          description: Suffix of the consent manager to which the request was intended
        - name: X-AUTH-TOKEN
          in: header
          required: true
          description: JWT Authentication token which was issued by ABDM after successful validation of username and password
          schema:
            type: string
            format: bearer
            minimum: 1
            maximum: 100
            example: <TOKEN>
        - name: request-id
          in: path
          required: true
          schema:
            type: string
          description: The subscription request id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isApplicableForAllHIPs
                - includedSources
                - excludedSources
              properties:
                isApplicableForAllHIPs:
                  type: boolean
                  nullable: false
                  example: false
                  description: A boolean value to denote if the policy is applicable to all the HIPs or only the specified HIP
                includedSources:
                  type: array
                  description: Included sources, carrying the list of hi types.
                  items:
                    type: object
                    required:
                      - hiTypes
                      - purpose
                      - hip
                      - categories
                      - period
                    properties:
