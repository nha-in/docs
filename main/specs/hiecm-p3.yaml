                            description: The reference URL.Allows alpha numeric character and special characters like "^[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\.[a-zA-Z0-9()]{1,6}\\b(?:[-a-zA-Z0-9()@:%_\\+.~#?&//=]*)$"
                      hip:
                        type: object
                        description: Identifier and name of the health information provider.
                        nullable: false
                        required:
                          - id
                          - name
                        properties:
                          id:
                            type: string
                            nullable: false
                            example: INDIA_HIP
                            description: The service ID of the health information provider. Allows alpha numeric character and special characters like [A-Z a-z 0-9]+[A-Z a-z 0-9 //_//-]*[A-Z a-z 0-9]$
                          name:
