                      stateCode:
                        type: string
                      districtCode:
                        type: string
                  tokens:
                    type: object
                    properties:
                      token:
                        type: string
                      expiresIn:
                        type: integer
                      refreshToken:
                        type: string
                      refreshExpiresIn:
                        type: integer
              examples:
                Enroll ABHA Address:
                  value:
