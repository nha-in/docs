        - P1-Registration-login
      summary: "6 flows: Verify User, Verify - User"
      description: |-
        Flows in the Postman collection:
        - P1-Registration-login › P1 - Create ABHA Address Flow › Enrolment via ABHA Number-ABHA OTP › Verify User
        - P1-Registration-login › P1 - PHR Login › P1 - Login via Mobile Number › Verify - User
        - P1-Registration-login › P1 - PHR Login › P1 - Login via Email (optional) › Verify - User
        - P1-Registration-login › P1 - PHR Login › P1 - Login via ABHA Number-Aadhaar OTP › Verify - User
        - P1-Registration-login › P1 - PHR Login › P1 - Login via ABHA Number-ABHA OTP › Verify - User
        - P1-Registration-login › P1 - PHR Login › P1 - Login via Aadhaar- OTP › Verify - User
      operationId: p1_post_v3_phr_app_login_verify_user
      security:
        - bearerAuth: []
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: T-token
          in: header
          required: true
          schema:
            type: string
          example: Bearer <JWT TOKEN>
          description: The transaction token from the preceding login step, sent with a `Bearer ` prefix. It is valid only for that login.
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                abhaAddress:
                  type: string
                txnId:
                  type: string
              required:
                - abhaAddress
                - txnId
            examples:
              Verify User:
                summary: Enrolment via ABHA Number-ABHA OTP › Verify User
                value:
                  abhaAddress: <ABHA_ADDRESS>
                  txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
              Verify - User:
                summary: P1 - Login via Mobile Number › Verify - User
                value:
                  abhaAddress: <ABHA_ADDRESS>
                  txnId: 48bc0a00-1127-459c-b040-8147f4ccc11a
              Verify - User (2):
                summary: P1 - Login via Email (optional) › Verify - User
                value:
                  abhaAddress: <ABHA_ADDRESS>
                  txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
              Verify - User (3):
                summary: P1 - Login via ABHA Number-Aadhaar OTP › Verify - User
                value:
                  abhaAddress: <ABHA_ADDRESS>
                  txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
              Verify - User (4):
                summary: P1 - Login via ABHA Number-ABHA OTP › Verify - User
                value:
                  abhaAddress: <ABHA_ADDRESS>
                  txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
              Verify - User (5):
                summary: P1 - Login via Aadhaar- OTP › Verify - User
                value:
                  abhaAddress: <ABHA_ADDRESS>
                  txnId: c51ad4d8-ae92-4509-8fb9-b91dea948492
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresIn:
                    type: integer
                  refreshToken:
                    type: string
                  refreshExpiresIn:
                    type: integer
              examples:
                Verify - User:
                  value:
                    token: <JWT TOKEN>
                    expiresIn: 1800
                    refreshToken: <JWT TOKEN>
                    refreshExpiresIn: 1296000
                Verify - User (2):
                  value:
                    token: <JWT TOKEN>
                    expiresIn: 1800
                    refreshToken: <JWT TOKEN>
                    refreshExpiresIn: 1296000
                Verify - User (3):
                  value:
                    token: <JWT TOKEN>
                    expiresIn: 1800
                    refreshToken: <JWT TOKEN>
                    refreshExpiresIn: 1296000
                Verify - User (4):
                  value:
                    token: <JWT TOKEN>
                    expiresIn: 1800
                    refreshToken: <JWT TOKEN>
                    refreshExpiresIn: 1296000
                Verify - User (5):
                  value:
                    token: <JWT TOKEN>
                    expiresIn: 1800
                    refreshToken: <JWT TOKEN>
                    refreshExpiresIn: 1296000
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                  - type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
              examples:
                Verify - User- Invalid ABHA address:
                  value:
                    code: "ABDM-9999: "
                    message: User not found.
                Verify - User - Blank ABHA address:
                  value:
                    - code: "ABDM-9999: "
                      message: Invalid ABHA Address
                Verify - User -Invalid Transaction Id:
                  value:
                    - code: "ABDM-9999: "
                      message: Invalid Transaction Id
                Verify - User- Invalid ABHA address (2):
                  value:
                    code: "ABDM-9999: "
                    message: User not found.
                Verify - User -Invalid Transaction Id (2):
                  value:
                    - code: "ABDM-9999: "
                      message: Invalid Transaction Id
                Verify - User - Blank ABHA address (2):
                  value:
                    - code: "ABDM-9999: "
                      message: Invalid ABHA Address
                Verify - User -Invalid Transaction Id (3):
                  value:
                    - code: "ABDM-9999: "
                      message: Invalid Transaction Id
                Verify - User - Blank ABHA address (3):
                  value:
                    - code: "ABDM-9999: "
                      message: Invalid ABHA Address
                Verify - User- Invalid ABHA address (3):
                  value:
                    code: "ABDM-9999: "
                    message: User not found.
                Verify - User -Invalid Transaction Id (4):
                  value:
                    - code: "ABDM-9999: "
                      message: Invalid Transaction Id
                Verify - User - Blank ABHA address (4):
                  value:
                    - code: "ABDM-9999: "
                      message: Invalid ABHA Address
                Verify - User- Invalid ABHA address (4):
                  value:
                    code: "ABDM-9999: "
                    message: User not found.
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
              example: Access Denied
      x-abdm-nha-operation-id: postLoginVerifyUser
