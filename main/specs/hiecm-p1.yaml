  /abha/api/v3/phr/app/enrollment/isExists:
    get:
      tags:
        - P1 - Create ABHA Address Flow
      summary: "3 flows: isExists API, isExists API Copy"
      description: |-
        Flows in the Postman collection:
        - P1-Registration-login › P1 - Create ABHA Address Flow › Enrolment via Mobile › isExists API
        - P1-Registration-login › P1 - Create ABHA Address Flow › Enrolment via ABHA Number-ABHA OTP › isExists API Copy
        - P1-Registration-login › P1 - Create ABHA Address Flow › Enrolment via ABHA Number-Aadhaar OTP › isExists API
      operationId: p1_get_v3_phr_app_enrollment_isexists
      security:
        - bearerAuth: []
      parameters:
        - name: abhaAddress
          in: query
          required: false
          schema:
            type: string
          example: <ABHA_ADDRESS>
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: boolean
              examples:
                isExists API - ABHA address not exist:
                  value: false
                isExists API - ABHA address not exist (2):
                  value: false
                isExists API - ABHA address not exist (3):
                  value: false
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    message:
                      type: string
              examples:
                isExists API-Invalid ABHA Address:
                  value:
                    - code: "ABDM-1006: "
                      message: Invalid ABHA Address
                isExists API-Invalid ABHA Address (2):
                  value:
                    - code: "ABDM-1006: "
                      message: Invalid ABHA Address
                isExists API-Invalid ABHA Address (3):
                  value:
                    - code: "ABDM-1006: "
                      message: Invalid ABHA Address
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  description:
                    type: string
              examples:
                isExists API- No Auth:
                  value:
                    code: "900902"
                    message: Missing Credentials
                    description: <JWT TOKEN>
                isExists API- No Auth (2):
                  value:
                    code: "900902"
                    message: Missing Credentials
                    description: <JWT TOKEN>
                isExists API- No Auth (3):
                  value:
                    code: "900902"
                    message: Missing Credentials
                    description: <JWT TOKEN>
