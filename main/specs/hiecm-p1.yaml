  /abha/api/v3/phr/app/enrollment/request/otp:
    post:
      tags:
        - P1 - Create ABHA Address Flow
      summary: "3 flows: OTP Request - Mobile, OTP Request - ABHA OTP, OTP Request - AADHAR OTP"
      description: |-
        Flows in the Postman collection:
        - P1-Registration-login › P1 - Create ABHA Address Flow › Enrolment via Mobile › OTP Request - Mobile
        - P1-Registration-login › P1 - Create ABHA Address Flow › Enrolment via ABHA Number-ABHA OTP › OTP Request - ABHA OTP
        - P1-Registration-login › P1 - Create ABHA Address Flow › Enrolment via ABHA Number-Aadhaar OTP › OTP Request - AADHAR OTP
      operationId: p1_post_v3_phr_app_enrollment_request_otp
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                loginHint:
                  type: string
                loginId:
                  type: string
                otpSystem:
                  type: string
              required:
                - scope
                - loginHint
                - loginId
                - otpSystem
            examples:
              OTP Request - Mobile:
                summary: Enrolment via Mobile › OTP Request - Mobile
                value:
                  scope:
                    - abha-address-enroll
                    - mobile-verify
                  loginHint: mobile-number
                  loginId: "{{encryptedData}}"
                  otpSystem: abdm
              OTP Request - ABHA OTP:
                summary: Enrolment via ABHA Number-ABHA OTP › OTP Request - ABHA OTP
                value:
                  scope:
                    - abha-login
                    - mobile-verify
                  loginHint: abha-number
                  loginId: "{{encryptedData}}"
                  otpSystem: abdm
              OTP Request - AADHAR OTP:
                summary: Enrolment via ABHA Number-Aadhaar OTP › OTP Request - AADHAR OTP
                value:
                  scope:
                    - abha-login
                    - aadhaar-verify
                  loginHint: abha-number
                  loginId: "{{encryptedData}}"
                  otpSystem: aadhaar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                  message:
                    type: string
              examples:
                OTP Request - Mobile:
                  value:
                    txnId: 1bda575d-02pd-40be-77e6-1e3efca52a82
                    message: OTP is sent to Mobile number ending with ******2425
                OTP Request - ABHA OTP:
                  value:
                    txnId: 4795527e-848b-4a62-91ec-be041fbf60f7
                    message: OTP sent to mobile number ending with ******2425
                OTP Request - AADHAR OTP:
                  value:
                    txnId: f69f7624-9768-40e2-aa4a-0c76252b9b25
                    message: OTP sent to Aadhaar registered mobile number ending with ******2425
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                  - type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              examples:
                OTP Request - Invalid LoginId:
                  value:
                    - code: "ABDM-9999: "
                      message: Invalid LoginId
                OTP Request - Invalid Scope:
                  value:
                    - code: "ABDM-1006: "
                      message: Invalid Scope
                OTP Request - Invalid Mobile:
                  value:
                    - code: "ABDM-1006: "
                      message: Invalid Mobile Number
                OTP Request - ABHA OTP-Invalid Login Hint:
                  value:
                    - code: "ABDM-1006: "
                      message: Invalid Login Hint
                OTP Request - ABHA OTP-Invalid LoginId:
                  value:
                    code: ABDM-9999
                    message: Invalid LoginId
                OTP Request - ABHA OTP-Invalid ABHA Number:
                  value:
                    - code: "ABDM-1006: "
                      message: Invalid ABHA Number
                OTP Request - ABHA OTP-Invalid Otp System:
                  value:
                    - code: "ABDM-1006: "
                      message: Invalid Otp System
                OTP Request - AADHAR OTP-Invalid Otp System:
                  value:
                    - code: "ABDM-1006: "
                      message: Invalid Otp System
                OTP Request - AADHAR OTP-Invalid Login Hint:
                  value:
                    - code: "ABDM-1006: "
                      message: Invalid Login Hint
                OTP Request - AADHAR OTP-Invalid ABHA Number:
                  value:
                    - code: "ABDM-1006: "
                      message: Invalid ABHA Number
      x-abdm-nha-operation-id: postEnrollmentRequestOtp2
