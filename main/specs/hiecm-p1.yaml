      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                txnId:
                  type: string
                phrDetails:
                  type: object
                  properties:
                    mobile:
                      type: string
                    firstName:
                      type: string
                    middleName:
                      type: string
                    lastName:
                      type: string
                    yearOfBirth:
                      type: string
                    dayOfBirth:
                      type: string
                    monthOfBirth:
                      type: string
                    gender:
                      type: string
                    email:
                      type: string
                    profilePhoto:
                      type: string
                    address:
                      type: string
                    stateName:
                      type: string
                    stateCode:
                      type: string
                    districtName:
                      type: string
                    districtCode:
                      type: string
                    pinCode:
                      type: string
                    abhaAddress:
                      type: string
                    password:
                      type: string
              required:
                - txnId
                - phrDetails
            examples:
              Enroll ABHA Address:
                summary: Enrolment via Mobile › Enroll ABHA Address
                value:
                  txnId: 27d444b7-2a3d-46d8-bf67-e5590b6c46b6
                  phrDetails:
                    mobile: <ENCRYPTED_MOBILE>
                    firstName: John
                    middleName: ""
                    lastName: Doe
                    yearOfBirth: <DOB>
                    dayOfBirth: ""
                    monthOfBirth: <DOB>
                    gender: M
                    email: ""
                    profilePhoto: ""
                    address: <ADDRESS>
                    stateName: Maharashtra
                    stateCode: "27"
                    districtName: <ADDRESS>
                    districtCode: "123"
                    pinCode: <PINCODE>
                    abhaAddress: <ABHA_ADDRESS>
                    password: <ENCRYPTED_PASSWORD>
              Enroll ABHA Address (2):
                summary: Enrolment via ABHA Number-ABHA OTP › Enroll ABHA Address
                value:
                  txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                  phrDetails:
                    firstName: John
                    middleName: ""
                    lastName: Doe
                    dayOfBirth: <DOB>
                    monthOfBirth: <DOB>
                    yearOfBirth: <DOB>
                    gender: M
                    email: ""
                    mobile: <ENCRYPTED_MOBILE>
                    address: <ADDRESS>
                    stateName: Maharashtra
                    stateCode: "27"
                    districtName: <ADDRESS>
                    districtCode: "123"
                    pinCode: <PINCODE>
                    abhaAddress: <ABHA_ADDRESS>
                    password: <ENCRYPTED_PASSWORD>
              Enroll ABHA Address (3):
                summary: Enrolment via ABHA Number-Aadhaar OTP › Enroll ABHA Address
                value:
                  txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                  phrDetails:
