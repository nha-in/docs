                      stateCode: "27"
                      districtCode: "123"
                    tokens:
                      token: <JWT TOKEN>
                      expiresIn: 1800
                      refreshToken: <JWT TOKEN>
                      refreshExpiresIn: 1296000
                Enroll ABHA Address (2):
                  value:
                    txnId: 6907ebb5-ff71-47f9-8052-6dd4254df5df
                    message: ABHA Address Created Successfully
                    phrDetails:
                      firstName: John
                      middleName: ""
                      lastName: Doe
                      fullName: John Doe
                      dayOfBirth: <DOB>
