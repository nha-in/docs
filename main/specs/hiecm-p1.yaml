                    stateCode: "27"
                    districtName: <ADDRESS>
                    districtCode: "123"
                    pinCode: <PINCODE>
                    abhaAddress: <ABHA_ADDRESS>
                    password: <ENCRYPTED_PASSWORD>
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                  message:
                    type: string
                  phrDetails:
                    type: object
                    properties:
                      firstName:
                        type: string
                      middleName:
                        type: string
                      lastName:
                        type: string
                      fullName:
                        type: string
                      dayOfBirth:
                        type: string
                      monthOfBirth:
                        type: string
                      yearOfBirth:
                        type: string
                      dateOfBirth:
                        type: string
                      gender:
                        type: string
                      email:
                        type: string
                      mobile:
                        type: string
                      address:
                        type: string
                      stateName:
                        type: string
                      districtName:
                        type: string
                      pinCode:
                        type: string
                      abhaAddress:
