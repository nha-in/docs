      summary: "3 flows: Enroll ABHA Address"
      description: |-
        Flows in the Postman collection:
        - P1-Registration-login › P1 - Create ABHA Address Flow › Enrolment via Mobile › Enroll ABHA Address
        - P1-Registration-login › P1 - Create ABHA Address Flow › Enrolment via ABHA Number-ABHA OTP › Enroll ABHA Address
        - P1-Registration-login › P1 - Create ABHA Address Flow › Enrolment via ABHA Number-Aadhaar OTP › Enroll ABHA Address
