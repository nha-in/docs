webhooks:
  delivery:
    post:
      operationId: nhcx_webhook_delivery
      summary: The exchange delivers a message to your bridge URL
      description: >
        The exchange POSTs to your registered `endpoint_url` plus the path of
        the exchange concerned, so a preauthorisation decision arrives at
        `<endpoint_url>/v1/preauth/on_submit`. Build one handler and route by
        path.


        Answer within 30 seconds with `202` and the receipt, then process.
        Anything slower, including a slow `200`, is read as a failed delivery
        and retried up to five times before the correlation ID is retired.


        Two body shapes arrive. `JWEPayload` carries a sealed bundle.
        `ProtocolResponse` carries a refusal, with the `x-hcx-` fields in the
        clear and the reason in `x-hcx-error_details`.


        The exchange signs its calls to you with a JWT in the authorisation
        header. No published source gives the public key to verify against,
        an address to fetch it from, or the name of the header it arrives in,
        so build the check and treat a missing key as a deliberate, logged,
        temporary state rather than a silent default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/JWERequest'
                - $ref: '#/components/schemas/ProtocolResponse'
      responses:
        "202":
          description: Required. Anything else is treated as a failed delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
  error:
    post:
      operationId: nhcx_webhook_error
      summary: The exchange reports a message it could not deliver
      description: >
        Every participant must host `/v1/error`. The exchange calls it to
        report a request that could not be delivered after five attempts.
        Without it, a sender never learns that its request died.


        This is the one path that carries neither of the two usual shapes. It
        has no `payload` and no `x-hcx-` fields: what arrives is a plain JSON
        report whose field names are not published. Store it whole rather
        than parsing it against a fixed schema, and still answer `202`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: An unpublished report shape. Store it whole.
              additionalProperties: true
      responses:
        "202":
          description: Required, even though the body is not a shape you recognise.
components:
  securitySchemes:
    bearer_auth:
      type: apiKey
      in: header
      name: bearer_auth
      description: The ABDM session token, prefixed with `Bearer ` and a space.
  schemas:
    JWERequest:
      type: object
      required: [payload]
      properties:
        type:
          type: string
          const: JWEPayload
          description: Present on a delivery to your bridge URL. Not sent on a call to the gateway.
        payload:
          type: string
          description: >
            The message as a JWE in compact serialisation: five base64url
            parts joined by dots. The protected header carries the `x-hcx-`
            routing fields in the clear; the FHIR bundle is sealed with the
            recipient's public key and the exchange cannot read it.


            Use `alg` `RSA-OAEP-256` with `enc` `A256GCM`. One protocol page
            says `RSA-OAEP`; the handbook, the samples and the Postman bodies
            all say `-256`.


            The header fields are `x-hcx-sender_code`,
            `x-hcx-recipient_code`, `x-hcx-api_call_id`, `x-hcx-request_id`,
            `x-hcx-correlation_id`, `x-hcx-workflow_id`, `x-hcx-timestamp`,
            `x-hcx-status` and `x-hcx-ben-abha-id`.
      example:
        payload: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIi....
    ProtocolResponse:
      type: object
      description: >
        A refusal delivered in the clear, when the recipient could not
        decrypt the bundle or the bundle failed validation.
      required: [type]
      properties:
        type:
          type: string
          const: ProtocolResponse
        x-hcx-sender_code: {type: string}
        x-hcx-recipient_code: {type: string}
        x-hcx-api_call_id: {type: string, format: uuid}
        x-hcx-correlation_id: {type: string, format: uuid}
        x-hcx-workflow_id: {type: string}
        x-hcx-timestamp: {type: string}
        x-hcx-status:
          type: string
          const: response.error
        x-hcx-entity-type: {type: string}
        x-hcx-error_details:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
            trace: {type: string}
    Receipt:
      type: object
      description: >
        The acknowledgement both the exchange and your own callback return.
        It says the message was taken in. It is never the decision.
      properties:
        timestamp: {type: string}
        api_call_id: {type: string, format: uuid}
        correlation_id: {type: string, format: uuid}
        result:
          type: object
          properties:
            sender_code: {type: string}
            recipient_code: {type: string}
            entity_type: {type: string, example: preauth}
            protocol_status:
              type: string
              enum: [request.queued, request.dispatched, request.error]
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
      example:
        timestamp: 04/09/2026 11:46:35:120
        api_call_id: a1b2c3d4-e5f6-4890-abcd-ef1234567890
        correlation_id: 11223344-5566-4788-99aa-bbccddeeff00
        result:
          sender_code: 1000004446@hcx
          recipient_code: 1000003538@hcx
          entity_type: preauth
          protocol_status: request.queued
        error:
          code: ""
          message: ""
security:
  - bearer_auth: []
