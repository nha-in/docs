openapi: 3.1.1
info:
  title: NHCX use case endpoints
  version: abdm-v3
  summary: The ten claim exchanges, each an action endpoint and its callback.
  description: >
    Every substantive NHCX exchange is an asynchronous pair. The initiator
    posts a sealed message to an action endpoint and gets a receipt. The
    responder does its work, then posts the outcome to the matching `on_`
    endpoint, and the exchange delivers it to the initiator's registered
    bridge URL.


    Every request body on this service is the same one-field object carrying
    a JWE. The exchange reads only the protected header, which is why every
    operation below shares one request schema: what separates a
    preauthorisation from an enhancement is the workflow code in that header,
    not the path and not the body.


    The `on_` paths appear twice in an integration. You POST to them here to
    deliver your answer, and the exchange POSTs the same shape to your own
    bridge URL to deliver someone else's. The webhooks section describes that
    second half.
  contact:
    name: NHCX integration support
    url: https://hcxsbx.abdm.gov.in/#/documents
    email: hcx.integration@nha.gov.in
  x-abdm-gateway: nhcx
  x-abdm-module: usecases
  x-abdm-phase: 1
  x-abdm-roles: [provider, payer, tpa, regulator]
x-abdm-sources:
  - file: NHCX-site/documents/AWS(Sandbox) NHCX USECASE Postman Collection.zip
    role: upstream
    status: not-yet-hashed
    note: AWS(Sandbox)-NHCX USECASE POSTMAN COLLECTION, 20 requests.
  - url: https://hcxsbx.abdm.gov.in/#/technical-specifications/api-specifications
    role: upstream
    status: not-yet-fetched
    note: >
      NHA publishes a Swagger UI per service on the sandbox portal, one each
      for coverage eligibility, preauth, claim, communication, payment,
      status, task, search, insurance plan and subscription. The portal warns
      that for use case payloads its value-set sheets and code snippets are
      the authority rather than the Swagger.
  - url: https://hcxsbx.abdm.gov.in/#/documents
    role: upstream
    status: not-yet-hashed
    note: Workflow Status Sheets (18 Aug 2026), for the codes named on each operation.
servers:
  - url: https://apisbx.abdm.gov.in/hcx
    description: Sandbox use case endpoints
tags:
  - name: Coverage eligibility
    description: Is this policy in force, what does it cover, and what will a package need.
  - name: Insurance plan
    description: The policy as data, fetched once per policy and cached.
  - name: Preauthorisation
    description: Approval before treatment, and the cycle of enhancement, resubmission and query around it.
  - name: Claim
    description: The request for payment at discharge, and its adjudication.
  - name: Task
    description: Cancel, reprocess and shortfall, told apart by the Task's code.
  - name: Communication
    description: The payer's channel for alerts, grievances and changes.
  - name: Search
    description: Claim lookup by a provider, a regulator or a scheme sponsor.
  - name: Predetermination
    description: What the payer would pay, without committing anyone.
  - name: Payment
    description: Notices as money moves, and the provider's acknowledgement.
  - name: Status
    description: The state of a request already triggered.
paths:
  /v1/coverageeligibility/check:
    post:
      operationId: nhcx_coverageeligibility_check
      tags: [Coverage eligibility]
      summary: "Coverage eligibility: send the request"
      description: >
        Ask whether a policy is in force, what it covers, and what a package will need. `purpose` decides which of the four questions is being asked: validation, discovery, benefits or auth-requirements.


        The body is one JSON object with a single `payload` field carrying the
        JWE. The exchange answers `202 Accepted` with a receipt; the decision
        arrives later on the matching callback.


        Workflow codes: none listed. The check sits alongside registration, code 10, and admission, code 11.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JWERequest'
      responses:
        "202":
          description: Accepted and queued for the recipient. This is not the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        "400":
          description: The envelope failed validation. Nothing about the sealed bundle shows up here.
        "401":
          description: The token is missing, malformed or expired. Fetch a new one and retry once.
  /v1/coverageeligibility/on_check:
    post:
      operationId: nhcx_coverageeligibility_on_check
      tags: [Coverage eligibility]
      summary: "Coverage eligibility: deliver the answer"
      description: >
        Answer an eligibility check with a CoverageEligibilityResponse. The payer may instead answer with a forward instruction, asking the exchange to pass the same request to another payer.


        The body is one JSON object with a single `payload` field carrying the
        JWE. The exchange answers `202 Accepted` with a receipt; the decision
        arrives later on the matching callback.


        Workflow codes: none listed. The check sits alongside registration, code 10, and admission, code 11.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JWERequest'
      responses:
        "202":
          description: Accepted and queued for the recipient. This is not the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        "400":
          description: The envelope failed validation. Nothing about the sealed bundle shows up here.
        "401":
          description: The token is missing, malformed or expired. Fetch a new one and retry once.
  /v1/insuranceplan/request:
    post:
      operationId: nhcx_insuranceplan_request
      tags: [Insurance plan]
      summary: "Insurance plan: send the request"
      description: >
        Ask a payer for the plan behind a policy. The body is a Task with code `poll`, keyed on policy number and provider ID. Sent once per policy the hospital handles, not once per patient.


        The body is one JSON object with a single `payload` field carrying the
