paths:
  /v1/communication/request:
    post:
      operationId: communication_v1_communication_request
      x-abdm-atom: nhcx.endpoint.communication-request
      x-abdm-use-case: Communication
      tags:
        - Communication
      summary: "Payer: send a communication request"
      description: |-
        Payer pushes a Task plus Communication bundle to a provider mid-claim: TAT alerts, wallet or policy changes, grievances or extra-information requests.

        ### Business purpose

        Every other NHCX exchange is provider-initiated and expects a matching response. Communication inverts that: it is the payer's asynchronous, event-driven channel into the hospital system, used when something must be said about an in-flight case without the provider having asked. It carries TAT breach alerts, grievance notices, wallet or benefit updates, policy or package-rate changes, requests for additional evidence and claim-arbitration intimations. Hospitals benefit because these signals arrive in a structured, routable bundle rather than by phone or email, and payers benefit because adjudication can proceed without waiting for an out-of-band exchange.

        ### When to use

        The payer uses it to send the provider a message outside the pre-authorisation or claim flow, such as a delay notice, a grievance or a request for more information. The workflow code in the header must match the related claim or pre-authorisation.

        ### Preconditions

        - A valid access token and the provider's certificate.
        - The bundle is encrypted for the provider.
        - The header carries `x-hcx-status` `request.initiated` and a fresh correlation ID.

        ### Postconditions

        - NHCX answers `202` at once. That only means the message was accepted.
        - The provider's acknowledgement arrives later on `/v1/communication/on_request`, with the same correlation ID.

        ### Common mistakes

        - Treating the `202` as the provider's answer.
        - Sending a workflow code that does not match the related claim or pre-authorisation.
        - Reusing a correlation ID from an earlier or failed cycle.
        - Using it in place of the query inside a `ClaimResponse`.

        ### Best practices

        - Mint a new UUID for x-hcx-api_call_id on every call and for x-hcx-correlation_id on every new communication cycle, including retries after failure.
        - Put the routing intent in Task.reasonCode and the message classification in Communication.category, topic and priority; pair additionalinfo with category instruction or questionnaire.
        - Use IST timestamps; UTC causes validation failures.
        - Persist the correlation id before posting so the on_request acknowledgement can be matched.
        - Expect up to five redeliveries if the provider mis-acknowledges; keep your own handling idempotent.
        - Implement v1/error so a message that never reaches the provider is reported back to you.

        ### Related scenario

        A state health agency's TPA notices that a cashless claim from a district hospital has sat in adjudication past the scheme's turnaround threshold. It builds a Task bundle with reasonCode tatquery, category reminder, topic progress-update and priority asap, encrypts it for the hospital and posts /v1/communication/request with the workflow id of the claim submitted earlier on /v1/claim/submit. The gateway returns 202 and forwards the bundle. The hospital's claims desk is alerted, and its system posts the acknowledgement Task on /v1/communication/on_request with the same correlation id. Adjudication then continues and the outcome arrives on /v1/claim/on_submit as usual.

        ### Specification

        Chapter [Communication](/docs/nhcx/v1/reference/fhir/communication) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      x-nhcx-protected-header:
        - alg
        - enc
        - x-hcx-sender_code
        - x-hcx-recipient_code
        - x-hcx-api_call_id
        - x-hcx-request_id
        - x-hcx-correlation_id
        - x-hcx-workflow_id
        - x-hcx-timestamp
        - x-hcx-status
        - x-hcx-ben-abha-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
            example:
              payload: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwieC1oY3gtc2VuZGVyX2NvZGUiOi4uLn0.encrypted_key.iv.ciphertext.tag
      responses:
        "202":
          description: The gateway validates the JWE headers, workflow id and NIIP and returns HTTP 202 with a StatusSuccessResponse (timestamp, api_call_id, correlation_id, result with sender_code, recipient_code, entity_type and protocol_status, and an error object).
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  result:
                    type: object
                    properties:
                      sender_code:
                        type: string
                      recipient_code:
                        type: string
                      entity_type:
                        type: string
                      protocol_status:
                        type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 25/08/2026 11:46:35:120
                api_call_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                correlation_id: 11223344-5566-7788-99aa-bbccddeeff00
                result:
                  sender_code: <payer participant code>
                  recipient_code: <provider participant code>
                  entity_type: task
                  protocol_status: request.queued
                error:
                  code: ""
                  message: ""
  /v1/communication/on_request:
    post:
      operationId: communication_v1_communication_on_request
      x-abdm-atom: nhcx.endpoint.communication-on-request
      x-abdm-use-case: Communication
      tags:
        - Communication
      summary: "Provider: acknowledge the communication"
      description: |-
        Provider returns the acknowledgement Task bundle for a payer communication, echoing the reason code and correlation id so the payer can close the loop.

        ### Business purpose

        A payer that has pushed a TAT alert, grievance, wallet update, policy change or document request needs proof that the hospital received it, because the next adjudication step or SLA clock often depends on it. This callback is that proof. The provider posts a bundle of identical structure to the request, with Task.status completed confirming receipt, and the payer's system can then continue, escalate or wait for the documents. It keeps the entire exchange inside NHCX, auditable by correlation id, rather than in phone calls and email.

        ### When to use

        The provider calls it to acknowledge a `/v1/communication/request`. It comes after the quick `202` reply and reuses the request's correlation ID and reason.

        ### Preconditions

        - You decrypted the incoming request and answered it `202` within 30 seconds.
        - A valid access token and the payer's certificate.
        - The acknowledgement mirrors the request and reuses its `x-hcx-correlation_id`.

        ### Postconditions

        NHCX answers `202` and forwards the acknowledgement to the payer. It only confirms receipt, so the issue itself may still be open.

        ### Common mistakes

        - Using a new correlation ID, so the payer cannot link the acknowledgement.
        - Keeping the connection open while someone reads the message, missing the 30-second limit.
        - Closing the hospital case because the Communication says `completed`.

        ### Best practices

        - Acknowledge first, process later: return 202 with the acceptance body, queue the bundle, then build and post the on_request acknowledgement asynchronously.
        - Switch on Task.reasonCode.code to route: tatquery to the claims desk, walletupdate to the benefit cache, policychange to package rate tables.
        - Be idempotent on x-hcx-correlation_id; the same communication may be redelivered.
        - Validate x-hcx-workflow_id against the workflow of the associated claim or preauth before acting.
        - Use IST timestamps and a fresh x-hcx-api_call_id on the acknowledgement call.
        - Log the reason code, category, priority and correlation id for the audit trail.

        ### Related scenario

        A district hospital receives a communication from the scheme payer on its registered callback: reasonCode additionalinfo, category instruction, asking for an updated discharge summary on a claim submitted last week. The endpoint returns 202 immediately and queues the bundle. The claims desk is notified, and the integration posts the acknowledgement Task on /v1/communication/on_request with the same correlation id and reasonCode. The desk then attaches the discharge summary through the claim's resubmission path, and the final adjudication arrives later on /v1/claim/on_submit, possibly followed by a payment notice on /v1/paymentnotice/request.

        ### Specification

        Chapter [Communication](/docs/nhcx/v1/reference/fhir/communication) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      x-nhcx-protected-header:
        - alg
        - enc
        - name: x-hcx-sender_code
          required: true
          description: Your participant code. Mandatory on the envelope.
          example: <provider participant code>
        - name: x-hcx-recipient_code
          required: true
          description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
          example: <payer participant code>
        - x-hcx-api_call_id
        - x-hcx-request_id
        - x-hcx-correlation_id
        - x-hcx-workflow_id
        - x-hcx-timestamp
        - name: x-hcx-status
          required: true
          description: "Where this message stands. [Status words](/docs/nhcx/v1/reference/envelope-fields#status-words) lists the values. Mandatory on the envelope."
          example: response.complete
        - x-hcx-ben-abha-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - JWEPayload
                  description: Always `JWEPayload`. Every response (`on_`) call sends it beside `payload`.
                payload:
                  type: string
              required:
                - type
                - payload
            example:
              type: JWEPayload
              payload: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwieC1oY3gtc2VuZGVyX2NvZGUiOi4uLn0.encrypted_key.iv.ciphertext.tag
      responses:
        "202":
          description: The gateway returns HTTP 202 with the StatusSuccessResponse envelope (timestamp, api_call_id, correlation_id, result, error) and forwards the bundle to the payer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  result:
                    type: object
                    properties:
                      sender_code:
                        type: string
                      recipient_code:
                        type: string
                      entity_type:
                        type: string
                      protocol_status:
                        type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 25/08/2026 11:56:35:004
                api_call_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                correlation_id: 11223344-5566-7788-99aa-bbccddeeff00
                result:
                  sender_code: <provider participant code>
                  recipient_code: <payer participant code>
                  entity_type: task
                  protocol_status: request.queued
                error:
                  code: ""
                  message: ""
