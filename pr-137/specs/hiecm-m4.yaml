          description: Ownership Code as available in HFR. Accepted codes are "G", "P" or "PP".
        ownerSubtypeCode:
          pattern: ^([Cc]|[Pp]|[Nn][Pp])$
          type: string
          description: Ownership subtype code, as available in HFR, under any Ownership. ownershipCode = "G" Accepted codes are "C". ownershipCode = "P" or "PP" Accepted codes are "P" or "NP".
    UtilityFacilityTypeReqDto:
      required:
        - ownershipCode
        - systemOfMedicineCode
