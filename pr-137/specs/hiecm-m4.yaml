      properties:
        ownershipCode:
          maxLength: 2
          minLength: 0
          pattern: ^([Gg]|[Pp]|[Pp][Pp])$
          type: string
          description: Ownership of the facility. Accepted codes are "G" or "P".
        systemOfMedicineCode:
          pattern: ^[A-Za-z\s,]*$
          type: string
          description: System of medicine followed by the facility. Accepted codes as specified in get-master-data API with type="MEDICINE". In case you have multiple systems of medicine, send a comma separated string of codes. See `GET /v1.5/facility/get-master-data`.
    UtilityFacilitySubTypeReqDto:
      required:
        - facilityTypeCode
      type: object
      properties:
        facilityTypeCode:
          pattern: ^[0-9\s]*$
          type: string
          description: Facility code. Accepted codes as specified in fetch-facilitytype API. See `POST /v1.5/facility/fetch-facility-type`.
    FacilityBloodBankDetails:
