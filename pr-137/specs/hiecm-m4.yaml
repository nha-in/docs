components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: M4 declares bearer authentication. The published M4 specifications name no call that issues the token.
  schemas:
    AadhaarGetTransactionRequest:
      type: object
      properties:
        txnId:
          type: string
    AadharVerifyResponsePayload:
      type: object
      properties:
        txnId:
          type: string
        mobileNumber:
          type: string
        photo:
          type: string
        gender:
          type: string
        name:
          type: string
        email:
          type: string
        pincode:
          type: string
        birthdate:
          type: string
        careOf:
          type: string
        house:
          type: string
        street:
          type: string
        landmark:
          type: string
        locality:
          type: string
        villageTownCity:
          type: string
        subDist:
          type: string
        district:
          type: string
        state:
          type: string
        postOffice:
          type: string
        address:
          type: string
    HPRIDGenerateMobileOTPResponseDTO:
      type: object
      properties:
        txnId:
          type: string
        mobileNumber:
          type: string
    MobileDemographicAuthResponseModel:
      type: object
      properties:
        verified:
          type: boolean
    CreateAccountWithPreVerifiedAadhaar:
      required:
        - email
        - txnId
      type: object
      properties:
        idType:
          type: string
          example: hpr_id
        domainName:
          type: string
          example: "@hpr.abdm"
        email:
          type: string
          description: Email Address of the user.
          example: <ABHA_ADDRESS>.com
        firstName:
          type: string
          description: First Name of the user).
          example: Ayushman
        middleName:
          type: string
          description: "Middle name of the user "
          example: Bharat
        lastName:
          type: string
          description: "Last name of the user "
          example: Mission
        password:
          type: string
          description: Passwords for authentication
          example: Ayushman@143
        profilePhoto:
          type: string
          description: Profile photo of the user (Uploaded by the user).
          example: <BASE64 ENCODED STRING>
        txnId:
          type: string
          description: Transaction ID
          format: uuid
          example: c3b0c27d-e19d-4244-b8bb-3fa19285054a
        hprId:
          type: string
          description: Healthcare Professional ID Alias.
          example: <EMAIL>
        sourceType:
          type: string
          enum:
            - DRIVING_LICENSE
            - AADHAAR
        hpCategoryCode:
          type: integer
          format: int32
          example: 1
        hpSubCategoryCode:
          type: integer
          format: int32
          example: 1
        clientId:
          type: string
          example: V4
        stateCode:
          type: string
        districtCode:
          type: string
        council:
          type: boolean
        role:
          type: integer
          format: int32
    CreateAccountJwtResponse:
      type: object
      properties:
        token:
          type: string
        hprIdNumber:
          type: string
        name:
          type: string
        gender:
          type: string
        yearOfBirth:
          type: string
        monthOfBirth:
          type: string
        dayOfBirth:
          type: string
        firstName:
          type: string
        hprId:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        stateCode:
          type: string
        districtCode:
          type: string
        subDistrictCode:
          type: string
        subDistrictName:
          type: string
        stateName:
          type: string
        districtName:
          type: string
        email:
          type: string
        kycPhoto:
          type: string
        mobile:
          type: string
        categoryId:
          type: integer
          format: int32
        subCategoryId:
          type: integer
          format: int32
        role:
          type: integer
          format: int32
        authMethods:
          uniqueItems: true
          type: array
          items:
            type: string
            enum:
              - AADHAAR_OTP
              - MOBILE_OTP
              - PASSWORD
              - DEMOGRAPHICS
              - AADHAAR_BIO
              - EMAIL_OTP
              - MOBILE_OTP_RESET_PASSWROD
              - FACE_AUTH
        new:
          type: boolean
    HPRIDVerifyMobileOTPRequestDTO:
      type: object
      properties:
        otp:
          type: string
        txnId:
          type: string
    HPRIDVerifyMobileOTPResponseDTO:
      type: object
      properties:
        txnId:
          type: string
        mobileNumber:
          type: string
    HpIdSuggestionRequst:
      required:
        - txnId
      type: object
      properties:
        txnId:
          type: string
          description: Based on UUID
          example: a825f76b-0696-40f3-864c-5a3a5b389a83
    HPRIDGenerateMobileOTPRequestDTO:
      type: object
      properties:
        mobile:
          type: string
        txnId:
          type: string
    AccountExistPayload:
      type: object
      properties:
        txnId:
          type: string
        preverifiedCheck:
          type: boolean
    AccountExistResponsePayload:
      type: object
      properties:
        token:
          type: string
        hprIdNumber:
          type: string
        categoryId:
          type: integer
          format: int32
        categoryName:
          type: string
        subCategoryId:
          type: integer
          format: int32
        categorySubName:
          type: string
        txnId:
          type: string
          format: uuid
        name:
          type: string
        gender:
          type: string
        yearOfBirth:
          type: string
        monthOfBirth:
          type: string
        dayOfBirth:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        stateCode:
          type: string
        districtCode:
          type: string
        stateName:
          type: string
        districtName:
          type: string
        address:
          type: string
        pincode:
          type: string
        profilePhoto:
          type: string
        mobile:
          type: string
        hprId:
          type: string
        new:
          type: boolean
    RetriveHprIdMobilePayLoad:
      required:
        - firstName
        - gender
        - name
        - otp
        - txnId
        - yearOfBirth
      type: object
      properties:
        txnId:
          type: string
          format: uuid
        name:
          type: string
        gender:
          pattern: ^(M|F|O|U)$
          type: string
        yearOfBirth:
          pattern: ^(\d{4})$
          type: string
        monthOfBirth:
          pattern: ^(0?[1-9]|1[012])$
          type: string
        dayOfBirth:
          pattern: ^(0?[1-9]|[12][0-9]|3[01])$
          type: string
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        otp:
          type: string
    RetrieveHprIdPayloadResponse:
      type: object
      properties:
        hprId:
          type: string
        hprIdNumber:
          type: string
        token:
          type: string
    SendOtpRequest:
      type: object
      properties:
        mobileNumber:
          type: string
        email:
          type: string
        type:
          type: string
        hpid:
          type: string
    SendOtpResponse:
      type: object
      properties:
        txnId:
          type: string
        msg:
          type: string
        mobileNumber:
          type: string
    BridgeAddUpdateRequestDTO:
      required:
        - facilityId
        - facilityName
      type: object
      properties:
        facilityId:
          pattern: ^IN\d+$
          type: string
          description: Id of the facility. Should start with 'IN' and have the length of 12 characters.
        facilityName:
          type: string
          description: "Name of the facility. Accepted characters: Alphanumeric, -_.(),/. The first character must be an alphabet or digit, and only one space is allowed between words."
        HRP:
          type: array
          items:
            $ref: "#/components/schemas/MultipleHRPRequest"
    MultipleHRPRequest:
      required:
        - active
        - bridgeId
        - hipName
        - type
      type: object
      properties:
        bridgeId:
          type: string
          description: Valid Bridge Id to be linked. Alphanumeric.
        hipName:
          type: string
          description: "Name of the hospital which will reflect on ABHA/PHR app when the patient will search for the respective hospital. HIP name can be the Hospital name added with suffix of bridge name. Example: Hospital name=XYZ and bridge name=BRIDGE TEST, so the HIP name = XYZ BRIDGE. HIP name can not be mor than 15 characters. No Special character is allowed (%$*#@(~&!) Should be unique for every bridge for a facility."
        type:
          type: string
          description: "Type of the bridge to be linked. Accepted values: HIP or HIU."
        active:
          type: boolean
          description: "Active Status of the bridge to be linked. Accepted values: true or false."
    ValidateOtpRequestDto:
      type: object
      properties:
        facilityId:
          type: string
          description: Id of the facility. Should start with 'IN' and have the length of 12 characters.
        sourceId:
          type: string
          description: Unique hospital identifier. Alphanumeric value.
        otp:
          type: string
          description: Unique number to verify the mobile number. 6-digit number received from the SendOTPToContact API response. See `POST /v1.5/facility/sendOtpToContact`.
        source:
          type: string
          description: "Facility Source value. Accepted values: UWIN, PMNDP, AB-PMJAY, NHRR, HMIS-CDAC, NIN, eHospital, STHMISID, STINSID, COWIN."
        transactionId:
          type: string
          description: Unique Id for a transaction. Use the transaction Id received in response from the SendOTPToContact API. See `POST /v1.5/facility/sendOtpToContact`.
      required:
        - facilityId
        - sourceId
        - otp
        - source
        - transactionId
    ErrorStatus:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    ValidateOtpResponse:
      type: object
      properties:
        facilityId:
          type: string
        status:
          type: string
        message:
          type: string
        errorStatus:
          type: array
          items:
            $ref: "#/components/schemas/ErrorStatus"
    FacilitySubmitDetails:
      required:
        - trackingId
      type: object
      properties:
        trackingId:
          pattern: ^[0-9]+$
          type: string
          description: Unique identification number for your facility. Tracking id generated from basic information API.
        sourceOfInformation:
          type: string
          description: Source of information of this facility. Should be valid data source provide by HFR team. If you leave this field empty, then your facility will be considered as Submitted entity.
        sourceUniqueID:
          type: string
          description: Facility Unique Id as exists in HRP or data source.
        facilitySuperUser:
          type: string
    FacilitySubmitResponse:
      type: object
      properties:
        facilityId:
          type: string
        status:
          type: string
        message:
          type: string
    FacilityContactDetails:
      type: object
      properties:
        facilityId:
          type: string
          description: Id of the facility to be linked. Should start with 'IN' and have the length of 12 characters.
      required:
        - facilityId
