      type: object
      properties:
        ownershipCode:
          type: string
          description: Ownership of the facility to be searched. Accepted codes are "G", "P" or "PP". Required if facilityId not present.
        subDistrictLGDCode:
          type: string
          description: Sub district of the facility. Sub District LGD Code. See `GET /v1.5/facility/lgd/subdistricts`.
        pincode:
          type: string
          description: Pin code of the facility. 6-digit number.
        facilityName:
          type: string
          description: "Name of the facility being searched. This value can be either full or partial name. Accepted characters: Alphanumeric, -_.(),/. The first character must be an alphabet or digit, and only one space is allowed between words. Required if facilityId not present."
        facilityId:
          type: string
          description: 12-character Facility Id allotted to each facility at the time of submission. Should start with 'IN' and have the length of 12 characters. Required if ownershipCode, stateLGDCode and facilityName not present.
        page:
          type: integer
          format: int32
          description: The page number of which results need to be seen. Numeric value. Minimum value to be passed is 1.
        resultsPerPage:
          type: integer
          format: int32
          description: Number of facilities what will come in one page. Numeric value. Minimum value to be passed is 10.
        stateLGDCode:
          type: string
          description: State of the facility. State LGD code. See `GET /v1.5/facility/lgd/states`. Required if facilityId not present.
        districtLGDCode:
          type: string
          description: District of the facility. District LGD Code. See `GET /v1.5/facility/lgd/districts`.
      required:
        - page
        - resultsPerPage
