# Spectral ruleset for the catalogue's OpenAPI files.
# NHA's upstream files often fail strict rules; corrections are recorded in
# catalogue/openapi/corrections/, never applied silently. Keep warnings
# visible but only fail CI on errors (see lint:specs --fail-severity).
extends:
  - spectral:oas
rules:
  operation-operationId: error
  oas3-schema: error
  # Task 3 (2026-09-16 final NHA set): NHA's own examples fail these two
  # rules (nullable siblings, non-object example values); downgraded to
  # warn rather than hand-edited. See catalogue/openapi/corrections/2026-09-16-final-set.md.
  oas3-valid-media-example: warn
  oas3-valid-schema-example: warn
