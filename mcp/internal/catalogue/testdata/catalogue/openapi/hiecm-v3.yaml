openapi: 3.0.3
info:
  title: HIE-CM fixture
  version: abdm-v3
  x-portal:
    module: m2
    label: M2 fixture
paths:
  /links/link/add-contexts:
    post:
      operationId: linkAddContexts
      tags: [links]
      summary: Add care contexts
      parameters:
        - name: X-HIP-ID
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abhaNumber]
              properties:
                abhaNumber: {type: string}
                count: {type: integer}
      responses:
        "202":
          description: Accepted
  /health:
    get:
      operationId: healthCheck
      tags: [meta]
      summary: Health check
      responses:
        "200":
          description: OK
x-abdm-errors:
  source: fixture
  codes:
    - code: ABDM-1016
      message: Dependent service unavailable
      action: Retry with backoff
    - code: "ABDM-1035: "
      message: Facility is not registered with the bridge
      action: Fix onboarding
