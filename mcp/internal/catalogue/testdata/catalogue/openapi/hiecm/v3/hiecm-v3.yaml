openapi: 3.0.3
info:
  title: HIE-CM fixture
  version: abdm-v3
  x-portal:
    module: m2
    label: M2 fixture
paths:
  /links/link/add-contexts:
    post:
      operationId: linkAddContexts
      tags: [links]
      summary: Add care contexts
      parameters:
        - name: X-HIP-ID
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abhaNumber]
              properties:
                abhaNumber: {type: string}
                count: {type: integer}
      responses:
        "202":
          description: Accepted
  /health:
    get:
      operationId: healthCheck
      tags: [meta]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                code: ABDM-9999
                message: Should never be extracted, this is a 2xx example
        "400":
          description: Invalid ABHA number
          content:
            application/json:
              example:
                error:
                  code: ABDM-1013
                  message: Invalid ABHA Number
        "409":
          description: Facility not onboarded
          content:
            application/json:
              examples:
                notOnboarded:
                  value:
                    error:
                      code: ABDM-1035
                      message: Facility is not registered with the bridge
