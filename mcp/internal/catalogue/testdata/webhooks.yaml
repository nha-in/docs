openapi: 3.1.1
info:
  title: webhooks fixture
  version: "1"
  x-portal:
    module: m2
paths:
  /api/hiecm/hip/v3/link/carecontext:
    post:
      operationId: m2_post_hip_v3_link_carecontext
      summary: Link care contexts
      responses:
        "202":
          description: Accepted
webhooks:
  /api/v3/link/on_carecontext:
    post:
      operationId: m2_post_v3_link_on_carecontext
      summary: The outcome of linking, posted to your bridge
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                abhaAddress:
                  type: string
      responses:
        "400":
          description: Bad request
          content:
            application/json:
              example:
                error:
                  code: ABDM-1006
                  message: Bad Request
