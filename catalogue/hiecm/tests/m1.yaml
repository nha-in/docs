# NHA's M1 UI test cases, each mapped to the functionality it tests.
#
# A functionality is one thing a person does in the integrator's product. The
# groups follow the 17 groups of NHA's sheet one to one; none is merged or
# split. They are ordered as an integrator builds them: the groups holding a
# mandatory case for every entity type first, in the order a patient meets
# them at a counter, then the optional groups, then the two that apply to
# government integrators only.
#
# Per case:
#   screen  the screen the case is judged on.
#   ops     the operation ids the case exercises, from the named skill's spec.
#           Empty when the case is judged on a screen alone.
#   needs   what the run needs from the tester. Each name is defined in one
#           place, the NEEDS list in scripts/check-test-mapping.mjs.
#   gaps    optional: steps the spec has no operation for, as {step, note}.
#           A case with gaps is always source: reviewed, with a reason.
#   source  apis-column: every op is a path the sheet's APIs column names,
#           resolved to the variant in this functionality's journeys that the
#           case's steps reach. The column lists the whole group's calls on
#           every row, so a case keeps only the calls its steps make.
#           reviewed: the column is empty, names a call the spec lacks, or
#           leaves out a call the steps make, or the case makes no call at
#           all. `reason` says which.
#
# `applies` is the group's Applicable To. A blank Applicable To, and "PHR App"
# on Share Profile, both read as all.
#
# scripts/check-test-mapping.mjs checks this file against the generated page
# site/docs/hiecm/v3/resources/test-cases/m1.mdx, the journeys and the specs.
