hiecm.concept.input-encryption:
  type: concept
  gateway: hiecm
  milestone: M1
  title: Encrypting sensitive inputs, Aadhaar, mobile, OTP and passwords
  summary: Aadhaar numbers, mobile numbers, OTPs and passwords are encrypted with
