    - hiecm.endpoint.p3-revoke-consent-request
    glossary:
    - shared.glossary.phr
    - hiecm.glossary.hiu
hiecm.concept.encrypted-identifiers:
  type: concept
  gateway: hiecm
  milestone: M1
  title: Why identifiers are encrypted, and where to do it
  summary: Identifiers are encrypted with the published certificate, using the algorithm
    its response names, after being put in the shape the service validates.
  page: site/docs/hiecm/v3/concepts/encryption.mdx
  heading: encrypted-identifiers
  url: /docs/hiecm/v3/concepts/encryption#encrypted-identifiers
  related:
