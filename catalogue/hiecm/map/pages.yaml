hiecm.concept.abha-address-policy:
  type: concept
  gateway: hiecm
  milestone: M1
  title: What an ABHA address is allowed to be
  summary: The characters and shapes an ABHA address may take, and the default address
    every ABHA number is issued.
  page: site/docs/hiecm/v3/registries/abha.mdx
  heading: abha-address-policy
  url: /docs/hiecm/v3/registries/abha#abha-address-policy
  related:
    concepts:
    - hiecm.concept.abha-number-and-address
    endpoints:
    - hiecm.endpoint.p1-enrollment-address-suggestion
    - hiecm.endpoint.p1-enrollment-address-exists
