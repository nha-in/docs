    - hiecm.endpoint.m1-get-public-certificate
    tests:
    - hiecm.test.m1-encryption-padding
hiecm.concept.error-codes:
  type: concept
  gateway: hiecm
  milestone: M2
  title: Reading an ABDM error code
  summary: Read the ABDM error code in the response body before the HTTP status, and
    key your handling on it.
