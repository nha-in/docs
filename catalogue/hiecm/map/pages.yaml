    - shared.glossary.abha-address
    - shared.glossary.abha-number
    flows:
    - hiecm.flow.p1-create-abha-address
hiecm.concept.abha-number-and-address:
  type: concept
  gateway: hiecm
  milestone: M1
  title: ABHA number and ABHA address, and why there are two
  summary: Two identifiers, the ABHA number for who the person is and the ABHA address
    for where their records are routed.
  page: site/docs/hiecm/v3/registries/abha.mdx
  heading: abha-number-and-address
  url: /docs/hiecm/v3/registries/abha#abha-number-and-address
  related:
    glossary:
    - shared.glossary.abha-number
    - shared.glossary.abha-address
hiecm.concept.asynchronous-callbacks:
  type: concept
  gateway: hiecm
  milestone: M2
  title: Asynchronous calls and callbacks, why a 200 means very little
  summary: Most HIE-CM calls answer 202 at once and deliver the real answer later
    as a callback to your registered URL, matched by request id.
  page: site/docs/hiecm/v3/concepts/gateway.mdx
  heading: asynchronous-callbacks
  url: /docs/hiecm/v3/concepts/gateway#asynchronous-callbacks
  related:
    glossary:
    - shared.glossary.request-id
    decisions:
    - hiecm.decision.callbacks-as-webhooks
hiecm.concept.callback-authenticity:
  type: concept
  gateway: hiecm
  milestone: M2
  title: Proving a callback really came from ABDM
  summary: Anything can post to your callback URL, so require the bearer token and
    a request id you sent before your handler acts.
  page: site/docs/hiecm/v3/concepts/callback-authenticity.mdx
  heading: callback-authenticity
  url: /docs/hiecm/v3/concepts/callback-authenticity#callback-authenticity
  related:
    concepts:
    - hiecm.concept.asynchronous-callbacks
    - hiecm.concept.gateway-session
    - hiecm.concept.consent-artefact
    troubleshooting:
    - hiecm.troubleshooting.callback-never-arrives
hiecm.concept.care-context:
  type: concept
  gateway: hiecm
  milestone: M2
  title: Care contexts, how records are grouped so they can be found
  summary: A care context is the unit a provider links to a patient's ABHA address,
    carrying a reference number and a display name and nothing clinical.
  page: site/docs/hiecm/v3/concepts/care-context.mdx
  heading: care-context
  url: /docs/hiecm/v3/concepts/care-context#care-context
  related:
    concepts:
    - hiecm.concept.roles
hiecm.concept.consent-artefact:
  type: concept
  gateway: hiecm
  milestone: M3
  title: Consent, what it authorises and how it ends
  summary: Reading somebody else's records needs a consent artefact naming who, what
    and for how long, and the patient can end it at any time.
  page: site/docs/hiecm/v3/concepts/consent.mdx
  heading: consent-artefact
  url: /docs/hiecm/v3/concepts/consent#consent-artefact
  related:
    glossary:
    - hiecm.glossary.hiu
    concepts:
    - hiecm.concept.roles
hiecm.concept.consent-in-a-phr-app:
  type: concept
  gateway: hiecm
  milestone: P3
  title: The five things a personal health record application must let a person do
    with consent
  summary: A personal health record app must let a person see a consent request, change
    it, allow or refuse it, see what is allowed, and take it back.
  page: site/docs/hiecm/v3/concepts/consent.mdx
  heading: consent-in-a-phr-app
  url: /docs/hiecm/v3/concepts/consent#consent-in-a-phr-app
  related:
    concepts:
    - hiecm.concept.consent-artefact
    - hiecm.concept.phr-subscriptions
