# ABDM gateway session API.
#
# Every module gets its access token from this one endpoint, so it is
# described once here instead of being copied into four module files. The
# module specs point at it from their security scheme description.
#
# Rules this file follows: catalogue/openapi/CONVENTIONS.md
openapi: 3.1.1

info:
  title: ABDM gateway sessions
  summary: Exchange a client id and client secret for the access token every other ABDM call needs.
  description: |
    The first call in any ABDM integration. You send the client id and client
    secret issued when you registered your application on the ABDM sandbox,
    and you get back a bearer token that the module APIs accept.

    Nothing in this file has been run against the sandbox from this
    repository. The request body and response fields below are transcribed
    from NHA's own milestone documentation, listed under `x-abdm-sources`.
    They are documented, not verified. An endpoint atom records a real
    response before anything here may be called verified.
  version: abdm-v3
  license:
    name: MIT
    identifier: MIT
  contact:
    name: ABDM sandbox support
    url: https://devforum.abdm.gov.in
  x-abdm-gateway: hiecm
  x-abdm-module: gateway
  x-abdm-phase: 1
  x-abdm-roles: [phr, his, hip, hiu]

x-abdm-sources:
  - file: ABDM Sandbox/ABDM/Proposed Simplified Milestone 4 (NHPR).docx
    role: upstream
    status: not-yet-hashed
    note: >
      NHA milestone pack, supplied as a document rather than a specification.
      Carries the session request body and a sample response verbatim.
  - url: https://sandbox.abdm.gov.in/sandbox/v3/new-documentation/swagger
    role: upstream
    status: not-yet-fetched
    note: >
      The published swagger. Fetch it, hash it, store it under .raw/ and
      reconcile this file against it before anyone integrates from it.

servers:
  - url: https://dev.abdm.gov.in
    description: 'Sandbox. Pair it with the `X-CM-ID: sbx` header.'
  - url: https://apis.abdm.gov.in
    description: 'Production. Pair it with the `X-CM-ID: abdm` header.'

tags:
  - name: sessions
    description: >
      Getting and refreshing the gateway access token. Do this before any
      other call in any module, and cache the token until it expires rather
      than asking for a new one per request.

paths:
  /api/hiecm/gateway/v3/sessions:
    post:
      operationId: gateway_sessions_create
      x-abdm-use-case: Session and tokens
      tags: [sessions]
      summary: Create a session and get an access token
      description: |
        Send the client id and client secret from your ABDM sandbox
        registration. The response carries a bearer token that every module
        API accepts in the `Authorization` header.

        This is the one call that does not itself need a bearer token, which
        is why `security` is empty here.

        The token is short lived. Read `expiresIn` from the response rather
        than assuming a duration, and refresh before it runs out instead of
        waiting for a 401.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/CmId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: A session was created and a bearer token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
      x-abdm-atom: hiecm.endpoint.gateway-sessions

components:
  securitySchemes:
    gatewaySession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The `accessToken` returned by `POST /api/hiecm/gateway/v3/sessions`
        in this file. Send it as `Authorization: Bearer <ACCESS_TOKEN>`.

  parameters:
    RequestId:
      name: REQUEST-ID
      in: header
      required: true
      description: >
        A fresh UUID that you generate for this request. It is how you and
        NHA correlate a call with its callback and with a support ticket, so
        log it. Reusing one across requests makes both impossible.
      schema:
        type: string
        format: uuid
      example: 5f7a4a1e-59ba-4c0c-9e0c-8e6b3b6e2f11

    Timestamp:
      name: TIMESTAMP
      in: header
      required: true
      description: >
        The current time in ISO 8601, in IST, the +05:30 offset. Working integrations send IST even though NHA's collection fills this with Postman's `$isoTimestamp`, which emits UTC. The gateway rejects a request
        whose timestamp has drifted too far from its own clock, so take this
        from a synchronised clock rather than from a local one.
      schema:
        type: string
        format: date-time
      example: '2026-08-24T15:45:30.000+05:30'

    CmId:
      name: X-CM-ID
      in: header
      required: true
      description: >
        Which consent manager you are talking to. `sbx` on the sandbox and
        `abdm` in production. Sending the wrong one against the right host is
        a common first-day failure and reads as an authorisation error.
      schema:
        type: string
      examples:
        sandbox:
          value: sbx
        production:
          value: abdm

  schemas:
    SessionRequest:
      type: object
      required: [clientId, clientSecret, grantType]
      properties:
        clientId:
          type: string
          description: The client id issued when you registered on the ABDM sandbox.
        clientSecret:
          type: string
          description: >
            The client secret issued alongside the client id. It is a
            credential. Keep it server side, never in a mobile or browser
            build.
        grantType:
          type: string
          description: The only value NHA's documentation shows is `client_credentials`.
          example: client_credentials

    SessionResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: The bearer token to send on every other call.
        expiresIn:
          type: integer
          description: >
            Seconds until the access token stops working. Read it rather than
            hardcoding a lifetime, because NHA has changed it.
        refreshExpiresIn:
          type: integer
          description: Seconds until the refresh token stops working.
        refreshToken:
          type: string
          description: Used to get a new access token without sending the secret again.
        tokenType:
          type: string
          description: NHA's sample response shows `bearer`.
          example: bearer
