  /v3/profile/login/verify:
    post:
      operationId: m1_login_verify
      tags:
      - abha-login
      summary: Verify a login OTP and get a user token
      description: |
        Returns the user scoped token that profile calls need, sent afterwards as
        the `X-token` header. That token identifies one person, so it is not
        interchangeable with the gateway session token, which identifies your
        application.

        If the identifier the person used maps to more than one ABHA, this
        responds with the list instead of a token, and you continue with the
        user selection call.

        The saved responses in NHA's collection cover 400, 401, 404 and 422 as
        well as 200, so read the body rather than only the status.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/BenefitName'
      - $ref: '#/components/parameters/TToken'
      - $ref: '#/components/parameters/XToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                    otp:
                      type: object
                      properties:
                        txnId:
                          type: string
                        otpValue:
                          type: string
                      required:
                      - otpValue
                      - txnId
                    password:
                      type: object
                      properties:
                        ABHANumber:
                          type: string
                        password:
                          type: string
                      required:
                      - ABHANumber
                      - password
                    face:
                      type: object
                      properties:
                        txnId:
                          type: string
                      required:
                      - txnId
                    bio:
                      type: object
                      properties:
                        txnId:
                          type: string
                        fingerPrintAuthPid:
                          type: string
                      required:
                      - fingerPrintAuthPid
                      - txnId
                  required:
                  - authMethods
              required:
              - authData
              - scope
            examples:
              login_abha_via_mobile_number:
                summary: login abha via mobile number
                value:
                  scope:
                  - abha-login
                  - mobile-verify
                  authData:
                    authMethods:
                    - otp
                    otp:
                      txnId: <TXN_ID>
                      otpValue: <OTPVALUE>
              login_abha_via_aadhaar_number:
                summary: login abha via aadhaar number
                value:
                  scope:
                  - abha-login
                  - aadhaar-verify
                  authData:
                    authMethods:
                    - otp
                    otp:
                      txnId: <TXN_ID>
                      otpValue: <OTPVALUE>
              login_abha_number_password:
                summary: login abha number password
                value:
                  scope:
                  - abha-login
                  - password-verify
                  authData:
                    authMethods:
                    - password
                    password:
                      ABHANumber: <ABHA_NUMBER>
                      password: <PASSWORD>
      responses:
        '200':
          description: Recorded in NHA's own collection. Values are scrubbed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                  authResult:
                    type: string
                  message:
                    type: string
                  token:
                    type: string
                  expiresIn:
                    type: integer
                  refreshToken:
                    type: string
                  refreshExpiresIn:
                    type: integer
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        ABHANumber:
                          type: string
                        preferredAbhaAddress:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                        profilePhoto:
                          type: string
                        mobileVerified:
                          type: boolean
                      required:
                      - ABHANumber
                      - mobileVerified
                      - name
                      - preferredAbhaAddress
                      - profilePhoto
                      - status
                required:
                - accounts
                - authResult
                - expiresIn
                - message
                - refreshExpiresIn
                - refreshToken
                - token
                - txnId
              examples:
                example:
                  summary: example
                  value:
                    txnId: <TXN_ID>
                    authResult: success
                    message: Aadhaar Face Authentication Success
                    token: <TOKEN>
                    expiresIn: 1800
                    refreshToken: <REFRESHTOKEN>
                    refreshExpiresIn: 1296000
