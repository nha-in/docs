# Module M1: ABHA identity.
#
# Operations are derived from NHA's own M1 Postman collection: paths,
# methods, headers, request schemas and the response examples NHA saved.
# Every summary and description is written by hand, because generated prose
# makes an agent pick the wrong tool.
#
# Nothing here has been run against the sandbox from this repository.
# Sample values are scrubbed: tokens, ABHA numbers and long identifiers in
# NHA's collection are replaced with placeholders.
#
# Rules this file follows: catalogue/openapi/CONVENTIONS.md
openapi: 3.1.1
info:
  title: ABDM M1, ABHA identity
  summary: Create, find, log into and manage an ABHA, the health account that
    identifies a patient across ABDM.
  description: |
    M1 is where a patient gets an identity. An ABHA number is a 14 digit
    identifier issued after a KYC check, and an ABHA address is the readable
    name, such as `name@sbx`, that the rest of ABDM uses to route records.

    You are here if you are building a PHR app, or a hospital, lab or pharmacy
    system that registers patients. Everything in M2 and M3 assumes the patient
    already has an ABHA address, and this module is how they get one.

    Two versions live side by side. Most of M1 is served from `/abha/api/v3`
    and a few login calls from `/abha/api/v3.1`, so the version is part of the
    path here rather than part of the server URL.

    Where this comes from, and what it is worth. Paths, methods, headers,
    request shapes and the response examples are derived from NHA's own M1
    Postman collection. Nothing has been run against the sandbox from this
    repository, so no operation here is verified. Where NHA saved no response
    body, the operation says so rather than guessing a shape.

    Sample values are scrubbed. Tokens, ABHA numbers and long identifiers are
    replaced with placeholders, and Postman variables such as
    `{{lastResponseTxnId}}` are rewritten as `<LAST_RESPONSE_TXN_ID>`.

    One rule runs through the whole module. Identifiers you send, an Aadhaar
    number, a mobile number, an OTP, are encrypted against NHA's public key
    rather than sent raw.
  version: abdm-v3
  license:
    name: MIT
    identifier: MIT
  contact:
    name: ABDM sandbox support
    url: https://devforum.abdm.gov.in
  x-abdm-gateway: hiecm
  x-abdm-module: M1
  x-abdm-phase: 1
  x-abdm-roles:
  - phr
  - his
x-abdm-sources:
- file: ABDM Sandbox/ABDM/M1 ABHA Collection.postman_collection.json
  role: upstream
  status: not-yet-hashed
  note: 'NHA''s own M1 collection, 123 requests. Every operation below is derived
    from it: paths, methods, headers, request shapes and the saved response examples.
    Tag names are its folder names, so an integrator reading NHA''s collection
    finds the same words here.'
- file: ABDM Sandbox/ABDM/Proposed Simplified Milestone 1.docx
  role: upstream
  status: not-yet-hashed
  note: Carries the sandbox and production base URLs and the enrolment flows.
- url: https://sandbox.abdm.gov.in/sandbox/v3/new-documentation/swagger
  role: upstream
  status: not-yet-fetched
  note: The published swagger. Fetch and hash it before filling `paths`.
servers:
- url: https://abhasbx.abdm.gov.in/abha/api
  description: Sandbox. The version segment is part of the path, because M1 serves
    both v3 and v3.1.
- url: https://abha.abdm.gov.in/api/abha
  description: Production.
security:
- gatewaySession: []
tags:
- name: abha-creation
  description: |
    Creating an ABHA number after verifying who the person is. NHA supports Aadhaar OTP, face authentication, fingerprint, IRIS, demographic authentication, a driving licence route, and a separate route for a child. Aadhaar OTP is mandatory for every integrator. The rest are optional.
- name: abha-login
  description: |
    Signing an existing ABHA holder in, by mobile number, Aadhaar number, ABHA number with a password, mobile OTP, biometric, or a face authentication QR code.
- name: abha-profile
  description: |
    Managing an account after it exists. Updating the mobile number or email, setting a password, repeating KYC, downloading the ABHA card, deactivating, reactivating, deleting, and logging out.
- name: find-abha
  description: |
    Recovering an ABHA for someone who does not remember it, using mobile OTP, Aadhaar OTP, face authentication or fingerprint.
- name: benefit-apis
  description: |
    The benefit scheme variants of creation, search and linking. These calls carry the `BENEFIT_NAME` header.
- name: tokens-and-encryption
  description: |
    The certificate and token calls the other groups depend on, including the public key used to encrypt Aadhaar and mobile values in transit.
paths:
  /v3/enrollment/auth/byAbdm:
    post:
      operationId: m1_enrolment_verify_abdm_otp
      tags:
      - abha-creation
      summary: Verify an OTP that ABDM sent, during enrolment
      description: |
        Confirms the mobile number or email address the person gave during
        enrolment. The OTP here came from ABDM rather than from Aadhaar, which is
        why the call is separate from the Aadhaar verification.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                    otp:
                      type: object
                      properties:
                        txnId:
                          type: string
                        otpValue:
                          type: string
                        timeStamp:
                          type: string
                      required:
                      - otpValue
                      - txnId
                  required:
                  - authMethods
                  - otp
              required:
              - authData
              - scope
            examples:
              create_abha_aadhaar_otp:
                summary: create abha aadhaar otp
                value:
                  scope:
                  - abha-enrol
                  - mobile-verify
                  authData:
                    authMethods:
                    - otp
                    otp:
                      txnId: <TXN_ID>
                      otpValue: <OTPVALUE>
              create_abha_aadhaar_otp_alt:
                summary: create abha aadhaar otp alt
                value:
                  scope:
                  - abha-enrol
                  - email-verify
                  authData:
                    authMethods:
                    - otp
                    otp:
                      txnId: <TXN_ID>
                      otpValue: <OTPVALUE>
              create_abha_driving_license:
                summary: create abha driving license
                value:
                  scope:
                  - abha-enrol
                  - mobile-verify
                  - dl-flow
                  authData:
                    authMethods:
                    - otp
                    otp:
                      timeStamp: <GENERATED>
                      txnId: <TXN_ID>
                      otpValue: <OTPVALUE>
      responses:
        '200':
          description: The call was accepted. NHA's collection saves no response
            body for this operation, so the shape is not recorded here. Run it
            against the sandbox and record what comes back before relying on it.
      x-abdm-atom: hiecm.endpoint.m1-enrolment-verify-abdm-otp
  /v3/enrollment/enrol/abha-address:
    post:
      operationId: m1_enrolment_claim_abha_address
      tags:
      - abha-creation
      summary: Claim a chosen ABHA address
      description: |
        Attaches the address the person picked to the ABHA number created
        earlier. `preferred: 1` marks it as the one to show.

        Until this succeeds the account has only the default address that NHA
        issues automatically, which is the fourteen digit number followed by
        `@sbx` or `@abdm` and which nobody can remember.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                txnId:
                  type: string
                abhaAddress:
                  type: string
                preferred:
                  type: integer
              required:
              - abhaAddress
              - preferred
              - txnId
            examples:
              create_abha_aadhaar_otp:
                summary: create abha aadhaar otp
                value:
                  txnId: <TXN_ID>
                  abhaAddress: <ABHA_ADDRESS>
                  preferred: 1
      responses:
        '200':
          description: The call was accepted. NHA's collection saves no response
            body for this operation, so the shape is not recorded here. Run it
            against the sandbox and record what comes back before relying on it.
      x-abdm-atom: hiecm.endpoint.m1-enrolment-claim-abha-address
  /v3/enrollment/enrol/auth/init:
    post:
      operationId: m1_enrolment_face_auth_init
      tags:
      - abha-creation
      summary: Start face or biometric authentication and get a transaction id
      description: |
        Returns the `txnId` that a QR code is built from. The person scans that QR
        with the ABHA app, completes face authentication through the Aadhaar RD
        service, and you then continue with the captured result.

        The same call starts the face authentication login flow, not only
        enrolment.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      responses:
        '200':
          description: The call was accepted. NHA's collection saves no response
            body for this operation, so the shape is not recorded here. Run it
            against the sandbox and record what comes back before relying on it.
      x-abdm-atom: hiecm.endpoint.m1-enrolment-face-auth-init
  /v3/enrollment/enrol/byAadhaar:
    post:
      operationId: m1_enrolment_by_aadhaar
      tags:
      - abha-creation
      summary: Create an ABHA from a verified Aadhaar OTP
      description: |
        Exchanges the OTP you just received for a real ABHA number. Send the
        `txnId` from the OTP request, the encrypted OTP value, and the consent
        block recording that the person agreed.

        This is the call that creates the account, so treat a success as a
        permanent side effect. If you retry it blindly after a timeout you may be
        asking NHA to enrol somebody twice.

        `BENEFIT_NAME` is sent on this call in NHA's collection when the
        enrolment belongs to a benefit scheme.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/BenefitName'
      - $ref: '#/components/parameters/XToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                    otp:
                      type: object
                      properties:
                        txnId:
                          type: string
                        otpValue:
                          type: string
                        mobile:
                          type: string
                        fingerPrintAuthPid:
                          type: string
                        timeStamp:
                          type: string
                      required:
                      - mobile
                      - txnId
                    face:
                      type: object
                      properties:
                        txnId:
                          type: string
                        aadhaar:
                          type: string
                      required:
                      - aadhaar
                      - txnId
                    iris:
                      type: object
                      properties:
                        aadhaar:
                          type: string
                        Pid:
                          type: string
                        mobile:
                          type: string
                      required:
                      - Pid
                      - aadhaar
                      - mobile
                    bio:
                      type: object
                      properties:
                        aadhaar:
                          type: string
                        fingerPrintAuthPid:
                          type: string
                        mobile:
                          type: string
                      required:
                      - aadhaar
                      - fingerPrintAuthPid
                      - mobile
                  required:
                  - authMethods
                consent:
                  type: object
                  properties:
                    code:
                      type: string
                    version:
                      type: string
                  required:
                  - code
                  - version
              required:
              - authData
              - consent
            examples:
              create_abha_aadhaar_otp:
                summary: create abha aadhaar otp
                value:
                  authData:
                    authMethods:
                    - otp
                    otp:
                      txnId: <TXN_ID>
                      otpValue: <OTPVALUE>
                      mobile: <MOBILE>
                  consent:
                    code: abha-enrollment
                    version: '1.4'
              create_abha_face_authentication:
                summary: create abha face authentication
                value:
                  authData:
                    authMethods:
                    - face_auth
                    face:
                      txnId: <TXN_ID>
                      aadhaar: <ENCRYPTED_AADHAAR>
                  consent:
                    code: abha-enrollment
                    version: '1.4'
              create_abha_fingerprint_authentication:
                summary: create abha fingerprint authentication
                value:
                  authData:
                    authMethods:
                    - otp
                    otp:
                      txnId: <TXN_ID>
                      fingerPrintAuthPid: <FINGERPRINTAUTHPID>
                      mobile: <MOBILE>
                  consent:
                    code: abha-enrollment
                    version: '1.4'
      responses:
        '200':
          description: The call was accepted. NHA's collection saves no response
            body for this operation, so the shape is not recorded here. Run it
            against the sandbox and record what comes back before relying on it.
      x-abdm-atom: hiecm.endpoint.m1-enrolment-by-aadhaar
  /v3/enrollment/enrol/byDocument:
    post:
      operationId: m1_enrolment_by_document
      tags:
      - abha-creation
      summary: Create an ABHA from an identity document
      description: |
        The route for somebody who cannot complete Aadhaar authentication. NHA's
        collection uses a driving licence. The account created this way is
        restricted until it is upgraded through Aadhaar KYC, so tell the person
        that rather than letting them discover it later.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                txnId:
                  type: string
                documentType:
                  type: string
                documentId:
                  type: string
                firstName:
                  type: string
                middleName:
                  type: string
                lastName:
                  type: string
                dob:
                  type: string
                gender:
                  type: string
                frontSidePhoto:
                  type: string
                backSidePhoto:
                  type: string
                address:
                  type: string
                state:
                  type: string
                district:
                  type: string
                pinCode:
                  type: string
                consent:
                  type: object
                  properties:
                    code:
                      type: string
                    version:
                      type: string
                  required:
                  - code
                  - version
              required:
              - address
              - backSidePhoto
              - consent
              - district
              - dob
              - documentId
              - documentType
              - firstName
              - frontSidePhoto
              - gender
              - lastName
              - middleName
              - pinCode
              - state
              - txnId
            examples:
              create_abha_driving_license:
                summary: create abha driving license
                value:
                  txnId: <TXN_ID>
                  documentType: DRIVING_LICENCE
                  documentId: DL0820****858
                  firstName: <FIRST_NAME>
                  middleName: <MIDDLE_NAME>
                  lastName: <LAST_NAME>
                  dob: <DATE_OF_BIRTH>
                  gender: M
                  frontSidePhoto: <ENCRYPTED_VALUE>
                  backSidePhoto: <ENCRYPTED_VALUE>
                  address: <ADDRESS>
                  state: <STATE>
                  district: <DISTRICT>
                  pinCode: <PIN_CODE>
                  consent:
                    code: abha-enrollment
                    version: '1.4'
      responses:
        '200':
          description: The call was accepted. NHA's collection saves no response
            body for this operation, so the shape is not recorded here. Run it
            against the sandbox and record what comes back before relying on it.
      x-abdm-atom: hiecm.endpoint.m1-enrolment-by-document
  /v3/enrollment/enrol/capturePID:
    post:
      operationId: m1_enrolment_capture_pid
      tags:
      - abha-creation
      summary: Submit a captured biometric or face authentication block
      description: |
        Hands NHA the PID block produced by the Aadhaar RD service. The block is
        encrypted by the device and is time limited, so send it as soon as the
        capture returns rather than storing it.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                txnId:
                  type: string
              required:
              - scope
              - txnId
            examples:
              create_abha_face_authentication:
                summary: create abha face authentication
                value:
                  scope:
                  - abha-enrol
                  - face-verify
                  txnId: <TXN_ID>
      responses:
        '200':
          description: Recorded in NHA's own collection. Values are scrubbed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  txnId:
                    type: string
                required:
                - message
                - status
              examples:
                without_submiting_pid:
                  summary: without submiting pid
                  value:
                    status: VERIFIED
                    message: Awaiting PID capture
                without_verify_and_submitting_pid:
                  summary: without verify and submitting pid
                  value:
                    status: PENDING
                    message: Awaiting PID capture
      x-abdm-atom: hiecm.endpoint.m1-enrolment-capture-pid
  /v3/enrollment/enrol/suggestion:
    get:
      operationId: m1_enrolment_address_suggestions
      tags:
      - abha-creation
      summary: Get suggested ABHA addresses for a new account
      description: |
        Returns a handful of available ABHA addresses built from the person's
        name and date of birth. Offer them as a choice. The person may type their
        own instead, subject to NHA's address policy: at least four characters,
        letters, numbers and dots only, and it may not begin with a number or
        begin or end with a dot.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The call was accepted. NHA's collection saves no response
            body for this operation, so the shape is not recorded here. Run it
            against the sandbox and record what comes back before relying on it.
      x-abdm-atom: hiecm.endpoint.m1-enrolment-address-suggestions
  /v3/enrollment/profile/children:
    get:
      operationId: m1_enrolment_list_children
      tags:
      - abha-creation
      summary: List the child ABHA accounts linked to this account
      description: |
        A parent or guardian can hold ABHA accounts for children under their own
        account. This returns them.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/XToken'
      responses:
        '200':
          description: The call was accepted. NHA's collection saves no response
            body for this operation, so the shape is not recorded here. Run it
            against the sandbox and record what comes back before relying on it.
      x-abdm-atom: hiecm.endpoint.m1-enrolment-list-children
  /v3/enrollment/request/otp:
    post:
      operationId: m1_enrolment_request_otp
      tags:
      - abha-creation
      summary: Send an OTP to begin or continue an enrolment
      description: |
        The first call of most enrolment flows, and the one people reuse without
        noticing. What it does depends on `scope` and `loginHint`.

        Starting an enrolment: `scope` is `["abha-enrol"]`, `loginHint` is
        `aadhaar`, `loginId` is the encrypted Aadhaar number and `otpSystem` is
        `aadhaar`. The OTP goes to the mobile registered with Aadhaar.

        Verifying a mobile or email afterwards: `scope` gains `mobile-verify` or
        `email-verify`, `otpSystem` becomes `abdm`, and you pass the `txnId` from
        the enrolment you are continuing.

        `loginId` is encrypted, never the raw value. Encrypt it against NHA's
        public key first.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                loginHint:
                  type: string
                loginId:
                  type: string
                otpSystem:
                  type: string
                txnId:
                  type: string
              required:
              - loginHint
              - loginId
              - otpSystem
              - scope
            examples:
              create_abha_aadhaar_otp:
                summary: create abha aadhaar otp
                value:
                  scope:
                  - abha-enrol
                  loginHint: aadhaar
                  loginId: _encrypted_12_digit_aadhaar_no_
                  otpSystem: aadhaar
              create_abha_aadhaar_otp_alt:
                summary: create abha aadhaar otp alt
                value:
                  txnId: <TXN_ID>
                  scope:
                  - abha-enrol
                  - mobile-verify
                  loginHint: mobile
                  loginId: <ENCRYPTED_MOBILE_NUMBER>
                  otpSystem: abdm
              create_abha_aadhaar_otp_alt_alt:
                summary: create abha aadhaar otp alt alt
                value:
                  txnId: <TXN_ID>
                  scope:
                  - abha-enrol
                  - email-verify
                  loginHint: email
                  loginId: <EMAIL_ENCRYPTION>
                  otpSystem: abdm
      responses:
        '200':
          description: The call was accepted. NHA's collection saves no response
            body for this operation, so the shape is not recorded here. Run it
            against the sandbox and record what comes back before relying on it.
      x-abdm-atom: hiecm.endpoint.m1-enrolment-request-otp
  /v3.1/profile/login/request/otp:
    post:
      operationId: m1_login_request_otp_v31
      tags:
      - abha-login
      summary: Send a login OTP, v3.1
      description: |
        The v3.1 variant of the login OTP request. It sits on a different base
        path from the rest of M1, `/abha/api/v3.1` rather than `/abha/api/v3`,
        which is why the version appears in the path here.

        NHA's collection uses it for Aadhaar OTP and biometric login. Treat v3
        as the default and reach for v3.1 only where NHA's material does.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                loginHint:
                  type: string
                loginId:
                  type: string
                otpSystem:
                  type: string
              required:
              - loginHint
              - loginId
              - otpSystem
              - scope
            examples:
              login_abha_via_aadhaar_otp_v3_1_api:
                summary: login abha via aadhaar otp v3 1 api
                value:
                  scope:
                  - abha-login
                  - aadhaar-verify
                  - aadhaar-otp-verify
                  loginHint: aadhaar
                  loginId: <ENCRYPTED_AADHAAR_NUMBER>
                  otpSystem: aadhaar
      responses:
        '200':
          description: The call was accepted. NHA's collection saves no response
            body for this operation, so the shape is not recorded here. Run it
            against the sandbox and record what comes back before relying on it.
      x-abdm-atom: hiecm.endpoint.m1-login-request-otp-v31
  /v3.1/profile/login/verify:
    post:
      operationId: m1_login_verify_v31
      tags:
      - abha-login
      summary: Verify a login OTP, v3.1
      description: |
        The v3.1 counterpart of the login verification, on the `/abha/api/v3.1`
        base path.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                    otp:
                      type: object
                      properties:
                        txnId:
                          type: string
                        otpValue:
                          type: string
                      required:
                      - otpValue
                      - txnId
                    face_login:
                      type: object
                      properties:
                        aadhaar:
                          type: string
                        faceAuthPid:
                          type: string
                        txnId:
                          type: string
                      required:
                      - aadhaar
                    bio_login:
                      type: object
                      properties:
                        aadhaar:
                          type: string
                        fingerPrintAuthPid:
                          type: string
                      required:
                      - aadhaar
                      - fingerPrintAuthPid
                    iris_login:
                      type: object
                      properties:
                        aadhaar:
                          type: string
                        irisAuthPid:
                          type: string
                      required:
                      - aadhaar
                      - irisAuthPid
                  required:
                  - authMethods
              required:
              - authData
              - scope
            examples:
              login_abha_via_aadhaar_otp_v3_1_api:
                summary: login abha via aadhaar otp v3 1 api
