components:
  securitySchemes:
    gatewaySession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `accessToken` from `POST /api/hiecm/gateway/v3/sessions`, which is described in hiecm-gateway.yaml. Send it as `Authorization: Bearer <ACCESS_TOKEN>`.
  parameters:
    RequestId:
      name: REQUEST-ID
      in: header
      required: true
      description: |
        A fresh UUID that you generate for this request. Present on 121 of the 123 requests in NHA's M1 collection. Log it, because it is how a support ticket is traced.
      schema:
        type: string
        format: uuid
      example: 5f7a4a1e-59ba-4c0c-9e0c-8e6b3b6e2f11
    Timestamp:
      name: TIMESTAMP
      in: header
      required: true
      description: |
        The current time in ISO 8601, in UTC. Take it from a synchronised clock. A drifted clock fails the whole module and the error does not say so.
      schema:
        type: string
        format: date-time
      example: '2026-08-24T10:15:30.000Z'
    XToken:
      name: X-token
      in: header
      required: false
      description: |
        The user scoped token returned when a person logs in or verifies an OTP. Profile calls act on one account, so they need this in addition to the gateway token. Required on the calls that read or change a specific person's account.
      schema:
        type: string
    BenefitName:
      name: BENEFIT_NAME
      in: header
      required: false
      description: |
        The benefit scheme an enrolment belongs to. Observed on the enrolment and benefit calls in NHA's collection. Confirm the exact values with NHA before using them in production.
      schema:
        type: string
    TToken:
      name: T-token
      in: header
      required: false
      schema:
        type: string
      description: The transaction token that carries state between the two halves
        of a login. Returned by the verify call and sent back on the account selection
        call.
    RToken:
      name: R-token
      in: header
      required: false
      schema:
        type: string
      description: The refresh token, sent when asking for a new user token without
        making the person log in again.
    KeyType:
      name: KEY_TYPE
      in: header
      required: false
      schema:
        type: string
      description: Which NHA public key the encryption helper should use.
    TransactionId:
      name: TRANSACTION_ID
      in: header
      required: false
      schema:
        type: string
      description: The enrolment transaction this call belongs to, when the transaction
        is not carried in the body.
    AbhaNumber:
      name: abhaNumber
      in: path
      required: true
      schema:
        type: string
      example: <ABHA_NUMBER>
      description: A fourteen digit ABHA number, written in the hyphenated form
        NHA uses, for example 91-1234-5678-9012.
