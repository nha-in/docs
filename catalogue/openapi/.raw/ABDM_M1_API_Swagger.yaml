        - xToken: []
      responses:
        '200':
          description: PHR profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhrProfileResponse'

  /phr/web/login/profile/abha/phr-card:
    get:
      tags: [PHR & ABHA Address]
      summary: Download PHR Card
      operationId: downloadPhrCard
