  /phr/web/login/abha/request/otp:
    post:
      tags: [PHR & ABHA Address]
      summary: Send OTP for ABHA Address Login
      operationId: phrRequestOtp
      description: |
        Send OTP to login via ABHA Address.

        | scope | loginHint | Method |
        |-------|-----------|--------|
        | `["abha-address-login","mobile-verify"]` | `abha-address` | Mobile OTP |
        | `["abha-address-login","aadhaar-verify"]` | `abha-address` | Aadhaar OTP |
        | `["abha-login","aadhaar-bio-verify"]` | `abha-address` | Fingerprint |
        | `["abha-login","aadhaar-face-verify"]` | `abha-address` | Face |
        | `["abha-login","aadhaar-iris-verify"]` | `abha-address` | Iris |
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhrOtpRequest'
            examples:
              mobile_otp:
                summary: Mobile OTP
                value:
                  scope: ["abha-address-login", "mobile-verify"]
                  loginHint: "abha-address"
                  loginId: "{{RSA_encrypted_abha_address}}"
              aadhaar_otp:
                summary: Aadhaar OTP
                value:
                  scope: ["abha-address-login", "aadhaar-verify"]
                  loginHint: "abha-address"
                  loginId: "{{RSA_encrypted_abha_address}}"
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxnResponse'

  /phr/web/login/abha/verify:
    post:
      tags: [PHR & ABHA Address]
      summary: Verify OTP / Biometric for ABHA Address Login
      operationId: phrVerify
      description: Complete the ABHA Address login with OTP or biometric.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhrVerifyRequest'
            examples:
              mobile_otp_verify:
                summary: Mobile OTP verification
                value:
                  scope: ["abha-address-login", "mobile-verify"]
                  authData:
                    authMethods: ["otp"]
                    otp:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      otpValue: "{{RSA_encrypted_otp}}"
              biometric_verify:
                summary: Fingerprint verification
                value:
                  scope: ["abha-login", "aadhaar-bio-verify"]
                  authData:
                    authMethods: ["bio"]
                    bio:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      bioType: "FMR"
                      pid: "{{encrypted_PID_block}}"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginVerifyResponse'

