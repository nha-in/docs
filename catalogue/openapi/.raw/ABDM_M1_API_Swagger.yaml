openapi: 3.0.3

info:
  title: ABDM Milestone 1 (M1) Integration API
  description: |
    ## Overview
    Complete OpenAPI specification for ABDM Milestone 1 integration.

    Covers the following domains:
    - **Session & Certificate** — Obtain Bearer token and RSA public key
    - **ABHA Enrolment** — Create ABHA via Aadhaar OTP, Driving Licence, or Biometrics
    - **Login & Verification** — Authenticate existing ABHA holders
    - **ABHA Profile** — View/update profile, manage account lifecycle
    - **PHR / ABHA Address** — PHR login via ABHA Address
    - **Benefit APIs** — Link/de-link government scheme benefits
    - **Child ABHA** — Create ABHA for children via parent session
    - **Gateway & Bridge** — HIP/HIU registration and bridge management
    - **Scan & Share** — QR-based patient profile sharing

    ## Authentication Flow
    1. Call `POST /api/hiecm/gateway/v3/sessions` → get `accessToken`
    2. Use `Authorization: Bearer {accessToken}` on all subsequent calls
    3. After login/verify, use `X-Token: {token}` for profile operations

    ## Encryption Requirement
    **All sensitive fields must be RSA-encrypted** using the public key from
    `GET /abha/api/v3/profile/public/certificate` before transmission:
    - Aadhaar number
    - Mobile number
    - OTP value
    - Password
    - ABHA Number (in some flows)
    - Email address
    - Profile photo

    ## Sandbox Environments
    | Server | Base URL |
    |--------|----------|
    | ABHA Server (Sandbox) | `https://abhasbx.abdm.gov.in/abha/api/v3` |
    | ABDM Gateway (Dev) | `https://dev.abdm.gov.in/api/hiecm/gateway/v3` |
    | Facility Registry (Sandbox) | `https://facilitysbx.abdm.gov.in` |

  version: "3.0.0"
  contact:
    name: ABDM Integration Support
    url: https://abdm.gov.in
  license:
    name: Government of India — National Health Authority
    url: https://nha.gov.in

servers:
  - url: https://abhasbx.abdm.gov.in/abha/api/v3
    description: ABHA Server — Sandbox (primary)
  - url: https://dev.abdm.gov.in/api/hiecm
    description: ABDM Gateway — Dev
  - url: https://facilitysbx.abdm.gov.in
    description: Facility Registry — Sandbox

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: |
      Session token and RSA certificate — **must be called first** before any other API.
  - name: Enrollment
    description: Create a new ABHA number via Aadhaar OTP, Driving Licence, or Biometrics.
  - name: Login & Verification
    description: Authenticate an existing ABHA holder via multiple channels.
  - name: ABHA Profile
    description: View, update, and manage ABHA profile details and account lifecycle.
  - name: PHR & ABHA Address
    description: PHR application login and profile management using ABHA Address.
  - name: Child ABHA
    description: Create and manage ABHA numbers for children via parent session.
  - name: Benefit APIs
    description: Link or de-link ABHA to government / insurance benefit schemes.
  - name: Gateway & Bridge
    description: HIP/HIU service registration, bridge URL management, and OIDC configuration.
  - name: Scan & Share
    description: |
      Patient scans HIP QR code → ABHA App shares profile →
      HIP callback receives data → HIP sends acknowledgement to Gateway.

# ═══════════════════════════════════════════════════════════════════════
# PATHS
# ═══════════════════════════════════════════════════════════════════════

paths:

  # ──────────────────────────────────────────
  # AUTHENTICATION
  # ──────────────────────────────────────────

  /gateway/v3/sessions:
    post:
      tags: [Authentication]
      summary: Create Session — Obtain Access Token
      operationId: createSession
      description: |
        Obtain a JWT Bearer access token using client credentials (OAuth 2.0 client_credentials grant).
        This token must be passed as `Authorization: Bearer {accessToken}` in all subsequent API calls.

        **Server:** `https://dev.abdm.gov.in/api/hiecm`
      security: []
      servers:
        - url: https://dev.abdm.gov.in/api/hiecm
          description: ABDM Gateway
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
        - name: X-CM-ID
          in: header
          required: true
          description: Consent Manager ID (`sbx` for sandbox)
          schema:
            type: string
            default: sbx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
            example:
              clientId: "your-client-id"
              clientSecret: "your-client-secret"
              grantType: "client_credentials"
      responses:
        '200':
          description: Access token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                accessToken: "eyJhbGciOiJSUzI1NiIsInR5..."
                tokenType: "Bearer"
                expiresIn: 1800
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/public/certificate:
    get:
      tags: [Authentication]
      summary: Get RSA Public Certificate
      operationId: getPublicCertificate
      description: |
        Fetch the RSA public key used to encrypt all sensitive fields before transmission.
        Fields requiring encryption: Aadhaar, Mobile, OTP, Password, ABHA Number, Email, Photo.

        **Server:** `https://abhasbx.abdm.gov.in/abha/api/v3`
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      responses:
        '200':
          description: RSA public key retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'

  # ──────────────────────────────────────────
  # ENROLLMENT
  # ──────────────────────────────────────────

  /enrollment/request/otp:
    post:
      tags: [Enrollment]
      summary: Send OTP — Initiate Enrollment
      operationId: enrollmentRequestOtp
      description: |
        Send an OTP to initiate the ABHA enrollment process.

        **Scope combinations by use case:**

        | Use Case | scope | loginHint | otpSystem |
        |----------|-------|-----------|-----------|
        | Aadhaar OTP enrollment | `["abha-enrol"]` | `aadhaar` | `aadhaar` |
        | Mobile update after enrollment | `["abha-enrol","mobile-verify"]` | `mobile` | `abdm` |
        | DL enrollment — mobile verify | `["abha-enrol","mobile-verify","dl-flow"]` | `mobile` | `abdm` |
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentOtpRequest'
            examples:
              aadhaar_enrollment:
                summary: Aadhaar OTP — start enrollment
                value:
                  txnId: ""
                  scope: ["abha-enrol"]
                  loginHint: "aadhaar"
                  loginId: "{{RSA_encrypted_aadhaar}}"
                  otpSystem: "aadhaar"
              mobile_update:
                summary: Mobile update — post enrollment
                value:
                  txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  scope: ["abha-enrol", "mobile-verify"]
                  loginHint: "mobile"
                  loginId: "{{RSA_encrypted_mobile}}"
                  otpSystem: "abdm"
              dl_flow:
                summary: DL enrollment — mobile OTP
                value:
                  scope: ["abha-enrol", "mobile-verify", "dl-flow"]
                  loginHint: "mobile"
                  loginId: "{{RSA_encrypted_mobile}}"
      responses:
        '200':
          description: OTP sent — returns transaction ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxnResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /enrollment/enrol/byAadhaar:
    post:
      tags: [Enrollment]
      summary: Enrol by Aadhaar (OTP / Biometric / Face / Iris / Child / DemoAuth)
      operationId: enrolByAadhaar
      description: |
        Multi-purpose enrollment and child ABHA creation endpoint.
        The `authMethods` array determines which authentication data is required:

        | authMethods | Description | Required fields |
        |-------------|-------------|-----------------|
        | `["otp"]` | Aadhaar OTP enrollment | `otp.txnId`, `otp.otpValue` |
        | `["bio"]` | Fingerprint biometric | `bio.aadhaar`, `bio.bioType`, `bio.pid` |
        | `["face"]` | Face authentication | `face.aadhaar`, `face.pid` |
        | `["iris"]` | Iris scan | `iris.aadhaar`, `iris.pid` |
        | `["child"]` | Child ABHA (parent must be logged in) | `child.*` fields |
        | `["demo_auth"]` | Demographic authentication | `demo_auth.aadhaarNumber`, demographics |
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolByAadhaarRequest'
            examples:
              otp_enrol:
                summary: Enrol via Aadhaar OTP
                value:
                  authData:
                    authMethods: ["otp"]
                    otp:
                      timeStamp: "2024-11-20T06:55:56.832Z"
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      otpValue: "{{RSA_encrypted_otp}}"
              fingerprint_enrol:
                summary: Enrol via fingerprint
                value:
                  authData:
                    authMethods: ["bio"]
                    bio:
                      aadhaar: "{{RSA_encrypted_aadhaar}}"
                      bioType: "FMR"
                      pid: "{{encrypted_PID_block}}"
              face_enrol:
                summary: Enrol via face recognition
                value:
                  authData:
                    authMethods: ["face"]
                    face:
                      aadhaar: "{{RSA_encrypted_aadhaar}}"
                      pid: "{{encrypted_face_PID}}"
              iris_enrol:
                summary: Enrol via iris scan
                value:
                  authData:
                    authMethods: ["iris"]
                    iris:
                      aadhaar: "{{RSA_encrypted_aadhaar}}"
                      pid: "{{encrypted_iris_PID}}"
              child_enrol:
                summary: Child ABHA creation
                value:
                  authData:
                    authMethods: ["child"]
                    child:
                      dayOfBirth: "15"
                      monthOfBirth: "03"
                      yearOfBirth: "2015"
                      firstName: "Ravi"
                      middleName: ""
                      lastName: "Kumar"
                      gender: "M"
                      parentAbhaNumber: "91-1234-5678-9012"
              demo_auth_enrol:
                summary: Demographic authentication
                value:
                  authData:
                    authMethods: ["demo_auth"]
                    demo_auth:
                      aadhaarNumber: "{{RSA_encrypted_aadhaar}}"
                      name: "John Doe"
                      dob: "1990-01-15"
                      gender: "M"
      responses:
        '201':
          description: ABHA created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: ABHA already exists for this Aadhaar

  /enrollment/auth/byAbdm:
    post:
      tags: [Enrollment]
      summary: Verify OTP via ABDM (Mobile Update / DL Sub-flows)
      operationId: enrollmentAuthByAbdm
      description: |
        Verify OTP within enrollment sub-flows:
        - Mobile number update after ABHA creation
        - DL enrollment mobile OTP verification (before `byDocument` call)
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbdmAuthVerifyRequest'
            examples:
              mobile_update_verify:
                summary: Mobile update OTP verification
                value:
                  scope: ["abha-enrol", "mobile-verify"]
                  authData:
                    authMethods: ["otp"]
                    otp:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      otpValue: "{{RSA_encrypted_otp}}"
              dl_flow_verify:
                summary: DL flow OTP verification
                value:
                  scope: ["abha-enrol", "mobile-verify", "dl-flow"]
                  authData:
                    authMethods: ["otp"]
                    otp:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      otpValue: "{{RSA_encrypted_otp}}"
      responses:
        '200':
          description: OTP verified — proceed to next step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxnResponse'

  /enrollment/enrol/byDocument:
    post:
      tags: [Enrollment]
      summary: Enrol by Driving Licence
      operationId: enrolByDocument
      description: |
        Create an ABHA enrolment number using a Driving Licence.
        Must be called **after** mobile OTP is verified via `POST /enrollment/auth/byAbdm`
        with `dl-flow` in scope.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolByDocumentRequest'
            example:
              txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
              documentType: "DRIVING_LICENCE"
              documentId: "{{RSA_encrypted_DL_number}}"
              firstName: "John"
              middleName: ""
              lastName: "Doe"
              dob: "1990-01-15"
              gender: "M"
              address: "123 Main Street, Andheri"
              districtCode: "501"
              stateCode: "27"
              pinCode: "400053"
      responses:
        '201':
          description: Enrolment number created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DLEnrolmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /enrollment/enrol/suggestion:
    get:
      tags: [Enrollment]
      summary: Get ABHA Address Suggestions
      operationId: getAbhaAddressSuggestions
      description: |
        Returns a list of available ABHA Address suggestions based on the user's name.
        Called after ABHA creation (uses the X-Token from the enrolment response).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      security:
        - bearerAuth: []
        - xToken: []
      responses:
        '200':
          description: Suggested ABHA addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionResponse'
              example:
                abhaAddressList:
                  - "johnkumar@sbx"
                  - "john.kumar123@sbx"
                  - "jkumar99@sbx"

  /enrollment/enrol/abha-address:
    post:
      tags: [Enrollment]
      summary: Set ABHA Address (PHR Address)
      operationId: setAbhaAddress
      description: Set the preferred ABHA Address (PHR Address / Health ID) for the newly created ABHA.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      security:
        - bearerAuth: []
        - xToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAbhaAddressRequest'
            example:
              txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
              abhaAddress: "johnkumar@sbx"
              preferred: 1
      responses:
        '200':
          description: ABHA Address set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbhaAddressResponse'

  # ──────────────────────────────────────────
  # CHILD ABHA
  # ──────────────────────────────────────────

  /enrollment/profile/children:
    get:
      tags: [Child ABHA]
      summary: Get Children Profiles
      operationId: getChildrenProfiles
      description: Retrieve a list of children linked to the authenticated parent's ABHA account.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      security:
        - bearerAuth: []
        - xToken: []
      responses:
        '200':
          description: Children profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildrenResponse'

  # ──────────────────────────────────────────
  # LOGIN & VERIFICATION
  # ──────────────────────────────────────────

  /profile/login/request/otp:
    post:
      tags: [Login & Verification]
      summary: Send OTP / Initiate Login
      operationId: loginRequestOtp
      description: |
        Initiate login for an existing ABHA holder. The `scope` and `loginHint`
        combination determines the authentication channel.

        **Complete scope reference:**

        | loginHint | scope | Use case |
        |-----------|-------|----------|
        | `abha-number` | `["abha-login","aadhaar-verify"]` | ABHA Number + Aadhaar OTP |
        | `abha-number` | `["abha-login","mobile-verify"]` | ABHA Number + ABHA mobile OTP |
        | `abha-number` | `["abha-login","aadhaar-face-verify"]` | ABHA Number + Face |
        | `abha-number` | `["abha-login","aadhaar-bio-verify"]` | ABHA Number + Fingerprint |
        | `abha-number` | `["abha-login","aadhaar-iris-verify"]` | ABHA Number + Iris |
        | `mobile` | `["abha-login","mobile-verify"]` | Mobile OTP (multi-ABHA) |
        | `aadhaar` | `["abha-login","aadhaar-verify"]` | Aadhaar number + OTP |
        | `index` | `["abha-login","search-abha","mobile-verify"]` | Find ABHA (post-search) |
        | `index` | `["abha-login","search-abha","aadhaar-bio-verify"]` | Find ABHA via biometric |
        | `abha-number` | `["abha-login","aadhaar-verify","re-activate"]` | Reactivate via Aadhaar OTP |
        | `abha-number` | `["abha-login","mobile-verify","re-activate"]` | Reactivate via mobile OTP |
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginOtpRequest'
            examples:
              abha_aadhaar_otp:
                summary: ABHA Number + Aadhaar OTP
                value:
                  scope: ["abha-login", "aadhaar-verify"]
                  loginHint: "abha-number"
                  loginId: "{{RSA_encrypted_abha_number}}"
              abha_mobile_otp:
                summary: ABHA Number + Mobile OTP
                value:
                  scope: ["abha-login", "mobile-verify"]
                  loginHint: "abha-number"
                  loginId: "{{RSA_encrypted_abha_number}}"
              mobile_login:
                summary: Mobile number OTP (multi-ABHA)
                value:
                  scope: ["abha-login", "mobile-verify"]
                  loginHint: "mobile"
                  loginId: "{{RSA_encrypted_mobile}}"
              aadhaar_login:
                summary: Aadhaar number + OTP
                value:
                  scope: ["abha-login", "aadhaar-verify"]
                  loginHint: "aadhaar"
                  loginId: "{{RSA_encrypted_aadhaar}}"
              face_login:
                summary: Face biometric login
                value:
                  scope: ["abha-login", "aadhaar-face-verify"]
                  loginHint: "abha-number"
                  loginId: "{{RSA_encrypted_abha_number}}"
              fingerprint_login:
                summary: Fingerprint login
                value:
                  scope: ["abha-login", "aadhaar-bio-verify"]
                  loginHint: "abha-number"
                  loginId: "{{RSA_encrypted_abha_number}}"
              find_abha:
                summary: Find ABHA (after search step)
                value:
                  scope: ["abha-login", "search-abha", "mobile-verify"]
                  loginHint: "index"
                  loginId: "{{index_from_search_response}}"
              reactivate:
                summary: Reactivate ABHA
                value:
                  scope: ["abha-login", "aadhaar-verify", "re-activate"]
                  loginHint: "abha-number"
                  loginId: "{{RSA_encrypted_abha_number}}"
              forgot_abha_retrieval:
                summary: Retrieval of enrolment number
                value:
                  scope: ["abha-login", "mobile-verify", "retrieval"]
                  loginHint: "mobile"
                  loginId: "{{RSA_encrypted_mobile}}"
      responses:
        '200':
          description: OTP sent / login initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxnResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /profile/login/verify:
    post:
      tags: [Login & Verification]
      summary: Verify OTP / Password / Biometric — Complete Login
      operationId: loginVerify
      description: |
        Complete the login by providing the OTP, password, or biometric PID block.
        Returns an `X-Token` for profile operations and optionally a list of ABHA accounts
        when the login hint was `mobile` and multiple ABHAs are linked.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginVerifyRequest'
            examples:
              otp_verify:
                summary: OTP verification
                value:
                  scope: ["abha-login", "aadhaar-verify"]
                  authData:
                    authMethods: ["otp"]
                    otp:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      otpValue: "{{RSA_encrypted_otp}}"
              password_verify:
                summary: Password verification
                value:
                  scope: ["abha-login", "password-verify"]
                  authData:
                    authMethods: ["password"]
                    password:
                      value: "{{RSA_encrypted_password}}"
              face_verify:
                summary: Face biometric verification
                value:
                  scope: ["abha-login", "aadhaar-face-verify"]
                  authData:
                    authMethods: ["face"]
                    face:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      pid: "{{encrypted_face_PID}}"
              fingerprint_verify:
                summary: Fingerprint verification
                value:
                  scope: ["abha-login", "aadhaar-bio-verify"]
                  authData:
                    authMethods: ["bio"]
                    bio:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      bioType: "FMR"
                      pid: "{{encrypted_FP_PID}}"
              iris_verify:
                summary: Iris verification
                value:
                  scope: ["abha-login", "aadhaar-iris-verify"]
                  authData:
                    authMethods: ["iris"]
                    iris:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      pid: "{{encrypted_iris_PID}}"
              reactivate_verify:
                summary: Reactivate ABHA
                value:
                  scope: ["abha-login", "aadhaar-verify", "re-activate"]
                  authData:
                    authMethods: ["otp"]
                    otp:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      otpValue: "{{RSA_encrypted_otp}}"
              reactivate_password:
                summary: Reactivate via password
                value:
                  scope: ["abha-login", "password-verify", "re-activate"]
                  authData:
                    authMethods: ["password"]
                    password:
                      value: "{{RSA_encrypted_password}}"
      responses:
        '200':
          description: Login verified — returns X-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginVerifyResponse'

  /profile/login/verify/user:
    post:
      tags: [Login & Verification]
      summary: Select ABHA Account (Multi-ABHA on same mobile)
      operationId: loginVerifyUser
      description: |
        When a mobile number is linked to multiple ABHA accounts, `POST /profile/login/verify`
        returns an `accounts` array. Use this endpoint to select the desired account
        and receive the final `X-Token`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectUserRequest'
            example:
              ABHANumber: "91-1234-5678-9012"
              txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        '200':
          description: Account selected — returns X-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginVerifyResponse'

  /profile/login/search:
    post:
      tags: [Login & Verification]
      summary: Search ABHA Profile (for Password Login)
      operationId: loginSearch
      description: |
        Look up a profile by ABHA Number as the first step of the password login flow.
        Returns basic profile info to confirm the correct account before requesting password.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ABHANumber]
              properties:
                ABHANumber:
                  type: string
                  description: 14-digit ABHA number (with or without hyphens)
                  example: "91-1234-5678-9012"
      responses:
        '200':
          description: Profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /profile/account/abha/search:
    post:
      tags: [Login & Verification]
      summary: Search ABHA by Mobile — Find ABHA
      operationId: searchAbhaByMobile
      description: |
        Search for ABHA numbers linked to a mobile number.
        Returns an opaque `index` value used as `loginId` in the subsequent
        `POST /profile/login/request/otp` call to complete the Find ABHA flow.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, mobile]
              properties:
                scope:
                  type: array
                  items:
                    type: string
                  example: ["search-abha"]
                mobile:
                  type: string
                  description: RSA-encrypted mobile number
                  example: "{{RSA_encrypted_mobile}}"
      responses:
        '200':
          description: Search result with opaque index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbhaSearchResponse'

  # ──────────────────────────────────────────
