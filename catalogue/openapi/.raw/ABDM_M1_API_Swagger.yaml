  /profile/account/request/otp:
    post:
      tags: [ABHA Profile]
      summary: Send OTP for Profile Actions
      operationId: profileRequestOtp
      description: |
        Send OTP for authenticated profile management actions.

        **Scope → Action mapping:**

        | scope | loginHint | Action |
        |-------|-----------|--------|
        | `["abha-profile","mobile-verify"]` | `mobile` | Update mobile number |
        | `["abha-profile","email-verify"]` | `email` | Update email |
        | `["abha-profile","re-kyc"]` | `abha-number` | Re-KYC |
        | `["abha-profile","change-password"]` | `password` | Change password (OTP path) |
        | `["abha-profile","delete"]` | `abha-number` | Delete ABHA |
        | `["abha-profile","de-activate"]` | `abha-number` | Deactivate ABHA |
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      security:
        - bearerAuth: []
        - xToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileOtpRequest'
            examples:
              update_mobile:
                summary: Update mobile number
                value:
                  scope: ["abha-profile", "mobile-verify"]
                  loginHint: "mobile"
                  loginId: "{{RSA_encrypted_new_mobile}}"
              update_email:
                summary: Update email address
                value:
                  scope: ["abha-profile", "email-verify"]
                  loginHint: "email"
                  loginId: "{{RSA_encrypted_email}}"
                  otpSystem: "abdm"
              re_kyc:
                summary: Re-KYC via Aadhaar OTP
                value:
                  scope: ["abha-profile", "re-kyc"]
                  loginHint: "abha-number"
                  loginId: "{{RSA_encrypted_abha_number}}"
                  otpSystem: "aadhaar"
              change_password_otp:
                summary: Change password (via OTP)
                value:
                  scope: ["abha-profile", "change-password"]
                  loginHint: "password"
                  loginId: "{{RSA_encrypted_current_password}}"
                  otpSystem: "aadhaar"
              delete_aadhaar_otp:
                summary: Delete ABHA via Aadhaar OTP
                value:
                  scope: ["abha-profile", "delete"]
                  loginHint: "abha-number"
                  loginId: "{{RSA_encrypted_abha_number}}"
                  otpSystem: "aadhaar"
              delete_abha_otp:
                summary: Delete ABHA via ABHA OTP
                value:
                  scope: ["abha-profile", "delete"]
                  loginHint: "abha-number"
                  loginId: "{{RSA_encrypted_abha_number}}"
                  otpSystem: "abdm"
              deactivate:
                summary: Deactivate ABHA
                value:
                  scope: ["abha-profile", "de-activate"]
                  loginHint: "abha-number"
                  loginId: "{{RSA_encrypted_abha_number}}"
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxnResponse'

  /profile/account/verify:
    post:
      tags: [ABHA Profile]
      summary: Verify OTP / Password — Complete Profile Action
      operationId: profileVerify
      description: |
        Complete a profile management action by verifying OTP or password.
        The `scope` field in the request body identifies which action to perform.

        **Supported actions:**

        | scope | authMethods | Description |
        |-------|-------------|-------------|
        | `["abha-profile","mobile-verify"]` | `otp` | Confirm mobile update |
        | `["abha-profile","email-verify"]` | `otp` | Confirm email update |
        | `["abha-profile","re-kyc"]` | `otp` | Complete re-KYC |
        | `["abha-profile","change-password"]` | `password` | Set/update password |
        | `["abha-profile","change-password"]` | `otp` | Reset password via OTP |
        | `["abha-profile","delete"]` | `otp` or `password` | Delete ABHA |
        | `["abha-profile","de-activate"]` | `otp` or `password` | Deactivate ABHA |
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      security:
        - bearerAuth: []
        - xToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileVerifyRequest'
            examples:
              mobile_otp_verify:
                summary: Confirm mobile update via OTP
                value:
                  scope: ["abha-profile", "mobile-verify"]
                  authData:
                    authMethods: ["otp"]
                    otp:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      otpValue: "{{RSA_encrypted_otp}}"
              set_new_password:
                summary: Set new password directly
                value:
                  scope: ["abha-profile", "change-password"]
                  authData:
                    authMethods: ["password"]
                    password:
                      value: "{{RSA_encrypted_new_password}}"
              change_password:
                summary: Change password via old password
                value:
                  scope: ["abha-profile", "change-password"]
                  authData:
                    authMethods: ["password"]
                    password:
                      value: "{{RSA_encrypted_old_password}}"
                      newPassword: "{{RSA_encrypted_new_password}}"
              reset_password_otp:
                summary: Reset password after OTP
                value:
                  scope: ["abha-profile", "change-password"]
                  authData:
                    authMethods: ["otp"]
                    otp:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      otpValue: "{{RSA_encrypted_otp}}"
                    password:
                      newPassword: "{{RSA_encrypted_new_password}}"
              delete_via_otp:
                summary: Delete ABHA via OTP
                value:
                  scope: ["abha-profile", "delete"]
                  authData:
                    authMethods: ["otp"]
                    otp:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      otpValue: "{{RSA_encrypted_otp}}"
              delete_via_password:
                summary: Delete ABHA via password
                value:
                  scope: ["abha-profile", "delete"]
                  authData:
                    authMethods: ["password"]
                    password:
                      value: "{{RSA_encrypted_password}}"
              deactivate_via_otp:
                summary: Deactivate ABHA via OTP
                value:
                  scope: ["abha-profile", "de-activate"]
                  authData:
                    authMethods: ["otp"]
                    otp:
                      txnId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      otpValue: "{{RSA_encrypted_otp}}"
      responses:
        '200':
          description: Action completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /profile/account/request/emailVerificationLink:
    post:
      tags: [ABHA Profile]
      summary: Send Email Verification Link
      operationId: sendEmailVerificationLink
      description: Send a one-click email verification link. The user clicks it to verify their email — no OTP required.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
      security:
        - bearerAuth: []
        - xToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, loginHint, loginId]
              properties:
                scope:
                  type: array
                  items:
                    type: string
                  example: ["abha-profile", "email-link-verify"]
                loginHint:
                  type: string
                  enum: [email]
                  example: "email"
                loginId:
                  type: string
                  description: RSA-encrypted email address
            example:
              scope: ["abha-profile", "email-link-verify"]
              loginHint: "email"
              loginId: "{{RSA_encrypted_email}}"
      responses:
        '200':
          description: Verification link sent to email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /profile/account/request/logout:
    get:
      tags: [ABHA Profile]
      summary: Logout
      operationId: logout
      description: Invalidate the current X-Token session.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Timestamp'
