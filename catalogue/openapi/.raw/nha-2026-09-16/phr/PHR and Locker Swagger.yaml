                        type: string
                        pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                        description: 'ABDM-9999 - Unknown exception. May be returned either bare (`ABDM-9999`) or with a trailing ": " separator (`ABDM-9999: `); match on the code itself and tolerate the separator.'
                        example: ABDM-9999
                      message:
                        type: string
                        example: To date should be present or future date
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                    description: '900901 - Invalid Credentials. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: '900901'
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
