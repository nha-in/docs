                  accessToken:
                    type: string
                    example: <JWT TOKEN>
                  expiresIn:
                    type: integer
                    example: 1200
                  refreshExpiresIn:
                    type: integer
                    example: 1800
                  refreshToken:
                    type: string
                    example: <JWT TOKEN>
                  tokenType:
                    type: string
                    example: bearer
              examples:
