                            type:
                              type: string
                              nullable: false
                              example: MH1001
                              description: The identification value. Allows alpha numeric character and special characters like  "^[a-zA-Z0-9_\\-@,. \":/]{0,255}$"
                            system:
                              type: string
                              nullable: false
                              example: https://www.sample.com
                              description: Allows alpha numeric character and special characters like "^[a-zA-Z0-9_\\-@,. \":/]{0,255}$"
                    hiTypes:
                      type: array
                      description: Types of health information document.
                      items:
                        type: string
                        enum:
                          - DiagnosticReport
                          - DischargeSummary
                          - HealthDocumentRecord
                          - ImmunizationRecord
                          - OPConsultation
                          - Prescription
                          - WellnessRecord
                          - Invoice
                        nullable: false
                        example: Prescription
                    permission:
                      type: object
                      nullable: false
                      required:
                        - accessMode
