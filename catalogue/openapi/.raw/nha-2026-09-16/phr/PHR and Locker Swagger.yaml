                      - GRANTED
                      - DENIED
                      - EXPIRED
                      - REVOKED
                    nullable: false
                    example: GRANTED
                  dateGranted:
                    type: string
                    format: date-time
                    nullable: false
                    example: '2021-09-28T12:30:08.573Z'
                  patient:
                    type: object
                    nullable: false
                    required:
                      - id
                    properties:
                      id:
                        type: string
                        nullable: false
                        example: <ABHA_ADDRESS>
                        description: The abha address of the patient. Must start with Alphanumeric . and  _  in the middle and must be ending with @abdm or @sbx
                  requester:
