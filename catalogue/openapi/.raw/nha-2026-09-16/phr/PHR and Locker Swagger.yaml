      summary: '4 flows: Send Otp - Update Email, Send Otp - Update Mobile, Send ABHA Otp - Link-DeLink, Send AADHAAR Otp - Link-DeLink'
      description: |-
        Flows in the Postman collection:
        - P2-Management › P2 -PHR Profile › P2 - Update Email (optional) › Send Otp - Update Email
        - P2-Management › P2 -PHR Profile › P2 - Update Mobile › Send Otp - Update Mobile
        - P2-Management › P2 -PHR Profile › P2 - Link ABHA Number › P2 - via ABHA OTP › Send ABHA Otp - Link-DeLink
        - P2-Management › P2 -PHR Profile › P2 - Link ABHA Number › P2 - via Aadhaar OTP › Send AADHAAR Otp - Link-DeLink
      operationId: postLoginProfileRequestOtp
      security:
        - apiKeyAuth: []
      parameters:
        - name: X-token
          in: header
          required: true
          schema:
            type: string
          example: Bearer <JWT TOKEN>
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: '2022-10-06T15:10:00.587Z'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                loginHint:
                  type: string
                loginId:
                  type: string
                otpSystem:
                  type: string
            examples:
              Send Otp - Update Email:
                summary: P2 - Update Email (optional) › Send Otp - Update Email
                value:
                  scope:
                    - abha-address-profile
                    - email-verify
                  loginHint: email
                  loginId: '{{encryptedData}}'
                  otpSystem: abdm
              Send Otp - Update Mobile:
                summary: P2 - Update Mobile › Send Otp - Update Mobile
                value:
                  scope:
                    - abha-address-profile
                    - mobile-verify
                  loginHint: mobile-number
                  loginId: '{{encryptedData}}'
                  otpSystem: abdm
              Send ABHA Otp - Link-DeLink:
                summary: P2 - via ABHA OTP › Send ABHA Otp - Link-DeLink
                value:
                  scope:
                    - abha-login
                    - mobile-verify
                  loginHint: abha-number
                  loginId: <BASE64_PHOTO>
                  otpSystem: abdm
              Send AADHAAR Otp - Link-DeLink:
                summary: P2 - via Aadhaar OTP › Send AADHAAR Otp - Link-DeLink
                value:
                  scope:
                    - abha-login
                    - aadhaar-verify
                  loginHint: abha-number
                  loginId: <BASE64_PHOTO>
                  otpSystem: aadhaar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                  message:
                    type: string
              examples:
                Send Otp - Update Mobile:
