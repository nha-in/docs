  /abha/api/v3/enrollment/enrol/suggestion:
    get:
      tags:
        - ABHA enrolment via Aadhaar
      summary: ABHA Address Suggestion API
      description: This API endpoint is used to provide suggestions for ABHA addresses based on the user’s personal information. It helps users find suitable ABHA addresses by generating a list of suggestions. This is particularly useful during the ABHA enrollment process to ensure that users can choose an appropriate and unique ABHA address.
      operationId: getEnrollmentEnrolSuggestion
      security:
        - bearerAuth: []
      parameters:
        - name: Transaction_Id
          in: header
          required: true
          schema:
            type: string
          example: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: '2022-10-06T15:10:00.587Z'
      responses:
