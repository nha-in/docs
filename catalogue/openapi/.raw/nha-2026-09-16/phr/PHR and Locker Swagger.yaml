openapi: 3.0.3
info:
  title: PHR and Locker APIs
  version: 1.0.0
  description: Personal Health Record (PHR) app, ABHA enrolment and HIE-CM (consent, linking, data flow, subscription, locker) APIs, generated from the "PHR and locker" Postman collection. Examples are sandbox responses saved in that collection, with personal data and credentials replaced. All timestamps are UTC ISO-8601 with Z.
servers:
  - url: https://abhasbx.abdm.gov.in
    description: ABHA / PHR sandbox
tags:
  - name: Gateway
    description: Gateway
  - name: P3-Subscription
    description: P3-Subscription
  - name: ABHA enrolment via Aadhaar
    description: P1-Registration-login / P1 - Create ABHA Number using Aadhaar / ABHA enrolment via Aadhaar
  - name: P1 - Create ABHA Address Flow
    description: P1-Registration-login / P1 - Create ABHA Address Flow / Enrolment via Mobile
  - name: P1-Registration-login
    description: P1-Registration-login / P1 - Create ABHA Address Flow / Enrolment via ABHA Number-ABHA OTP
  - name: P1 - PHR Login
    description: P1-Registration-login / P1 - PHR Login / P1 - Login via Mobile Number
  - name: P1 - Login via ABHA Address - Password
    description: P1-Registration-login / P1 - PHR Login / P1 - Login via ABHA Address - Password
  - name: P2 -PHR Profile
    description: P2-Management / P2 -PHR Profile / P2 - Update Email (optional)
  - name: P2 - Link ABHA Number
    description: P2-Management / P2 -PHR Profile / P2 - Link ABHA Number / P2 - via ABHA OTP
  - name: P2 - Switch Profile
    description: P2-Management / P2 -PHR Profile / P2 - Switch Profile
  - name: P2 - Patient Share
    description: P2-Management / P2 - Patient Share
  - name: P2 - User Initiated Linking
    description: P2-Management / P2 - User Initiated Linking
  - name: P2 - Initiated Linking
    description: P2-Management / P2 -  Initiated Linking
  - name: HIU & HIP
    description: P2-Management / P2 - Consent Manager / HIU & HIP
  - name: FETCH & MANAGE CONSENT REQUESTS
    description: P2-Management / P2 - Consent Manager / FETCH & MANAGE CONSENT REQUESTS
  - name: P2 - Data Flow
    description: P2-Management / P2 - Data Flow
  - name: P4-Locker
    description: P4-Locker
paths:
  /abha/api/v3/enrollment/auth/byAbdm:
    post:
      tags:
        - ABHA enrolment via Aadhaar
      summary: Mobile Update - Verify OTP
      description: "This API verifies via Mobile OTP. After verifying OTP successfully mobile will be mobile number will be updated for further communication for perticular ABHA number. \r

        <br> <br>**Example of OTP Request**<br>  **Mobile Update - Verify OTP:** When the user wants to verify the Mobile Number for communication purpose.<br>   <br> <br><b>Note:</b><br> **1.**OTP will be valid for 10 minute only <br><br>"
      operationId: postEnrollmentAuthByAbdm
      security:
        - bearerAuth: []
      parameters:
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: '2022-10-06T15:10:00.587Z'
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                  example:
                    - abha-enrol
                    - mobile-verify
                    - email-verify
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                      example:
                        - otp
                    otp:
                      type: object
                      properties:
                        txnId:
                          type: string
                          example: '{{txnId}}'
                        otpValue:
                          type: string
                          example: '{{encrypted OTP}}'
                      required:
                        - txnId
                        - otpValue
                  required:
                    - authMethods
                    - otp
              required:
                - scope
                - authData
            examples:
              Mobile Update - Verify OTP:
                summary: ABHA enrolment via Aadhaar › Mobile Update - Verify OTP
                value:
                  scope:
                    - abha-enrol
                    - mobile-verify
                  authData:
                    authMethods:
                      - otp
                    otp:
                      timeStamp: '2022-10-06T15:10:00.587Z'
                      txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                      otpValue: '{{encrypted otp}}'
      responses:
        '200':
          description: "The 200 response code indicates a successful request. In this context, it refers to the successful generation and delivery of an OTP (One-Time Password) for various services.<br><br> <strong>Types of OTP Responses:</strong> <ol> <li><strong> Mobile Update-Verify OTP-Positive flow:</strong> Indicates a successful request. The response includes a message indicating that the OTP has been verified successfully.</li> </ol>

            \ <ol start =\"2\">

            <li><strong>Mobile Update-Verify OTP-OTP Expired:</strong> This error occurs when the OTP provided for verification has expired. The OTP must be used within the valid time frame to ensure secure authentication.</li> </ol>

            \ "
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                    example: 9c5d453e-756f-45e1-9766-43b9cc1190de
                  authResult:
                    type: string
                    example: failed
                  message:
                    type: string
                    example: OTP expired, please try again,Mobile number is now successfully linked to your Account,Email address is now successfully linked to your Account
                  accounts:
                    type: array
                    items:
                      type: object
                    example:
                      - ABHANumber: <ABHA_NUMBER>
              examples:
                Mobile Update - Verify OTP-positive flow:
                  value:
                    txnId: 23acf181-339d-4771-b532-5c5df4a28d19
                    authResult: success
                    message: Mobile number is now successfully linked to your Account
                    accounts:
                      - ABHANumber: <ABHA_NUMBER>
                Mobile Update - Verify OTP-OTP EXPIRED:
                  value:
                    txnId: 9c5d453e-756f-45e1-9766-43b9cc1190de
                    authResult: failed
                    message: OTP expired, please try again
                    accounts: []
                Email Update - Verify OTP-positive flow:
                  value:
                    txnId: 23acf181-339d-4771-b532-5c5df4a28d19
                    authResult: success
                    message: Email address is now successfully linked to your Account
                    accounts:
                      - ABHANumber: <ABHA_NUMBER>
                Email Update - Verify OTP-OTP EXPIRED:
                  value:
                    txnId: 9c5d453e-756f-45e1-9766-43b9cc1190de
                    authResult: failed
                    message: OTP expired, please try again
                    accounts: []
                OTP EXPIRED:
                  value:
                    txnId: 9c5d453e-756f-45e1-9766-43b9cc1190de
                    authResult: failed
                    message: OTP expired, please try again
                    accounts: []
                positive flow:
                  value:
                    txnId: 23acf181-339d-4771-b532-5c5df4a28d19
                    authResult: success
                    message: Mobile number is now successfully linked to your Account
                    accounts:
                      - ABHANumber: <ABHA_NUMBER>
        '400':
          description: "The 400 response code indicates a bad request. In this context, it refers to various errors encountered during the OTP (One-Time Password) verification process.<br><br>

            \   <ol>

            \   <li>

            \   <p><strong>Invalid OTP Value:</strong> This error occurs when the OTP value provided for verification is invalid. The OTP must be correctly formatted and match the one sent to the user’s registered mobile number</p>

            \   </li>

            \   </ol>

            \   <ol start=\"2\">

            \   <li>

            \   <p><strong>Invalid Transaction Id:</strong>  This error occurs when the transaction ID provided in the request is invalid. The transaction ID is essential for tracking the OTP request and ensuring that the correct OTP is verified.</p>

            \   </li>

            \   </ol>

            \   <ol start=\"3\">

            \   <li>

            \   <p><strong>Invalid Scope:</strong> This error occurs when the scope provided in the OTP verification request for mobile update is invalid. The scope specifies the purpose of the OTP verification, such as abha-enrol, mobile-verify, etc.</p>

            \   </li>

            \   </ol>

            \   <ol start=\"4\">

            \   <li>

            \   <p><strong>Invalid AuthMethod - :</strong>  This error occurs when the authentication method provided in the OTP verification request for mobile update is invalid. The authMethods field must contain valid authentication methods such as otp.</p>

            \   </li>

            \   </ol>

            \  "
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      txnId:
                        type: string
                        example: Invalid Transaction Id
                      timestamp:
                        type: string
                        format: date-time
                        example: '2024-05-10T11:41:47.000Z'
                  - type: object
                    properties:
                      authMethods:
                        type: string
                        example: Invalid Auth Method
                      timestamp:
                        type: string
                        format: date-time
                        example: '2024-05-10T11:40:16.000Z'
                  - type: object
                    properties:
                      txnId:
                        type: string
                        example: 30839193-9788-4c0d-9459-7cd70a
                      description:
                        type: string
                        example: Invalid OTP value
                  - type: object
                    properties:
                      scope:
                        type: string
                        example: Invalid Scope
                      timestamp:
                        type: string
                        format: date-time
                        example: '2024-05-10T14:37:47.000Z'
              examples:
                Mobile Update - Verify OTP:
                  summary: Invalid OTP Value
                  value:
                    txnId: 30839193-9788-4c0d-9459-7cd70a
                    description: Invalid OTP value
                Invalid Transaction Id:
                  summary: Invalid Transaction Id
                  value:
                    txnId: Invalid Transaction Id
                    timestamp: '2024-05-10T11:41:47.000Z'
                Invalid Scope:
                  summary: Invalid scope
                  value:
                    scope: Invalid Scope
                    timestamp: '2024-05-10T11:41:47.000Z'
                Invalid AuthMethod:
                  summary: Invalid authMethod
                  value:
                    authMethods: Invalid Auth Method
                    timestamp: '2024-05-10T11:21:54.000Z'
                Invalid Transaction Id (2):
                  value:
                    txnId: Invalid Transaction Id
                    timestamp: '2024-05-10T11:41:47.000Z'
                Invalid authMethod:
                  value:
                    authMethods: Invalid Auth Method
                    timestamp: '2024-05-10T11:40:16.000Z'
        '401':
          description: The 401 response code indicates an unauthorized request. In this context, it refers to the lack of proper authentication during the operation of the Invalid Credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: '900901'
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: Invalid JWT token. Make sure you have provided the correct security credentials
              examples:
                Invalid access token:
                  value:
                    code: '900901'
                    message: Invalid Credentials
                    description: Invalid JWT token. Make sure you have provided the correct security credentials
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              examples:
                Invalid OTP value:
                  value:
                    error:
                      code: ABDM-1204
                      message: 'UIDAI Error code : 400 : Invalid Aadhaar OTP value.'
        '500':
          description: The 500 response code indicates an Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: '900900'
                  message:
                    type: string
                    example: Unclassified Authentication Failure
                  description:
                    type: string
                    example: 'Access failure for API: /abha/api/v3, version: v3 status: (900900) - Unclassified Authentication Failure'
              examples:
                Mobile Update - Verify OTP-Invalid access token:
                  value:
                    code: '900900'
                    message: Unclassified Authentication Failure
                    description: 'Access failure for API: /abha/api/v3, version: v3 status: (900900) - Unclassified Authentication Failure'
                Invalid access token:
                  value:
                    code: '900900'
                    message: Unclassified Authentication Failure
                    description: 'Access failure for API: /abha/api/v3, version: v3 status: (900900) - Unclassified Authentication Failure'
      x-documented-in: M1 ABHA Swagger 1.yaml
  /abha/api/v3/enrollment/enrol/abha-address:
    post:
      tags:
        - ABHA enrolment via Aadhaar
      summary: ABHA Address
      description: This API endpoint is used to enroll a new ABHA address. It allows users to create a unique ABHA address that can be used for accessing and managing their health records. The endpoint ensures that the provided ABHA address is unique and valid..
      operationId: postEnrollmentEnrolAbhaAddress
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: '2022-10-06T15:10:00.587Z'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                txnId:
                  type: string
                  example: '{{txnId}}'
                abhaAddress:
                  type: string
                  example: '{{abhaAddress}}'
                preferred:
                  type: integer
                  example: 1
              required:
                - txnId
                - abhaAddress
                - preferred
            examples:
              ABHA Address:
                summary: ABHA enrolment via Aadhaar › ABHA Address
                value:
                  txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                  abhaAddress: '{{ABHA Address}}'
                  preferred: 1
      responses:
        '200':
          description: The 200 response code indicates a successful request. In this context, it refers to the successful operation of the Enroll ABHA Address API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                    example: '{{txnId}}'
                  abhaAddress:
                    type: string
                    example: '{{abhaAddress}}'
                  preferred:
                    type: integer
                    example: 1
              examples:
                ABHA Address-Positive flow:
                  value:
                    txnId: 23acf181-339d-4771-b532-5c5df4a28d19
                    healthIdNumber: <ABHA_NUMBER>
                    preferredAbhaAddress: <ABHA_ADDRESS>
                Positive flow:
                  value:
                    txnId: 23acf181-339d-4771-b532-5c5df4a28d19
                    healthIdNumber: <ABHA_NUMBER>
                    preferredAbhaAddress: <ABHA_ADDRESS>
        '400':
          description: The 400 response code indicates a bad request. In this context, it refers to various errors encountered during the operation of the Suggestion API.<br><br> <p><strong>Types of Suggestion API Errors:</strong></p> <ol> <li><strong>Invalid Preferred Flag:</strong> This error occurs when the transaction ID provided in the request is invalid. The transaction ID is essential for tracking the request and ensuring that the correct information is processed. An invalid transaction ID means the server cannot verify the request, leading to a failure in enrolling the ABHA address. .</li> </ol> <ol start="2"> <li><strong>Invalid Transaction Id:</strong>This error occurs when the preferred flag provided in the request is invalid. The preferred flag indicates the user’s preference for the suggested ABHA address. An invalid preferred flag means the server cannot process the user’s preference correctly, leading to a failure in enrolling the ABHA address.</li> </ol>
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferred:
                    type: string
                    example: Invalid Preferred Flag
                  timestamp:
                    type: string
                    format: date-time
                    example: '2024-05-10T12:00:14.000Z'
              examples:
                ABHA Address-Invalid Preferred Flag:
                  summary: Invalid Preferred Flag
                  value:
                    preferred: Invalid Preferred Flag
                    timestamp: '2024-05-10T12:00:14.000Z'
                ABHA Address-Invalid Transaction Id:
                  summary: Invalid Transaction Id
                  value:
                    txnId: Invalid Transaction Id
                    timestamp: '2024-05-10T12:01:22.000Z'
                Invalid Transaction Id:
                  value:
                    txnId: Invalid Transaction Id
                    timestamp: '2024-05-10T12:01:22.000Z'
                Invalid Preferred Flag:
                  value:
                    preferred: Invalid Preferred Flag
                    timestamp: '2024-05-10T12:00:14.000Z'
        '401':
          description: The 401 response code indicates an unauthorized request. In this context, it refers to the lack of proper authentication during the operation of the Invalid Credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: '900901'
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: Invalid JWT token. Make sure you have provided the correct security credentials
              examples:
                ABHA Address-Invalid access token:
                  value:
                    code: '900901'
                    message: Invalid Credentials
                    description: Invalid JWT token. Make sure you have provided the correct security credentials
                Invalid access token:
                  value:
                    code: '900901'
                    message: Invalid Credentials
                    description: Invalid JWT token. Make sure you have provided the correct security credentials
        '500':
          description: <b>Internal Server Error</b><br><br>  An Internal Server Error (500) indicates that the server encountered an unexpected condition that prevented it from fulfilling the request.
      x-documented-in: M1 ABHA Swagger 1.yaml
  /abha/api/v3/enrollment/enrol/byAadhaar:
    post:
      tags:
        - ABHA enrolment via Aadhaar
      summary: Create ABHA by verifying OTP
      description: 'This API endpoint is used to create an ABHA (Ayushman Bharat Health Account) number for an individual using their Aadhaar number. The ABHA number is a unique identifier that helps in authenticating individuals and linking their health records across multiple systems and stakeholders, ensuring that medical records are issued to the correct individual and accessed by authorized Health Information Users with appropriate consent. '
      operationId: postEnrollmentEnrolByAadhaar
      security:
        - bearerAuth: []
      parameters:
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: '2022-10-06T15:10:00.587Z'
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                      example:
                        - otp
                        - demo_auth
                        - bio
                        - face
                        - iris
                        - child
                  required:
                    - authMethods
                  anyOf:
                    - type: object
                      properties:
                        otp:
                          type: object
                          properties:
                            txnId:
                              type: string
                              example: '{{txnId}}'
                            otpValue:
                              type: string
                              example: '{{encrypted otp}}'
                            mobile:
                              type: string
                              example: '{{mobile number}}'
                          required:
                            - txnId
                            - otpValue
                            - mobile
                      required:
                        - otp
                    - type: object
                      properties:
                        demo_auth:
                          type: object
                          properties:
                            aadhaarNumber:
                              type: string
                              example: '{{encrypted aadhaar number}}'
                            districtCode:
                              type: string
                              example: '{{District code}}'
                            stateCode:
                              type: string
                              example: '{{State code}}'
                            dateOfBirth:
                              type: string
                              example: '{{DOB}}'
                            gender:
                              type: string
                              example: '{{Gender}}'
                            name:
                              type: string
                              example: '{{Full name}}'
                            mobile:
                              type: string
                              example: '{{Mobile number}}'
                            pinCode:
                              type: string
                              example: '{{Pincode}}'
                            address:
                              type: string
                              example: '{{Address}}'
                            profilePhoto:
                              type: string
                              example: '{{Base64 plain String}}'
                          required:
                            - aadhaarNumber
                            - name
                            - gender
                            - dateOfBirth
                            - districtCode
                            - stateCode
                      required:
                        - demo_auth
                    - type: object
                      properties:
                        bio:
                          type: object
                          properties:
                            aadhaar:
                              type: string
                              example: '{{encrypted aadhaar number}}'
                            fingerPrintAuthPid:
                              type: string
                              example: '{{fingerPrintAuthPid}}'
                            mobile:
                              type: string
                              example: '{{mobile number}}'
                          required:
                            - aadhaar
                            - fingerPrintAuthPid
                            - mobile
                      required:
                        - bio
                    - type: object
                      properties:
                        face:
                          type: object
                          properties:
                            aadhaar:
                              type: string
                              example: '{{encrypted aadhaar number}}'
                            rdPidData:
                              type: string
                              example: '{{faceAuthPid}}'
                            mobile:
                              type: string
                              example: '{{mobile number}}'
                          required:
                            - aadhaar
                            - fingerPrintAuthPid
                            - mobile
                      required:
                        - face
                    - type: object
                      properties:
                        iris:
                          type: object
                          properties:
                            aadhaar:
                              type: string
                              example: '{{encrypted aadhaar number}}'
                            Pid:
                              type: string
                              example: '{{PID}}'
                            mobile:
                              type: string
                              example: '{{mobile number}}'
                          required:
                            - aadhaar
                            - fingerPrintAuthPid
                            - mobile
                      required:
                        - iris
                    - type: object
                      properties:
                        child:
                          type: object
                          properties:
                            dayOfBirth:
                              type: string
                              example: '{{day Of Birth}}'
                            monthOfBirth:
                              type: string
                              example: '{{month Of Birth}}'
                            yearOfBirth:
                              type: string
                              example: '{{year Of Birth}}'
                            gender:
                              type: string
                              example: '{{Gender}}'
                            password:
                              type: string
                              example: ''
                            name:
                              type: string
                              example: '{{Name}}'
                            profilePhoto:
                              type: string
                              example: ''
                            parentConsent:
                              type: string
                              example: 'true'
                          required:
                            - dayOfBirth
                            - monthOfBirth
                            - yearOfBirth
                            - gender
                            - name
                            - parentConsent
                      required:
                        - child
                consent:
                  type: object
                  properties:
                    code:
                      type: string
                      example: abha-enrollment
                    version:
                      type: string
                      example: '1.4'
              required:
                - authData
                - consent
            examples:
              Create ABHA by verifying OTP:
                summary: ABHA enrolment via Aadhaar › Create ABHA by verifying OTP
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      timeStamp: '2022-10-06T15:10:00.587Z'
                      txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                      otpValue: '{{encrypted otp}}'
                      mobile: '{{mobile number for ABHA communication}}'
                  consent:
                    code: abha-enrollment
                    version: '1.4'
      responses:
        '200':
          description: The 200 response code indicates a successful request. In this context, it refers to the successful generation and delivery of an OTP (One-Time Password) for various services.<br><br> <strong>Types of OTP Responses:</strong> <ol> <li><strong>Create ABHA by Verifying OTP - Positive Flow:</strong> his API endpoint is used to create an ABHA (Ayushman Bharat Health Account) number by verifying an OTP sent to the user’s registered mobile number. The ABHA number uniquely identifies individuals and helps in authenticating them and linking their health records across multiple systems.</li> </ol> <ol start ="2"> <li><strong>CHILD ABHA - Positive Flow:</strong> This API endpoint is used to create a CHILD ABHA number for a minor using their demographic details. The CHILD ABHA number helps in uniquely identifying minors and linking their health records across multiple systems.</li> </ol> <ol start="3"> <li><strong>CHILD ABHA - Account Already Exists.</strong> This error occurs when an attempt is made to create a CHILD ABHA number for a minor who already has an existing ABHA number.</li> </ol> <ol start ="4"> <li><strong>DemoAuth API - In Case of Existing ABHA Numbe:</strong> This API endpoint is used for the demo authentication of an individual using their Aadhaar number. It verifies the demographic details against the Aadhaar database and generates an ABHA number if the details match. If an ABHA number already exists, it will return the existing ABHA number</li> </ol> <ol start ="5"> <li><strong>DemoAuth API - New ABHA Creation :</strong> This API endpoint is used for the demo authentication of an individual using their Aadhaar number. It verifies the demographic details against the Aadhaar database and generates a new ABHA number if the details match and no existing ABHA number is found.</li> </ol>
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
