                              format: date-time
                              nullable: false
                              example: '2021-09-28T12:30:08.573Z'
                            status:
                              type: string
                              nullable: false
                              enum:
                                - REQUESTED
                                - EXPIRED
                                - DENIED
                                - GRANTED
                                - REVOKED
                              example: GRANTED
                            purpose:
                              type: object
                              nullable: false
