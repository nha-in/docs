    put:
      tags:
        - P3-Subscription
      summary: 07 edit-subscription
      description: This API endpoint is used to edit the details of an existing subscription. By invoking this API, users can update the parameters and preferences associated with a specific subscription identified by the subscription ID.
      operationId: putSubscriptionRequestsV3PatientsBySubscriptionID
      security:
        - bearerAuth: []
      parameters:
        - name: subscription-id
          in: path
          required: true
          schema:
            type: string
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: '2022-10-06T15:10:00.587Z'
        - name: X-CM-ID
          in: header
          required: true
          description: Suffix of the consent manager to which the request was intended
          schema:
            type: string
          example: sbx
        - name: X-AUTH-TOKEN
          in: header
          required: true
          description: JWT Authentication token which was issued by ABDM after successful validation of username and password
          schema:
            type: string
          example: <JWT TOKEN>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hiuId
                - subscriptionEditAndApprovalRequest
              properties:
                hiuId:
                  type: string
                  nullable: false
                  example: INDIA_HIU
                  description: The service ID of the health information provider Allows alphanumeric characters and special characters like "^[a-zA-Z0-9_\\-@,. \":]{0,255}$"
                subscriptionEditAndApprovalRequest:
                  type: object
                  nullable: false
                  required:
                    - isApplicableForAllHIPs
                    - includedSources
                    - excludedSources
                  properties:
                    isApplicableForAllHIPs:
                      type: boolean
                      nullable: false
                      example: true
                      description: A boolean value to denote if the policy is applicable to all the HIPs or only the specified HIP
                    includedSources:
