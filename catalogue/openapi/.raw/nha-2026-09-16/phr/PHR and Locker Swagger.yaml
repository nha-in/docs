  /api/hiecm/consent/v3/request:
    servers:
      - url: https://dev.abdm.gov.in
        description: HIE-CM sandbox
    get:
      tags:
        - FETCH & MANAGE CONSENT REQUESTS
      summary: 04 all-consent-requests
      description: ' This API endpoint is used to fetch all consent request details for a patient. By invoking this API, users can retrieve a comprehensive list of all consent requests associated with a patient’s health information. This functionality is essential for maintaining transparency and ensuring that users have access to complete and up-to-date consent information. The API supports efficient tracking and management of consent requests, facilitating secure and compliant health information exchange within the healthcare ecosystem.'
      operationId: getConsentV3Request
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
          description: The number of items to be returned at a time
          example: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: The number of items to be skipped before starting to collect data
          example: 0
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - REQUESTED
              - EXPIRED
              - DENIED
              - GRANTED
              - REVOKED
              - ALL
          description: Status of the consent
          example: ALL
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: '2022-10-06T15:10:00.587Z'
        - name: X-CM-ID
          in: header
          required: true
          description: Suffix of the consent manager to which the request was intended
          schema:
            type: string
          example: sbx
        - name: X-AUTH-TOKEN
          in: header
          required: true
          description: JWT Authentication token which was issued by ABDM after successful validation of username and password
          schema:
            type: string
          example: <JWT TOKEN>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  size:
                    type: integer
                    nullable: false
                    example: 10
                  limit:
                    type: integer
                    nullable: false
                    example: 10
                  offset:
                    type: integer
                    nullable: false
                    example: 0
                  requests:
                    type: array
                    items:
                      type: object
                      nullable: true
                      properties:
                        requestId:
                          type: string
                          nullable: false
                          example: e5ec415f-c098-40f6-a0db-faa162fc5295
                        purpose:
                          type: object
                          nullable: false
                          required:
                            - text
                            - code
                            - refUri
                          properties:
                            text:
                              type: string
                              nullable: false
                              enum:
                                - Care Management
                                - Break the Glass
                                - Public Health
                                - Healthcare Payment
                                - Disease Specific Healthcare Research
                                - Self Requested
                            code:
                              type: string
                              nullable: false
                              enum:
                                - CAREMGT
                                - BTG
                                - PUBHLTH
                                - HPAYMT
                                - DSRCH
                                - PATRQT
                            refUri:
                              type: string
                              nullable: false
                              example: www.abc.com
                              description: The reference URL. Should be a valid URL
                        patient:
                          type: object
                          nullable: false
                          required:
                            - id
                          properties:
                            id:
                              type: string
                              nullable: false
                              example: <ABHA_ADDRESS>
                              description: The abha address of the patient
                        hip:
                          type: object
                          description: Identifier and name of the health information provider.
                          nullable: true
                          required:
                            - id
                            - name
                          properties:
                            id:
                              type: string
                              nullable: false
                              example: cowin_hip_01
                              description: The service ID of the health information provider. Allows alpha numeric character and special characters like [A-Z a-z 0-9]+[A-Z a-z 0-9 //_//-]*[A-Z a-z 0-9]$
                            name:
                              type: string
                              nullable: true
                              example: Cowin
                              description: The name of the health information provider. Allows alpha numeric and special characters like _\-@,():/
                            type:
                              type: string
                              nullable: true
                              example: HIP
                              description: The type of the health information provider. Allows alpha numeric and special characters like _\-@,. ":/
                        hiu:
                          type: object
                          nullable: false
                          required:
                            - id
                            - name
                          properties:
                            id:
                              type: string
