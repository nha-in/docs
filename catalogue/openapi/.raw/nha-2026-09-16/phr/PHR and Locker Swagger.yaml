          in: header
          required: true
          description: Suffix of the consent manager to which the request was intended
          schema:
            type: string
          example: sbx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: In the request body, either 'abhaNumber' or 'abhaAddress' must be included, with atleast one being mandatory based on the patient profile.
              type: object
              required:
                - abhaAddress
                - name
                - gender
                - yearOfBirth
              properties:
                abhaNumber:
                  type: number
                  nullable: true
                  example: 12345678901234
                  description: it can be null if abhaNumber is not linked with abhaAddress. Allows numeric character like ^\d{14}$
                abhaAddress:
                  type: string
                  nullable: true
                  example: <ABHA_ADDRESS>
                  description: abhaAddress of the user/patient. Allows alpha numeric character and special characters like ^[a-zA-Z0-9][a-zA-Z0-9_.]+[a-zA-Z0-9]@(abdm|sbx)$
                name:
                  type: string
                  nullable: false
                  example: first_name + middle_name + last_name
                  description: Only alphabets and special characters like ',.- are allowed like ^[a-zA-Z]+(([',. -][a-zA-Z ])?[a-zA-Z]*)*$
                gender:
                  type: string
                  nullable: false
                  example: M
                  description: Allows M, F, O, D, T, U as a input
                yearOfBirth:
                  type: number
                  nullable: false
                  example: 9999
                  description: Year of birth must be 4 digit, ranging between 1900 and 2200
            examples:
              generate-link-token:
                summary: P2 -  Initiated Linking › generate-link-token
                value:
                  abhaAddress: <ABHA_ADDRESS>
                  name: John Doe
                  gender: M
                  yearOfBirth: <DOB>
      responses:
        '202':
          description: Accepted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                        description: 'ABDM-1035 - Invalid HIP ID. May be returned either bare (`ABDM-1035`) or with a trailing ": " separator (`ABDM-1035: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1035
                      message:
                        type: string
                        example: Invalid HIP ID
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                    description: '900902 - Unauthorized. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: '900902'
                  message:
                    type: string
                    example: Unauthorized
                  description:
                    type: string
                    example: "Invalid Credentials. Make sure your API invocation call has a header: 'Authorization : Bearer ACCESS_TOKEN' or 'Authorization : Basic ACCESS_TOKEN' or 'apikey: API_KEY'"
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: Access Denied
        '404':
          description: server cannot find the requested resource
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                    description: '900900 - Unclassified Authentication Failure. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: '900900'
                  message:
                    type: string
                    example: Unclassified Authentication Failure
                  description:
                    type: string
                    example: 'Access failure for API: /hiecm/api/v3, version: v3 status: (900900) - Unclassified Authentication Failure'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                    description: 'ABDM-1024 - Dependent service unavailable. May be returned either bare (`ABDM-1024`) or with a trailing ": " separator (`ABDM-1024: `); match on the code itself and tolerate the separator.'
                    nullable: false
                    example: ABDM-1024
                  message:
                    type: string
                    nullable: false
                    example: Dependent service unavailable
      x-documented-in: link-token.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Gateway session token from POST /api/hiecm/gateway/v3/sessions.
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: API key for the PHR app gateway.
