    servers:
      - url: https://dev.abdm.gov.in
        description: HIE-CM sandbox
    post:
      tags:
        - P2 - Patient Share
      summary: 01 profile-share
      description: "This is a API will be invoked from the <b>PHR-HIU</b> to share the user/patient profile with HMIS/LIMS. <ol type='1'> <li> <b>Header</b>  <ol type='a'> <br/> <li>Authorization will be provided by the gateway session API after the successful verification of client ID and Secret [ Example: <JWT TOKEN> ]</li> <li>REQUEST-ID unique UUID[ Example: 18235d89-cb13-479d-ad71-7a57d5f669a8 ]</li> <li>TIMESTAMP  actual time of the requested was initiated[ Example: 2022-10-06T10:10:00.587Z ]</li> <li>X-AUTH-TOKEN JWT Authentication token which was issued by ABDM after successful validation of username and password[ Example: <JWT TOKEN> ]</li> <li>X-CM-ID  consent manager ID[ Example: sbx ]</li> <li>X-HIU-ID  HIU ID[ Example: HIU ]</li> </ol> </li> <br/> <li> <b>Request Body</b> <ol type='a'><br/> <li>intent This is a key value pair  which contains the purpose [ Example: {purpose: PROFILE_SHARE } ]</li> <li>metaData This is a key value pair which contains the location longitude and latitude[ Example: {hip_id: ABDM_HIP, context: 123, lat: 20.5937 long: 78.9629} ]</li> <li>profile which contains user details.</li> </ol> </ol>"
      operationId: postPatientShareV3Share
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: '2022-10-06T15:10:00.587Z'
        - name: X-CM-ID
          in: header
          required: true
          description: Suffix of the consent manager to which the request was intended
          schema:
            type: string
          example: sbx
        - name: X-HIU-ID
          in: header
          required: true
          description: Identifier of the health information user to which the request was intended
          schema:
            type: string
          example: IN2810014366
        - name: X-AUTH-TOKEN
          in: header
          required: true
          description: JWT Authentication token which was issued by ABDM after successful validation of username and password
          schema:
            type: string
          example: <JWT TOKEN>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - intent
                - metaData
                - profile
              properties:
                intent:
                  type: string
                  nullable: false
                  enum:
                    - PROFILE_SHARE
                    - RECORD_SHARE
                    - PAYMENT_SHARE
                  example: PROFILE_SHARE
                  description: The intention of share API call
                metaData:
                  type: object
                  description: A key-value pair carrying the location longitude and latitude.
                  nullable: false
                  required:
                    - hipId
                    - context
                    - latitude
                    - longitude
                  properties:
                    hipId:
                      type: string
                      nullable: false
                      example: HIP_1
                      description: The service ID of the health information provider. Allows alpha numeric character and special characters like [A-Z a-z 0-9]+[A-Z a-z 0-9 @//_//-]*[A-Z a-z 0-9]
                    context:
                      type: string
                      nullable: false
                      example: '6'
                      description: This is a counter Id. Allows alpha numeric character and special characters like ^(?:[a-zA-Z0-9 ]|[a-zA-Z0-9 ][a-zA-Z0-9.\\-_ ]*[a-zA-Z0-9 ]){1,250}$
                    hprId:
                      type: string
                      nullable: true
                      example: <EMAIL>
                      description: Healthcare Professionals Registry id. Allows alpha numeric character and special characters like [a-zA-Z0-9][a-zA-Z0-9_.]+[a-zA-Z0-9]@(dr.abdm|hpr.abdm)$|^[1-9][0-9]{13}$
                    latitude:
                      type: number
                      format: float
                      nullable: true
                      example: 20.5937
                      description: The latitude of the location.Allows alpha numeric character and special characters like ^[0-9-.]+$
                    longitude:
                      type: number
                      format: float
                      nullable: true
                      example: 78.9629
                      description: The longitude of the location.Allows alpha numeric character and special characters like ^[0-9-.]+$
                profile:
                  type: object
                  nullable: false
                  description: This should populated only for PROFILE_SHARE
                  required:
                    - patient
                  properties:
                    patient:
                      type: object
                      nullable: false
                      required:
                        - abhaAddress
                        - name
                        - gender
                        - yearOfBirth
                        - address
                        - phoneNumber
                      properties:
                        abhaNumber:
                          type: string
                          nullable: true
                          example: <ABHA_NUMBER>
                          description: The abha number of the patient. Should be only 14 digit. Allows alpha numeric character and special characters like ^(\\d+-?){13}\\d$
                        abhaAddress:
                          type: string
                          nullable: false
                          example: <ABHA_ADDRESS>
                          description: The abha address of the patient. Should start with Alphanumeric . and  _  in the middle and must be ending with @abdm or @sbx and Allows alpha numeric character and special characters like ^[a-zA-Z0-9][a-zA-Z0-9_.\-!]+[a-zA-Z0-9]@(abdm|sbx)$
                        name:
                          type: string
                          nullable: false
                          example: <NAME>
                          description: The name of the patient. Allows alpha numeric character and special characters like ^[a-zA-Z0-9.-_,]+(([',. -][a-zA-Z0-9. ])?[a-zA-Z0-9. ]*)*$
                        gender:
                          type: string
                          enum:
                            - M
                            - F
                            - O
                            - D
                            - T
                            - U
                          nullable: false
                          example: M
                          description: The gender of the patient
                        dayOfBirth:
                          type: string
                          format: number
                          nullable: true
                          example: '<DOB>'
                          description: The day of birth of the patient. Only allows numeric values between 1 abd 31 and ^(?!\\s*$)(0?[1-9]|[12][0-9]|3[01])$
                        monthOfBirth:
                          type: string
                          format: number
                          nullable: true
                          example: '<DOB>'
                          description: The month of birth of the patient. Only allows numeric values between 1 abd 12 and ^(?!\\s*$)(0?[1-9]|[1][0-2])$
                        yearOfBirth:
                          type: string
                          format: number
                          nullable: false
                          example: '9999'
                          description: The month of birth of the patient. Only allows numeric values and must be 4 digit ranging between 1900 and 2200 and ^(?!\\s*$)(19|20|21|22)\\d{2}$
                        address:
                          type: object
                          required:
                            - line
                          properties:
                            line:
                              type: string
                              nullable: true
                              example: Address line 1
                              description: The address line
                            district:
                              type: string
                              nullable: true
                              example: Coimbatore
                              description: The district and should only contain alphabets
                            state:
                              type: string
                              nullable: false
                              example: Tamil Nadu
                              description: The state and should only contain alphabets like [A-Z a-z]+[A-Z a-z //' ']*$
                            pincode:
                              type: string
                              nullable: false
                              example: '<PINCODE>'
                              description: Should be 5 digits and only contain numbers
                        phoneNumber:
                          type: string
                          nullable: true
                          example: '<MOBILE_NUMBER>'
                          description: The mobile number of the patient. Must be 10 digit and contain only 0-9 and it allows only numbers like ^(\+\d{1,3}[- ]?)?\d{10}$
            examples:
              01 profile-share:
                summary: P2 - Patient Share › 01 profile-share
                value:
                  intent: PROFILE_SHARE
                  metaData:
                    hipId: HIP_1
                    context: '123456'
                    hprId: <EMAIL>
                    latitude: -38.671
                    longitude: 58.498
                  profile:
                    patient:
                      abhaAddress: <ABHA_ADDRESS>
                      name: John Doe
                      gender: M
                      dayOfBirth: '<DOB>'
                      monthOfBirth: '<DOB>'
                      yearOfBirth: '<DOB>'
                      address:
                        line: North street
                        district: NORTH GOA
                        state: GOA
                        pincode: '<PINCODE>'
                      phoneNumber: '99999999'
      responses:
        '202':
          description: Accepted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                        description: 'ABDM-1006 - Bad Request, invalid request Body. May be returned either bare (`ABDM-1006`) or with a trailing ": " separator (`ABDM-1006: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1006
                      message:
                        type: string
                        example: Bad Request, invalid request Body
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                    description: '900901 - Invalid Credentials. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: '900901'
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: Invalid Credentials. Make sure you have provided the correct security credentials
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: Access Denied
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                        description: 'ABDM-1001 - No data found. May be returned either bare (`ABDM-1001`) or with a trailing ": " separator (`ABDM-1001: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1001
                      message:
                        type: string
                        example: No data found
        '408':
          description: Request Timeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                        description: 'ABDM-1007 - Connection failed due to timeout. May be returned either bare (`ABDM-1007`) or with a trailing ": " separator (`ABDM-1007: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1007
                      message:
                        type: string
                        example: Connection failed due to timeout
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                        description: 'ABDM-1022 - Too many requests. May be returned either bare (`ABDM-1022`) or with a trailing ": " separator (`ABDM-1022: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1022
                      message:
                        type: string
                        example: Too many requests
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                    description: '900900 - Unclassified Authentication Failure. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: '900900'
                  message:
                    type: string
                    example: Unclassified Authentication Failure
                  description:
                    type: string
                    example: 'Access failure for API: /hiecm/api/v3, version: v3 status: (900900) - Unclassified Authentication Failure'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                    description: 'ABDM-1024 - Dependent service unavailable. May be returned either bare (`ABDM-1024`) or with a trailing ": " separator (`ABDM-1024: `); match on the code itself and tolerate the separator.'
                    nullable: false
                    example: ABDM-1024
                  message:
                    type: string
                    nullable: false
                    example: Dependent service unavailable
