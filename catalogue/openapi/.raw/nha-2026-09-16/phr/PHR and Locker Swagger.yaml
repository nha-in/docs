          schema:
            type: string
          example: sbx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  example: '{{clientId}}'
                clientSecret:
                  type: string
                  example: '{{clientSecret}}'
                grantType:
                  type: string
                  example: client_credentials
              required:
                - clientId
                - clientSecret
            examples:
