          schema:
            type: string
          example: <JWT TOKEN>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - subscriptionId
                  - purpose
                  - status
                  - dateCreated
                  - dateGranted
                  - patient
                  - requester
                  - includedSources
                properties:
                  subscriptionId:
                    type: string
                    format: uuid
                    nullable: false
                    minimum: 36
                    maximum: 50
                    example: f29f0e59-8388-4698-9fe6-05db67aeac46
                  purpose:
                    type: object
                    nullable: false
                    required:
                      - text
                      - code
                      - refUri
                    properties:
                      text:
                        type: string
                        nullable: false
                        enum:
                          - Care Management
                          - Break the Glass
                          - Public Health
                          - Healthcare Payment
                          - Disease Specific Healthcare Research
                          - Self Requested
                        example: Care Management
                      code:
                        type: string
                        nullable: false
                        enum:
                          - CAREMGT
                          - BTG
                          - PUBHLTH
                          - HPAYMT
                          - DSRCH
                          - PATRQT
                        example: CAREMGT
                      refUri:
                        type: string
                        format: uri
                        nullable: false
                        example: https://abc.def.in
                        description: The reference URL. Allows alpha numeric character and special characters like "^[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\.[a-zA-Z0-9()]{1,6}\\b(?:[-a-zA-Z0-9()@:%_\\+.~#?&//=]*)$"
                  dateCreated:
                    type: string
                    format: date-time
                    nullable: false
                    example: '2021-09-28T12:30:08.573Z'
                  status:
