  /api/hiecm/hip/v3/link/carecontext:
    servers:
      - url: https://dev.abdm.gov.in
        description: HIE-CM sandbox
    post:
      tags:
        - P2 - Initiated Linking
      summary: link-care-context
      description: " <p><b>Note: </b>While generating the link-token the user/patient is providing both abha_number and abha_address, then at the time of linking both must be mandatory. If not one should be mandatory either 'abha_number' or 'abha_address'.</p><br><p> This API endpoint is utilized by the Ayushman Bharat Digital Mission (ABDM) system to store care context or health record references. Upon successful validation of the ABHA (Ayushman Bharat Health Account) address and the associated link token, the system securely records the relevant care context information. This process ensures that health records are accurately linked and accessible, facilitating efficient and seamless health information exchange across the network. The API plays a critical role in maintaining the integrity and continuity of patient health records, thereby supporting comprehensive and coordinated care."
      operationId: postHipV3LinkCarecontext
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          description: Unique UUID for each request.
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          description: Request timestamp in UTC, ISO-8601 with Z.
          schema:
            type: string
            format: date-time
          example: '2022-10-06T15:10:00.587Z'
        - name: X-HIP-ID
          in: header
          required: true
          description: Identifier of the health information provider to which the request was intended
          schema:
            type: string
          example: IN2810014366
        - name: X-LINK-TOKEN
          in: header
          required: true
          description: Link token issued for care-context linking.
          schema:
            type: string
          example: <JWT TOKEN>
        - name: X-CM-ID
          in: header
          required: true
          description: Suffix of the consent manager to which the request was intended
          schema:
            type: string
          example: sbx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - abhaAddress
                - patient
              properties:
                abhaNumber:
                  type: number
                  nullable: true
                  example: 12345678901234
                  description: The abha number of the patient. Should be only 14 digit and it allows numeric character like ^\\d{14}$
                abhaAddress:
                  type: string
                  nullable: false
                  example: <ABHA_ADDRESS>
                  description: The abha address of the patient. Should start with Alphanumeric . and  _  in the middle and must be ending with @abdm or @sbx also allows alpha numeric character and special characters like ^[a-zA-Z0-9][a-zA-Z0-9_.]+[a-zA-Z0-9]@(abdm|sbx)$
                patient:
                  type: array
                  nullable: false
                  items:
                    type: object
                    required:
                      - referenceNumber
                      - display
                      - careContexts
                      - hiTypes
                      - count
                    properties:
                      referenceNumber:
                        type: string
                        nullable: false
                        example: TMH-PUID-001
                        description: Patient identifier with which patient is registered in the facility/hospital or patient can also pass his abha_address in the reference number. Allows alpha numeric character and special characters like ^[a-zA-Z0-9_\-@,. "':|()/]{0,255}$
                      display:
                        type: string
                        nullable: false
                        example: String
                        description: The display text for patient reference(regex:^[a-zA-Z0-9_\-@,. "':|()/]{0,255}$)
                      careContexts:
                        type: array
                        description: List of care contexts linked at the HIP end for the identified patient.
                        nullable: false
                        items:
                          type: object
                          required:
                            - referenceNumber
                            - display
                          properties:
                            referenceNumber:
                              type: string
                              nullable: false
                              example: TMH-PUID-001
                              description: An identifier of patient's care context created in HIP. A care context is a group of patient's health data (Not the actual health data) and it should be unique for each care-context.Allows alpha numeric character and special characters like ^[a-zA-Z0-9_\-@,. ()/:\\]{0,255}$
                            display:
                              type: string
                              nullable: false
                              example: display 1
                              description: The display text for care context reference(regex:^[a-zA-Z0-9_\-@,. "':|()/]{0,255}$)
                      hiTypes:
                        type: string
                        description: Types of health information document.
                        enum:
                          - DiagnosticReport
                          - DischargeSummary
                          - HealthDocumentRecord
                          - ImmunizationRecord
                          - OPConsultation
                          - Prescription
                          - WellnessRecord
                          - Invoice
                        nullable: false
                        example: DiagnosticReport
                      count:
                        type: number
                        nullable: false
                        example: 1
                        description: The count should match with the number of care contexts
            examples:
              link-care-context:
                summary: P2 -  Initiated Linking › link-care-context
                value:
                  abhaAddress: <ABHA_ADDRESS>
                  patient:
                    - referenceNumber: TMH-PUID-001
                      display: Blood Test
                      careContexts:
                        - referenceNumber: Test-2
                          display: Blood Test
                      hiType: Prescription
                      count: 1
      responses:
        '202':
          description: Accepted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                        description: 'ABDM-1006 - Bad Request, invalid request Body. May be returned either bare (`ABDM-1006`) or with a trailing ": " separator (`ABDM-1006: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1006
                      message:
                        type: string
                        example: Bad Request, invalid request Body
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                    description: '900902 - Unauthorized. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: '900902'
                  message:
                    type: string
                    example: Unauthorized
                  description:
                    type: string
                    example: "Invalid Credentials. Make sure your API invocation call has a header: 'Authorization : Bearer ACCESS_TOKEN' or 'Authorization : Basic ACCESS_TOKEN' or 'apikey: API_KEY'"
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: Access Denied
        '404':
          description: server cannot find the requested resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                        description: 'ABDM-1001 - No data found. May be returned either bare (`ABDM-1001`) or with a trailing ": " separator (`ABDM-1001: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1001
                      message:
                        type: string
                        example: No data found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
                    description: 'ABDM-9999 - Unknown exception. May be returned either bare (`ABDM-9999`) or with a trailing ": " separator (`ABDM-9999: `); match on the code itself and tolerate the separator.'
                    example: ABDM-9999
