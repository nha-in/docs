  /abha/api/v3/phr/app/login/profile/request/otp:
    post:
      tags:
        - Profile API Collection
      summary: Send Otp
      description:  API is used to send a One-Time Password (OTP) to the mobile number associated with the currently logged-in user’s account. This ensures that the user can securely update their profile information by verifying their identity through the OTP.
       <br><br>**Example of OTP Request**<br>
        <br>Example1:<br>
       **AADHAR OTP:** When the user wants to update their profile using their Aadhaar number, an OTP is sent to the mobile number registered with their Aadhaar. For this, pass loginHint as "abha-number"<br>
         <br>Example2:<br>
       **ABHA OTP:** When the user wants to update their profile using their ABHA number, an OTP is sent to the mobile number registered with their ABHA. For this, pass loginHint as "abha-number".<br>
        <br>Example3:<br>
        **Email OTP:** When the user wants to update their profile using their email, an OTP is sent to the provided email address. For this, pass loginHint as "email".. <br>
        <br>Example4:<br>
       **Mobile OTP:** When the user wants to update their profile using their mobile number, an OTP is sent to the provided mobile number. For this, pass loginHint as "mobile-number"<br><br><b>Note:</b><br> **1.** OTP will be valid for 10 minute only
       <br><br>

      operationId: sendOtpUpdateEmail
      parameters:
        - name: X-token
          description: >-
            Token identifying the logged-in ABHA user. For child ABHA creation this is the X-token of
            the parent user, obtained after login
          in: header
          required: true
          schema:
            type: string
            example: >-
              {{jwt-token}}
        - name: REQUEST-ID
          description: >-
            Unique UUID to track the end to end request transaction
          in: header
          required: true
          schema:
            type: string
            example: 'e906de88-7e4e-465f-9744-f246a5c96b5b'
        - name: TIMESTAMP
          description: >-
            Actual time the request was initiated, ISO 8601 date-time: year, month, day, hour, minutes,
            seconds and milliseconds, e.g. 2024-09-03T11:20:51.456Z
          in: header
          required: true
          schema:
            type: string
            example: '2024-09-03T11:20:51.456Z'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                loginHint:
                  type: string
                  description: >-
                    The registration or login method being used.
                  example: mobile-number
                loginId:
                  type: string
                  description: >-
                    Encrypted login id, which can be a mobile number, ABHA number or ABHA address.
                  example: '{{encrypted mobile-number}}'
                otpSystem:
                  type: string
                  description: >-
                    The system used to deliver and verify the OTP.
                  example: abdm
                scope:
                  type: array
                  items:
                    type: string
                    example: abha-address-profile
                  example:
                    - abha-address-profile
                    - mobile-verify
              required :
                - loginHint
                - loginId
                - otpSystem
                - scope
            examples:
              Send AADHAAR Otp - Link-DeLink:
                value:
                  loginHint: abha-number
                  loginId: '{{encrypted abha-number}}'
                  otpSystem: aadhaar
                  scope:
                    - abha-login
                    - aadhaar-verify
              Send ABHA Otp - Link-DeLink:
                value:
                  loginHint: abha-number
                  loginId: '{{encrypted abha-number}}'
                  otpSystem: abdm
                  scope:
                    - abha-login
                    - mobile-verify
              Send Otp - Update Email:
                value:
                  loginHint: email
                  loginId: '{{encrypted email}}'
                  otpSystem: abdm
                  scope:
                    - abha-address-profile
                    - email-verify
              Send Otp - Update Mobile:
                value:
                  loginHint: mobile-number
                  loginId: '{{encrypted mobile-number}}'
                  otpSystem: abdm
                  scope:
                    - abha-address-profile
                    - mobile-verify
        description : Below is the Request Body description<br><br>
         <b> Note:</b> Mandatory fields can't be null.
         <ol>
          <li>
          <p><strong>scope</strong> (required):</p>
          <ul>
          <li><strong>Description:</strong> Specifies the scope of the OTP request.</li>
          <li><strong>Example:</strong> <code>["abha-login", "mobile-verify"]</code></li>
          <li><strong>Possible Values:</strong> <code>abha-login</code>, <code>mobile-verify</code>, <code>aadhar-verify</code>, <code>abha-address-profile</code>,<code>email-verify</code>,etc.</li>
          </ul>
          </li>
          <li>
          <p><strong>loginHint</strong> (required):</p>
          <ul>
          <li><strong>Description:</strong> Indicates the type of identifier being used for the OTP request.</li>
          <li><strong>Example:</strong> <code>abha-number</code></li>
          <li><strong>Possible Values:</strong><code>abha-number</code>, <code>mobile-number</code>,<code>email</code></li>
          </ul>
          </li>
          <li>
          <p><strong>loginId</strong> (required):</p>
          <ul>
          <li><strong>Description:</strong> The encrypted identifier (ABHA Number, or Mobile Number) for which the OTP is being requested.</li>
          <li><strong>Example:</strong> <code>{{encrypted abha number/encrypted mobile-number/encrypted email}}</code></li>
          </ul>
          </li>
          <li>
          <p><strong>otpSystem</strong> (required):</p>
          <ul>
          <li><strong>Description:</strong> Specifies the system used for OTP generation.</li>
          <li><strong>Example:</strong> <code>abdm</code></li>
          <li><strong>Possible Values:</strong> <code>abdm</code>, <code>aadhaar</code></li>
          </ul>
          </li>
          </ol>
          <ol>
      responses:
        '200':
          description: The 200 response code indicates a successful request. In this context, it refers to the successful sending of an Aadhaar OTP for linking, delinking, or updating a mobile number.<br><br>
            <p><strong>Types of OTP Verification Scenarios:</strong></p>
            <ol>
              <li>
                <p><strong>Send AADHAAR OTP - Link-DeLink:</strong> This indicates a successful OTP sending for linking or delinking an Aadhaar account.</p>
              </li>
            </ol>
            <ol start="2">
              <li>
                <p><strong>Send AADHAAR OTP - Update Mobile:</strong> This indicates a successful OTP sending for updating the mobile number associated with an Aadhaar account.</p>
              </li>
            </ol>
            <ol start="3">
              <li>
                <p><strong>Send AADHAAR OTP - Link-DeLink - Invalid Request:</strong> This error occurs when the request for sending an OTP for linking or delinking an Aadhaar account is invalid.</p>
              </li>
            </ol>
            <ol start="4">
              <li>
                <p><strong>Send AADHAAR OTP - Update Mobile - Invalid Request:</strong> This error occurs when the request for sending an OTP for updating the mobile number is invalid.</p>
              </li>
            </ol>
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP is sent to Mobile number ending with ******2425
                  txnId:
                    type: string
                    example: 1bda575d-02pd-40be-77e6-1e3efca52a82
              examples:
