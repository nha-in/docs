  /abha/api/v3/phr/app/login/verify:
    post:
      tags:
        - Login API Collection
      summary: OTP Verify
      description: API is used to verify the One-Time Password (OTP) provided by the user. This verification process ensures that the user is authenticated based on the OTP sent to their registered contact method. The API supports multiple scenarios for OTP verification, including the below example:<br><br>**Example of OTP Verify**<br>
        <br>Example1:<br>
       **ABHA ADDRESS Verify Email OTP:** Verifies the OTP sent to the user’s registered email address associated with their ABHA address.<br>
       <br>Example2:<br>
       **ABHA ADDRESS Verify Mobile OTP:** Verifies the OTP sent to the mobile number linked to the user’s ABHA address.<br>
         <br>Example3:<br>
         **AADHAAR OTP:**  Verifies the OTP sent to the mobile number linked to the user’s Aadhaar number.<br>
       <br>Example4:<br>
       **ABHA Verify OTP:** Verifies the OTP sent to the mobile number linked to the user’s ABHA number.<br>
       <br>Example5:<br>
       **Email Verify OTP:** Verifies the OTP sent to the user’s registered email address.<br>
        <br>Example6:<br>
       **Mobile Verify OTP:** Verifies the OTP sent to the user’s registered mobile number.<br>
       <br>Example7:<br>
        **Password Verify OTP:** Verifies the OTP sent for password authentication.<br>
       <br><br>Note:<br>**1. OTP will be valid for 10 minute only**
       
       <!--<table>
       <thead>
       <tr>
       <th>Attributes</>
       <th>Description</>
       </tr>
       </thead>
       <tbody>
       <tr>
       <td>otpSystem <sup> * required</td>
       <td>abdm/aadhaar</td>
       </tr>
        <tr>
       <td>txnId <sup>* required </sup></td>
       <td>transactionId</td>
       </tr>
        <tr>
       <td>scope <sup>* required</td>
       <td>Aadhaar/Abha/Abha Address Mobile/Abha Address Email/Email/Mobile/Password</td>
       </tr>
       </tbody
       </table> -->
      operationId: loginOtpVerifyMobile
      parameters:
        - name: REQUEST-ID
          description: >-
            Unique UUID to track the end to end request transaction
          in: header
          required: true
          schema:
            type: string
            example: 'e906de88-7e4e-465f-9744-f246a5c96b5b'
        - name: TIMESTAMP
          description: >-
            Actual time the request was initiated, ISO 8601 date-time: year, month, day, hour, minutes,
            seconds and milliseconds, e.g. 2024-09-03T11:20:51.456Z
          in: header
          required: true
          schema:
            type: string
            example: '2024-09-03T11:20:51.456Z'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                authData:
                  type: object
                  description: >-
                    The authentication data - includes authMethods, transaction id and OTP value.
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                        example: otp
                      example:
                        - otp
                    otp:
                      type: object
                      properties:
                        otpValue:
                          type: string
                          example: '{{encrypted OTP}}'
                        txnId:
                          type: string
                          example: '{{transactionId}}'
                      required:
                        - txnId
                        - otpValue
                  required:
                  - authMethods
                  - otp
                scope:
                  type: array
                  items:
                    type: string
                    example: abha-login
                  example:
                    - abha-login
                    - mobile-verify
              required:
                - authData
                - scope
            examples:
              Login OTP Verify - AADHAAR:
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      otpValue: '{{encrypted OTP}}'
                      txnId: '{{transactionId}}'
                  scope:
                    - abha-address-login
                    - aadhaar-verify
              Login OTP Verify - ABHA:
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      otpValue: '{{encrypted OTP}}'
                      txnId: '{{transactionId}}'
                  scope:
                    - abha-login
                    - mobile-verify
              Login OTP Verify - ABHAADDRES Mobile:
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      otpValue: '{{encrypted OTP}}'
                      txnId: '{{transactionId}}'
                  scope:
                    - abha-address-login
                    - mobile-verify
              Login OTP Verify - ABHAADDRESS Email:
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      otpValue: '{{encrypted OTP}}'
                      txnId: '{{transactionId}}'
                  scope:
                    - email-verify
                    - abha-address-login
              Login OTP Verify - Email:
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      otpValue: '{{encrypted otp}}'
                      txnId: '{{transactionId}}'
                  scope:
                    - email-verify
                    - abha-address-login
              Login OTP Verify - Mobile:
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      otpValue: '{{encrypted OTP}}'
                      txnId: '{{transactionId}}'
                  scope:
                    - abha-address-login
                    - mobile-verify
              Login Verify - Password:
                value:
                  authData:
                    authMethods:
                      - password
                    password:
                      abhaAddress: john.doe@sbx
                      password: '{{encrypted password}}'
                  scope:
                    - abha-address-login
                    - password-verify
        description : <b>Below is the Request Body description:</b><br><br>
         <b>Note:</b> Mandatory fields can't be null.
         <ol> 
            <li>
            <p><strong>authData</strong> (required):</p>
            <ul>
            <li><strong>Description:</strong> Contains the authentication methods and OTP details.</li>
            <li><strong>Properties:</strong>
            <ul>
            <li><strong>authMethods:</strong> Specifies the method of authentication.
            <ul>
            <li><strong>Type:</strong> Array of strings</li>
            <li><strong>Example:</strong> <code>["otp"]</code></li>
            </ul>
            </li>
            <li><strong>otp:</strong> Contains the OTP value and transaction ID.
            <ul>
            <li><strong>Properties:</strong>
            <ul>
            <li><strong>otpValue:</strong> The encrypted OTP provided by the user.
            <ul>
            <li><strong>Type:</strong> String</li>
            <li><strong>Example:</strong> <code>{{encrypted OTP}}</code></li>
            </ul>
            </li>
            <li><strong>txnId:</strong> The transaction ID associated with the OTP request.
            <ul>
            <li><strong>Type:</strong> String</li>
            <li><strong>Example:</strong> <code>{{transactionId}}</code></li>
            </ul>
            </li>
            </ul>
            </li>
            </ul>
            </li>
            </ul>
            </li>
            </ul>
            </li>
            <li>
            <p><strong>scope</strong> (required):</p>
            <ul>
            <li><strong>Description:</strong> Specifies the scope of the OTP verification.</li>
            <li><strong>Type:</strong> Array of strings</li>
            <li><strong>Example:</strong> <code>["abha-login", "mobile-verify"]</code></li>
            <li><strong>Possible Values:</strong> <code>abha-login</code>, <code>mobile-verify</code>, <code>aadhaar-verify</code>,<code>abha-address-login</code>, <code>email-verify</code>,<code>password-verify</code>etc.</li>
            </ul>
            </li>
            </ol>
      responses:
        '200':
          description: >-
            The 200 response code indicates a successful request. In this context, it refers to the successful verification of an OTP (One-Time Password) or password for various login services.
              <p><strong>Types of Login Verifications:</strong></p>
              <ol>
                <li>
                  <p><strong>Login OTP Verify - Mobile:</strong> This response indicates that the OTP sent to a mobile number for login purposes has been successfully verified.</p>
                </li>
              </ol>
              <ol start="2">
                <li>
                  <p><strong>Login OTP Verify - Mobile - Invalid OTP:</strong> This response indicates that the OTP sent to a mobile number for login purposes is invalid.</p>
                </li>
              </ol>
              <ol start="3">
                <li>
                  <p><strong>Login OTP Verify - ABHA Address Mobile - Invalid OTP:</strong> This response indicates that the OTP sent to a mobile number for ABHA (Ayushman Bharat Health Account) address login purposes is invalid.</p>
                </li>
              </ol>
              <ol start="4">
                <li>
                  <p><strong>Login OTP Verify - AADHAAR:</strong> This response indicates that the OTP sent for AADHAAR login purposes has been successfully verified.</p>
                </li>
              </ol>
              <ol start="5">
                <li>
                  <p><strong>Login Verify - Password:</strong> This response indicates that the password provided for login purposes has been successfully verified.</p>
                </li>
              </ol>
              <ol start="6">
                <li>
                  <p><strong>Login Verify - Password - Invalid Password:</strong> This response indicates that the password provided for login purposes is invalid.</p>
                </li>
              </ol>
              <ol start="7">
                <li>
                  <p><strong>Login OTP Verify - Email:</strong> This response indicates that the OTP sent to an email address for login purposes has been successfully verified.</p>
                </li>
              </ol>
              <ol start="8">
                <li>
                  <p><strong>Login OTP Verify - Email - Invalid OTP:</strong> This response indicates that the OTP sent to an email address for login purposes is invalid.</p>
                </li>
              </ol>
              <ol start="9">
                <li>
                  <p><strong>Login OTP Verify - ABHA Address Email - Invalid OTP:</strong> This response indicates that the OTP sent to an email address for ABHA (Ayushman Bharat Health Account) address login purposes is invalid.</p>
                </li>
              </ol>
              <ol start="10">
                <li>
                  <p><strong>Login OTP Verify - ABHA:</strong> This response indicates that the OTP sent for ABHA login purposes has been successfully verified.</p>
                </li>
              </ol>
              <ol start="11">
                <li>
                  <p><strong>Login OTP Verify - ABHA - Invalid OTP:</strong> This response indicates that the OTP sent for ABHA login purposes is invalid.</p>
                </li>
              </ol>


