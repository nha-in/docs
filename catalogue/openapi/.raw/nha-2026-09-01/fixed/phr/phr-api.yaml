  /abha/api/v3/phr/app/login/profile/updateProfile:
    post:
      tags:
        - Profile API Collection
      summary: Update Profile
      description:  This API endpoint updates the user profile of the currently logged-in user with the information provided in the request body. It allows users to modify their personal details, ensuring their profile information is accurate and up-to-date.
        <ol>
              <li>
              <p><strong>Profile Management:</strong> Enables users to update their personal information such as address, contact details, and other profile attributes.</p>
              </li>
              <li>
              <p><strong>Data Accuracy:</strong> Ensures that the user’s profile information is current and accurate, which is essential for personalized services and communication..</p>
              </li>
              <li>
              <p><strong>User Control:</strong> Provides users with the ability to manage and update their own profile information, enhancing user autonomy and satisfaction..</p>
              </li>
               <li>
              <p><strong>Compliance:</strong> Helps in maintaining compliance with data protection regulations by allowing users to keep their information up-to-date.</p>
              </li>
               </ol>

      operationId: updateProfile
      parameters:
        - name: X-token
          description: >-
            Token identifying the logged-in ABHA user. For child ABHA creation this is the X-token of
            the parent user, obtained after login
          in: header
          required: true
          schema:
            type: string
            example: >-
              {{jwt-token}}
        - name: REQUEST-ID
          description: >-
            Unique UUID to track the end to end request transaction
          in: header
          required: true
          schema:
            type: string
            example: 'e906de88-7e4e-465f-9744-f246a5c96b5b'
        - name: TIMESTAMP
          description: >-
            Actual time the request was initiated, ISO 8601 date-time: year, month, day, hour, minutes,
            seconds and milliseconds, e.g. 2024-09-03T11:20:51.456Z
          in: header
          required: true
          schema:
            type: string
            example: '2024-09-03T11:20:51.456Z'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - firstName
              - lastName
              - middleName
              - address
              - dayOfBirth
              - monthOfBirth
              - yearOfBirth
              - stateCode
              - stateName
              - districtCode
              - districtName
              - gender
              - pinCode
              - profilePhoto
              properties:
                address:
                  type: string
                  example: street number 5
                dayOfBirth:
                  type: string
                  example: '14'
                districtCode:
                  type: string
                  example: '123'
                districtName:
                  type: string
                  example: Nashik
                email:
                  type: string
                  example: ''
                firstName:
                  type: string
                  nullable: false
                  example: John
                gender:
                  type: string
                  example: M
                lastName:
                  type: string
                  example: Doe
                middleName:
                  type: string
                  example: ''
                mobile:
                  type: string
                  example: XXXXXX1234
                monthOfBirth:
                  type: string
                  example: '11'
                pinCode:
                  type: string
                  example: '422003'
                profilePhoto:
                  type: string
                  example: '{{profile-photo}}'
                stateCode:
                  type: string
                  example: '27'
                stateName:
                  type: string
                  example: Maharashtra
                yearOfBirth:
                  type: string
                  example: '1998'
             
            examples:
              Update Profile:
                value:
                  address: street number 5
                  dayOfBirth: '14'
                  districtCode: '123'
                  districtName: Nashik
                  email: ''
                  firstName: John
                  gender: M
                  lastName: Doe
                  middleName: ''
                  mobile: XXXXXX1234
                  monthOfBirth: '11'
                  pinCode: '422003'
                  profilePhoto: '{{profile-photo}}'
                  stateCode: '27'
                  stateName: Maharashtra
                  yearOfBirth: '1998'
        description : 
            Below is the Request Body description<br><br>
           <b> Note:</b> Mandatory fields can't be null.
           <div>
           <ol>
            <li>
            <p><strong>address (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The user’s residential address.</li>
            <li><strong>Example :</strong> <code>street number 5</code></li>
            </ul>
            </li>
            <li>
            <p><strong>dayOfBirth (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The day of the user’s birth.</li>
            <li><strong>Example :</strong> <code>14</code></li>
            </ul>
            </li>
            <li>
            <p><strong>districtCode (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The code of the user’s district.</li>
            <li><strong>Example :</strong> <code>123</code></li>
            </ul>
            </li>
            <li>
            <p><strong>districtName (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The name of the user’s district.</li>
            <li><strong>Example :</strong> <code>Nashik</code></li>
            </ul>
            </li>
            <li>
            <p><strong>email (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The user’s email address.</li>
            <li><strong>Example :</strong> <code>johndoe@example.com</code></li>
            </ul>
            </li>
            <li>
            <p><strong>firstName (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The user’s first name.</li>
            <li><strong>Example :</strong> <code>John</code></li>
            </ul>
            </li>
            <li>
            <p><strong>gender (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The user’s gender.</li>
            <li><strong>Example :</strong> <code>M</code></li>
            </ul>
            </li>
            <li>
            <p><strong>lastName (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The user’s last name.</li>
            <li><strong>Example :</strong> <code>Doe</code></li>
            </ul>
            </li>
            <li>
            <p><strong>middleName (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The user’s middle name.</li>
            <li><strong>Example :</strong> <code></code></li>
            </ul>
            </li>
            <li>
            <p><strong>mobile (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The user’s mobile number.</li>
            <li><strong>Example :</strong> <code>XXXXXX1234</code></li>
            </ul>
            </li>
            <li>
            <p><strong>monthOfBirth (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The month of the user’s birth.</li>
            <li><strong>Example :</strong> <code>11</code></li>
            </ul>
            </li>
            <li>
            <p><strong>pinCode (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The postal code of the user’s address.</li>
            <li><strong>Example :</strong> <code>422003</code></li>
            </ul>
            </li>
            <li>
            <p><strong>profilePhoto (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The URL or identifier for the user’s profile photo.</li>
            <li><strong>Example :</strong> <code></code></li>
            </ul>
            </li>
            <li>
            <p><strong>stateCode (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The code of the user’s state.</li>
            <li><strong>Example :</strong> <code>27</code></li>
            </ul>
            </li>
            <li>
            <p><strong>stateName (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The name of the user’s state.</li>
            <li><strong>Example :</strong> <code>Maharashtra</code></li>
            </ul>
            </li>
            <li>
            <p><strong>yearOfBirth (required):</strong></p>
            <ul>
            <li><strong>Description:</strong> The year of the user’s birth.</li>
            <li><strong>Example :</strong> <code>1998</code></li>
            </ul>
            </li>
            </ol>
           </div>
      responses:
        '200':
          description: The 200 response code means the request to “Update Profile” was successful. This means the profile information was updated as requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  abhaAddress:
                    type: string
                    example: johndoe@sbx
                  abhaLinkedCount:
                    type: string
                    example: '3'
                  abhaNumber:
                    type: string
                    description: >-
                      14-digit unique ABHA number of the patient.
                    example: xx-xxxx-xxxx-1234
                  address:
                    type: string
                    example: street number 5
                  authMethods:
                    type: array
                    items:
                      type: string
                      example: MOBILE_OTP
                    example:
                      - MOBILE_OTP
                      - PASSWORD
                      - EMAIL_OTP
                      - AADHAAR_OTP
                  dateOfBirth:
                    type: string
                    example: 14-11-1998
                  dayOfBirth:
                    type: string
                    example: '14'
                  districtCode:
                    type: string
                    example: '123'
                  districtName:
                    type: string
                    example: Nashik
                  email:
                    type: string
                    example: johxxxxxxxxxx@gmail.com
                  emailVerified:
                    type: string
                    example: 'true'
                  firstName:
                    type: string
                    example: John
                  fullName:
                    type: string
