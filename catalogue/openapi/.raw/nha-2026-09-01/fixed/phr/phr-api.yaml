  /abha/api/v3/phr/app/login/profile/verify:
    post:
      tags:
        - Profile API Collection
      summary: Verify Otp
      description: API endpoint is used to verify the user’s identity using the provided verification information. This ensures that the user can securely update their profile information by confirming their identity through the OTP.
        <br><br>**Example of OTP Verification**<br>
          <br>Example1:<br>
         **AADHAAR OTP Verification:**  When the user wants to verify their identity using an OTP sent to their Aadhaar number, the provided OTP is validated. For this, pass scope as ["abha-login", "aadhaar-verify"].<br>
           <br>Example2:<br>
         **ABHA OTP Verification:** When the user wants to verify their identity using an OTP sent to their ABHA number, the provided OTP is validated. For this, pass scope as ["abha-login", "mobile-verify"].<br>
          <br>Example3:<br>
          **Email OTP Verification:**When the user wants to verify their identity using an OTP sent to their email, the provided OTP is validated. For this, pass scope as ["email-verify"]. <br>
          <br>Example4:<br>
         **Mobile OTP Verification:** When the user wants to verify their identity using an OTP sent to their mobile number, the provided OTP is validated. For this, pass scope as ["mobile-verify"].<br><br><b>Note:</b><br> **1.** OTP will be valid for 10 minute only
        <br><br>
      
      operationId: verifyOtpUpdateEmail
      parameters:
        - name: X-token
          description: >-
            Token identifying the logged-in ABHA user. For child ABHA creation this is the X-token of
            the parent user, obtained after login
          in: header
          required: true
          schema:
            type: string
            example: >-
              eyJ4NXQiOiJOMkpqTWpOaU0yRXhZalJrTnpaalptWTFZVEF4Tm1GbE5qZzRPV1UxWVdRMll6YzFObVk1TlE9PSIsImtpZdI6ImdhdGV3YXlfY3VydGlmaWNhdGVfYWxpYXMiLCJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..KwQSkfZrPY4rpngRxk6iXq7kzimESiCkl5XlDs6er0WPFAikOqnJFA2zMmIGJxgIhQtqe2fMLj9WeD0UgrtC8ObPWIqbfcPerz4X79vb2hI4fei8uFZhWASila8tycYj3c9vQmhHVGbwHVxZO2ZQfLklPSpDjDwh9XzR_zRTL_6rBsIkPx3SV9P4krQXVabcZTA2byfJD8WKV999WB8MoczrNtI-eqKDoge8utTUyl-2gfwuLAiB_scymC7OBXUCa7gi1pXiwu5n-J5bvSwfjK9qgpN12jF3r9kvz3xNDAA1B8LvxQAeYMsFRB4Sd44uWreVKtIPrxu_6X6ffiRews==
        - name: REQUEST-ID
          description: >-
            Unique UUID to track the end to end request transaction
          in: header
          required: true
          schema:
            type: string
            example: 'e906de88-7e4e-465f-9744-f246a5c96b5b'
        - name: TIMESTAMP
          description: >-
            Actual time the request was initiated, ISO 8601 date-time: year, month, day, hour, minutes,
            seconds and milliseconds, e.g. 2024-09-03T11:20:51.456Z
          in: header
          required: true
          schema:
            type: string
            example: '2024-09-03T11:20:51.456Z'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                authData:
                  type: object
                  description: >-
                    The authentication data - includes authMethods, transaction id and OTP value.
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                        example: otp
                      example:
                        - otp
                    otp:
                      type: object
                      properties:
                        otpValue:
                          type: string
                          example: '{{encrypted OTP}}'
                        txnId:
                          type: string
                          example: '{{transactionId}}'
                      required :
                        - otpValue
                        - txnId
                  required :
                    - authMethods
                    - otp
                scope:
                  type: array
                  items:
                    type: string
                    example: mobile-verify
                  example:
                    - mobile-verify
              required :
                - authData
                - scope
            examples:
              Verify AADHAAR Otp - Link-DeLink:
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      otpValue: '{{encrypted OTP}}'
                      txnId: '{{transactionId}}'
                  scope:
                    - abha-login
                    - aadhaar-verify
              Verify ABHA Otp - Link-DeLink:
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      otpValue: '{{encrypted OTP}}'
                      txnId: '{{transactionId}}'
                  scope:
                    - abha-login
                    - mobile-verify
              Verify Otp - Update Email:
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      otpValue: '{{encrypted OTP}}'
                      txnId: '{{transactionId}}'
                  scope:
                    - abha-address-profile
                    - email-verify
              Verify Otp - Update Mobile:
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      otpValue: '{{encrypted OTP}}'
                      txnId: '{{transactionId}}'
                  scope:
                    - mobile-verify
        description : Below is the Request Body description<br><br>
         <b> Note:</b> Mandatory fields can't be null.
         <ol>
            <li>
