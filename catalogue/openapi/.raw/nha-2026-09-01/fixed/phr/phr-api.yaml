  /abha/api/v3/phr/app/login/profile/link:
    post:
      tags:
        - Profile API Collection
      summary: Link Request
      description: API endpoint is used to link an ABHA (Ayushman Bharat Health Account) address to an ABHA number. This linking process is crucial for the following reasons.
       <ol>
            <li>
            <p><strong>Unified Health Records:</strong>By linking the ABHA address to the ABHA number, users can ensure that all their health records are unified under a single identifier. This makes it easier to access and manage health information.</p>
            </li>
            <li>
            <p><strong>Enhanced Security:</strong>Linking the ABHA address to the ABHA number adds an extra layer of security, ensuring that only authorized users can access sensitive health information.</p>
            </li>
            <li>
            <p><strong>Streamlined Access:</strong> With the ABHA address linked to the ABHA number, users can seamlessly access their health records across different healthcare providers and platforms, improving the efficiency of healthcare services.</p>
            </li>
             <li>
            <p><strong>Improved Healthcare Coordination:</strong>  Healthcare providers can better coordinate care by having access to a comprehensive view of a patient’s health history, leading to more informed decision-making and better patient outcomes.</p>
            </li>
             <li>
            <p><strong>Compliance with National Health Policies:</strong>  This linking process aligns with national health policies and standards, promoting interoperability and standardization in the healthcare ecosystem.</p>
            </li>
            </ol>
      operationId: linkRequest
      parameters:
        - name: X-token
          description: >-
            Token identifying the logged-in ABHA user. For child ABHA creation this is the X-token of
            the parent user, obtained after login
          in: header
          required: true
          schema:
            type: string
            example: >-
              {{jwt-token}}
        - name: REQUEST-ID
          description: >-
            Unique UUID to track the end to end request transaction
          in: header
          required: true
          schema:
            type: string
            example: 'e906de88-7e4e-465f-9744-f246a5c96b5b'
        - name: TIMESTAMP
          description: >-
            Actual time the request was initiated, ISO 8601 date-time: year, month, day, hour, minutes,
            seconds and milliseconds, e.g. 2024-09-03T11:20:51.456Z
          in: header
          required: true
          schema:
            type: string
            example: '2024-09-03T11:20:51.456Z'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: >-
                    Link or de-link action to be performed.
                  example: LINK
                transactionId:
                  type: string
                  example: '{{ transactionId}}'
              required :
                - action
                - transactionId
            examples:
              Link Request:
                value:
                  action: LINK
                  transactionId: '{{transactionId}}'
        description :
          Below is the Request Body description<br><br>
          <b>Note:</b> Mandatory fields can't be null.
          <ol>
          <li>
          <p><strong>action (required):</strong></p>
          <ul>
          <li><strong>Description:</strong> Specifies the action to be performed.</li>
          <li><strong>Example:</strong> <code>LINK</code></li>
          </ul>
          </li>
          <li>
          <p><strong>txnId (required):</strong></p>
          <ul>
          <li><strong>Description:</strong> The transaction ID associated with the OTP request.</li>
          <li><strong>Example:</strong> <code>{{transactionId}}</code></li>
          </ul>
          </li>
          </ol>

      responses:
        '200':
          description: The 200 response code indicates a successful request. In this context, it refers to the successful generation and processing of a link request for various services. This includes operations such as generating a link for a specific service or operation, ensuring that the request has been processed correctly and the link has been created as intended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authResult:
                    type: string
                    example: success
                  message:
                    type: string
                    example: ABHA number is securely linked to ABHA address
              examples:
                Link Request:
                  value:
                    authResult: success
                    message: ABHA number is securely linked to ABHA address
        '400':
          description: >-
            The 400 response code indicates a bad request. In this context, it refers to various errors encountered during the link request process due to invalid or missing input.
