          description: >-
            The 200 response code indicates a successful request. In this context, it refers to the successful generation and delivery of an OTP (One-Time Password) for various services.<br><br>
            <p><strong>Types of OTP Response:</strong></p>
            <ol>
            <li><strong>OTP Response - Mobile:</strong> This response indicates that an OTP has been successfully generated and sent to a mobile number for purposes such as logging into an account, completing a transaction, or verifying identity.</li>
            </ol>
            <ol start="2">
            <li><strong>OTP Response - ABHA Address Mobile:</strong> This response indicates that an OTP has been successfully generated and sent to a mobile number for purposes related to ABHA (Ayushman Bharat Health Account) address verification.</li>
            </ol>
            <ol start="3">
            <li><strong>OTP Response - AADHAAR OTP:</strong> This response indicates that an OTP has been successfully generated and sent for authentication or verification purposes related to AADHAAR, the unique identification number issued by the Indian government.</li>
            </ol>
            <ol start="4">
            <li><strong>OTP Response - Email:</strong> This response indicates that an OTP has been successfully generated and sent to an email address for purposes such as logging into an account, completing a transaction, or verifying identity.</li>
            </ol>
            <ol start="5">
            <li><strong>OTP Response - ABHA Address Email:</strong> This response indicates that an OTP has been successfully generated and sent to an email address for purposes related to ABHA (Ayushman Bharat Health Account) address verification.</li>
            </ol>
            <ol start="6">
            <li><strong>OTP Response - ABHA OTP:</strong> This response indicates that an OTP has been successfully generated and sent for authentication or verification purposes related to ABHA (Ayushman Bharat Health Account).</li>
            </ol>
            <ol start="7">
            <li><strong>TXN Response - AADHAR-FACE-VERIFY:</strong> This response will send transaction Id to verify the user using generate Transaction Id along with face Id to ABHA (Ayushman Bharat Health Account).</li>
            </ol>
