  /abha/api/v3/phr/app/login/request/otp:
    post:
      tags:
        - Login API Collection
      summary: OTP Request
      description: API is designed to facilitate secure user authentication by sending a One-Time Password (OTP) to the user’s registered contact method. This ensures that only authorized users can access their accounts or perform sensitive actions. The API supports multiple scenario for sending OTP. In below there is a example of multiple scenario.<br>
        <br>**Example of OTP Request**<br>
        <br>Example1:<br>
       **ABHA ADDRESS Email OTP:** Sends an OTP to the user’s registered email address associated with their ABHA address.<br>
       <br>Example2:<br>
       **ABHA ADDRESS Mobile OTP:** Sends an OTP to the mobile number linked to the user’s ABHA number.<br>
         <br>Example3:<br>
         **AADHAAR OTP:** Sends an OTP to the mobile number linked to the user’s Aadhaar number.<br>
       <br>Example4:<br>
       **ABHA OTP:** Sends an OTP to the mobile number linked to the user’s ABHA number.<br>
       <br>Example5:<br>
       **Email OTP:** Sends an OTP to the user’s registered email address.<br>
       <br>Example6:<br>
       **Mobile OTP:** Sends an OTP to the user’s registered mobile number.<br><br>Note:<br>**1. OTP will be valid for 10 minute only**
       <br>
        <br>Example7:<br>
       **AADHAR FACE VERIFY:** FACE authentication request successfully sent.<br><br>
       <br><br>
         <!--<table>
       <thead>
       <tr>
       <th>Attributes
       <th>Description
       </tr>
       </thead>
       <tbody>
       <tr>
       <td>loginHint <sup> * required</td>
       <td>AbhaAddress Email,Abhaaddress Mobile,Aadhaar OTP,Abha OTP,Email And Mobile</td>
       </tr>
        <tr>
       <td>loginId <sup>* required </sup></td>
       <td>encrypted mobile-number</td>
       </tr>
        <tr>
       <td>otpSystem <sup>* required</td>
       <td>abdm/aadhaar</td>
       </tr>
        <tr>
       <td>scope <sup>* required</td>
       <td>AbhaAddress Email/Abhaaddress Mobile/Aadhaar OTP/Abha OTP/Email/Mobile</aadhar-face-verify/td>
       </tr>
       </tbody>
       </table> -->
      operationId: otpRequestMobileLogin
      parameters:
        - name: REQUEST-ID
          description: >-
            Unique UUID to track the end to end request transaction
          in: header
          required: true
          schema:
            type: string
            example: 'e906de88-7e4e-465f-9744-f246a5c96b5b'
        - name: TIMESTAMP
          description: >-
            Actual time the request was initiated, ISO 8601 date-time: year, month, day, hour, minutes,
            seconds and milliseconds, e.g. 2024-09-03T11:20:51.456Z
          in: header
          required: true
          schema:
            type: string
            example: '2024-09-03T11:20:51.456Z'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                loginHint:
                  type: string
                  description: >-
                    The registration or login method being used.
                  example: abha-number
                loginId:
                  type: string
                  description: >-
                    Encrypted login id, which can be a mobile number, ABHA number or ABHA address.
                  example: '{{encrypted abha-number}}'
                otpSystem:
                  type: string
                  description: >-
                    The system used to deliver and verify the OTP.
                  example: abdm
                scope:
                  type: array
                  items:
                    type: string
                    example: abha-login
                  example:
                    - abha-login
                    - mobile-verify
              required:
                - scope
                - loginId
                - loginHint
                - otpSystem
            examples:
              OTP Request - ABHA ADDRESS Email:
                value:
                  loginHint: abha-address-login
                  loginId: '{{encrypted abha-address}}'
                  otpSystem: abdm
                  scope:
                    - abha-address-login
                    - email-verify
              OTP Request - ABHA ADDRESS Mobile:
                value:
                  loginHint: abha-address
                  loginId: '{{encrypted abha-address}}'
                  otpSystem: abdm
                  scope:
                    - abha-address-login
                    - mobile-verify
              OTP Request - AADHAAR OTP:
                value:
                  loginHint: abha-number
                  loginId: '{{encrypted abha-number}}'
                  otpSystem: aadhaar
                  scope:
                    - abha-login
                    - aadhaar-verify
              Transaction Request - Aadhaar-Face-Verify :
                value:
                  loginHint: abha-number
                  loginId: '{{encrypted abha-number}}'
                  otpSystem: aadhaar
                  scope:
                    - abha-login
                    - aadhaar-face-verify
              OTP Request - ABHA OTP:
                value:
                  loginHint: abha-number
                  loginId: '{{encrypted abha-number}}'
                  otpSystem: abdm
                  scope:
                    - abha-login
                    - mobile-verify
              OTP Request - Email:
                value:
                  loginHint: email
                  loginId: '{{encrypted email}}'
                  otpSystem: abdm
                  scope:
                    - abha-address-login
                    - email-verify
              OTP Request - Mobile:
                value:
                  loginHint: mobile-number
                  loginId: '{{encrypted mobile-number}}'
                  otpSystem: abdm
                  scope:
                    - abha-address-login
                    - mobile-verify
        description : <b>Below is the Request Body description:</b><br><br>
         <b>Note:</b> Mandatory fields can't be null.
         <ol>
          <li>
          <p><strong>scope</strong> (required):</p>
          <ul>
          <li><strong>Description:</strong> Specifies the scope of the OTP request.</li>
          <li><strong>Example:</strong> <code>["abha-login", "mobile-verify"]</code></li>
          <li><strong>Possible Values:</strong> <code>abha-login</code>, <code>mobile-verify</code>, <code>aadhaar-verify</code>, <code>email-verify</code>,<code>abha-address-login</code>,<code>aadhaar-face-verify</code>etc.</li>
          </ul>
          </li>
          <li>
          <p><strong>loginHint</strong> (required):</p>
          <ul>
          <li><strong>Description:</strong> Indicates the type of identifier being used for the OTP request.</li>
          <li><strong>Example:</strong> <code>abha-number</code></li>
          <li><strong>Possible Values:</strong><code>abha-number</code>,<code>mobile-number</code>, <code>email</code>,  <code>abha-address</code></li>
          </ul>
          </li>
          <li>
          <p><strong>loginId</strong> (required):</p>
          <ul>
          <li><strong>Description:</strong> The encrypted identifier (Aadhaar Number, ABHA Number, or Mobile Number) for which the OTP is being requested.</li>
          <li><strong>Example:</strong> <code>{{encrypted abha number}}</code>,<code>{{encrypted abha-address}}</code>,<code>{{encrypted email}}</code></li>
          </ul>
          </li>
          <li>
          <p><strong>otpSystem</strong> (required):</p>
          <ul>
