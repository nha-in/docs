              <ol>
                <li>
                  <p><strong>Link Request - Invalid Transaction Id:</strong> This error occurs when the transaction ID provided for the link request is invalid.</p>
                </li>
              </ol>
              <ol start="2">
                <li>
                  <p><strong>Link Request - Blank Transaction Id:</strong> This error occurs when the transaction ID provided for the link request is blank or missing.</p>
                </li>
              </ol>
              <ol start="3">
                <li>
