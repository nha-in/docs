                properties:
                  message:
                    type: string
                    example: You have been logged out
                  timestamp:
                    type: string
                    description: >-
                      The actual UTC time when the request was initiated, ISO 8601 date-time format.
                    example: '2023-07-27T13:36:28.000Z'
              examples:
