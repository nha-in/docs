  /abha/api/v3/phr/app/login/profile/switch-profile:
    get:
      tags:
        - Profile API Collection
      summary: Switch Profile
      description: API endpoint is used to switch the profile for a given ABHA (Ayushman Bharat Health Account) address using the provided JWT token. This functionality is essential for the following reasons.
       <ol>
            <li>
            <p><strong>User Flexibility:</strong> Allows users to switch between different profiles associated with their ABHA address, providing flexibility in managing multiple health accounts.</p>
            </li>
            <li>
            <p><strong>Seamless Access:</strong> Enables seamless access to different profiles without the need to log out and log back in, enhancing user experience.</p>
            </li>
            <li>
            <p><strong>Efficient Management:</strong> Facilitates efficient management of health records by allowing users to quickly switch profiles and access the necessary information.</p>
            </li>
             <li>
            <p><strong>Security:</strong> Ensures secure access to different profiles through the use of JWT tokens, maintaining the integrity and confidentiality of health data.</p>
            </li>
             <li>
            <p><strong>Compliance:</strong> Aligns with health data management policies by providing a standardized method for profile switching, promoting interoperability and standardization in the healthcare ecosystem.</p>
            </li>
            </ol>
      operationId: switchProfile
      parameters:
        - name: X-token
          description: >-
            Token identifying the logged-in ABHA user. For child ABHA creation this is the X-token of
            the parent user, obtained after login
          in: header
          required: true
