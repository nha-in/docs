        '400':
          description: >-
           The 400 response code indicates a bad request. In this context, it refers to various errors encountered during the OTP (One-Time Password) verification process.<br><br>
              <ol>
              <li>
              <p><strong>OTP Verify - Invalid Transaction Id:</strong> This error occurs when the transaction ID provided for OTP verification is invalid.</p>
              </li>
              </ol>
              <ol start="2">
              <li>
              <p><strong>OTP Verify - Invalid OTP:</strong> This error occurs when the OTP provided for verification is invalid.</p>
              </li>
              </ol>
              <ol start="3">
              <li>
              <p><strong>OTP Verify - Invalid Scope:</strong> This error occurs when the scope of the OTP verification request is invalid.</p>
              </li>
              </ol>
              <ol start="4">
              <li>
              <p><strong>OTP Verify - AADHAAR OTP - Invalid Transaction Id:</strong> This error occurs when the transaction ID provided for AADHAAR OTP verification is invalid.</p>
              </li>
              </ol>
              <ol start="5">
              <li>
              <p><strong>OTP Verify - AADHAAR OTP - Invalid OTP Request:</strong> This error occurs when the OTP request for AADHAAR verification is invalid.</p>
              </li>
              </ol>
              <ol start="6">
              <li>
              <p><strong>OTP Verify - AADHAAR OTP - Invalid Auth Methods:</strong> This error occurs when the authentication methods used for AADHAAR OTP verification are invalid.</p>
              </li>
              </ol>
              <ol start="7">
              <li>
              <p><strong>OTP Verify - AADHAAR OTP - Invalid Scope:</strong> This error occurs when the scope of the AADHAAR OTP verification request is invalid.</p>
              </li>
              </ol>
              <ol start="8">
              <li>
              <p><strong>OTP Verify - ABHA OTP - Invalid Transaction Id:</strong> This error occurs when the transaction ID provided for ABHA OTP verification is invalid.</p>
              </li>
              </ol>
              <ol start="9">
              <li>
              <p><strong>OTP Verify - ABHA OTP - Invalid OTP Request:</strong> This error occurs when the OTP request for ABHA verification is invalid.</p>
              </li>
              </ol>
              <ol start="10">
              <li>
              <p><strong>OTP Verify - ABHA OTP - Invalid Auth Methods:</strong> This error occurs when the authentication methods used for ABHA OTP verification are invalid.</p>
              </li>
              </ol>
              <ol start=11>
              <li>
              <p><strong>OTP Verify - ABHA OTP - Invalid Scope:</strong> This error occurs when the scope of the ABHA OTP verification request is invalid.</p>
              </li>
              </ol>
