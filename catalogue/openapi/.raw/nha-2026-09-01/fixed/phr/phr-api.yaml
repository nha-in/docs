  /abha/api/v3/phr/app/login/profile/request/logout:
    get:
      tags:
        - Profile API Collection
      summary: Logout
      description: This API endpoint is used to log out the current session of a user. It ensures that the user’s session is securely terminated, preventing unauthorized access and maintaining the security of the application.
       <br><br>**Uses**<br>
          <ol>
              <li>
              <p><strong>Session Termination:</strong> Ends the user’s current session, ensuring that no further actions can be taken without re-authentication.</p>
              </li>
              <li>
              <p><strong>Security:</strong> Enhances security by preventing unauthorized access to the user’s account after logout.</p>
              </li>
              <li>
              <p><strong>User Control:</strong> Provides users with control over their sessions, allowing them to log out when needed.</p>
              </li>
               <li>
              <p><strong>Resource Management:</strong> Frees up server resources by terminating inactive or unwanted sessions.</p>
              </li>
              </ol>
      operationId: logout

      parameters:
        - name: X-token
          description: >-
            Token identifying the logged-in ABHA user. For child ABHA creation this is the X-token of
            the parent user, obtained after login
          in: header
          required: true
          schema:
            type: string
            example: >-
              {{jwt-token}}
        - name: REQUEST-ID
