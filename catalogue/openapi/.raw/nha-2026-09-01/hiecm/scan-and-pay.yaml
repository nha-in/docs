openapi: 3.0.2
info:
  title: HIE-CM Scan And Pay
  version: "3.0"
servers:
- url: https://dev.abdm.gov.in
  description: Sandbox Server URL
- url: https://apis.abdm.gov.in
  description: Production Server URL
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apikeyAuth:
      type: http
      scheme: apikey
    noauthAuth:
      type: http
      scheme: noauth
    basicAuth:
      type: http
      scheme: basic
paths:
  <callback_url>/v3/patient/share/open-order:
    post:
      tags:
      - abdm-scan-pay-hip
      operationId: patient-share 1
      summary: >-
        This is an API is called by HIU to check the status of reports.
      description: >-
        This is an API is called by HIU to check the status of reports. <ol type='1'> <li> <b>Header</b>  <ol type='a'> <br/> <li>Authorization will be provided by the gateway session API after the successful verification of client ID and Secret [ Example: Bearer eyJhbGciOiJSUzUxMiJ9.eyJzdWIiOiJ2YXNhbnRoYWt1bWFyLmtlc2F2 ]</li><li>REQUEST-ID unique UUID[ Example: 18235d89-cb13-479d-ad71-7a57d5f669a8 ]</li> <li>TIMESTAMP  actual time of the requested was initiated[ Example: 2022-10-06T10:10:00.587Z ]</li> <li>X-HIP-ID [ Example: HIP id ]</li> </ol> </li> <br/> <li> <b>Request Body</b> <ol type='a'><br/> <li>intent This is a key value pair  which contains the purpose [ Example: type: OPEN_PAYMENT_ORDER ]</li> <li>metaData This is a key value pair which contains  hipId and counterId[ Example: { hipId: IN3810000008 counterId:12123 } ]</li> <li>profile which contains user details</li> </ol> </ol>
      security:
      - bearerAuth: []
      parameters:
      - name: REQUEST-ID
        in: header
        required: true
        schema:
          type: string
        example: '18235d89-cb13-479d-ad71-7a57d5f669a8'
        description: Unique UUID for track the end to end request transaction
      - name: TIMESTAMP
        in: header
        required: true
        schema:
          type: string
        example: '2022-10-06T15:10:00.587Z'
        description: >-
          Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds.
      - name: X-HIP-ID
        in: header
        required: true
        description: >-
          Identifier of the health information provider to which the request was intended
        schema:
          type: string
          format: string
          minimum: 1
          maximum: 100
          example: IN2810014366

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - intent
              - metaData
              - profile
              properties:
                intent:
                  type: string
                  nullable: false
                  example: OPEN_PAYMENT_ORDER
                  description: The intention of share API call
                metaData:
                  type: object
                  nullable: false
                  required:
                  - hipId
                  - counterId
                  properties:
                    hipId:
                      type: string
                      nullable: false
                      example: HIP_1
                      description: The service ID of the health information provider
                    counterId:
                      type: number
                      nullable: false
                      example: 1
                      description: it describes the counterId.
                profile:
                  type: object
                  nullable: true
                  required:
                  - patient
                  description: This should populated only for PAYMENT_SHARE
                  properties:
                    patient:
                      type: object
                      required:
                      - abhaNumber
                      - abhaAddress
                      - name
                      - gender
                      - yearOfBirth
                      - address
                      - phoneNUmber
                      properties:
                        abhaNumber:
                          type: string
                          nullable: true
                          example: 91-7507-xxxx-xxxx
                          description: >-
                            The abha number of the patient. Should be only 14 digit
                        abhaAddress:
                          type: string
                          nullable: false
                          example: abc@sbx
                          description: >-
                            The abha address of the patient. Should start with Alphanumeric . and  _  in the middle and must be ending with @abdm or @sbx
                        name:
                          type: string
                          nullable: false
                          example: name
                          description: >-
                            The name of the patient. Only alphabets.
                        gender:
                          type: string
                          enum:
                          - M
                          - F
                          - O
                          - D
                          nullable: false
                          example: M
                          description: The gender of the patient
                        dayOfBirth:
                          type: string
                          format: number
                          nullable: true
                          example: string
                          description: >-
                            The day of birth of the patient. Only allows numeric values between 1 abd 31
                        monthOfBirth:
                          type: string
                          format: number
                          nullable: false
                          example: string
                          description: >-
                            The month of birth of the patient. Only allows numeric values between 1 abd 12
                        yearOfBirth:
                          type: string
                          format: number
                          nullable: false
                          example: string
                          description: >-
                            The month of birth of the patient. Only allows numeric values and must be 4 digit ranging between 1900 and 2200
                        address:
                          type: object
                          nullable: false
                          required:
                          - line
                          properties:
                            line:
                              type: string
                              nullable: true
                              example: Address line 1
                              description: The address line
                            district:
                              type: string
                              nullable: true
                              example: XXXXXXX
                              description: The district and should only contain alphabets
                            state:
                              type: string
                              nullable: false
                              example: XXXXXX
                              description: The state and should only contain alphabets
                            pincode:
                              type: string
                              nullable: false
                              example: XXXXXX
                              description: Should be 5 digits and only contain numbers
                        phoneNumber:
                          type: string
                          nullable: false
                          example: 987654xxxx
                          description: >-
                            The mobile number of the patient. Must be 10 digit and contain only 0-9
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                        example: "ABDM-2500: "
                      message:
                        type: string
                        example: Unknown error occurred
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    nullable: false
                    example: "ABDM-2500: "
                  message:
                    type: string
                    nullable: false
                    example: Service Unavailable
  /api/hiecm/scan-gateway/v3/patient/on-share/open-order:
    post:
      tags:
      - abdm-scan-pay-hip
      operationId: scan-gateway 2
      summary: >-
        This is an API called by HIP to HIE-CM to send all the open order for patient.
      description: >-
        This API will be invoked by the <b>HIP</b> to share the response of HIECM's /hiecm/api/v3/scan-gateway/patient/on-share/open API.  <ol type='1'>
          <li>
            <b>Header</b>  
            <ol type='a'>
              <li>AUTHORIZATION will be provided by the gateway session API after the successful verification of client ID and Secret [ Example: Bearer eyJhbGciOiJSUzUxMiJ9.eyJzdWIiOiJ2YXNhbnRoYWt1bWFyLmtlc2F2 ]</li>
              <li>REQUEST-ID unique UUID[ Example: 18235d89-cb13-479d-ad71-7a57d5f669a8 ]</li> 
              <li>TIMESTAMP  actual time of the requested was initiated[ Example: 2022-10-06T10:10:00.587Z ]</li>
              <li>X-CM-ID consent manager ID [ Example: sbx ]</li>
            </ol>
          </li>
          <li>
            <b>Request Body</b>
            <ol type='a'>
              <li>intent This is a key value pair which contains the purpose [ Example: type: OPEN_PAYMENT_ORDER ]</li>
              <li>Abha address of the user.</li>
              <li>PatientUid of the user.</li>
              <li>error is optional object in case of any error or Failure then only send error object</li>
              <li>procedures which contains the list of open order</li>
              <li>response which contains the requestId [ Example: requestId: 059fcb69-8ad8-4789-a049-62db16c7b5a0 ]</li>
            </ol>
          </li>
        </ol>

      security:
      - bearerAuth: []
      parameters:
      - name: REQUEST-ID
        in: header
        required: true
        schema:
          type: string
        example: '18235d89-cb13-479d-ad71-7a57d5f669a8'
        description: Unique UUID for track the end to end request transaction
      - name: TIMESTAMP
        in: header
        required: true
        schema:
          type: string
        example: '2022-10-06T15:10:00.587Z'
        description: >-
          Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds.
      - name: X-CM-ID
        in: header
        required: true
        description: Suffix of the consent manager to which the request was intended
        schema:
          type: string
          format: string
          minimum: 1
          maximum: 100
          example: sbx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                required:
                - intent
                - abhaAddress
                - patientUid
                - procedures
                - response
                properties:
                  intent:
                    type: string
                    nullable: false
                    example: OPEN_PAYMENT_ORDER
                    description: The intention of share API call
                  abhaAddress:
                    type: string
                    example: "abc@sbx"
                    nullable: false
                    description: The abha address of the patient. Should start with Alphanumeric . and _ in the middle and must be ending with @abdm or @sbx
                  patientUid:
                    type: string
                    example: "string"
                    nullable: false
                    description: Patient UId(unique ID).
                  procedures:
                    type: array
                    items:
                      type: object
                      required:
                      - category
                      - services
                      properties:
                        category:
                          type: string
                          description: The category of the procedure
                          example: OPD consultation
                        services:
                          type: array
                          items:
                            type: object
                            required:
                            - name
                            - amount
                            properties:
                              serviceId:
                                type: string
                                description: Unique identifier for the service
                                example: "service-12345"
                              name:
                                type: string
                                description: Name of the service
                                example: consultation
                              description:
                                type: string
                                description: Description of the service
                                example: Albumin 24 hrs Urine
                              amount:
                                type: number
                                format: double
                                description: Amount for the service
                                example: 629.12
                    example:
                    - category: "OPD consultation"
                      services:
                      - name: "consultation"
                        serviceId: "service-12345"
                        description: "Albumin 24 hrs Urine"
                        amount: 629.12
                    - category: "Laboratory and Diagnostics"
                      services:
                      - name: "Diagnostics"
                        serviceId: "service-12345"
                        description: "Albumin 24 hrs Urine"
                        amount: 629.12
                    - category: "Pharmacy"
                      services:
                      - name: "Pharmacy"
                        serviceId: "service-12345"
                        description: "Albumin 24 hrs Urine"
                        amount: 629.12
                    - category: "Miscellaneous/Other"
                      services:
                      - name: "Miscellaneous"
                        serviceId: "service-12345"
                        description: "Albumin 24 hrs Urine"
                        amount: 629.12
                  response:
                    type: object
                    nullable: false
                    required:
                    - requestId
                    properties:
                      requestId:
                        type: string
                        nullable: false
                        example: "6c3d4e5c-09d1-****-817b-a0c82d130c53"
                    description: >-
                      This is the response request-id which is generated from the share API
              - type: object
                description: In case of any error or FAIL then only send error object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: 1000
                      message:
                        type: string
                        example: string
                  response:
                    type: object
                    nullable: false
                    required:
                    - requestId
                    properties:
                      requestId:
                        type: string
                        nullable: false
                        example: "6c3d4e5c-09d1-****-817b-a0c82d130c53"
                    description: >-
                      This is the response request-id which is generated from the share API
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                        example: "ABDM-2500: "
                      message:
                        type: string
                        example: no mapping found to the resp.requestId cache
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "900901"
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: >-
                      Invalid Credentials. Make sure you have provided the correct security credentials
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: Access Denied
        "404":
          description: Not Found
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                        example: "ABDM-2429:"
                      message:
                        type: string
                        example: Too Many Requests found
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                        example: "ABDM-2500: "
                      message:
                        type: string
                        example: Unknown error occurred
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    nullable: false
                    example: "ABDM-2500: "
                  message:
                    type: string
                    nullable: false
                    example: Service Unavailable
  <callback_url>/v3/patient/selection:
    post:
      tags:
      - abdm-scan-pay-hip
      operationId: patient-share 1
      summary: >-
        This is the call back api for the selection API. This API needs to implement by HIP to receive all selected open order .
      description: >-
        This is the call back api for the selection API. This API needs to implement by HIP to receive all selected open order . <ol type='1'> <li> <b>Header</b>  <ol type='a'> <br/> <li>Authorization will be provided by the gateway session API after the successful verification of client ID and Secret [ Example: Bearer eyJhbGciOiJSUzUxMiJ9.eyJzdWIiOiJ2YXNhbnRoYWt1bWFyLmtlc2F2 ]</li><li>REQUEST-ID unique UUID[ Example: 18235d89-cb13-479d-ad71-7a57d5f669a8 ]</li> <li>TIMESTAMP  actual time of the requested was initiated[ Example: 2022-10-06T10:10:00.587Z ]</li> <li>X-HIP-ID  consent manager ID[ Example: sbx ]</li> </ol> </li> <br/>    <li> <b>Request Body</b> <ol type='a'><br/> <li>intent This is a key value pair  which contains the purpose [ Example: type: PAYMENT_ORDER ]</li> <li>openOrderRequestId from the share open order requestId [ Example: 059fcb69-****-4789-a049-62db16c7b5a0 ]</li> <li>abha address of the user</li> <li>Procedures which contains the list of open order</li><li>Payment Bundle : which contains payment detail.</li> </ol></ol>

      security:
      - bearerAuth: []
      parameters:
      - name: REQUEST-ID
        in: header
        required: true
        schema:
          type: string
        example: '18235d89-cb13-479d-ad71-7a57d5f669a8'
        description: Unique UUID for track the end to end request transaction
      - name: TIMESTAMP
        in: header
        required: true
        schema:
          type: string
        example: '2022-10-06T15:10:00.587Z'
        description: >-
          Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds.
      - name: X-HIP-ID
        in: header
        required: true
        description: >-
          Identifier of the health information provider to which the request was intended
        schema:
          type: string
          format: string
          minimum: 1
          maximum: 100
          example: IN2810014366

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - intent
              - openOrderRequestId
              - abhaAddress
              - procedures
              properties:
                intent:
                  type: string
                  nullable: false
                  example: PAYMENT_ORDER
                  description: The intention of share API call
                openOrderRequestId:
                  type: object
                  nullable: false
                  example: "6c3d4e5c-09d1-4ecc-817b-a0c82d130c53"
                  description: >-
                    This is the response request-id which is generated from the share API
                abhaAddress:
                  type: string
                  example: "abc@sbx"
                  nullable: false
                  description: The abha address of the patient. Should start with Alphanumeric . and _ in the middle and must be ending with @abdm or @sbx
                procedures:
                  type: array
                  items:
                    type: object
                    required:
                    - category
                    - services
                    properties:
                      category:
                        type: string
                        description: The category of the procedure
                        example: OPD consultation
                      services:
                        type: array
                        items:
                          type: object
                          required:
                          - name
                          - amount
                          properties:
                            serviceId:
                              type: string
                              description: Unique identifier for the service
                              example: "service-12345"
                            name:
                              type: string
                              description: Name of the service
                              example: consultation
                            description:
                              type: string
                              description: Description of the service
                              example: Albumin 24 hrs Urine
                            amount:
                              type: number
                              format: double
                              description: Amount for the service
                              example: 629.12
                  example:
                  - category: "OPD consultation"
                    services:
                    - name: "consultation"
                      serviceId: "service-12345"
                      description: "Albumin 24 hrs Urine"
                      amount: 629.12
                  - category: "Laboratory and Diagnostics"
                    services:
                    - name: "Diagnostics"
                      serviceId: "service-12346"
                      description: "Albumin 24 hrs Urine"
                      amount: 629.12
                  - category: "Pharmacy"
                    services:
                    - name: "Pharmacy"
                      serviceId: "service-12347"
                      description: "Albumin 24 hrs Urine"
                      amount: 629.12
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                        example: "ABDM-2500: "
                      message:
                        type: string
                        example: Unknown error occurred
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    nullable: false
                    example: "ABDM-2500: "
                  message:
                    type: string
                    nullable: false
                    example: Service Unavailable
  /api/hiecm/scan-gateway/v3/patient/on-selection:
    post:
      tags:
      - abdm-scan-pay-hip
      operationId: scan-gateway 2
      summary: >-
        This is an API is called by HIP to share payment bundle alone with procedures of the patient.
      description: >-
        This is an API is called by HIP to share payment bundle alone with procedures of the patient. The HIP will sent the payment bundle to HIU. <ol type='1'> <li> <b>Header</b>  <ol type='a'> <br/> <li>AUTHORIZATION will be provided by the gateway session API after the successful verification of client ID and Secret [ Example: Bearer eyJhbGciOiJSUzUxMiJ9.eyJzdWIiOiJ2YXNhbnRoYWt1bWFyLmtlc2F2 ]</li><li>REQUEST-ID unique UUID[ Example: 18235d89-cb13-479d-ad71-7a57d5f669a8 ]</li> <li>TIMESTAMP  actual time of the requested was initiated[ Example: 2022-10-06T10:10:00.587Z ]</li> <li>X-CM-ID  consent manager ID[ Example: sbx ]</li> </ol> </li> <br/> <li> <b>Request Body</b> <ol type='a'><br/> <li>intent This is a key value pair  which contains the purpose [ Example: type: PAYMENT_ORDER ]</li> <li>openOrderRequestId from the share open order requestId [ Example: 059fcb69-****-4789-a049-62db16c7b5a0 ]</li> <li>abhaAddress of the user/patient</li> <li>error is optional object in case of any error or Failure then only send error object</li> <li>Procedures which contains the list of open order</li> <li>paymentBundle which contains payments details</li><li>response which contains the requestId [ Example: requestId: 059fcb69-8ad8-4789-a049-62db16c7b5a0 ]</li></ol> </ol>

      security:
      - bearerAuth: []
      parameters:
      - name: REQUEST-ID
        in: header
        required: true
        schema:
          type: string
        example: '18235d89-cb13-479d-ad71-7a57d5f669a8'
        description: Unique UUID for track the end to end request transaction
      - name: TIMESTAMP
        in: header
        required: true
        schema:
          type: string
        example: '2022-10-06T15:10:00.587Z'
        description: >-
          Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds.
      - name: X-CM-ID
        in: header
        required: true
        description: Suffix of the consent manager to which the request was intended
        schema:
          type: string
          format: string
          minimum: 1
          maximum: 100
          example: sbx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                required:
                - intent
                - openOrderRequestId
                - abhaAddress
                - procedures
                - paymentBundle
                - response
                properties:
                  intent:
                    type: string
                    nullable: false
                    example: PAYMENT_ORDER
                    description: The intention of share API call
                  openOrderRequestId:
                    type: object
                    nullable: false
                    example: b767614f-153a-4aa3-946f-1622596f0fab
                    description: >-
                      This is the request-id which is generated from the share/Open Order Request id api
                  abhaAddress:
                    type: string
                    nullable: false
                    example: abha@sbx
                    description: abha address of the user/patient.
                  procedures:
                    type: array
                    items:
                      type: object
                      required:
                      - category
                      - services
                      properties:
                        category:
                          type: string
                          description: The category of the procedure
                          example: OPD consultation
                        services:
                          type: array
                          items:
                            type: object
                            required:
                            - name
                            - amount
                            properties:
                              serviceId:
                                type: string
                                description: Unique identifier for the service
                                example: "service-12345"
                              name:
                                type: string
                                description: Name of the service
                                example: consultation
                              description:
                                type: string
                                description: Description of the service
                                example: Albumin 24 hrs Urine
                              amount:
                                type: number
                                format: double
                                description: Amount for the service
                                example: 629.12
                    example:
                    - category: "OPD consultation"
                      services:
                      - name: "consultation"
                        serviceId: "service-12345"
                        description: "Albumin 24 hrs Urine"
                        amount: 629.12
                    - category: "Laboratory and Diagnostics"
                      services:
                      - name: "Diagnostics"
                        serviceId: "service-12345"
                        description: "Albumin 24 hrs Urine"
                        amount: 629.12
                    - category: "Pharmacy"
                      services:
                      - name: "Pharmacy"
                        serviceId: "service-12345"
                        description: "Albumin 24 hrs Urine"
                        amount: 629.12
                  paymentBundle:
                    type: object
                    nullable: false
                    required:
                    - paymentMode
                    - paymentUrl
                    - orderNumber
                    - amount
                    - merchantId
                    - description
                    properties:
                      paymentMode:
                        type: string
                        nullable: false
                        example: GATEWAY
                        description: >-
                          Specifies the mode of payment. For example, “GATEWAY” indicates that the payment is processed through a payment gateway
                      paymentUrl:
                        type: string
                        nullable: false
                        example: string
