  /on_search:
    post:
      tags:
        - EUA - Consumer Platform
      summary: /on_search (Gateway / HSPA → EUA)
      operationId: uhi_network_on_search
      description: |-
        Sign this request first: [Signing](/docs/uhi/v1/concepts/signing).

        Sends catalog.

        The header X-Gateway-Authorization is sent only by UHI gateway during first onsearch only. 
        The header Authorization is passed by HSPA to EUA during second onsearch and following APIs.
        Both headers are required on respective calls as mentioned above.

        Retry behaviour: not yet published.
      servers:
        - url: https://{consumer_uri}
          description: The EUA's consumer_uri, taken from context.consumer_uri in the request.
          variables:
            consumer_uri:
              default: consumer_uri
      requestBody:
        description: Sends catalog of healtchare services & products as a response to /search
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  $ref: "#/components/schemas/Context"
                message:
                  type: object
                  properties:
                    catalog:
                      $ref: "#/components/schemas/Catalog"
                  required:
                    - catalog
                error:
                  $ref: "#/components/schemas/Error"
              required:
                - context
