  /api/v1/networkregistry/lookup:
    post:
      tags:
        - UHI-Network Registry
      summary: lookup
      operationId: uhi_network_registry_lookup
      description: |-
        Sign this request first: [Signing](/docs/uhi/v1/concepts/signing).

        The network participant will trigger the subscribe call to the registry to register its public key.

        The header Authorization is accepted and verified by the /lookup api. 
        Use your header generation details to generate header and payload should contain details of partner on whom lookup is intended.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: networkParticipant
              required:
                - lookup
            examples:
              network-lookup:
                summary: lookup
                value:
                  subscriber_id: nha.eua
                  type: EUA
                  domain: nic2008:86201
                  country: IND
                  city: std:08752
                  pub_key_id: nha.eua.k1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriberDto"
        "201":
          description: Created
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: No record found!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - schema:
            type: string
          in: header
          name: Authorization
          description: UHI Auth header
          required: true
      x-abdm-title: Look up a network participant
      x-abdm-hosted-by: gateway
      x-abdm-nha-operation-id: gatewayLookupUsingPOST
components:
  schemas:
    Ack:
      title: Ack
      type: object
      properties:
        ack:
          $ref: "#/components/schemas/Ack"
    Agent:
      description: Describes an order executor
      allOf:
        - $ref: "#/components/schemas/Person"
        - $ref: "#/components/schemas/Contact"
        - type: object
    Catalog:
      description: Describes a DHP-Provider catalog
      type: object
      properties:
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        fulfillments:
          type: array
          items:
            $ref: "#/components/schemas/Fulfillment"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/Provider"
        exp:
          type: string
          description: Time after which catalog has to be refreshed
          format: date-time
    Category:
      description: Describes a category
      type: object
      properties:
        id:
          type: string
          description: Unique id of the category
        parent_category_id:
          $ref: "#/components/schemas/Category/properties/id"
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        time:
          $ref: "#/components/schemas/Time"
        tags:
          $ref: "#/components/schemas/Tags"
    City:
      description: Describes a city
      type: object
      properties:
        name:
          type: string
          description: Name of the city
        code:
          type: string
          description: City code
    Contact:
      type: object
      properties:
        phone:
          type: string
        email:
          type: string
        tags:
          $ref: "#/components/schemas/Tags"
    Context:
      description: Describes a DHP message context
      type: object
      properties:
        domain:
          $ref: "#/components/schemas/Domain"
        country:
          $ref: "#/components/schemas/Country/properties/code"
        city:
          $ref: "#/components/schemas/City/properties/code"
        action:
          type: string
          description: Defines the DHP API call. Any actions other than the enumerated actions are not supported by DHP Protocol
          enum:
            - search
            - select
            - init
            - confirm
            - status
            - on_search
            - on_select
            - on_init
            - on_confirm
            - on_confirm_audit
            - on_status
            - on_status_audit
            - on_cancel_audit
        core_version:
          type: string
          description: Version of DHP core API specification being used
        consumer_id:
          type: string
          format: uri
          description: Unique id of the Consumer. By default it is the fully qualified domain name of the Consumer
        consumer_uri:
          type: string
          format: uri
          description: URI of the Consumer for accepting callbacks. Must have the same domain name as the consumer_id
        provider_id:
          type: string
          format: uri
          description: Unique id of the Provider. By default it is the fully qualified domain name of the Provider
        provider_uri:
          type: string
          format: uri
          description: URI of the Provider. Must have the same domain name as the provider_id
        transaction_id:
          type: string
          description: This is a unique value which persists across all API calls from search through confirm
        message_id:
          type: string
          description: This is a unique value which persists during a request / callback cycle
        timestamp:
          type: string
          format: date-time
          description: Time of request generation in RFC3339 format
        key:
          type: string
          description: The encryption public key of the sender
        ttl:
          type: string
          description: The duration in ISO8601 format after timestamp for which this message holds valid
      required:
        - domain
        - action
        - country
        - city
        - core_version
        - transaction_id
        - message_id
        - consumer_id
        - consumer_uri
        - timestamp
    Country:
      description: Describes a country.
      type: object
      properties:
        name:
          type: string
          description: Name of the country
        code:
          type: string
          description: Country code as per ISO 3166-1 and ISO 3166-2 format
    DecimalValue:
      description: Describes a decimal value
      type: string
      pattern: "[+-]?([0-9]*[.])?[0-9]+"
    Descriptor:
      description: Describes the description of a real-world object.
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        symbol:
          type: string
        short_desc:
          type: string
        long_desc:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        audio:
          type: string
          format: uri
        3d_render:
          type: string
          format: uri
    Domain:
      description: Describes the domain of an object
      type: string
    Duration:
      description: Describes duration as per ISO8601 format
      type: string
    Error:
      description: Describes an error object
      type: object
      properties:
        type:
          type: string
        code:
          type: string
          description: DHP specific error code. For full list of error codes, refer to error_codes.md in the root folder of this repo
        path:
          type: string
          description: Path to json schema generating the error. Used only during json schema validation errors
        message:
          type: string
          description: Human readable message describing the error
      required:
        - type
        - code
    Fulfillment:
      description: Describes how a single product/service will be rendered/fulfilled to the end customer
      type: object
      properties:
        id:
          type: string
          description: Unique reference ID to the fulfillment of an order
        type:
          type: string
          description: This describes the type of fulfillment
        provider_id:
          $ref: "#/components/schemas/Provider/properties/id"
        state:
          $ref: "#/components/schemas/State"
        tracking:
          type: boolean
          description: Indicates whether the fulfillment allows tracking
          default: false
        customer:
          type: object
          properties:
            person:
              $ref: "#/components/schemas/Person"
            contact:
              $ref: "#/components/schemas/Contact"
        agent:
          $ref: "#/components/schemas/Agent"
        person:
          $ref: "#/components/schemas/Person"
        contact:
          $ref: "#/components/schemas/Contact"
        start:
          description: Details on the start of fulfillment
          type: object
          properties:
            time:
              $ref: "#/components/schemas/Time"
            instructions:
              $ref: "#/components/schemas/Descriptor"
            contact:
              $ref: "#/components/schemas/Contact"
            person:
              $ref: "#/components/schemas/Person"
        end:
          description: Details on the end of fulfillment
          type: object
          properties:
            time:
              $ref: "#/components/schemas/Time"
            instructions:
              $ref: "#/components/schemas/Descriptor"
            contact:
              $ref: "#/components/schemas/Contact"
            person:
              $ref: "#/components/schemas/Person"
        tags:
          $ref: "#/components/schemas/Tags"
    Image:
      description: Image of an object. <br/><br/> A url based image will look like <br/><br/>```uri:http://path/to/image``` <br/><br/>
      type: string
    Intent:
      description: Intent of a user. Used for searching for services
      type: object
      properties:
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        provider:
          $ref: "#/components/schemas/Provider"
        fulfillment:
          $ref: "#/components/schemas/Fulfillment"
        payment:
          $ref: "#/components/schemas/Payment"
        category:
          $ref: "#/components/schemas/Category"
        item:
          $ref: "#/components/schemas/Item"
        tags:
          $ref: "#/components/schemas/Tags"
    Item:
      description: Describes an item. Allows for domain extension.
      type: object
      properties:
        id:
          description: This is the most unique identifier of a service item. An example of an Item ID could be the SKU of a product.
          type: string
          format: "#/components/schemas/Item/properties/id"
        parent_item_id:
          $ref: "#/components/schemas/Item/properties/id"
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        price:
          $ref: "#/components/schemas/Price"
        category_id:
          $ref: "#/components/schemas/Category/properties/id"
        fulfillment_id:
          $ref: "#/components/schemas/Fulfillment/properties/id"
        time:
          $ref: "#/components/schemas/Time"
        matched:
          type: boolean
        related:
          type: boolean
        recommended:
          type: boolean
        tags:
          $ref: "#/components/schemas/Tags"
    Location:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: object
          properties:
            name:
              type: string
        city:
          type: object
          properties:
            name:
              type: string
            code:
              type: string
        country:
          type: object
          properties:
            name:
              type: string
            code:
              type: string
        gps:
          type: string
        address:
          type: string
        radius:
          type: object
          properties:
            type:
              type: string
            value:
              type: string
            unit:
              type: string
    Name:
      type: string
      description: "Describes the name of a person in format: ./{given_name}/{honorific_prefix}/{first_name}/{middle_name}/{last_name}/{honorific_suffix}"
      pattern: ^\./[^/]+/[^/]*/[^/]*/[^/]*/[^/]*/[^/]*$
    Payment:
      description: Describes a payment
      type: object
      properties:
        uri:
          type: string
          description: A payment target uri to be called by the DHP-Consumer. Supported formats are <br></br>a) https and, <br></br>b) payto - Refer to RFC8905
          format: uri
        tl_method:
          type: string
          enum:
            - https
            - payto
        params:
          type: object
          properties:
            transaction_id:
              type: string
              description: This value will be placed in the the $transaction_id url param in case of http/get and in the requestBody http/post requests
            transaction_status:
              type: string
            amount:
              $ref: "#/components/schemas/Price/properties/value"
            currency:
              $ref: "#/components/schemas/Price/properties/currency"
          additionalProperties:
            type: string
          required:
            - currency
        type:
          type: string
          description: Stage at which the payment is expected
          enum:
            - ON-ORDER
            - PRE-FULFILLMENT
            - ON-FULFILLMENT
            - POST-FULFILLMENT
        status:
          type: string
          enum:
            - PAID
            - NOT-PAID
        time:
          $ref: "#/components/schemas/Time"
    Person:
      description: Describes a person.
      type: object
      properties:
        id:
          type: string
        name:
          $ref: "#/components/schemas/Name"
        image:
          $ref: "#/components/schemas/Image"
        dob:
          type: string
          format: date
        gender:
          type: string
          description: Gender of something, typically a Person, but possibly also fictional characters, animals, etc. While Male and Female may be used, text strings are also acceptable for people who do not identify as a binary gender
        cred:
          type: string
        tags:
          $ref: "#/components/schemas/Tags"
      required:
        - name
    Price:
      description: Describes the price of an item. Allows for domain extension.
      type: object
      properties:
        currency:
          type: string
        value:
          $ref: "#/components/schemas/DecimalValue"
        estimated_value:
          $ref: "#/components/schemas/DecimalValue"
        computed_value:
          $ref: "#/components/schemas/DecimalValue"
        listed_value:
          $ref: "#/components/schemas/DecimalValue"
        offered_value:
          $ref: "#/components/schemas/DecimalValue"
        minimum_value:
          $ref: "#/components/schemas/DecimalValue"
        maximum_value:
          $ref: "#/components/schemas/DecimalValue"
    Provider:
      description: Describes a service provider. This can be a restaurant, a hospital, a Store etc
      type: object
      properties:
        id:
          type: string
          description: Id of the provider
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        category_id:
          type: string
          description: Category Id of the provider
        time:
          $ref: "#/components/schemas/Time"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        fulfillments:
          type: array
          items:
            $ref: "#/components/schemas/Fulfillment"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        location:
          $ref: "#/components/schemas/Location"
        exp:
          type: string
          description: Time after which catalog has to be refreshed
          format: date-time
        tags:
          $ref: "#/components/schemas/Tags"
    Schedule:
      description: Describes a schedule
      type: object
      properties:
        frequency:
          $ref: "#/components/schemas/Duration"
        holidays:
          type: array
          items:
            type: string
            format: date-time
        times:
          type: array
          items:
            type: string
            format: date-time
    State:
      description: Describes a state
      type: object
      properties:
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          description: ID of entity which changed the state
    SubscriberDto:
      type: object
      description: Any entity which wants to authenticate itself on a network. This can be a DHP-Consumer, DHP-Provider, DG.
      title: Subscriber
      properties:
        city:
          type: string
          description: City code
        country:
          type: string
          description: Country code as per ISO 3166-1 and ISO 3166-2 format
        domain:
          type: string
          description: Industry domain of the subscriber.
        encr_public_key:
          type: string
          description: Encryption public key of the dhp_consumer subscriber. Any dhp_provider must encrypt the requestBody.message value of the on_search API using this public key.
        participant_id:
          type: string
          description: A unique ID describing a participant on a network.
        pub_key_id:
          type: string
          description: A unique ID describing  public key uniquely on a network.
        status:
          type: string
          enum:
            - INITIATED
            - SUBSCRIBED
            - UNSUBSCRIBED)
        subscriber_id:
          type: string
          description: Registered domain name of the subscriber. Must have a valid SSL certificate issued by a Certificate Authority of the operating region
        subscriber_url:
          type: string
          description: Callback URL of the subscriber. The Registry will call this URL's on_subscribe API to validate the subscriber's credentials
        type:
          type: string
          enum:
            - consumer
            - provider
            - gateway
        valid_from:
          type: string
          description: Keys valid from
        valid_until:
          type: string
          description: Keys valid until
    Tags:
      description: Describes a tag. This is a simple key-value store which is used to contain read-only metadata
      additionalProperties:
        type: string
    Time:
      description: Describes time in its various forms. It can be a single point in time; duration; or a structured timetable of operations<br> UHI currently follows ISO 8601 without timezone format (2022-07-15T00:00:00)
      type: object
      properties:
        label:
          type: string
        timestamp:
          type: string
          format: date-time
        duration:
          $ref: "#/components/schemas/Duration"
        range:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        days:
          type: string
          description: comma separated values representing days of the week
        schedule:
          $ref: "#/components/schemas/Schedule"
