openapi: 3.1.1
info:
  x-portal:
    module: consultation
    label: Physical Consultation
    position: 2
    icon: stethoscope
  title: UHI Physical Consultation
  summary: Book, fulfil and cancel a physical consultation, directly between EUA and HSPA after discovery.
  description: |-
    **Domain:** `nic2004:85111` (the `/select` example uses `nic2004:85110`)<br>
    **fulfillment.type:** `Online` (Teleconsultation), `Physical` (Physical Consultation)<br>
    **Coverage:** full lifecycle. search (1st via gateway, 2nd peer-to-peer for slots), select, init, confirm, status, update (both directions), cancel, message, and gateway audit copies.<br>
    **Search filters:** specialty `category.descriptor.code`; doctor name `fulfillment.agent.name`; facility `provider.descriptor.name`; HPR address `fulfillment.agent.id`; Physical only: GPS + radius, pincode `address.area_code`, state + district.<br>
    **Tele vs Physical:** Tele uses `PRE-ORDER` payment and a teleconsultation URI tag; Physical uses `ON-ORDER`/`FREE` payment and an `authorization` PIN (`GENERATED` then `VERIFIED` / `HSPAOVERRIDE`).
  version: 2.0.2
  contact:
    name: National Health Authority India
  x-abdm-gateway: uhi
  x-abdm-module: consultation
  x-abdm-phase: 1
  x-abdm-roles:
    - eua
    - hspa
x-abdm-sources:
  - file: catalogue/openapi/.raw/nha-2026-09-28-uhi/gateway/UHI Documentation Requirements.yaml
    role: upstream
    hash: sha256:af065b1acc1032286c5b10ba43a39c048bfd8ce8afe1017b92e11b783a43d158
    fetched: "2026-09-28"
  - file: catalogue/openapi/.raw/nha-2026-09-28-uhi/gateway/UHI Gateway Service.yaml
    role: upstream
    hash: sha256:a04a7a18f19f9fb448f747d84b19aa10908b9118ac32a4bf84cf330440984d47
    fetched: "2026-09-28"
servers:
  - url: https://uhigatewaysandbox.abdm.gov.in
    description: Sandbox
  - url: https://uhigateway.abdm.gov.in
    description: Production
  - url: https://uhigatewaybeta.abdm.gov.in
    description: Beta. Use it only when NHA asks you to.
tags:
  - name: HSPA - Provider Platform
  - name: EUA - Consumer Platform
  - name: UHI - Gateway
paths:
  /select:
    post:
      tags:
        - HSPA - Provider Platform
      summary: /select (EUA → HSPA)
      operationId: uhi_consultation_select
      description: |-
        Sign this request first: [Signing](/docs/uhi/v1/concepts/signing).

        Select items from the catalog and build your order <br> <b><i>*Currently not being used for doctor search will be used in vaccination search</i></b>
      servers: &a1
        - url: https://{provider_uri}
          description: The HSPA's provider_uri, taken from context.provider_uri in its on_search.
          variables:
            provider_uri:
              default: provider_uri
      requestBody:
        description: Selection of various products/services as part of order
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  $ref: "#/components/schemas/Context"
                message:
                  type: object
                  properties:
                    order:
                      type: object
                      properties:
                        provider:
                          type: object
                          properties:
                            id:
                              $ref: "#/components/schemas/Provider/properties/id"
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                $ref: "#/components/schemas/Item/properties/id"
                              quantity:
                                $ref: "#/components/schemas/ItemQuantity/properties/selected"
                              fulfillment_id:
                                $ref: "#/components/schemas/Fulfillment/properties/id"
                            required:
                              - id
                  required:
                    - order
              required:
                - context
                - message
            examples:
              consultation-patient-requests-a-quote-for-booking-a-consultation-slot-in:
                summary: Patient requests a quote for booking a consultation slot in a given doctor’s schedule
                value:
                  context:
                    domain: nic2004:85110
                    country: IND
                    city: std:011
                    action: select
                    core_version: 0.7.1
                    message_id: 85a422c4-2867-4d72-b5f5-d31588e2f7c5
                    timestamp: "2021-03-23T10:00:40.065Z"
                  message:
                    order:
                      provider:
                        id: "1"
                      items:
                        - id: "1"
                          fulfillment_id: "2"
      responses:
        "200":
          description: Acknowledgement of message received
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      ack:
                        $ref: "#/components/schemas/Ack"
                    required:
                      - ack
                  error:
                    $ref: "#/components/schemas/Error"
                required:
                  - message
      parameters:
        - schema:
            type: string
          in: header
          name: Authorization
          description: UHI Auth header
          required: true
      x-abdm-title: Select items and build an order
      x-abdm-hosted-by: hspa
      x-abdm-answered-by: uhi_consultation_on_select
