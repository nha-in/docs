paths:
  /v1/status:
    post:
      operationId: status_v1_status
      x-abdm-atom: nhcx.endpoint.status
      x-abdm-use-case: Status and search
      tags:
        - Status and search
      summary: Status check
      description: |-
        Sender asks NHCX where its own in-flight request stands; the gateway answers request.queued or request.dispatched, and only dispatched yields a callback.

        ### Business purpose

        Asynchronous exchanges lose messages, stall in queues and outlive the shift of the desk operator who started them. The Status API exists so the original sender can find out which side of the exchange is holding a request without resubmitting it and creating a duplicate. It answers the hospital desk's most common question, where is my preauth, by telling it whether the gateway has forwarded the request to the payer at all. Providers, payers and TPAs all benefit because it separates gateway delay from payer delay before anyone escalates.

        ### When to use

        Use it when the callback for a request you sent has not arrived. Set `x-hcx-correlation_id` to the `x-hcx-api_call_id` of that request. You can only check requests you sent yourself.

        ### Preconditions

        - You sent the original request and kept its `api_call_id`.
        - You have a valid access token.
        - The encrypted payload is an empty string, and the header status is `request.initiated`.

        ### Postconditions

        NHCX answers at once with `request.queued` or `request.dispatched`. Queued means the payer has not seen the request, and no callback follows. Dispatched means the payer has it and will answer on the status callback.

        ### Common mistakes

        - Making a new correlation ID instead of using the original request's `api_call_id`.
        - Polling in a tight loop.
        - Resubmitting the original request after `request.queued`, which creates a duplicate.

        ### Best practices

        - Persist the correlation id against the case record before every submission so a status check is always possible.
        - Use a bounded, spaced schedule tied to the correlation id, then escalate; do not poll aggressively.
        - Branch on protocol_status: wait on request.queued, expect the status callback on request.dispatched.
        - Use a fresh x-hcx-api_call_id per status call and IST timestamps.
        - Treat Status as transport position only; the decision lives in the original on_ callback or a Search for the claim document.
        - Implement the status callback and v1/error so both branches of the answer have somewhere to land.

        ### Related scenario

        A hospital's TPA desk submitted a preauth on /v1/preauth/submit at 09:00 and by 13:00 nothing has arrived on /v1/preauth/on_submit. Rather than resubmit, the integration posts /v1/status with the preauth's correlation id. The synchronous reply shows protocol_status request.dispatched, so the request is with the payer, not stuck at the gateway; the desk stops worrying about a lost message and waits for the status callback and the eventual preauth decision. Had the reply been request.queued, the desk would have waited on the gateway and, if the delay persisted, escalated to NHCX support with the correlation id.

        ### Specification

        Chapter [NHCX adapter (Optional)](/docs/nhcx/v1/getting-started/nhcx-adapter) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
        - $ref: "#/components/parameters/XHcxSenderCode"
        - $ref: "#/components/parameters/XHcxRecipientCode"
        - $ref: "#/components/parameters/XHcxApiCallId"
        - $ref: "#/components/parameters/XHcxRequestId"
        - $ref: "#/components/parameters/XHcxCorrelationId"
        - $ref: "#/components/parameters/XHcxTimestamp"
        - $ref: "#/components/parameters/XHcxStatus"
        - $ref: "#/components/parameters/XHcxBenAbhaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
            example:
              payload: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwieC1oY3gtc2VuZGVyX2NvZGUiOiIxMDAwMDA0NDQ2QGhjeCJ9.encrypted_key.iv.ciphertext.tag
      responses:
        "202":
          description: "The gateway validates the request and returns the protocol status synchronously in the HTTP response: HTTP 202 with a StatusSuccessResponse whose result carries sender_code, recipient_code, entity_type and protocol_status of request.queued or request.dispatched."
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  result:
                    type: object
                    properties:
                      sender_code:
                        type: string
                      recipient_code:
                        type: string
                      entity_type:
                        type: string
                      protocol_status:
                        type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 25/08/2026 13:00:00:215
                api_call_id: e5f6a7b8-c9d0-1234-ef01-345678901234
                correlation_id: 11223344-5566-7788-99aa-bbccddeeff00
                result:
                  sender_code: 1000004446@hcx
                  recipient_code: 1518@hcx
                  entity_type: preauth
                  protocol_status: request.dispatched
                error:
                  code: ""
                  message: ""
  /v1/search/submit:
    post:
      operationId: status_v1_search_submit
      x-abdm-atom: nhcx.endpoint.search-submit
      x-abdm-use-case: Status and search
      tags:
        - Status and search
      summary: Search submit
      description: |-
        Authorised entity such as NHA or IRDAI sends a Task to retrieve claim information for a case; the payer returns the documents on the search callback.

        ### Business purpose

        Regulators and scheme authorities need to see what was actually claimed and decided for a given case without being a party to the original exchange. The Search API is that privileged pull path: an authorised entity submits a Task naming the case, and the payer supplies the claim documents. It supports oversight, audit and dispute review, and it lets payers answer such requests through the same encrypted, correlated channel as everything else on NHCX. The documented callers are NHA and IRDAI; a provider integration usually implements only the responding side.

        ### When to use

        Use it when an authorised body such as NHA or IRDAI needs the claim documents for a known case, for example during an audit. The result arrives later on `/v1/search/on_submit`.

        ### Preconditions

        - You are an entity allowed to search, registered on NHCX, with a valid access token.
        - The payload is an encrypted FHIR `Task` that points to the case being queried.
        - `x-hcx-correlation_id` carries the correlation ID of the request being queried.

        ### Postconditions

        NHCX answers `202` at once. The payer sends the documents later on `/v1/search/on_submit`. Search only reads, so nothing about the case changes.

        ### Common mistakes

        - Using search to ask where a request is. Use `/v1/status` for that.
        - Sending a `CommunicationRequest` instead of a `Task`.
        - Making a new correlation ID instead of carrying the one being queried.
        - Expecting the documents in the `202`.

        ### Best practices

        - Reference the case in Task.about using the sender's own reference id and keep it consistent with the correlation id you carry.
        - Persist the correlation id so the on_submit result can be matched.
        - Use fresh api_call_id values, IST timestamps and request.initiated on the outbound header.
        - Handle 404 as a signal that the correlation id is unknown to the gateway, not as a retry trigger.
        - Implement v1/error and the on_submit receiver before submitting searches.

        ### Related scenario

        A scheme authority reviewing a grievance about a rejected claim needs the payer's adjudication record. Its integration posts /v1/search/submit with a Task whose about element names the case and whose header carries the claim's correlation id. The gateway acknowledges with 202 and forwards the Task to the payer. The payer's system locates the ClaimResponse for the reference number and returns it on /v1/search/on_submit with basedOn holding the authority's reference and about holding the payer's reference and current status. The authority then compares it with the provider's original /v1/claim/submit bundle.

        ### Specification

        Chapter [NHCX adapter (Optional)](/docs/nhcx/v1/getting-started/nhcx-adapter) of the NHCX integration specification.
      parameters:
