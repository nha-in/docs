                    type: string
                  correlation_id:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 19/03/2026 11:46:35:120
                api_call_id: "{{$guid}}"
                correlation_id: "{{correlationId}}"
                error:
                  code: ""
                  message: ""
  /v1/predetermination/on_submit:
    post:
      operationId: predetermination_v1_predetermination_on_submit
      x-abdm-atom: nhcx.endpoint.predetermination-on-submit
      x-abdm-use-case: Predetermination
      tags:
        - Predetermination
      summary: Predetermination callback
      description: |-
        Payer returns its estimate for a predetermination request to the provider: a `ClaimResponse` with `use` `predetermination` and the benefit it would approve. This is use case C11.

        ### Business purpose

        The callback carries the payer's view of what it would pay for a proposed treatment, so the hospital can plan the admission and counsel the patient before any money is committed. For the payer it is the record of the estimate it gave.

        ### When to use

        The payer calls it after assessing a predetermination request, with the same correlation ID and `x-hcx-status` `response.complete`. Only payers that support predetermination send it.

        ### Preconditions

        - A predetermination request with this correlation ID exists in NHCX.
        - The payer has a valid access token and the provider's certificate, and encrypts the answer for the provider.
        - The bundle is a `ClaimResponse` with `use` set to `predetermination`, carrying the estimated benefit.
        - The correlation ID matches the request, and the call ID is new.

        ### Postconditions

        - NHCX answers `202` and forwards the estimate to the provider, who must reply `202` within 30 seconds.
        - The estimate reserves nothing against the policy.

        ### Common mistakes

        - Creating a new correlation ID instead of reusing the request's.
        - Provider side: reading the estimate as an approval.
        - Provider side: replying with anything other than `202`, which triggers retries.

        ### Best practices

        - Provider: acknowledge first, then decrypt, then store the estimate against the planned case.
        - Provider: make the handler idempotent, since a missed receipt means the same message arrives again with the same `x-hcx-api_call_id`.
        - Payer: explain the estimate in `ClaimResponse.disposition`, as the reference sample does.

        ### Related scenario

        A payer receives a predetermination request for procedure `MG004A` under reference `PD0000000001`. Its adjudicator assesses the proposed treatment, and the payer posts a `ClaimResponse` with `use` `predetermination`, outcome `complete` and a benefit total of 15500.00 to this endpoint on the request's correlation ID. The hospital's callback answers 202 within 30 seconds and files the figure as an estimate for the planned admission.

        ### Specification

        Chapter [Predetermination, status and search](/docs/nhcx/v1/reference/fhir/predetermination-status-and-search) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
        - $ref: "#/components/parameters/XHcxSenderCode"
        - $ref: "#/components/parameters/XHcxRecipientCode"
        - $ref: "#/components/parameters/XHcxApiCallId"
        - $ref: "#/components/parameters/XHcxCorrelationId"
        - $ref: "#/components/parameters/XHcxTimestamp"
        - name: x-hcx-status
          in: header
          required: true
          description: Where this message stands. Values below. Mandatory on the envelope.
          schema:
            type: string
          example: response.complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
            example:
              payload: <compact JWE>
      responses:
        "202":
          description: NHCX returns HTTP 202 with the acknowledgement and delivers the callback to the provider, which must answer 202 with a receipt within 30 seconds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 19/03/2026 11:46:35:120
                api_call_id: "{{$guid}}"
                correlation_id: "{{correlationId}}"
                error:
                  code: ""
                  message: ""
