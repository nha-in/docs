components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: bearer_auth
      description: Every NHCX call carries the access token from the session call in a header named `bearer_auth`, as the word `Bearer`, a space and the token. NHCX reads `bearer_auth`, not `Authorization`.
  parameters:
    BearerAuth:
      name: bearer_auth
      in: header
      required: true
      description: It is `bearer_auth`, not `Authorization`, on NHCX's own endpoints.
      schema:
        type: string
      example: Bearer <access token>
  x-nhcx-protected-header:
    alg:
      required: true
      description: "Key management algorithm. Always `RSA-OAEP-256`: the content key is wrapped with the recipient's RSA public key."
      example: RSA-OAEP-256
    enc:
      required: true
      description: Content encryption algorithm. Always `A256GCM`.
      example: A256GCM
    x-hcx-sender_code:
      required: true
      description: Your participant code. Mandatory on the envelope.
      example: <provider participant code>
    x-hcx-recipient_code:
      required: true
      description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
      example: <payer participant code>
    x-hcx-api_call_id:
      required: true
      description: Fresh on every message, including responses. Mandatory on the envelope.
      example: <uuid>
    x-hcx-request_id:
      required: false
      description: "One per originating request. The Open Protocol page marks it Mandatory; the Technical Specifications page marks it Optional. Optional on the envelope. Send it anyway, as a fresh UUID per originating request: it is cheap and satisfies both readings until NHA rules."
      example: <uuid>
    x-hcx-correlation_id:
      required: true
      description: "The thread that ties a request to its answers. [The correlation ID rule](/docs/nhcx/v1/reference/envelope-fields#the-correlation-id-rule-in-full) says when to reuse it. Mandatory on the envelope."
      example: <uuid>
    x-hcx-workflow_id:
      required: false
      description: "Which step, or which case. [The workflow code](/docs/nhcx/v1/reference/envelope-fields#the-workflow-code-means-two-different-things) explains both readings. Optional on the envelope."
      example: "11"
    x-hcx-timestamp:
      required: true
      description: "The time the message was made. [Timestamp](/docs/nhcx/v1/reference/envelope-fields#timestamp) gives the format. Mandatory on the envelope."
      example: <iso timestamp>
    x-hcx-status:
      required: true
      description: "Where this message stands. [Status words](/docs/nhcx/v1/reference/envelope-fields#status-words) lists the values. Mandatory on the envelope."
      example: request.initiated
    x-hcx-ben-abha-id:
      required: false
      description: "The beneficiary's ABHA number. Optional: send it when the beneficiary has an ABHA number. Optional on the envelope."
      example: <14-digit ABHA number>
    x-hcx-debug_flag:
      required: false
      description: "`Error`, `Info` or `Debug`. A server may ignore it. Optional on the envelope."
      example: INFO
x-abdm-errors:
  notes: "Codes any exchange call can meet are recorded once, in the [Other](/docs/nhcx/v1/api/other) specification: the gateway's NHCX- codes, the standard payer codes, and the reference payer's structure and transport codes. The reference payer's other codes sit with the exchange they reject: coverage eligibility, preauthorisation, claim and insurance plan. [Reading error codes](/docs/nhcx/v1/reference/error-code-guide) explains the code spaces."
x-abdm-errors-reference-payer:
  source: Reference payer codes, PAYR-1001 to PAYR-1520. Sent by the PMJAY reference implementation; they arrive inside the sealed response.
  codes:
    - code: PAYR-1101
      message: Invalid purpose received as (%s) for beneficiary id (%s) from hospital id (%s). Hence no result will be returned. Please try again with a valid purpose.
      action: ""
    - code: PAYR-1102
      message: Invalid search parameter requested. Please try again with a valid id.
      action: ""
    - code: PAYR-1103
      message: Invalid careplan id received. Please try again with valid careplan id.
      action: ""
    - code: PAYR-1104
      message: Multiple records found for the beneficiary. Hence request will not be processed further.
      action: ""
    - code: PAYR-1105
      message: Hospital configuration not found. Please contact support team.
      action: ""
    - code: PAYR-1106
      message: No details found for the requested procedures in the system.
      action: ""
    - code: PAYR-1107
      message: No billable item received. Please try again with valid item data.
      action: ""
    - code: PAYR-1108
      message: No details found for the requested stratification in the system.
