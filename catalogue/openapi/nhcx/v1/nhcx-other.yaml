  /swagger-resources:
    get:
      operationId: other_swagger_resources
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Swagger resources list
      description: |-
        Lists the Swagger resources (API document locations) exposed by the status service; used by Swagger UI, not by integrations.

        ### Business purpose

        Swagger UI discovers which API documents a service offers by reading this list. On the status service it points the UI at the /v2/api-docs and /v3/api-docs documents so that an engineer can browse the /v1/status operation interactively. It carries no claim-settlement data and involves no business logic; the endpoint index describes it simply as the list of Swagger resources.

        ### When to use

        Use it only with Swagger UI, or when a tool needs to find the service's API documents. Integrations never call it.

        ### Preconditions

        - A plain `GET` to the status service host, under `/statushcxservice`.
        - No encryption, no `x-hcx-*` headers and no request body.

        ### Postconditions

        The service returns `200` with a list of where its API documents live. Nothing changes and no callback follows.

        ### Common mistakes

        - Calling the gateway address instead of the status service host.
        - Treating this document as the contract for gateway traffic.
        - Sending a `POST`, a request body or `x-hcx-*` headers.

        ### Best practices

        - Use these endpoints for exploration and client generation in the sandbox, and cache the document rather than fetching it on every run.
        - Diff the served document against the corpus (Status service: OpenAPI 3.0.1, version 1.0.0) when behaviour changes unexpectedly.
        - Never let production traffic depend on the availability of the documentation endpoints.
        - Keep the /v1/status protocol rules in mind when reading the spec: x-hcx-correlation_id must carry the original request's correlation id.

        ### Related scenario

        An integration engineer opens Swagger UI against the status service in the sandbox to reproduce a colleague's failing status call. The UI first requests /swagger-resources to learn where the API documents live, then loads /v3/api-docs. The engineer inspects the /v1/status operation, notices the colleague had minted a fresh correlation id instead of reusing the original preauth correlation id, and fixes the client before retrying the status request.

        ### Specification

        Chapter [Environments and addresses](/docs/nhcx/v1/reference/environments-and-addresses) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: The service returns HTTP 200 with a JSON list of resource descriptors that locate the service's API documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _note:
                    type: string
                  resources:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        url:
                          type: string
                        swaggerVersion:
                          type: string
              example:
                _note: The service returns a JSON array of resource descriptors; wrapped here for display.
                resources:
                  - name: default
                    url: /v3/api-docs
                    swaggerVersion: "3.0"
  /swagger-resources/configuration/ui:
    get:
      operationId: other_swagger_resources_configuration_ui
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Swagger UI configuration
      description: |-
        Returns the Swagger UI display configuration for the status service; consumed by Swagger UI, not by integrations.

        ### Business purpose

        Swagger UI reads this endpoint to learn how the service wants its documentation rendered (for example, expansion and deep-linking settings). It supports the interactive exploration of the status service's /v1/status operation and has no role in claim settlement, routing or security. The endpoint index describes it as the Swagger UI configuration.

        ### When to use

        Use it only in a Swagger UI session against the status service. Integrations never call it.

        ### Preconditions

        - A plain `GET` to the status service host, under `/statushcxservice`.
        - No encryption, no `x-hcx-*` headers and no request body.

        ### Postconditions

        The service returns `200` with a small set of UI settings. Nothing changes and no callback follows.

        ### Common mistakes

        - Calling the gateway address instead of the status service host.
        - Treating this document as the contract for gateway traffic.
        - Sending a `POST`, a request body or `x-hcx-*` headers.

        ### Best practices

        - Use these endpoints for exploration and client generation in the sandbox, and cache the document rather than fetching it on every run.
        - Diff the served document against the corpus (Status service: OpenAPI 3.0.1, version 1.0.0) when behaviour changes unexpectedly.
        - Never let production traffic depend on the availability of the documentation endpoints.
        - Keep the /v1/status protocol rules in mind when reading the spec: x-hcx-correlation_id must carry the original request's correlation id.

        ### Related scenario

        While preparing sandbox exit evidence, a payer's engineer captures screenshots of the status service's Swagger UI. The browser loads /swagger-resources/configuration/ui to decide how to render the page, then the resources list and the OpenAPI document. The engineer uses the rendered /v1/status operation to explain to the certification reviewer how the payer responds on the status callback when a provider asks about a dispatched preauthorisation.

        ### Specification

        Chapter [Environments and addresses](/docs/nhcx/v1/reference/environments-and-addresses) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: The service returns HTTP 200 with a small JSON object of UI settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deepLinking:
                    type: boolean
                  docExpansion:
                    type: string
                  displayRequestDuration:
                    type: boolean
              example:
                deepLinking: true
                docExpansion: none
                displayRequestDuration: false
  /swagger-resources/configuration/security:
    get:
      operationId: other_swagger_resources_configuration_security
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Swagger security configuration
      description: |-
        Returns the Swagger UI security configuration for the status service; consumed by Swagger UI, not by integrations.

        ### Business purpose

        Swagger UI reads this endpoint to learn how to present authorisation inputs (such as a bearer token field) when a user tries operations from the browser. It describes UI behaviour only; it does not issue tokens, and it is unrelated to the client-credentials flow at /get/session or to the JWE encryption that protects protocol payloads. The endpoint index describes it as the Swagger security configuration.

        ### When to use

        Use it only in a Swagger UI session against the status service. It does not issue tokens, and integrations never call it.

        ### Preconditions

        - A plain `GET` to the status service host, under `/statushcxservice`.
        - No encryption, no `x-hcx-*` headers and no request body.

        ### Postconditions

        The service returns `200` with the UI's security settings. No token is issued and no callback follows.

        ### Common mistakes

        - Calling the gateway address instead of the status service host.
        - Treating this document as the contract for gateway traffic.
        - Sending a `POST`, a request body or `x-hcx-*` headers.
        - Mistaking it for a way to get a token.

        ### Best practices

        - Use these endpoints for exploration and client generation in the sandbox, and cache the document rather than fetching it on every run.
        - Diff the served document against the corpus (Status service: OpenAPI 3.0.1, version 1.0.0) when behaviour changes unexpectedly.
        - Never let production traffic depend on the availability of the documentation endpoints.
        - Keep the /v1/status protocol rules in mind when reading the spec: x-hcx-correlation_id must carry the original request's correlation id.

        ### Related scenario

        A provider's engineer wants to try /v1/status from Swagger UI in the sandbox. The UI fetches /swagger-resources/configuration/security to decide how to show the authorisation dialog, and the engineer pastes a Bearer token obtained separately from the client-credentials call. Because the status request body must be a JWE built with the payer's certificate, the engineer ultimately uses the UI only to confirm the schema and runs the real status request from the integration code, which reuses the original preauth correlation id.

        ### Specification

        Chapter [Environments and addresses](/docs/nhcx/v1/reference/environments-and-addresses) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: The service returns HTTP 200 with a small JSON object describing how Swagger UI should handle security inputs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKeyVehicle:
                    type: string
                  apiKeyName:
                    type: string
                  scopeSeparator:
                    type: string
              example:
                apiKeyVehicle: header
                apiKeyName: bearer_auth
                scopeSeparator: ","
  /v1/on_status:
    post:
      operationId: other_v1_on_status
      x-abdm-atom: nhcx.endpoint.on-status
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Status callback
      description: |-
        The answer to a status request, delivered to the sender that asked. The `x-hcx-status` in the protected header says where the message you asked about got to. The payload is an empty string.

        ### Business purpose

        It separates "did my message arrive" from "what did the payer decide". A sender learns whether a quiet case is still held by the exchange, has reached the recipient, or is dead, without resubmitting it and creating a duplicate.

        ### When to use

        Every participant that sends `/v1/status` hosts this path. It carries the answer to your status request.

        ### Preconditions

        - You sent `/v1/status` and kept track of which request it asked about.
        - Your callback URL is registered and answers `202` within 30 seconds.

        ### Postconditions

        Read `x-hcx-status` in the header. `request.dispatched` means the message reached the recipient, and `request.queued` means NHCX still holds it. `request.stopped` means the request is dead, so a retry needs a new correlation ID. Answer `202`.

        ### Common mistakes

        - Expecting a bundle. The payload is an empty string.
        - Matching on the original request's correlation ID instead of your status request's.
        - Retrying a stopped request on its old correlation ID.

        ### Best practices

        - Keep every `api_call_id` you send. Without it you cannot ask the question at all.
        - Act on `request.stopped` at once, and treat `request.dispatched` as a reason to wait for the payer.
        - Ask from a support screen when a case has gone quiet for longer than the payer's expected turnaround, not on a timer.

        ### Related scenario

        A pre-authorisation has had no answer for longer than the payer's usual turnaround. The support screen sends `/v1/status` with that request's `api_call_id` as the correlation ID. The answer arrives here with an empty payload and `x-hcx-status` `request.stopped`, so the desk knows the request is dead rather than slow, and resubmits it with a fresh correlation ID.

        ### Specification

        Chapter [NHCX adapter (Optional)](/docs/nhcx/v1/getting-started/nhcx-adapter) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
        - name: x-hcx-sender_code
          in: header
          required: true
          description: Your participant code. Mandatory on the envelope.
          schema:
            type: string
          example: <participant code>
        - name: x-hcx-recipient_code
          in: header
          required: true
          description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
          schema:
            type: string
          example: <recipient code>
        - $ref: "#/components/parameters/XHcxApiCallId"
        - name: x-hcx-correlation_id
          in: header
          required: true
          description: The thread. See the rule below. Mandatory on the envelope.
          schema:
            type: string
          example: <correlation id>
        - $ref: "#/components/parameters/XHcxTimestamp"
        - name: x-hcx-status
          in: header
          required: true
          description: Where this message stands. Values below. Mandatory on the envelope.
          schema:
            type: string
          example: response.complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
            example:
              payload: <compact JWE>
      responses:
        "200":
          description: Read `x-hcx-status` from the protected header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 19/03/2026 11:46:35:120
                api_call_id: "{{$guid}}"
                correlation_id: "{{correlationId}}"
                error:
                  code: ""
                  message: ""
  /v1/error:
    post:
      operationId: other_v1_error
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Error report (callback)
      description: |-
        Where the exchange tells a sender that a request could not be delivered after five attempts. Received by every participant under its registered address. There is no outbound form.

        ### Business purpose

        When the exchange cannot deliver a request, it tries five times, retires the correlation ID and tells the original sender here. A system without this endpoint never learns that its request died, and a dead request looks exactly like a case still under review. Every participant must host it.

        ### When to use

        You host this path and never call it. Providers and payers both need it, so build it first.

        ### Preconditions

        - Your callback URL is registered: a domain name over HTTPS, hosted in India, answering within 30 seconds.
        - Your handler accepts a body it does not know. The report is plain JSON, not encrypted.

        ### Postconditions

        Answer `202`. The original request is dead, so a retry needs a new correlation ID.

        ### Common mistakes

        - Not hosting it, so failed deliveries go unseen.
        - Rejecting the report because it does not match a fixed schema.
        - Retrying the failed request on the old correlation ID.

        ### Best practices

        - Store the report whole before doing anything with it.
        - Mark the case it names as undelivered, so the desk does not wait for a decision that will not come.
        - Check it first when a case goes quiet, before asking the exchange with `/v1/status`.

        ### Related scenario

        A hospital posts a pre-authorisation and gets its receipt, but the payer's endpoint is down. The exchange tries five times, retires the correlation ID and posts a report to the hospital's `/v1/error`. The handler stores the report whole, answers 202 with the receipt, and marks the pre-authorisation undelivered. The desk resubmits it with a fresh correlation ID once the payer is reachable.

        ### Specification

        Chapter [Building and sending a JWE](/docs/nhcx/v1/getting-started/building-and-sending-a-jwe) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
        - name: x-hcx-sender_code
          in: header
          required: true
          description: Your participant code. Mandatory on the envelope.
          schema:
            type: string
          example: nhcx-gateway@hcx
        - name: x-hcx-recipient_code
          in: header
          required: true
          description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
          schema:
            type: string
          example: 1000004446@hcx
        - $ref: "#/components/parameters/XHcxApiCallId"
        - name: x-hcx-correlation_id
          in: header
          required: true
          description: The thread. See the rule below. Mandatory on the envelope.
          schema:
            type: string
          example: <correlation id>
        - $ref: "#/components/parameters/XHcxTimestamp"
        - name: x-hcx-status
          in: header
          required: true
          description: Where this message stands. Values below. Mandatory on the envelope.
          schema:
            type: string
          example: response.error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                x-hcx-sender_code:
                  type: string
                x-hcx-recipient_code:
                  type: string
                x-hcx-api_call_id:
                  type: string
                x-hcx-correlation_id:
                  type: string
                x-hcx-workflow_id:
                  type: string
                x-hcx-timestamp:
                  type: string
                x-hcx-status:
                  type: string
                x-hcx-error_details:
                  type: object
                  properties:
                    code:
                      type: string
                    message:
                      type: string
                    trace:
                      type: string
                x-hcx-entity-type:
                  type: string
            example:
              type: ProtocolResponse
              x-hcx-sender_code: nhcx-gateway@hcx
              x-hcx-recipient_code: 1000004446@hcx
              x-hcx-api_call_id: <uuid>
              x-hcx-correlation_id: <correlation id>
              x-hcx-workflow_id: "12"
              x-hcx-timestamp: <iso timestamp>
              x-hcx-status: response.error
              x-hcx-error_details:
                code: ERR_DELIVERY_FAILED
                message: Recipient endpoint unreachable after five attempts
                trace: ""
              x-hcx-entity-type: preauth
      responses:
        "200":
          description: Answer 202 with the receipt, like every other delivery, filling in whatever identifiers the report carries and leaving the rest empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  result:
                    type: object
                    properties:
                      sender_code:
                        type: string
                      recipient_code:
                        type: string
                      entity_type:
                        type: string
                      protocol_status:
                        type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 04/09/2026 11:46:41:305
                api_call_id: <from the incoming header>
                correlation_id: <from the incoming header>
                result:
                  sender_code: 1000003538@hcx
                  recipient_code: 1000004446@hcx
                  entity_type: preauth
                  protocol_status: request.queued
                error:
                  code: ""
                  message: ""
