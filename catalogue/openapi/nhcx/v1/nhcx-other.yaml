paths:
  /v1/notification/subscribe:
    post:
      operationId: other_v1_notification_subscribe
      x-abdm-atom: nhcx.endpoint.notification-subscribe
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Notification subscribe
      description: |-
        A Beneficiary Service Provider (PHR app) subscribes an ABHA id to notification topics; NHCX persists it synchronously, Last-Linked-Wins per ABHA id.

        ### Business purpose

        Every other flow is a two-party exchange between hospital and payer. Notifications let a third party, the beneficiary through a PHR app, watch a claim move without being a sender or recipient on the underlying preauth or claim. The caller is a Beneficiary Service Provider (BSP), not a hospital or insurer; the persona label here is the nearest available. The subscription is what routes human-readable messages such as a preauth approval with amount and validity to the patient's app, giving beneficiaries transparency and reducing calls to the hospital desk.

        ### When to use

        Call it every time a beneficiary logs in to your app. The last app to subscribe an ABHA ID wins, so do not trust a stored subscription.

        ### Preconditions

        - You have a valid access token, sent in the `Authorization` header.
        - Your callback URL is registered over HTTPS, with TLS 1.2 or higher.
        - The user has agreed to receive notifications.
        - The body is encrypted and carries a new `x-hcx-correlation_id`.

        ### Postconditions

        NHCX saves the subscription and answers `200` with a `subscription_id` and its status. From then on, claim events for that ABHA ID are pushed to your callback.

        ### Common mistakes

        - Reusing a correlation ID on a retry, which returns `409`.
        - Subscribing once and assuming it still holds after another app logs in.
        - Sending it to the exchange host instead of `https://hcxsbx.abdm.gov.in/v1/notification/subscribe`.
        - Sending the token on `bearer_auth` instead of `Authorization`.

        ### Best practices

        - Subscribe on every login and refresh the token before its 100-minute expiry; store access_token encrypted and never log the secret.
        - Generate a fresh UUID correlation id per subscribe attempt, including retries; retry 500s with backoff, regenerate the token on 401, check the registry on 403.
        - Subscribe only to the topics you need, typically workflow_events.
        - Secure the callback: HTTPS with TLS 1.2 or higher, validate the JWT from NHCX, verify sender_code, rate-limit.
        - Display the message field directly to users; treat domain_values as optional audit data and read status from x-hcx-status, not the workflow id description.

        ### Related scenario

        A beneficiary opens a PHR app and logs in with the ABHA address ravi@abdm. The app confirms its NHCX token is valid, then posts /v1/notification/subscribe with subscription_id sub_ravi_001, topic_code workflow_events, its BSP code and its on_notification_url, under a fresh correlation id. NHCX replies 200 with subscription_status active. Later that day a hospital submits a preauth for the same ABHA id on /v1/preauth/submit and the payer approves it on /v1/preauth/on_submit; NHCX pushes a notification to the app's callback reading that the preauthorisation was approved for Rs. 50,000 with its validity dates, which the app displays as-is.

        ### Specification

        Chapter [Notifications and patient apps](/docs/nhcx/v1/reference/notifications-and-patient-apps) of the NHCX integration specification.
      security: []
      servers:
        - url: https://hcxsbx.abdm.gov.in
          description: Sandbox, NHCX portal.
      parameters:
        - name: x-hcx-sender_code
          in: header
          required: true
          description: Your participant code. Mandatory on the envelope.
          schema:
            type: string
          example: phr-app-xyz@bsp
        - name: x-hcx-recipient_code
          in: header
          required: true
          description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
          schema:
            type: string
          example: nhcx-gateway@hcx
        - $ref: "#/components/parameters/XHcxTimestamp"
        - $ref: "#/components/parameters/XHcxCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
                _payload_plaintext:
                  type: object
                  properties:
                    subscription_id:
                      type: string
                    topic_code:
                      type: array
                      items:
                        type: string
                    recipient_code:
                      type: string
                    subscriber:
                      type: object
                      properties:
                        id:
                          type: string
                    on_notification_url:
                      type: string
            example:
              payload: eyJhbGciOiJSU0EtT0FFUCIsImVuYyI6IkEyNTZHQ00iLCJ4LWhjeC1zZW5kZXJfY29kZSI6InBoci1hcHAteHl6QGJzcCJ9.encrypted_key.iv.ciphertext.tag
              _payload_plaintext:
                subscription_id: sub_ravi_001
                topic_code:
                  - workflow_events
                recipient_code: phr-app-xyz@bsp
                subscriber:
                  id: ravi@abdm
                on_notification_url: https://api.phrapp.com/v1/hcx/notification/on_subscribe
      responses:
        "200":
          description: "NHCX decrypts the request with its private key, validates headers and payload, persists the subscription with Last-Linked-Wins per ABHA id and returns the subscription state synchronously: HTTP 200 with a SubscribeResponse carrying timestamp, api_call_id, correlation_id, subscription_id, subscription_status (active, replaced or expired), expiry and message."
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  subscription_id:
                    type: string
                  subscription_status:
                    type: string
                  expiry:
                    type: string
                  message:
                    type: string
              example:
                timestamp: 2026-08-25T08:30:00+05:30
                api_call_id: d6e7f8a9-b0c1-2345-9012-456789012345
                correlation_id: 8899aabb-ccdd-eeff-0011-223344556677
                subscription_id: sub_ravi_001
                subscription_status: active
                expiry: ""
                message: Subscription accepted
  /v1/notification/on_subscribe:
    post:
      operationId: other_v1_notification_on_subscribe
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Notification on_subscribe
      description: |-
        BSP-side subscription acknowledgement; the same name denotes the callback where NHCX pushes claim-event notifications for a subscribed ABHA id.

        ### Business purpose

        Two things share this name. The API reference defines an NHCX-side operation (operationId onSubscribe) that takes a NotificationOnSubscribePayload with the beneficiary's abhaid, optional domain_values and plain header values, and returns a SubscribeResponse; it is described as the BSP-side subscription persistence acknowledgement. The integration guide uses the same path on the BSP's own host as the callback where NHCX delivers notifications. Together they complete the beneficiary-facing loop: the patient's app learns, in plain language, that a preauth was approved, a claim adjudicated, a payment made or information requested. The caller is a Beneficiary Service Provider; the persona label is the nearest available.

        ### When to use

        A beneficiary app hosts this path to receive notifications for the ABHA IDs it subscribed. NHCX calls it when a pre-authorisation, claim, payment or query event happens.

        ### Preconditions

        - An active subscription exists for the ABHA ID, made through `/v1/notification/subscribe`.
        - Your callback runs over HTTPS with TLS 1.2 or higher, at the registered `on_notification_url`.
        - You check the token NHCX sends and its sender code.

        ### Postconditions

        Each notification carries a `message` you can show the user as it is. Nothing changes in the exchange between hospital and payer.

        ### Common mistakes

        - Building the user message from `domain_values`, which may be missing, instead of showing `message`.
        - Reading the status from `x-hcx-workflow_id`. It lives in `x-hcx-status`.
        - Assuming the subscription is still yours after it shows `replaced`.
        - Accepting calls without checking the token or the sender code.

        ### Best practices

        - Display message verbatim; keep domain_values for audit logging or advanced formatting only.
        - Validate the JWT and sender_code on every inbound push, enforce TLS 1.2 or higher and rate limiting.
        - Map event types (preauth_response, claim_response, payment_notice, communication) to in-app timelines using x-hcx-action and x-hcx-status.
        - Show subscription status in settings so a replaced subscription is visible to the user; resubscribe on next login.
        - Keep the endpoint fast and idempotent on notification_id.

        ### Related scenario

        A PHR app has subscribed ravi@abdm to workflow_events. A hospital submits a claim on /v1/claim/submit for that beneficiary and the payer adjudicates it on /v1/claim/on_submit. NHCX forks the outcome to the app's registered on_subscribe callback with topic_code workflow_events, a message stating the claim was approved with the amount, and domain_values including x-hcx-action claim_response and x-hcx-status response.complete. The app validates the JWT and sender_code, shows the message on the patient's timeline, and when the payer later sends a payment notice on /v1/paymentnotice/request the next push reads paid.

        ### Specification

        Chapter [Notifications and patient apps](/docs/nhcx/v1/reference/notifications-and-patient-apps) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request:
                  type: object
                  properties:
                    abhaid:
                      type: string
                    domain_values:
                      type: object
                      properties:
                        x-hcx-workflow_id:
                          type: string
                        x-hcx-correlation_id:
                          type: string
                        x-hcx-timestamp:
                          type: string
                        x-hcx-sender_code:
                          type: string
                        x-hcx-recipient_code:
                          type: string
                        x-hcx-status:
                          type: string
                        x-hcx-action:
                          type: string
                        x-hcx-amount_submitted:
                          type: string
                hvalues:
                  type: object
                  properties:
                    senderid:
                      type: string
                    receiverid:
                      type: string
                    correlationid:
                      type: string
                    status:
                      type: string
                    workflowid:
                      type: string
            example:
              request:
                abhaid: ravi@abdm
                domain_values:
                  x-hcx-workflow_id: wf_20260825_001
                  x-hcx-correlation_id: corr_20260825_12345
                  x-hcx-timestamp: 2026-08-25T14:30:00+05:30
                  x-hcx-sender_code: payor.icici@nhcx
                  x-hcx-recipient_code: bsp.phrapp@nhcx
                  x-hcx-status: response.complete
                  x-hcx-action: preauth_response
                  x-hcx-amount_submitted: "75000.00"
              hvalues:
                senderid: payor.icici@nhcx
                receiverid: bsp.phrapp@nhcx
                correlationid: corr_20260825_12345
                status: response.complete
                workflowid: wf_20260825_001
      responses:
        "200":
          description: The NHCX-side operation returns HTTP 200 with a SubscribeResponse (timestamp, api_call_id, correlation_id, subscription_id, subscription_status active, replaced or expired, expiry, message); 400, 401, 403, 409 and 500 return a StatusSuccessResponse with the same descriptions as the subscribe table.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  subscription_id:
                    type: string
                  subscription_status:
                    type: string
                  expiry:
                    type: string
                  message:
                    type: string
              example:
                timestamp: 2026-08-25T14:30:01+05:30
                api_call_id: e7f8a9b0-c1d2-3456-0123-567890123456
                correlation_id: corr_20260825_12345
                subscription_id: sub_ravi_001
                subscription_status: active
                expiry: ""
                message: "Preauthorization approved for Rs. 50,000. Valid from 2026-08-25 to 2026-09-01. Reference: PA-2026-004567"
  /v1/delete:
    post:
      operationId: other_v1_delete
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Delete records (troubleshooting)
      description: |-
        Internal troubleshooting operation on the claim service that deletes records by correlationid and action; not part of the business transaction flows.

        ### Business purpose

        The claim service OpenAPI lists /v1/delete as an internal troubleshooting operation for deleting records identified by a correlationid and an action. It exists to clear stuck or erroneous records during integration testing and support, not to move a claim through its lifecycle. The published documentation gives no further business context and does not state which participant roles may call it.

        ### When to use

        Only for troubleshooting, and only when NHCX support asks you to. It is not part of any claim flow.

        ### Preconditions

        - You have a valid access token.
        - You know the correlation ID and the action of the record to remove.
        - NHCX support agrees that deleting it is the right fix.

        ### Postconditions

        The record is removed. To carry on, start a new request with a new correlation ID.

        ### Common mistakes

        - Using it to cancel a pre-authorisation. Cancel with a `Task` on `/v1/task/submit`, workflow `PC01`.
        - Reusing the old correlation ID after a delete.
        - Calling it in production without NHCX support.

        ### Best practices

        - Reserve this call for sandbox troubleshooting and only on NHCX support's instruction.
        - Record the correlation ID, action and reason for every deletion in your own audit log, since the docs describe no NHCX-side confirmation beyond the HTTP status.
        - Prefer /v1/status to inspect a stuck correlation ID before deleting anything.
        - Mint a new correlation UUID for any re-submission after a deletion.

        ### Related scenario

        During sandbox testing a hospital's integrator submits a claim whose callback keeps failing because their endpoint returned 200 instead of 202. NHCX support asks them to fix the acknowledgement and then clears the stuck record by correlation ID and action using /v1/delete so the test case can be rerun cleanly. The integrator resubmits the claim to /v1/claim/submit under a new correlation UUID, receives a 202, and this time the on_submit callback is acknowledged correctly.

        ### Specification

        No chapter of the current documentation covers this operation. It appears only in the claim service's OpenAPI.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correlationid:
                  type: string
                action:
                  type: string
            example:
              correlationid: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
              action: /v1/claim/submit
      responses:
        "200":
          description: The endpoint sits in the claim service, whose domain operations all return 202 Accepted, 400 Request Validation failed, 404 Requested resource was not found and 500 Downstream systems down, each carrying StatusSuccessResponse.
          content:
            application/json:
              schema:
                type: object
                properties:
                  httpStatus:
                    type: integer
                  schema:
                    type: string
                  note:
                    type: string
              example:
                httpStatus: 202
                schema: StatusSuccessResponse
                note: The claim service spec lists 202, 400, 404 and 500, all carrying StatusSuccessResponse; no worked response body is published for /v1/delete.
  /v3/api-docs:
    get:
      operationId: other_v3_api_docs
      x-abdm-use-case: Other
      tags:
        - Other
      summary: OpenAPI 3 document (status service)
      description: |-
        Serves the status service's OpenAPI 3 document, optionally filtered by a group query parameter; a discovery endpoint, not a protocol API.

        ### Business purpose

        Integrators need a machine-readable contract for the Status API in order to generate clients, validate their requests and confirm the server prefix. This endpoint serves that contract in OpenAPI 3 form for the status service (statushcxservice, OpenAPI 3.0.1, service version 1.0.0). It carries no claim-settlement data and involves no payer or provider business logic; its value is purely in making the /v1/status operation discoverable and verifiable during integration and troubleshooting.

        ### When to use

        Use it when you set up an integration or generate a client, to read the status service's contract. It is not part of any claim flow.

        ### Preconditions

        - A plain `GET` to the status service host, under `/statushcxservice`.
        - No encryption, no `x-hcx-*` headers and no request body.

        ### Postconditions

        The service returns `200` with its OpenAPI 3 document. Nothing changes and no callback follows.

        ### Common mistakes

        - Calling the gateway address instead of the status service host.
        - Treating this document as the contract for gateway traffic.
        - Sending a `POST`, a request body or `x-hcx-*` headers.

        ### Best practices

        - Use these endpoints for exploration and client generation in the sandbox, and cache the document rather than fetching it on every run.
        - Diff the served document against the corpus (Status service: OpenAPI 3.0.1, version 1.0.0) when behaviour changes unexpectedly.
        - Never let production traffic depend on the availability of the documentation endpoints.
        - Keep the /v1/status protocol rules in mind when reading the spec: x-hcx-correlation_id must carry the original request's correlation id.

        ### Related scenario

        A hospital's integration team is building status polling for stalled preauthorisations. Before wiring /v1/status, an engineer fetches /v3/api-docs from the status service host, confirms the server prefix and the response schema, and generates a typed client. The team then implements the status request with the original correlation id in x-hcx-correlation_id, handles the synchronous request.queued and request.dispatched outcomes, and receives the payer's answer on the status callback.

        ### Specification

        Chapter [Environments and addresses](/docs/nhcx/v1/reference/environments-and-addresses) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: "The service returns HTTP 200 with a JSON OpenAPI 3 document describing the status service: its info block, the /statushcxservice server entry and the /v1/status operation with its StatusSuccessResponse responses."
          content:
            application/json:
              schema:
                type: object
                properties:
                  openapi:
                    type: string
                  info:
                    type: object
                    properties:
                      title:
                        type: string
                      version:
                        type: string
                  servers:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                  paths:
                    type: object
                    properties:
                      /v1/status:
                        type: object
                        properties:
                          post:
                            type: object
                            properties:
                              operationId:
                                type: string
                              responses:
                                type: object
                                properties:
                                  "202":
                                    type: object
                                    properties:
                                      description:
                                        type: string
              example:
                openapi: 3.0.1
                info:
                  title: Status service
                  version: 1.0.0
                servers:
                  - url: /statushcxservice
                paths:
                  /v1/status:
                    post:
                      operationId: status
                      responses:
                        "202":
                          description: Accepted
  /v2/api-docs:
    get:
      operationId: other_v2_api_docs
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Swagger 2 document (status service)
      description: |-
        Serves the status service's Swagger 2 document, optionally filtered by a group query parameter; a discovery endpoint, not a protocol API.

        ### Business purpose

        Some tooling still consumes Swagger 2 rather than OpenAPI 3. This endpoint serves the status service's contract in that older format so that such tools can generate clients and validate requests against /v1/status. It exists alongside /v3/api-docs and describes the same service; it carries no claim-settlement data and involves no business logic. Its value is limited to integration setup and troubleshooting.

        ### When to use

        Use it when your tools need the older Swagger 2 format. It describes the same service as `/v3/api-docs`.

        ### Preconditions

        - A plain `GET` to the status service host, under `/statushcxservice`.
        - No encryption, no `x-hcx-*` headers and no request body.

        ### Postconditions

        The service returns `200` with its Swagger 2 document. Nothing changes and no callback follows.

        ### Common mistakes

        - Calling the gateway address instead of the status service host.
        - Treating this document as the contract for gateway traffic.
        - Sending a `POST`, a request body or `x-hcx-*` headers.

        ### Best practices

        - Use these endpoints for exploration and client generation in the sandbox, and cache the document rather than fetching it on every run.
        - Diff the served document against the corpus (Status service: OpenAPI 3.0.1, version 1.0.0) when behaviour changes unexpectedly.
        - Never let production traffic depend on the availability of the documentation endpoints.
        - Keep the /v1/status protocol rules in mind when reading the spec: x-hcx-correlation_id must carry the original request's correlation id.

        ### Related scenario

        A TPA's legacy integration platform only imports Swagger 2 definitions. During onboarding to the status flow the team fetches /v2/api-docs from the status service, imports it, and confirms that the /v1/status operation and its StatusSuccessResponse are represented. They then implement the JWE-wrapped status request for preauthorisations that have not received an on_submit callback, and respond to providers' status requests on the status callback.

        ### Specification

        Chapter [Environments and addresses](/docs/nhcx/v1/reference/environments-and-addresses) of the NHCX integration specification.
      parameters:
