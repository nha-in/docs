x-abdm-errors-observed:
  source: Observed live codes, ERR-PYR-. Sent by the PMJAY reference implementation, on none of its published sheets; they arrive inside the sealed response.
  codes:
    - code: ERR-PYR-CLM-007
      message: No prior preauthorization or claim record found for case number
      action: On none of the seven sheets. The SHA HP sandbox sent it for a claim raised under a number of its own rather than the preauthorisation's.
