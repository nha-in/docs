                        type: string
                      entity_type:
                        type: string
                      protocol_status:
                        type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 27/02/2026 15:36:09:004
                api_call_id: c3d2e1f0-a9b8-4c7d-9e6f-5a4b3c2d1e0f
                correlation_id: c3d2e1f0-a9b8-4c7d-9e6f-5a4b3c2d1e0f
