                    properties:
                      sender_code:
                        type: string
                      recipient_code:
                        type: string
                      entity_type:
                        type: string
                      protocol_status:
                        type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 25/08/2026 12:15:00:377
                api_call_id: d4e5f6a7-b8c9-0123-def0-234567890123
                correlation_id: 22334455-6677-8899-aabb-ccddeeff0011
                result:
                  sender_code: 1000004446@hcx
