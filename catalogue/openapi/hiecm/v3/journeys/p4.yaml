# catalogue/openapi/hiecm/v3/journeys/p4.yaml
# Order of calls from the P4-Locker folder of the PHR and locker collection of
# 16 September. Content from the PHR and Locker swagger of the same set.
# The list of health locker providers is last so the earlier steps keep their
# page addresses; a patient reads it before setting a locker up.
- id: p4-locker
  title: Locker
  steps:
    - {op: p4_post_subscription_requests_v3_setup_locker}
    - {op: p4_get_subscription_requests_v3_patients_lockers}
    - {op: p4_get_subscription_requests_v3_patients_lockers_lockerid}
    - {op: p4_get_subscription_requests_v3_patients_requests}
    - {op: p4_get_gateway_v3_health_lockers}
