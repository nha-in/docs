# catalogue/openapi/hiecm/v3/journeys/p1.yaml
# Order of calls from the P1-Registration-login folder of the PHR and locker
# collection of 16 September. Content from the PHR and Locker swagger of the
# same set. Each collection subfolder is its own journey, in collection order,
# so a shared call appears under every method with that method's example.
# ABHA enrolment via Aadhaar calls the M1 enrolment operations, which the
# steps name directly. The certificate and session token calls sit loose at
# the end of the folder and form the last journey here.
- id: p1-create-abha-number-aadhaar-otp
  title: Create ABHA number, Aadhaar OTP
  steps:
    - {op: m1_post_v3_enrollment_request_otp, example: ABHA enrolment via Aadhaar-Send OTP}
    - {op: m1_post_v3_enrollment_enrol_byaadhaar, example: Create ABHA by verifying OTP}
    - {op: m1_post_v3_enrollment_request_otp, example: Mobile Update - Send OTP, optional: true}
    - {op: m1_post_v3_enrollment_auth_byabdm, example: Mobile Update - Verify OTP, optional: true}
    - {op: p1_post_v3_profile_account_request_emailverificationlink, example: Email Verification Link}
    - {op: m1_get_v3_enrollment_enrol_suggestion}
    - {op: m1_post_v3_enrollment_enrol_abha_address, example: ABHA Address}
    - {op: m1_get_v3_profile_account}
    - {op: m1_get_v3_profile_account_abha_card}

- id: p1-create-abha-address-mobile
  title: Create ABHA address, mobile number
  steps:
    - {op: p1_post_v3_phr_app_enrollment_request_otp, example: OTP Request - Mobile}
    - {op: p1_post_v3_phr_app_enrollment_verify, example: OTP Verify - Mobile}
    - {op: p1_post_v3_phr_app_enrollment_suggestion, example: Suggestion API}
    - {op: p1_get_v3_phr_app_enrollment_isexists}
    - {op: p1_post_v3_phr_app_enrollment_enrol, example: Enroll ABHA Address}

- id: p1-create-abha-address-abha-number-abha-otp
  title: Create ABHA address, ABHA number with ABHA OTP
  steps:
    - {op: p1_post_v3_phr_app_enrollment_request_otp, example: OTP Request - ABHA OTP}
    - {op: p1_post_v3_phr_app_enrollment_verify, example: OTP Verify - ABHA OTP}
    - {op: p1_post_v3_phr_app_login_verify_user, example: Verify User}
    - {op: p1_post_v3_phr_app_enrollment_suggestion, example: Suggestion API (2)}
    - {op: p1_get_v3_phr_app_enrollment_isexists}
    - {op: p1_post_v3_phr_app_enrollment_enrol, example: Enroll ABHA Address (2)}

- id: p1-create-abha-address-abha-number-aadhaar-otp
  title: Create ABHA address, ABHA number with Aadhaar OTP
  steps:
    - {op: p1_post_v3_phr_app_enrollment_request_otp, example: OTP Request - AADHAR OTP}
    - {op: p1_post_v3_phr_app_enrollment_verify, example: OTP Verify - AADHAR OTP}
    - {op: p1_post_v3_phr_app_enrollment_suggestion, example: Suggestion API (3)}
    - {op: p1_get_v3_phr_app_enrollment_isexists}
    - {op: p1_post_v3_phr_app_enrollment_enrol, example: Enroll ABHA Address (3)}

