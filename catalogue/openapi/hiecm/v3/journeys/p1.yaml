# catalogue/openapi/hiecm/v3/journeys/p1.yaml
# Order of calls from the P1-Registration-login folder of the PHR and locker
# collection of 16 September. Content from the PHR and Locker swagger of the
# same set. Each collection subfolder is its own journey, in collection order,
# so a shared call appears under every method with that method's example.
# The collection's ABHA enrolment via Aadhaar folder is left out: it names the
# M1 ABHA number operations, which M1 documents, and NHA's PHR V3 document
# registers an ABHA address by mobile or ABHA number only. The PHR V3 document
# puts the PHR certificate first, so the PHR public key is never confused with
# the ABHA service's, and it registers an ABHA address without the verify user
# call, which belongs to login. The two email OTP routes are optional in that
# document; every other route is mandatory.
- id: p1-certificate-and-session
  title: PHR certificate and session token
  steps:
    - {op: p1_get_v3_phr_app_login_public_certificate}
    - {op: gateway_post_gateway_v3_sessions}

- id: p1-create-abha-address-mobile
  title: Create ABHA address, mobile number
  steps:
    - {op: p1_post_v3_phr_app_enrollment_request_otp, example: OTP Request - Mobile}
    - {op: p1_post_v3_phr_app_enrollment_verify, example: OTP Verify - Mobile}
    - {op: p1_post_v3_phr_app_enrollment_suggestion, example: Suggestion API}
    - {op: p1_get_v3_phr_app_enrollment_isexists}
    - {op: p1_post_v3_phr_app_enrollment_enrol, example: Enroll ABHA Address}

- id: p1-create-abha-address-abha-number-abha-otp
  title: Create ABHA address, ABHA number with ABHA OTP
  steps:
    - {op: p1_post_v3_phr_app_enrollment_request_otp, example: OTP Request - ABHA OTP}
    - {op: p1_post_v3_phr_app_enrollment_verify, example: OTP Verify - ABHA OTP}
    - {op: p1_post_v3_phr_app_enrollment_suggestion, example: Suggestion API (2)}
    - {op: p1_get_v3_phr_app_enrollment_isexists}
    - {op: p1_post_v3_phr_app_enrollment_enrol, example: Enroll ABHA Address (2)}

- id: p1-create-abha-address-abha-number-aadhaar-otp
  title: Create ABHA address, ABHA number with Aadhaar OTP
  steps:
    - {op: p1_post_v3_phr_app_enrollment_request_otp, example: OTP Request - AADHAR OTP}
    - {op: p1_post_v3_phr_app_enrollment_verify, example: OTP Verify - AADHAR OTP}
    - {op: p1_post_v3_phr_app_enrollment_suggestion, example: Suggestion API (3)}
    - {op: p1_get_v3_phr_app_enrollment_isexists}
    - {op: p1_post_v3_phr_app_enrollment_enrol, example: Enroll ABHA Address (3)}

- id: p1-login-mobile
  title: PHR login, mobile number
  steps:
    - {op: p1_post_v3_phr_app_login_request_otp, example: OTP Request - Mobile}
    - {op: p1_post_v3_phr_app_login_verify, example: Login OTP Verify - Mobile}
    - {op: p1_post_v3_phr_app_login_verify_user, example: Verify - User}

- id: p1-login-email
  title: PHR login, email (optional)
  steps:
    - {op: p1_post_v3_phr_app_login_request_otp, example: OTP Request - Email}
    - {op: p1_post_v3_phr_app_login_verify, example: Login OTP Verify - Email}
    - {op: p1_post_v3_phr_app_login_verify_user, example: Verify - User (2)}

- id: p1-login-abha-address-mobile-otp
  title: PHR login, ABHA address with mobile OTP
  steps:
    - {op: p1_post_v3_phr_app_login_request_otp, example: OTP Request - ABHAADDRES Mobile}
    - {op: p1_post_v3_phr_app_login_verify, example: Login OTP Verify - ABHAADDRES Mobile}

- id: p1-login-abha-number-aadhaar-otp
  title: PHR login, ABHA number with Aadhaar OTP
  steps:
    - {op: p1_post_v3_phr_app_login_request_otp, example: OTP Request - AADHAR OTP}
    - {op: p1_post_v3_phr_app_login_verify, example: Login OTP Verify - AADHAR}
    - {op: p1_post_v3_phr_app_login_verify_user, example: Verify - User (3)}

- id: p1-login-abha-number-abha-otp
  title: PHR login, ABHA number with ABHA OTP
  steps:
    - {op: p1_post_v3_phr_app_login_request_otp, example: OTP Request - ABHA OTP}
    - {op: p1_post_v3_phr_app_login_verify, example: Login OTP Verify - ABHA}
    - {op: p1_post_v3_phr_app_login_verify_user, example: Verify - User (4)}

- id: p1-login-abha-address-password
  title: PHR login, ABHA address with password
  steps:
    - {op: p1_post_v3_phr_app_login_search, example: Search Auth Methods - ABHAAddress}
    - {op: p1_post_v3_phr_app_login_verify, example: Login Verify - Password}

- id: p1-login-abha-address-email-otp
  title: PHR login, ABHA address with email OTP (optional)
  steps:
    - {op: p1_post_v3_phr_app_login_request_otp, example: OTP Request - ABHAADDRES Email}
    - {op: p1_post_v3_phr_app_login_verify, example: Login OTP Verify - ABHAADDRESS Email}

- id: p1-login-aadhaar-otp
  title: PHR login, Aadhaar OTP
  steps:
    - {op: p1_post_v3_phr_app_login_request_otp, example: new OTP Request- AADHAAR}
    - {op: p1_post_v3_phr_app_login_verify, example: new OTP verify- AADHAAR}
    - {op: p1_post_v3_phr_app_login_verify_user, example: Verify - User (5)}
