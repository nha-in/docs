# catalogue/openapi/hiecm/v3/journeys/m1.yaml
# Identifiers are encrypted locally under the public certificate before the search call; the helper endpoint in the collection is not part of the final set.
# Order of calls from the M1 collection of 15 September. Content from the
# M1 swagger of 16 September. Each ABHA creation method is its own journey
# so the shared calls appear under every method with that method's example.
# Biometric login follows the swagger examples; the collection's v3.1 and
# Face Auth QR calls are not in the final set.
- id: m1-session
  title: Session, tokens and certificate
  steps:
    - {op: gateway_post_gateway_v3_sessions}
    - {op: m1_get_v3_profile_public_certificate}

- id: m1-create-aadhaar-otp
  title: ABHA creation, Aadhaar OTP
  steps:
    - {op: gateway_post_gateway_v3_sessions}
    - {op: m1_get_v3_profile_public_certificate}
    - {op: m1_post_v3_enrollment_request_otp, example: ABHA enrolment via Aadhaar-Send OTP}
    - {op: m1_post_v3_enrollment_enrol_byaadhaar, example: Create ABHA by verifying OTP}
    - {op: m1_post_v3_enrollment_request_otp, example: Mobile Update - Send OTP, optional: true}
    - {op: m1_post_v3_enrollment_auth_byabdm, example: Mobile Update - Verify OTP, optional: true}
    - {op: m1_get_v3_enrollment_enrol_suggestion}
    - {op: m1_post_v3_enrollment_enrol_abha_address, example: ABHA Address}

- id: m1-create-face
  title: ABHA creation, face authentication
  steps:
    - {op: gateway_post_gateway_v3_sessions}
    - {op: m1_get_v3_profile_public_certificate}
    - {op: m1_post_v3_enrollment_enrol_auth_init, example: Init Transaction}
    - {op: m1_post_v3_enrollment_enrol_capturepid, example: Capture PID}
    - {op: m1_post_v3_enrollment_enrol_byaadhaar, example: Create ABHA via Biometrics- Aadhaar Faceauth}
    - {op: m1_post_v3_enrollment_request_otp, example: Mobile Update - Send OTP, optional: true}
    - {op: m1_post_v3_enrollment_auth_byabdm, example: Mobile Update - Verify OTP, optional: true}
    - {op: m1_get_v3_enrollment_enrol_suggestion}
    - {op: m1_post_v3_enrollment_enrol_abha_address, example: ABHA Address}

- id: m1-create-fingerprint
  title: ABHA creation, fingerprint
  steps:
    - {op: gateway_post_gateway_v3_sessions}
    - {op: m1_get_v3_profile_public_certificate}
    - {op: m1_post_v3_enrollment_enrol_byaadhaar, example: Create ABHA via Biometrics- Aadhaar Bio (Fingerprint)}
    - {op: m1_post_v3_enrollment_request_otp, example: Mobile Update - Send OTP, optional: true}
    - {op: m1_post_v3_enrollment_auth_byabdm, example: Mobile Update - Verify OTP, optional: true}
    - {op: m1_get_v3_enrollment_enrol_suggestion}
    - {op: m1_post_v3_enrollment_enrol_abha_address, example: ABHA Address}

