      operationId: p4_get_subscription_requests_v3_patients_requests
      summary: This API will be invoked to get all the consent and subscription requests with given filters.
      description: This API endpoint is used to retrieve all consent and subscription requests based on specified filters. By invoking this API, users can obtain a comprehensive list of requests that match the given criteria, including details about their status, scope, and any associated conditions. This functionality is essential for managing and tracking consent and subscription requests efficiently, ensuring that users have access to accurate and up-to-date information.
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for tracking the end-to-end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds, and milliseconds
        - name: X-CM-ID
          in: header
          required: true
          schema:
            type: string
          example: sbx
          description: Suffix of the consent manager to which the request was intended
        - name: X-AUTH-TOKEN
          in: header
          required: true
          description: JWT Authentication token which was issued by ABDM after successful validation of username and password
          schema:
            type: string
            format: bearer
            minimum: 1
            maximum: 100
            example: <TOKEN>
        - name: consentLimit
          in: query
          required: true
          schema:
            type: string
            default: "-1"
          description: The consent limit - to limit records being fetched
        - name: consentOffset
          in: query
          required: true
          schema:
            type: string
            default: "0"
          description: The consent offset - to skip the records before fetching the first record
        - name: subscriptionLimit
          in: query
          required: true
          schema:
            type: string
            default: "-1"
          description: The subscription limit - to limit records being fetched
        - name: subscriptionOffset
          in: query
          required: true
          schema:
            type: string
            default: "0"
          description: The subscription offset - to skip the records before fetching the first record
        - name: status
          in: query
          required: true
          schema:
            type: string
            default: ALL
            enum:
              - ALL
              - REQUESTED
              - DENIED
              - GRANTED
              - REVOKED
              - EXPIRED
            example: ALL
          description: The status of the subscription and consent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  consents:
                    type: object
                    properties:
                      size:
