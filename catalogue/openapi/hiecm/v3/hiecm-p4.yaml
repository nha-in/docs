      operationId: p4_get_subscription_requests_v3_patients_lockers_lockerid
      summary: This API will be invoked to get health locker settings of a patient by locker id.
      description: This API endpoint is used to retrieve the health locker settings of a patient using the locker ID. By invoking this API, users can access detailed information about the configuration and preferences of the patient’s health locker. This functionality is essential for managing and customizing the storage and access settings of health records, ensuring that patients have control over their health information. The API supports secure and efficient retrieval of health locker settings, enhancing the overall management of health data within the healthcare ecosystem.
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for tracking the end-to-end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds, and milliseconds
        - name: X-CM-ID
          in: header
          required: true
          schema:
            type: string
          example: sbx
          description: Suffix of the consent manager to which the request was intended
        - name: X-AUTH-TOKEN
          in: header
          required: true
          schema:
            type: string
            format: bearer
            minimum: 1
            maximum: 100
          example: <TOKEN>
          description: JWT Authentication token issued by ABDM after successful validation of username and password
        - name: lockerId
          in: path
          required: true
          schema:
            type: string
          description: The locker id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lockerId:
                    type: string
                    nullable: false
                    example: "1234"
                  lockerName:
                    type: string
                    nullable: false
                    example: Locker 1
                  active:
                    type: boolean
                    nullable: false
                    example: true
