                              type: string
                              nullable: false
                              example: e5ec415f-c098-40f6-a0db-faa162fc5295
                            createdAt:
                              type: string
                              format: date-time
                              nullable: false
                              example: "2021-09-28T12:30:08.573Z"
                            lastUpdated:
