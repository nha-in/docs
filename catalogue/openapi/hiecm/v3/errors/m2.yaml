# The error codes NHA lists for M2, as one list rather than per call.
# Source: "Sandbox2.0 M2 and M3 API review v2", NHA, 21 September 2026, the section
# "Error code put in one place for M2". NHA gives the code and the message
# only, not the HTTP status or the call that returns it. Rows that repeated
# an earlier row exactly are listed once; a code NHA lists with more than
# one message keeps every message.
intro: During ABDM integration, systems may encounter issues across discovery, linking, consent, encryption, and data exchange workflows. This section outlines common errors, their causes, and recommended resolutions to help ensure smooth implementation.
source: Sandbox2.0 M2 and M3 API review v2, NHA, 21 September 2026
