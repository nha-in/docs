  - url: https://sandbox.abdm.gov.in/sandbox/v3/new-documentation?doc=HIPInitiatedlinking
    role: upstream
    status: not-yet-fetched
  - url: https://sandbox.abdm.gov.in/sandbox/v3/newdocumentation?doc=DiscoveryAndlink
    role: upstream
    status: not-yet-fetched
  - url: https://sandbox.abdm.gov.in/sandbox/v3/newdocumentation?doc=RequestHealthRecords
    role: upstream
    status: not-yet-fetched
  - url: https://sandbox.abdm.gov.in/sandbox/v3/new-documentation/swagger
    role: upstream
    status: not-yet-fetched
    note: The published swagger. Fetch and hash it before filling `paths`.

externalDocs:
  description: NRCeS FHIR R4 profiles, which every M2 bundle must validate against
  url: https://nrces.in/ndhm/fhir/r4/index.html

servers:
  - url: https://dev.abdm.gov.in
    description: 'Sandbox. Pair it with the `X-CM-ID: sbx` header.'
  - url: https://apis.abdm.gov.in
    description: 'Production. Pair it with the `X-CM-ID: abdm` header.'

security:
  - gatewaySession: []

tags:
  - name: hip-initiated-linking
    description: >
      Linking a care context when the patient gave you their ABHA address at
      registration. Needs a link token, which you validate before use and
      regenerate through demographic authentication when it has expired.
  - name: mobile-notification
    description: >
      The path for a patient who gave a mobile number rather than an ABHA
      address. ABDM sends them an SMS with a deep link, and they link the
      record themselves from a PHR app.
  - name: discovery-and-link
    description: >
      Answering a patient who is searching your facility from a PHR app. You
      match them from the identifiers ABDM supplies and return care contexts.
      No clinical detail may appear in a discovery response, only the
      reference number and display name.
  - name: health-information-request
    description: >
      Receiving a consented request for records and posting the encrypted
      FHIR bundles to the data push URL it names.

# Path inventory to fill at ingestion, from NHA's M2 material. Kept as a
# comment rather than as empty operations, because an operation with no
# request or response schema reads as a contract and is not one.
#
#   HIP calls the gateway:   care context link, link confirm, discovery
#                            response, health information transfer
#   Gateway calls the HIP:   discovery request, link request,
#                            health information request
#
# Confirm every path against the swagger. None of them is transcribed here
# from memory.
paths: {}

# Callbacks NHA makes to your bridge. Transcribed from NHA's milestone
# document; none has been observed against the sandbox.
webhooks:
  /v0.5/care-contexts/discover:
    post:
      operationId: m2_on_discovery_request
      summary: "A discovery request for a patient you may hold records for"
      description: |
        Inbound to every HIP. Answer with care context metadata only: NHA states that a discovery response carries no clinical or sensitive data. A rejected answer is reported as ABDM-1109.

        Transcribed from NHA's milestone document. Not run against the ABDM sandbox, so the payload is unconfirmed.
      responses:
        '202':
          description: "Your bridge accepted the callback. NHA validates the body you send back, so a 202 carrying the wrong body is still a failure."
  /v0.5/links/link/init:
    post:
      operationId: m2_on_link_init
      summary: "A request to start linking a care context"
      description: |
        Inbound to the HIP. A duplicate arrives as ABDM-1104, and a rejected answer as ABDM-1110.

        Transcribed from NHA's milestone document. Not run against the ABDM sandbox, so the payload is unconfirmed.
      responses:
        '202':
          description: "Your bridge accepted the callback. NHA validates the body you send back, so a 202 carrying the wrong body is still a failure."
  /v0.5/links/link/confirm:
    post:
      operationId: m2_on_link_confirm
      summary: "Confirmation of a link, carrying the token the patient approved"
      description: |
        Inbound to the HIP. A duplicate arrives as ABDM-1105, and a rejected answer as ABDM-1111.

        Transcribed from NHA's milestone document. Not run against the ABDM sandbox, so the payload is unconfirmed.
      responses:
        '202':
          description: "Your bridge accepted the callback. NHA validates the body you send back, so a 202 carrying the wrong body is still a failure."
  /v0.5/health-information/hip/request:
    post:
      operationId: m2_on_health_information_request
      summary: "A request for the records a consent covers"
      description: |
        Inbound to the HIP, carrying the consent id, the date range, the data push URL and the encryption parameters. NHA states 20 minutes from this request to the data push.

        Transcribed from NHA's milestone document. Not run against the ABDM sandbox, so the payload is unconfirmed.
      responses:
        '202':
          description: "Your bridge accepted the callback. NHA validates the body you send back, so a 202 carrying the wrong body is still a failure."
  /v0.5/consents/hiu/notify:
    post:
      operationId: m2_on_consent_notify_hiu
      summary: "A consent notification to an HIU bridge"
      description: |
        Inbound to the HIU bridge, at the bridge URL you registered.

        Transcribed from NHA's milestone document. Not run against the ABDM sandbox, so the payload is unconfirmed.
      responses:
        '202':
          description: "Your bridge accepted the callback. NHA validates the body you send back, so a 202 carrying the wrong body is still a failure."

components:
  securitySchemes:
    gatewaySession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The `accessToken` from `POST /api/hiecm/gateway/v3/sessions`, which
        is described in hiecm-gateway.yaml. Send it as
        `Authorization: Bearer <ACCESS_TOKEN>`.
        M2 also uses per flow tokens, a link token for linking and an
        authorisation token for patient scoped calls. NHA's error table names
        both. Their exact header names go here once the swagger is ingested,
        rather than being guessed now.

  parameters:
    RequestId:
      name: REQUEST-ID
      in: header
      required: true
      description: >
        A fresh UUID that you generate for this request. The callback that
        answers it carries the same value, so this is how you match an
        asynchronous reply to the call that caused it. Store it before you
        send the request, not after.
      schema:
        type: string
        format: uuid
      example: 5f7a4a1e-59ba-4c0c-9e0c-8e6b3b6e2f11

    Timestamp:
      name: TIMESTAMP
      in: header
      required: true
      description: >
        The current time in ISO 8601, in IST, the +05:30 offset, from a synchronised clock. Working integrations send IST rather than the UTC that NHA's collection templates emit.
      schema:
        type: string
        format: date-time
      example: '2026-08-24T15:45:30.000+05:30'

    CmId:
      name: X-CM-ID
      in: header
      required: true
      description: >
        Which consent manager you are talking to. `sbx` on the sandbox and
        `abdm` in production. NHA's M2 error table has a dedicated code for
        an invalid value here, which tells you how often it is wrong.
      schema:
        type: string
      examples:
        sandbox:
          value: sbx
        production:
          value: abdm

