                              description: The public key, Base64 encoded, in X.509 SubjectPublicKeyInfo form.
                          description: The public half of the ephemeral key pair generated for this transaction.
                        nonce:
                          type: string
                          format: uuid
                          nullable: false
                          example: 28236d89-cb13-479d-ad71-7a57d5f669a9
                          description: 32 random bytes, Base64 encoded, generated for this transaction. The other side combines it with its own nonce to derive the AES-GCM key and initialisation vector.
                      description: The requester's half of the ECDH key agreement. The HIP derives the shared key from it and its own key pair, and encrypts every entry it pushes with AES-GCM.
