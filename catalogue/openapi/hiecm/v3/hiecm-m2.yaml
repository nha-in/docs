                      properties:
                        cryptoAlg:
                          type: string
                          nullable: false
                          example: ECDH
                          description: The key agreement algorithm. Always ECDH.
                        curve:
                          type: string
                          nullable: false
                          example: curve25519
                          description: The curve the key pair is generated on. Always Curve25519.
                        dhPublicKey:
                          type: object
                          nullable: false
                          required:
                            - expiry
