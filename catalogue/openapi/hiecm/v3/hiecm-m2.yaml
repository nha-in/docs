                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1006 - Bad Request, invalid request Body. May be returned either bare (`ABDM-1006`) or with a trailing ": " separator (`ABDM-1006: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1006
                      message:
