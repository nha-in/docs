  /api/v3/consent/request/hip/notify:
    post:
      tags:
        - consent-management-data-flow-hip
      operationId: m2_post_v3_consent_request_hip_notify
      summary: This is a callback api to notify hip when consent is APPROVED or REVOKED.
      description: |-
        **Hosted by the HIP/HIU, not by ABDM.** ABDM calls this endpoint at the callback URL registered for your bridge, so the path below is relative to that URL.
        Notification of consents to health information providers consent request granted, consent revoked, consent expired. Only the GRANTED, REVOKED and EXPIRED status notifications will be sent to HIP. If consent is granted, status=GRANTED, then consentDetail contains the consent artefact details and signature is available. If consent is revoked, then status=REVOKED, and consentId specifes which consent artefact is revoked. If the consent has expired, then status=EXPIRED, and consentId specifies which consent artefact has expired. Note, this is also responsibility of the HIP to keep track of consent expiry. Any data request on expired consent artefact must not be done.
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for track the end to end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
        - name: X-HIP-ID
          in: header
          required: true
          schema:
            type: string
          example: IN2810014366
          description: Identifier of the health information provider to which the request was intended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notification
              properties:
                notification:
                  type: object
                  nullable: false
                  required:
                    - status
                    - consentId
                    - consentDetail
                    - signature
                    - grantAcknowledgement
                  properties:
                    status:
                      type: string
                      nullable: false
                      enum:
                        - GRANTED
                        - EXPIRED
                        - DENIED
                        - REQUESTED
                        - REVOKED
                    consentId:
                      type: string
