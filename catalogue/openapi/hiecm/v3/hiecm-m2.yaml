          schema:
            type: string
          example: IN2810014366
          description: Identifier of the health information provider to which the request was intended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notification
              properties:
                notification:
                  type: object
                  required:
                    - patient
                    - careContext
                    - hiTypes
                    - hip
                    - date
                  properties:
                    patient:
                      type: object
                      required:
                        - id
                      properties:
                        id:
                          type: string
                          nullable: false
                          example: <ABHA_ADDRESS>
                          description: The abha address of the patient
                    careContext:
                      type: object
                      description: A care context - one episode or record grouping at the HIP.
                      required:
                        - patientReference
                        - careContextReference
                      properties:
                        patientReference:
                          type: string
                          nullable: false
                          example: <ABHA_ADDRESS>
                          description: '"A patient identifier with which patient is registered in the facility/hospital"'
                        careContextReference:
                          type: string
                          nullable: false
                          example: b009a970-8b04-4779-abd1-b50f113245bf
                          description: An identifier of patient's care context created in HIP. A care context is a group of patient's health data (Not the actual health data)
                    hiTypes:
                      type: array
                      description: Type of health data that created in the care context
                      items:
                        type: string
                        enum:
                          - DiagnosticReport
                          - DischargeSummary
                          - HealthDocumentRecord
                          - ImmunizationRecord
                          - OPConsultation
                          - Prescription
                          - WellnessRecord
                          - Invoice
                        nullable: false
                        example: DiagnosticReport
                    date:
                      type: string
                      format: date-time
                      nullable: false
                      example: "2024-05-09T10:34:00.387Z"
                      description: This should be a UTC Date & Time in ISO format
                    hip:
                      type: object
                      description: The HIP that linked the care context. Only id is required.
                      required:
                        - id
                      properties:
                        id:
                          type: string
                          nullable: false
                          example: ABDM_HIP
                          description: The service ID of the health information provider
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          content:
