  /health-information/transfer:
    post:
      tags:
        - consent-management-data-flow-hip
      operationId: m2_post_health_information_transfer
      summary: health information transfer API
      description: <p><strong>NOTE:</strong> This API is actually the callback URL that is passed as <code>dataPushUrl</code> in the data request API - <code>/api/v3/hip/health-information/request</code>. This API is directly called by HIP Data Bridge and is not mediated via CM, and hence not routed through the Gateway.</p> <ul> <li>This API should be implemented at HIU side. It may be implemented by the Data Bridge representing the HIU.</li> <li>Entry elements may be content or link, although for version 1, entry content is preferred.</li> <li>Entry content (or even link reference content) must be encrypted by means of Elliptic-curve Diffie–Hellman Key Exchange, utilizing the HIU key materials that are passed through the data request API - <code>/api/v3/hip/health-information/request</code>.</li> <li>Media contains the mimetype of content, and for v1, it is "application/fhir+json".</li> <li>Checksum is MD5 checksum of the data content, before encryption.</li> <li>Please refer to the ABDM Sandbox Documentation for the format of FHIR bundle that is passed through content.</li> </ul> <ol type="*"><li><strong>Authorization token is mandatory for this api.</strong></li></ol>
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pageNumber
                - pageCount
                - transactionId
                - entries
                - keyMaterial
              properties:
                pageNumber:
                  type: integer
                  nullable: false
                  description: Current page number.
                pageCount:
                  type: integer
                  nullable: false
                  example: 1
                  description: Total number of pages.
                transactionId:
                  type: string
                  nullable: false
                  description: Transaction Id issued when data requested.
                entries:
                  type: array
                  items:
                    type: object
                    required:
                      - content
                      - media
                      - checksum
                      - careContextReference
                    properties:
                      content:
                        type: string
                        nullable: false
                        example: Encrypted content of data packaged in FHIR bundle
                        description: Encrypted content
                      media:
                        type: string
                        nullable: false
                        example: application/fhir+json
                        enum:
                          - application/fhir+json
                      checksum:
                        type: string
                        nullable: false
                        example: string
                        description: Md5 checksum of the content before encryption
                      careContextReference:
                        type: string
                        nullable: false
                        example: 1931-nd2
                        description: care context reference number.
                keyMaterial:
                  type: object
                  description: Encryption and decryption key details.
                  required:
                    - cryptoAlg
                    - curve
                    - dhPublicKey
                    - nonce
                  properties:
                    cryptoAlg:
                      type: string
                      nullable: false
                      enum:
                        - ECDH
                    curve:
                      type: string
                      nullable: false
                      enum:
                        - Curve25519
                    dhPublicKey:
                      type: object
                      required:
                        - expiry
                        - parameters
                        - keyValue
                      properties:
                        expiry:
                          type: string
                          nullable: false
                        parameters:
                          type: string
                          description: Parameters of the encryption and decryption key.
                          nullable: false
                          enum:
                            - Curve25519/32byte random key
                        keyValue:
                          type: string
                          nullable: false
                    nonce:
                      type: string
                      nullable: false
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: '4500 - Unknown error. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                        nullable: false
                        example: "4500"
                      message:
                        type: string
                        nullable: false
