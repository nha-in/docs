# Module M2: care context linking and HIP data sharing.
#
# Rules this file follows: catalogue/openapi/CONVENTIONS.md
openapi: 3.1.1

info:
  x-portal:
    module: m2
    label: M2 Linking and sharing
    position: 3
  title: ABDM M2, care context linking and data sharing
  summary: Tell ABDM that a patient has records at your facility, and hand those records over when a consented request arrives.
  description: |
    M2 is the provider side. Your system holds health records, so ABDM calls
    you a Health Information Provider, or HIP. Two things happen here.

    First, linking. When you create a record for a patient, you group it into
    a care context and link that care context to the patient's ABHA address.
    The consent manager never sees the record itself, only a reference number
    and a display name, which is why it is called data blind.

    Second, sharing. When a request backed by a consent artefact reaches you,
    you package the records as FHIR R4 bundles, encrypt them, and post them
    to the URL in the request.

    Most of M2 is asynchronous. You call the gateway, it answers with an
    acknowledgement, and the real answer arrives later as a callback to a URL
    you registered. Those callbacks belong under `webhooks` in this file.

    Prerequisite: a valid facility id and the HIP role. Without both, every
    call here fails on authorisation rather than on anything you sent.

    No operation in this file has been run against the sandbox from this
    repository. `paths` and `webhooks` stay empty until NHA's swagger is
    fetched, hashed and stored under `.raw/`.
  version: abdm-v3
  license:
    name: MIT
    identifier: MIT
  contact:
    name: ABDM sandbox support
    url: https://devforum.abdm.gov.in
  x-abdm-gateway: hiecm
  x-abdm-module: M2
  x-abdm-phase: 1
  x-abdm-roles: [hip, his]

