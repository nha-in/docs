components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: M4 declares bearer authentication. The published M4 specifications name no call that issues the token.
  schemas:
    AadhaarGetTransactionRequest:
      type: object
      properties:
        txnId:
          type: string
    AadharVerifyResponsePayload:
      type: object
      properties:
        txnId:
          type: string
        mobileNumber:
          type: string
        photo:
          type: string
        gender:
          type: string
        name:
          type: string
        email:
          type: string
        pincode:
          type: string
        birthdate:
          type: string
        careOf:
          type: string
        house:
          type: string
        street:
          type: string
        landmark:
          type: string
        locality:
          type: string
        villageTownCity:
          type: string
        subDist:
          type: string
        district:
          type: string
        state:
          type: string
        postOffice:
          type: string
        address:
          type: string
    HPRIDGenerateMobileOTPResponseDTO:
      type: object
      properties:
        txnId:
          type: string
        mobileNumber:
          type: string
    MobileDemographicAuthResponseModel:
      type: object
      properties:
        verified:
          type: boolean
    CreateAccountWithPreVerifiedAadhaar:
      required:
        - email
        - txnId
      type: object
      properties:
        idType:
          type: string
          example: hpr_id
        domainName:
          type: string
          example: "@hpr.abdm"
        email:
          type: string
          description: Email Address of the user.
          example: <ABHA_ADDRESS>.com
        firstName:
          type: string
          description: First Name of the user).
          example: Ayushman
        middleName:
          type: string
          description: "Middle name of the user "
          example: Bharat
        lastName:
          type: string
          description: "Last name of the user "
          example: Mission
        password:
          type: string
          description: Passwords for authentication
          example: Ayushman@143
        profilePhoto:
          type: string
          description: Profile photo of the user (Uploaded by the user).
          example: <BASE64 ENCODED STRING>
        txnId:
          type: string
          description: Transaction ID
          format: uuid
          example: c3b0c27d-e19d-4244-b8bb-3fa19285054a
        hprId:
          type: string
          description: Healthcare Professional ID Alias.
          example: <EMAIL>
        sourceType:
          type: string
          enum:
            - DRIVING_LICENSE
            - AADHAAR
        hpCategoryCode:
          type: integer
          format: int32
          example: 1
        hpSubCategoryCode:
          type: integer
          format: int32
          example: 1
        clientId:
          type: string
          example: V4
        stateCode:
          type: string
        districtCode:
          type: string
        council:
          type: boolean
        role:
          type: integer
          format: int32
    CreateAccountJwtResponse:
      type: object
      properties:
        token:
          type: string
        hprIdNumber:
          type: string
        name:
          type: string
        gender:
          type: string
        yearOfBirth:
          type: string
        monthOfBirth:
          type: string
        dayOfBirth:
          type: string
        firstName:
          type: string
        hprId:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        stateCode:
          type: string
        districtCode:
          type: string
        subDistrictCode:
          type: string
        subDistrictName:
          type: string
        stateName:
          type: string
        districtName:
          type: string
        email:
          type: string
        kycPhoto:
          type: string
        mobile:
          type: string
        categoryId:
          type: integer
          format: int32
        subCategoryId:
          type: integer
          format: int32
        role:
          type: integer
          format: int32
        authMethods:
          uniqueItems: true
          type: array
          items:
            type: string
            enum:
              - AADHAAR_OTP
              - MOBILE_OTP
              - PASSWORD
              - DEMOGRAPHICS
              - AADHAAR_BIO
              - EMAIL_OTP
              - MOBILE_OTP_RESET_PASSWROD
              - FACE_AUTH
        new:
          type: boolean
    HPRIDVerifyMobileOTPRequestDTO:
      type: object
      properties:
        otp:
          type: string
        txnId:
          type: string
    HPRIDVerifyMobileOTPResponseDTO:
      type: object
      properties:
        txnId:
          type: string
        mobileNumber:
          type: string
    HpIdSuggestionRequst:
      required:
        - txnId
