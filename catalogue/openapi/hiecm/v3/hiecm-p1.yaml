# P1 PHR identity and profile.
#
# Derived from NHA's Aarogya Setu Postman collection, which is NHA's own
# PHR. The same calls and the same error codes apply to any PHR.
#
# Rules this file follows: catalogue/openapi/CONVENTIONS.md
openapi: 3.1.1
info:
  title: ABDM P1 PHR identity and profile
  summary: P1 PHR identity and profile, from NHA's reference PHR.
  description: |
    P1 is where a patient gets into their own PHR. Registration, login, the
    profile they see, the family members they manage, and the DigiLocker
    documents they pull in.

    It is the patient facing counterpart of M1: M1 is how a hospital system
    creates an ABHA, P1 is how the patient's own application does it and then
    maintains the account afterwards.

    Nothing in this file has been run against the sandbox from this repository. Sample values are scrubbed.
  version: abdm-v3
  license:
    name: MIT
    identifier: MIT
  contact:
    name: ABDM sandbox support
    url: https://devforum.abdm.gov.in
  x-abdm-gateway: hiecm
  x-abdm-module: p1
  x-abdm-phase: 2
  x-abdm-roles:
  - phr
  x-portal:
    module: p1
    label: P1 PHR identity and profile
    position: 6
    icon: user-round
x-abdm-sources:
- file: catalogue/openapi/.raw/aarogya-setu.postman_collection.json
  role: upstream
  hash: sha256:0264f83b5b6c4635c6e63ac5529ddc72d3fa28b3d578375ca91b13171a7f30c6
  fetched: '2026-08-25'
  note: NHA's Aarogya Setu collection, 248 requests. Aarogya Setu is NHA's own
    PHR, so it stands in for any PHR implementation.
- file: catalogue/openapi/corrections/2026-09-03-p-series-descriptions.md
  role: correction
  hash: sha256:19ec9c925786ede3b664575f705948a022dcb891316e605ce4f2d2006aeb832d
  fetched: '2026-09-03'
  note: One description per operation, written from each operation's own
    signature. The upstream collection names its requests and describes none.
servers:
- url: https://phrsbx.abdm.gov.in
  description: Sandbox host, not yet
    confirmed.
- url: https://phr.abdm.gov.in
  description: Production.
security:
- gatewaySession: []
tags:
- name: digilocker_apis
  description: From NHA's "DigiLocker APIs" folder in the Aarogya Setu collection.
- name: family_management
  description: The Family Management service operations.
- name: global_collection
  description: From NHA's "Global Service Collection service" folder in the Aarogya
    Setu collection.
- name: login
  description: From NHA's "AS Login service" folder in the Aarogya Setu collection.
- name: profile
  description: From NHA's "As profile service" folder in the Aarogya Setu collection.
- name: registration
  description: The As registration service operations.
paths:
  /abha/api/v3/phr/app/enrollment/encrypt:
    post:
      operationId: p1_encryption
      tags:
      - login
      summary: ENCRYPTION
      description: "Encrypts a value with the ABDM public key so it can be sent in the fields that only accept ciphertext, such as `loginId` and OTP values."
      x-abdm-atom: hiecm.endpoint.p1-encryption
      x-abdm-source-folder: AS Login service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: string
              required:
              - data
            examples:
              from_nha_collection:
                summary: Example values, scrubbed
                value:
                  data: <ABHA_NUMBER>
      responses:
        '200':
          description: No response body is documented for this request.
  /abha/api/v3/phr/app/login/profile/abha/verify:
    post:
      operationId: p1_update_mobile_verify_otp
      tags:
      - login
      summary: Update mobile verify OTP
      description: "Verifies the OTP sent for a mobile number update on an ABHA address. `authData` carries the transaction id and the encrypted OTP."
      x-abdm-atom: hiecm.endpoint.p1-update-mobile-verify-otp
      x-abdm-source-folder: AS Login service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                    otp:
                      type: object
                      properties:
                        txnId:
                          type: string
                        otpValue:
                          type: string
                      required:
                      - otpValue
                      - txnId
                  required:
                  - authMethods
                  - otp
              required:
              - authData
              - scope
            examples:
              from_nha_collection:
                summary: Example values, scrubbed
                value:
                  scope:
                  - abha-profile
                  - mobile-verify
                  authData:
                    authMethods:
                    - otp
                    otp:
                      txnId: <TXN_ID>
                      otpValue: <OTPVALUE>
      responses:
        '200':
          description: No response body is documented for this request.
  /api/family-management/assign:
    post:
      operationId: p1_assign
      tags:
      - family_management
      summary: assign
      description: "Links another ABHA address to the signed-in person's address under a relationship type, so the two profiles are managed as a family."
      x-abdm-atom: hiecm.endpoint.p1-assign
      x-abdm-source-folder: Family Management service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                relatedAbhaAddress:
                  type: string
                relationshipTypeId:
                  type: integer
              required:
              - relatedAbhaAddress
              - relationshipTypeId
            examples:
              from_nha_collection:
                summary: Example values, scrubbed
                value:
                  relatedAbhaAddress: nithishnov@sbx
                  relationshipTypeId: 2
      responses:
        '500':
          description: Example values, scrubbed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
        '200':
          description: Example values, scrubbed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  success:
                    type: boolean
                  relationshipId:
                    type: 'null'
                required:
                - message
                - relationshipId
                - success
              examples:
                recorded:
                  summary: Recorded response
                  value:
                    message: Relationship assigned successfully
                    success: true
                    relationshipId: null
        '400':
          description: Example values, scrubbed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
