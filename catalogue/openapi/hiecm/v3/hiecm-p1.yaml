      operationId: p1_verify_user_switch_profile
      tags:
      - profile
      summary: Verify User Switch Profile
      description: "Completes a profile switch: selects the ABHA address to continue as and returns its session tokens."
      x-abdm-atom: hiecm.endpoint.p1-verify-user-switch-profile
      x-abdm-source-folder: As profile service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                abhaAddress:
                  type: string
                txnId:
                  type: string
              required:
              - abhaAddress
              - txnId
            examples:
              from_nha_collection:
                summary: Example values, scrubbed
                value:
                  abhaAddress: <ABHA_ADDRESS>
                  txnId: <TXN_ID>
      responses:
        '400':
          description: Example values, scrubbed.
          content:
            application/json:
              schema:
                type:
                - array
                - object
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    message:
                      type: string
                  required:
                  - code
                  - message
        '200':
          description: Example values, scrubbed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresIn:
                    type: integer
                  refreshToken:
                    type: string
                  refreshExpiresIn:
                    type: integer
                required:
