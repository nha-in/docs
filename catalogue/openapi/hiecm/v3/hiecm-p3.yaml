# P3 PHR consent and notifications.
#
# Derived from NHA's Aarogya Setu Postman collection, which is NHA's own
# PHR. The same calls and the same error codes apply to any PHR.
#
# Rules this file follows: catalogue/openapi/CONVENTIONS.md
openapi: 3.1.1
info:
  title: ABDM P3 PHR consent and notifications
  summary: P3 PHR consent and notifications, from NHA's reference PHR.
  description: |
    P3 is the patient exercising control. Consent requests they have received,
    artefacts they have granted, what they can revoke, and the notifications
    that tell them any of it happened.

    It is the other side of M3. M3 is a requester asking; P3 is the patient
    deciding.

    Nothing in this file has been run against the sandbox from this repository. Sample values are scrubbed.
  version: abdm-v3
  license:
    name: MIT
    identifier: MIT
  contact:
    name: ABDM sandbox support
    url: https://devforum.abdm.gov.in
  x-abdm-gateway: hiecm
  x-abdm-module: p3
  x-abdm-phase: 2
  x-abdm-roles:
  - phr
  x-portal:
    module: p3
    label: P3 PHR consent and notifications
    position: 8
x-abdm-sources:
- file: catalogue/openapi/.raw/aarogya-setu.postman_collection.json
  role: upstream
  hash: sha256:84afbc33fc248dd13f63e12adcd8958c9be30e3877184555f5e5a0a50d5ec92c
  fetched: '2026-08-25'
  note: NHA's Aarogya Setu collection, 248 requests. Aarogya Setu is NHA's own
    PHR, so it stands in for any PHR implementation.
servers:
- url: https://phrsbx.abdm.gov.in
  description: Sandbox host, not yet
    confirmed.
- url: https://phr.abdm.gov.in
  description: Production.
security:
- gatewaySession: []
tags:
- name: consent_management
  description: The Consent Management service operations.
- name: notification_collection
  description: From NHA's "Notification Collection service" folder in the Aarogya
    Setu collection.
