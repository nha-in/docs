  /api/v3/hiu/patient/care-context/on-confirm:
    post:
      tags:
        - abdm-user-initiated-linking-phr
      operationId: p2_post_v3_hiu_patient_care_context_on_confirm
      summary: This API endpoint is used by healthcare information users (HIUs) to receive confirmation of the linked care contexts for a patient. It provides detailed information about the patient’s care contexts, including any errors encountered during the confirmation process.
      description: |-
        **Hosted by the HIP/HIU, not by ABDM.** ABDM calls this endpoint at the callback URL registered for your bridge, so the path below is relative to that URL.
        The on-confirm API endpoint allows HIUs to receive and process the confirmation of care context linking for a patient. When a request is made to this endpoint, it returns a detailed response containing the patient’s care contexts, transaction details, and any errors that occurred. This ensures that HIUs have the necessary information to manage patient care effectively and verify that the care contexts have been correctly linked. <p><strong>NOTE:</strong> In the request body, either 'patient' or 'error' must be included. <ol type = "a"> <li>In case of success scenario, patient object is mandatory and error object is optional</li> <br> <li>In case of failure scenario, error object is mandatory and patient object is optional</li> <br> <li>Response is mandatory in both scenarios</li> </ol>
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for track the end to end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
        - name: X-HIU-ID
          in: header
          required: true
          schema:
            type: string
          example: IN2810014366
          description: Identifier of the health information user to which the request was intended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: In the request body, either 'patient' or 'error' must be included. <ol type = "a"> <li>In case of success scenario, patient object is mandatory and error object is optional</li> <br> <li>In case of failure scenario, error object is mandatory and patient object is optional</li> <br> <li>Response is mandatory in both scenarios</li> </ol>
              required:
                - patient
                - response
              properties:
                response:
                  type: object
                  nullable: false
                  required:
                    - requestId
                  properties:
                    requestId:
                      type: string
                      format: uuid
                      nullable: false
                      minimum: 36
                      maximum: 50
                      example: f29f0e59-8388-4698-9fe6-05db67aeac46
                      description: The request id that was passed.Allows alpha numeric characters and special characters like "^[0-9a-fA-F]{8}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{12}"
                  description: The request id is from the link/confirm callback
                patient:
                  type: object
                  nullable: false
                  required:
                    - referenceNumber
                    - display
                    - careContexts
                    - hiType
                    - count
                  properties:
                    referenceNumber:
                      type: string
                      nullable: false
                      example: abc123
                      description: A patient identifier with which patient is registered in the facility/hospitalauthenticationType.Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. \"':|()/]{0,255}$
                    display:
                      type: string
                      nullable: true
                      example: "12345"
                      description: Display text for patient reference.Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. \"':|()/]{0,255}$"
                    careContexts:
                      type: array
                      description: List of care contexts linked at the HIP end for the identified patient.
                      items:
                        type: object
                        required:
                          - referenceNumber
                          - display
                        properties:
                          referenceNumber:
                            type: string
                            nullable: false
                            example: abc123
                            description: An identifier of patient's care context created in HIP. A care context is a group of patient's health data (Not the actual health data).Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. \"':|()/]{0,255}$
                          display:
                            type: string
                            nullable: true
                            example: "12345"
                            description: Display text for care context reference. Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. \"':|()/]{0,255}$"
                    hiType:
                      type: string
                      nullable: false
                      enum:
                        - DiagnosticReport
                        - DischargeSummary
                        - HealthDocumentRecord
                        - ImmunizationRecord
                        - OPConsultation
                        - Prescription
                        - WellnessRecord
                        - Invoice
                      example: Prescription
                      description: The health information type
                    count:
                      type: integer
                      nullable: false
                      example: 1
                      description: The count should match the number of care contexts in the payload
                error:
                  type: object
                  description: The error code and message, if any occurred.
                  nullable: true
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                      nullable: false
                      example: ABDM-1001
                      description: 'ABDM-1001 - No data found. May be returned either bare (`ABDM-1001`) or with a trailing ": " separator (`ABDM-1001: `); match on the code itself and tolerate the separator.'
                    message:
                      type: string
                      nullable: false
                      example: No data found
                      description: The appropriate error message
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1108 - Notification DB service unavailable. May be returned either bare (`ABDM-1108`) or with a trailing ": " separator (`ABDM-1108: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1108
                      message:
                        type: string
                        example: Duplicate On confirm request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: '900901 - Invalid Credentials. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: "900901"
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: Invalid Credentials. Make sure you have provided the correct security credentials
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: Access Denied
        "500":
          description: Internal Server Error -> It is just one example, for every api the path will be changed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - timestamp
                  - path
                  - status
                  - error
                  - requestId
                properties:
                  timestamp:
                    type: number
                    example: 1731557446506
                  path:
                    type: string
                    example: /api/v3/hiecm/user-initiated-linking/patient/care-context/discover
                  status:
                    type: integer
                    example: 500
                  error:
                    type: string
                    description: The error code and message, if any occurred.
                    example: Internal Server Error
                  requestId:
                    type: string
                    example: d20b575b-2659-4a1b-8c2d-9e3f5a6b7c8d
                    description: The request id that was passed.Allows alpha numeric characters and special characters like "^[0-9a-fA-F]{8}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{12}"
      x-abdm-nha-operation-id: abdm-user-initiated-linking-phr 6
  /api/v3/hiu/patient/on-share:
    post:
      tags:
        - abdm-hiecm-patient-share-phr
      operationId: p2_post_v3_hiu_patient_on_share
      summary: This API will be invoked to the HIU for sharing the response of HIECM's /api/hiecm/patient-share/v3/on-share API
      description: |-
        **Hosted by the HIP/HIU, not by ABDM.** ABDM calls this endpoint at the callback URL registered for your bridge, so the path below is relative to that URL.
        This is a API will be invoked by <b>HIU</b> to share the response of HIECM's /api/hiecm/patient-share/v3/on-share API. <ol type='1'> <li> <b>Header</b>  <ol type='a'> <br/> <li>Authorization will be provided by the gateway session API after the successful verification of client ID and Secret [ Example: <TOKEN> ]</li> <li>REQUEST-ID unique UUID[ Example: 18235d89-cb13-479d-ad71-7a57d5f669a8 ]</li> <li>TIMESTAMP  actual time of the requested was initiated[ Example: 2022-10-06T10:10:00.587Z ]</li> <li>X-HIU-ID  HIU ID[ Example: HIU ]</li> </ol> </li> <br/> <li> <b>Request Body</b> <ol type='a'><br/> <li>Incase of success scenario,acknowledgement is mandatory and error is optional</li> <li>Incase if failure scenario,error is mandatory and acknowledgment is optional</li> <li>response is mandatory object in both the cases</li> </ol> </ol>
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for track the end to end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
        - name: X-HIU-ID
          in: header
          required: true
          schema:
            type: string
          example: HIU_ID
          description: Identifier of the health information user to which the request was intended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: In the request body, either ‘acknowledgement’ or ‘error’ must be included.<br> <ol type='a'><br/> <li>Incase of success scenario,acknowledgement is mandatory and error is optional </li> <li>Incase of failure scenario,error is mandatory and acknowledgment is optional</li> <li>response is mandatory object in both the cases</li> </ol>
              oneOf:
                - type: object
                  required:
                    - acknowledgement
                    - error
                    - response
                  properties:
                    acknowledgement:
                      type: object
                      nullable: false
                      required:
                        - abhaAddress
                        - status
                        - profile
                      properties:
                        status:
                          type: string
                          nullable: false
                          example: SUCCESS
                          description: The status of the transaction.Allows like (SUCCESS|FAILED)
                        abhaAddress:
                          type: string
                          nullable: false
                          example: <ABHA_ADDRESS>
                          description: The abha address of the patient. Should start with Alphanumeric . and  _  in the middle and must be ending with @abdm or @sbx and Allows alpha numeric character and special characters like ^[a-zA-Z0-9][a-zA-Z0-9_.\-!]+[a-zA-Z0-9]@(abdm|sbx)$
                        profile:
                          type: object
                          description: Should be populated only if this is a response for PROFILE_SHARE request
                          required:
                            - context
                            - tokenNumber
                            - expiry
                          properties:
                            context:
                              type: string
                              nullable: false
                              example: "43"
                              description: This is a counter Id. Allows alpha numeric character and special characters like ^(?:[a-zA-Z0-9 ]|[a-zA-Z0-9 ][a-zA-Z0-9.\\-_ ]*[a-zA-Z0-9 ]){1,250}$
                            tokenNumber:
                              type: string
                              nullable: false
                              example: "3"
                              description: The token number generated at HIP for the request
                            expiry:
                              type: number
                              nullable: false
                              example: 180
                              description: The expiry time and should be only numeric value.Allows alpha numeric character and special characters like [\d]*$
                    error:
                      type: object
                      nullable: false
                      description: error is optional object in case of Sucess response.
                      required:
                        - code
                        - message
                      properties:
                        code:
                          type: string
                          pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                          description: 'ABDM-9999 - Unknown exception. May be returned either bare (`ABDM-9999`) or with a trailing ": " separator (`ABDM-9999: `); match on the code itself and tolerate the separator.'
                          nullable: false
                          example: ABDM-9999
                        message:
                          type: string
                          nullable: false
                          example: Unknown exception
                    response:
                      type: object
                      nullable: false
                      required:
                        - requestId
                      properties:
                        requestId:
                          type: string
                          format: uuid
                          nullable: false
                          example: 6f0b4665-a915-4c92-aa36-65afb4a2cd71
                          description: The requestId that was passed.Allows alpha numeric character and special characters like [0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12}
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request. The request could not be processed because it was malformed or failed validation - a missing mandatory field, a value in the wrong format, or a header that did not match the body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1006 - Bad Request, invalid request Body. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                        example: ABDM-1006
                      message:
                        type: string
                        description: Short description of the failure.
                        example: Bad Request, invalid request Body
        "401":
          description: Unauthorized. The request carried no valid credentials, or the access token has expired. Obtain a fresh token from the session API and retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: '900901 - Invalid Credentials. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: "900901"
                  message:
                    type: string
                    description: Short description of the failure.
                    example: Invalid Credentials
                  description:
                    type: string
                    description: Detailed description of the failure.
                    example: "Invalid Credentials. Make sure your API invocation call has a header: 'Authorization : Bearer ACCESS_TOKEN' or 'Authorization : Basic ACCESS_TOKEN' or 'apikey: API_KEY'"
        "403":
          description: Forbidden. The caller is authenticated but is not permitted to perform this operation on this resource.
          content:
            text/plain:
              schema:
                type: string
                example: Forbidden
        "408":
          description: Request Timeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1007 - Connection failed due to timeout. May be returned either bare (`ABDM-1007`) or with a trailing ": " separator (`ABDM-1007: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1007
                      message:
                        type: string
                        example: Connection failed due to timeout
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: '900900 - Unclassified Authentication Failure. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: "900900"
                  message:
                    type: string
                    example: Unclassified Authentication Failure
                  description:
                    type: string
                    example: "Access failure for API: /hiecm/api/v3, version: v3 status: (900900) - Unclassified Authentication Failure"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: 'ABDM-1024 - Dependent service unavailable. May be returned either bare (`ABDM-1024`) or with a trailing ": " separator (`ABDM-1024: `); match on the code itself and tolerate the separator.'
                    nullable: false
                    example: ABDM-1024
                  message:
                    type: string
                    nullable: false
                    example: Dependent service unavailable
      x-abdm-nha-operation-id: profile-share 2
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token from POST /api/hiecm/gateway/v3/sessions, sent with a `Bearer ` prefix.
