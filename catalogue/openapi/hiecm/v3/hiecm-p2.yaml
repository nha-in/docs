          required: true
          description: JWT Authentication token which was issued by ABDM after successful validation of username and password
          schema:
            type: string
            format: bearer
            minimum: 1
            maximum: 100
            example: <TOKEN>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - linkRefNumber
              properties:
                token:
                  type: integer
                  nullable: false
                  example: 123456
                  description: The token number. Must be 6 digit and contain only 0-9. Allows the numerical values like "[\\d]*$"
                linkRefNumber:
