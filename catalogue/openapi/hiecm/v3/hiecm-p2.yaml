            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                    otp:
                      type: object
                      properties:
                        txnId:
                          type: string
                        otpValue:
                          type: string
                    password:
                      type: object
                      properties:
                        abhaAddress:
                          type: string
                        password:
                          type: string
