webhooks:
  /api/v3/hiu/patient/care-context/on-discover:
    post:
      tags:
        - abdm-user-initiated-linking-phr
      operationId: p2_post_v3_hiu_patient_care_context_on_discover
      summary: This API endpoint is used by healthcare information users (HIUs) to receive the discovered care contexts of a patient. It provides detailed information about the patient’s care contexts, including any errors encountered during the discovery process.
      description: |-
        **Hosted by the HIP/HIU, not by ABDM.** ABDM calls this endpoint at the callback URL registered for your bridge, so the path below is relative to that URL.
        The on-discover API endpoint allows HIUs to receive and process the care contexts associated with a patient. When a request is made to this endpoint, it returns a detailed response containing the patient’s care contexts, transaction details, and any errors that occurred. This ensures that HIUs have the necessary information to manage patient care effectively. <p><strong>NOTE:</strong> In the request body, either 'patient' or 'error' must be included. <ol type = "a"> <li>In case of success scenario, patient object is mandatory and error object is optional</li> <br> <li>In case of error scenario, error object is mandatory and patient object is optional</li> <br> <li>Response is mandatory in both scenarios</li> </ol>
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for track the end to end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
        - name: X-HIU-ID
          in: header
          required: true
          schema:
            type: string
          example: IN2810014366
          description: Identifier of the health information user to which the request was intended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: In the request body, either 'patient' or 'error' must be included. <ol type = "a"> <li>In case of success scenario, patient object is mandatory and error object is optional</li> <br> <li>In case of error scenario, error object is mandatory and patient object is optional</li> <br> <li>Response is mandatory in both scenarios</li> </ol>
              required:
                - transactionId
                - patient
                - createdAt
                - response
              properties:
                transactionId:
                  type: string
                  format: uuid
                  nullable: false
                  example: f901b782-bfdf-4224-9f8d-da2cadc20c0d
                patient:
                  type: array
                  nullable: false
                  items:
                    type: object
                    required:
                      - referenceNumber
                      - careContexts
                      - hiType
                      - count
                    properties:
                      referenceNumber:
                        type: string
                        nullable: false
                        example: abc123
                        description: A patient identifier with which patient is registered in the facility/hospital.Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. ()/:\\\\]{0,255}$"
                      display:
                        type: string
                        nullable: true
                        example: "12345"
                        description: Display text for patient reference.Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. \"':|()/]{0,255}$"
                      careContexts:
                        type: array
                        description: List of care contexts linked at the HIP end for the identified patient.
                        items:
                          type: object
                          required:
                            - referenceNumber
                            - display
                          properties:
                            referenceNumber:
                              type: string
                              nullable: false
                              example: abc123
                              description: An identifier of patient's care context created in HIP. A care context is a group of patient's health data (Not the actual health data).Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. ()/:\\\\]{0,255}$"
                            display:
                              type: string
                              nullable: true
                              example: "12345"
                              description: Display text for care context reference. Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. \"':|()/]{0,255}$"
                      hiType:
                        type: string
                        nullable: false
                        enum:
                          - DiagnosticReport
                          - DischargeSummary
                          - HealthDocumentRecord
                          - ImmunizationRecord
                          - OPConsultation
                          - Prescription
                          - WellnessRecord
                          - Invoice
                        example: Prescription
                        description: The health information type
                      count:
                        type: integer
                        nullable: false
                        example: 1
                        description: The count should match the number of care contexts in the payload
                createdAt:
                  type: string
                  format: date-time
                  nullable: false
                  example: "2024-12-31T05:45:35.429Z"
                error:
                  type: object
                  description: The error code and message, if any occurred.
                  nullable: true
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                      nullable: false
                      example: ABDM-1001
                      description: 'ABDM-1001 - No data found. May be returned either bare (`ABDM-1001`) or with a trailing ": " separator (`ABDM-1001: `); match on the code itself and tolerate the separator.'
                    message:
                      type: string
                      nullable: false
                      example: No data found
                      description: The appropriate error message
                response:
                  type: object
                  nullable: false
                  required:
                    - requestId
                  properties:
                    requestId:
                      type: string
                      format: uuid
                      nullable: false
                      minimum: 36
                      maximum: 50
                      example: f29f0e59-8388-4698-9fe6-05db67aeac46
                      description: The request id that was passed.Allows alpha numeric characters and special characters like "^[0-9a-fA-F]{8}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{12}"
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId:
                    type: string
                    example: 0d36501c-551a-4bb5-b247-eec4bb42984b
                  patient:
                    type: array
                    items:
                      type: object
                      properties:
                        referenceNumber:
                          type: string
                          description: Reference number used while linking the health records of the patient.
                          example: example01
                        display:
                          type: string
                          description: Displayed information about the care context.
                          example: abcd-display
                        careContexts:
                          type: array
                          description: List of care contexts linked at the HIP end for the identified patient.
                          items:
                            type: object
                            properties:
                              referenceNumber:
                                type: string
                                description: Reference number used while linking the health records of the patient.
                                example: abcd
                              display:
                                type: string
                                description: Displayed information about the care context.
                                example: 123-display
                        hiType:
                          type: string
                          enum:
                            - DiagnosticReport
                            - DischargeSummary
                            - HealthDocumentRecord
                            - ImmunizationRecord
                            - OPConsultation
                            - Prescription
                            - WellnessRecord
                            - Invoice
                          example: Prescription
                        count:
                          type: integer
                          description: Number of health records in the careContext object.
                          example: 1
                  createdAt:
                    type: string
                    format: date-time
                    example: "2023-06-13T08:05:43.030Z"
                  response:
                    type: object
                    properties:
                      requestId:
                        type: string
                        example: d89525a2-3a3f-4d39-98b5-477afb1865f6
              examples:
                success:
                  value:
                    transactionId: 0d36501c-551a-4bb5-b247-eec4bb42984b
                    patient:
                      - referenceNumber: example01
                        display: abcd-display
                        careContexts:
                          - referenceNumber: abcd
                            display: 123-display
                        hiType: Prescription
                        count: 1
                    createdAt: "2023-06-13T08:05:43.030Z"
                    response:
                      requestId: d89525a2-3a3f-4d39-98b5-477afb1865f6
                Invalid Gender:
                  value:
                    transactionId: 704bd69e-641b-4f92-8709-0d5062336e2c
                    error:
                      code: ABDM-1056
                      message: Gender is invalid
                    response:
                      requestId: f9d4adac-723f-40e6-9f95-9c55ef508cf5
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1106 - Duplicate On discovery request. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                        example: ABDM-1106
                      message:
                        type: string
                        example: Duplicate On discovery request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: '900901 - Invalid Credentials. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: "900901"
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: Invalid Credentials. Make sure you have provided the correct security credentials
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: Access Denied
        "500":
          description: Internal Server Error -> It is just one example, for every api the path will be changed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - timestamp
                  - path
                  - status
                  - error
                  - requestId
                properties:
                  timestamp:
                    type: number
                    example: 1731557446506
                  path:
                    type: string
                    example: /api/v3/hiecm/user-initiated-linking/patient/care-context/discover
                  status:
                    type: integer
                    example: 500
                  error:
                    type: string
                    description: The error code and message, if any occurred.
                    example: Internal Server Error
                  requestId:
                    type: string
                    example: d20b575b-2659-4a1b-8c2d-9e3f5a6b7c8d
      x-abdm-nha-operation-id: abdm-user-initiated-linking-phr 2
