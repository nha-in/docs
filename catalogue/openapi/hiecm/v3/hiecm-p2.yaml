paths:
  /api/hiecm/hip/v3/link/patient/links:
    get:
      tags:
        - abdm-hip-initiated-linking-phr
      operationId: p2_get_hip_v3_link_patient_links
      summary: "This is the PHR  APP API, this api will used to fetch all link care-context for a patient. "
      description: This API endpoint is designed to retrieve all linked care contexts for a patient from various Health Information Providers (HIPs). By invoking this API, users can obtain a comprehensive list of care contexts associated with a patient’s ABHA (Ayushman Bharat Health Account) address. This functionality is essential for ensuring that all relevant health records are accessible and consolidated, thereby supporting coordinated and efficient patient care. The API facilitates seamless health information exchange, enhancing the overall quality and continuity of care within the healthcare ecosystem.
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for track the end to end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
        - name: X-CM-ID
          in: header
          required: true
          schema:
            type: string
          example: sbx
          description: Suffix of the consent manager to which the request was intended
        - name: X-AUTH-TOKEN
          in: header
          required: true
          schema:
            type: string
          description: JWT Authentication token which was issued by ABDM after successful validation of username and password
        - name: limit
          in: query
          required: true
          schema:
            type: integer
          description: Limit the number of records returned. Send -1 to get all the links of the patient.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Patient:
                    type: object
                    required:
                      - id
                      - links
                      - referenceNumber
                      - display
                      - hiTypes
                      - careContexts
                    properties:
                      id:
                        type: string
                        example: <ABHA_ADDRESS>
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            hip:
                              type: object
                              description: Identifier and name of the health information provider.
                              properties:
                                id:
                                  type: string
                                  example: ABDM_HIP
                                name:
                                  type: string
                                  example: ABC Hospital
                                type:
                                  type: string
                                  example: HIP
                            referenceNumber:
                              type: string
                              description: Reference number used while linking the health records of the patient.
                              example: string
                            display:
                              type: string
                              description: Displayed information about the care context.
                              example: string
                            hiType:
                              type: string
                              enum:
                                - DiagnosticReport
                                - DischargeSummary
                                - HealthDocumentRecord
                                - ImmunizationRecord
                                - OPConsultation
                                - Prescription
                                - WellnessRecord
                                - Invoice
                              nullable: false
                              example: DiagnosticReport
                            careContexts:
                              type: array
                              description: List of care contexts linked at the HIP end for the identified patient.
                              items:
                                type: object
                                properties:
                                  referenceNumber:
                                    type: string
                                    description: Reference number used while linking the health records of the patient.
                                    example: TMH-PUID-001
                                  display:
                                    type: string
                                    description: Displayed information about the care context.
                                    example: display 1
                            dateCreated:
                              type: string
                              format: date-time
                              example: "2024-05-09T10:34:00.387Z"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1065 - Invalid X Auth token. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                        example: ABDM-1065
                      message:
                        type: string
                        example: Invalid X Auth token
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: '900902 - Unauthorized. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: "900902"
                  message:
                    type: string
                    example: Unauthorized
                  description:
                    type: string
                    example: "Invalid Credentials. Make sure your API invocation call has a header: 'Authorization : Bearer ACCESS_TOKEN' or 'Authorization : Basic ACCESS_TOKEN' or 'apikey: API_KEY'"
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: Access Denied
        "404":
          description: server cannot find the requested resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1001 - No data found. May be returned either bare (`ABDM-1001`) or with a trailing ": " separator (`ABDM-1001: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1001
                      message:
                        type: string
                        example: No data found
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: 'ABDM-9999 - Unknown exception. May be returned either bare (`ABDM-9999`) or with a trailing ": " separator (`ABDM-9999: `); match on the code itself and tolerate the separator.'
                    example: ABDM-9999
                  message:
                    type: string
                    example: Unknown exception
      x-abdm-nha-operation-id: abdm-hip-initiated-linking-hip 2
  /api/hiecm/user-initiated-linking/v3/patient/care-context/discover:
    post:
      tags:
        - abdm-user-initiated-linking-phr
      operationId: p2_post_user_initiated_linking_v3_patient_care_context_discover
      summary: This API will be invoked by the patient/user from PHR application to discover his/her health records.
      description: This API endpoint is designed to be invoked by the patient or user through the Personal Health Record (PHR) application to discover their health records. By using this API, patients can initiate a search to locate and access their health information across various Health Information Providers (HIPs). This functionality empowers patients to have greater control and visibility over their health data, facilitating a more informed and engaged approach to managing their health. The API supports the seamless retrieval of health records, ensuring that patients can easily discover and review their care contexts.
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for track the end to end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
        - name: X-CM-ID
          in: header
          required: true
          schema:
            type: string
          example: sbx
          description: Suffix of the consent manager to which the request was intended
        - name: X-HIU-ID
          in: header
          required: true
          schema:
            type: string
          example: IN2810014366
          description: Identifier of the health information user to which the request was intended
        - name: X-AUTH-TOKEN
          in: header
          required: true
          description: JWT Authentication token which was issued by ABDM after successful validation of username and password
          schema:
            type: string
            format: bearer
            minimum: 1
            maximum: 100
            example: <TOKEN>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hip
                - unverifiedIdentifiers
              properties:
                hip:
                  type: object
                  description: Identifier and name of the health information provider.
                  nullable: false
                  required:
                    - id
                  properties:
                    id:
                      type: string
                      nullable: false
                      example: cowin_hip_01
                      description: The service ID of the health information provider
                unverifiedIdentifiers:
                  type: array
                  description: Identifiers with which the HIP will search for the patient in its own records.
                  items:
                    type: object
                    required:
                      - type
                      - value
                    properties:
                      type:
                        type: string
                        enum:
                          - MR
                          - MOBILE
                          - ABHA_NUMBER
                          - ABHA_ADDRESS
                        nullable: false
                        example: MOBILE
                      value:
                        type: string
                        nullable: false
                        example: +9198765*****
                        description: Allows alphanumeric characters and special characters like "^(\\+)?[a-zA-Z0-9_\\-@,. ]{0,255}$"
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1103 - Duplicate Discovery request. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                        example: ABDM-1103
                      message:
                        type: string
                        example: Duplicate Discovery request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: '900901 - Invalid Credentials. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: "900901"
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: Invalid Credentials. Make sure you have provided the correct security credentials
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: Access Denied
        "500":
          description: Internal Server Error -> It is just one example, for every api the path will be changed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - timestamp
                  - path
                  - status
                  - error
                  - requestId
                properties:
                  timestamp:
                    type: number
                    example: 1731557446506
                  path:
                    type: string
                    example: /api/v3/hiecm/user-initiated-linking/patient/care-context/discover
                  status:
                    type: integer
                    example: 500
                  error:
                    type: string
                    description: The error code and message, if any occurred.
                    example: Internal Server Error
                  requestId:
                    type: string
                    example: d20b575b-2659-4a1b-8c2d-9e3f5a6b7c8d
                    description: Unique UUID
      x-abdm-nha-operation-id: abdm-user-initiated-linking-phr 1
  /api/hiecm/user-initiated-linking/v3/link/care-context/init:
    post:
      tags:
        - abdm-user-initiated-linking-phr
      operationId: p2_post_user_initiated_linking_v3_link_care_context_init
      summary: This API will be invoked by the patient/user to link his/her health records.
      description: This API endpoint is designed to be invoked by the patient or user to link their health records. By using this API, patients can initiate the process of associating their health information with their ABHA (Ayushman Bharat Health Account) address. This functionality empowers patients to actively manage and consolidate their health records, ensuring that all relevant care contexts are accurately linked and accessible. The API supports a seamless and efficient health information exchange, enhancing the overall quality and continuity of care within the healthcare ecosystem.
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for track the end to end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
        - name: X-CM-ID
          in: header
          required: true
          schema:
            type: string
          example: sbx
          description: Suffix of the consent manager to which the request was intended
        - name: X-HIU-ID
          in: header
          required: true
          schema:
            type: string
          example: IN2810014366
          description: Identifier of the health information user to which the request was intended
        - name: X-AUTH-TOKEN
          in: header
          required: true
          description: JWT Authentication token which was issued by ABDM after successful validation of username and password
          schema:
            type: string
            format: bearer
            minimum: 1
            maximum: 100
            example: <TOKEN>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transactionId
                - patient
              properties:
                transactionId:
                  type: string
                  format: uuid
                  nullable: false
                  example: f901b782-bfdf-4224-9f8d-da2cadc20c0d
                  description: UUID from discover request callback to track the entire user link flow
                patient:
                  type: array
                  nullable: false
                  items:
                    type: object
                    required:
                      - referenceNumber
                      - display
                      - careContexts
                      - hiType
                      - count
                    properties:
                      referenceNumber:
                        type: string
                        nullable: false
                        example: <ABHA_ADDRESS>
                        description: A patient identifier with which patient is registered in the facility/hospital.Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. ()/:\\\\]{0,255}$"
                      display:
                        type: string
                        nullable: true
                        example: Test
                        description: Display text for patient reference.Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. \"':|()/]{0,255}$"
                      careContexts:
                        type: array
                        description: List of care contexts linked at the HIP end for the identified patient.
                        items:
                          type: object
                          required:
                            - referenceNumber
                          properties:
                            referenceNumber:
                              type: string
                              nullable: false
                              example: abc123
                              description: An identifier of patient's care context created in HIP. A care context is a group of patient's health data (Not the actual health data).Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. ()/:\\\\]{0,255}$"
                            display:
                              type: string
                              nullable: true
                              example: Sugar Test
                              description: Display text for care context reference.Allows alpha numeric characters and special characters like "^[a-zA-Z0-9_\\-@,. \"':|()/]{0,255}$"
                      hiType:
                        type: string
                        nullable: false
                        enum:
                          - DiagnosticReport
                          - DischargeSummary
                          - HealthDocumentRecord
                          - ImmunizationRecord
                          - OPConsultation
                          - Prescription
                          - WellnessRecord
                          - Invoice
                        example: OPConsultation
                        description: The health information type
                      count:
                        type: integer
                        nullable: false
                        example: 1
                        description: The count should match the number of care contexts in the payload
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1104 - Duplicate Init request. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                        example: ABDM-1104
                      message:
                        type: string
                        example: Duplicate Init request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: '900901 - Invalid Credentials. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: "900901"
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: Invalid Credentials. Make sure you have provided the correct security credentials
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: Access Denied
        "500":
          description: Internal Server Error -> It is just one example, for every api the path will be changed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - timestamp
                  - path
                  - status
                  - error
                  - requestId
                properties:
                  timestamp:
                    type: number
                    example: 1731557446506
                  path:
                    type: string
                    example: /api/v3/hiecm/user-initiated-linking/patient/care-context/discover
                  status:
                    type: integer
                    example: 500
                  error:
                    type: string
                    description: The error code and message, if any occurred.
                    example: Internal Server Error
                  requestId:
                    type: string
                    example: d20b575b-2659-4a1b-8c2d-9e3f5a6b7c8d
                    description: The request id from discover call back .Allows alpha numeric characters and special characters like "^[0-9a-fA-F]{8}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{12}"
      x-abdm-nha-operation-id: abdm-user-initiated-linking-phr 3
  /api/hiecm/user-initiated-linking/v3/link/care-context/confirm:
    post:
      tags:
        - abdm-user-initiated-linking-phr
      operationId: p2_post_user_initiated_linking_v3_link_care_context_confirm
      summary: This API will be invoked by the patient/user to confirm his/her health records.
      description: This API endpoint is designed to be invoked by the patient or user to confirm their health records. By using this API, patients can validate and confirm the linkage of their health information to their ABHA (Ayushman Bharat Health Account) address. This confirmation process ensures that all relevant care contexts are accurately linked and verified, providing patients with control over their health data. The API supports a seamless and efficient health information exchange, enhancing the overall quality and continuity of care within the healthcare ecosystem.
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
