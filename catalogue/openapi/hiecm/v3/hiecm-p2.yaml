  /api/hiecm/patient-share/v3/share:
    post:
      tags:
        - abdm-hiecm-patient-share-phr
      operationId: p2_post_patient_share_v3_share
      summary: This API will be invoked from the PHR-HIU application for sharing the patient/user profile with the HMIS/LIMS.
      description: "This is a API will be invoked from the <b>PHR-HIU</b> to share the user/patient profile with HMIS/LIMS. <ol type='1'> <li> <b>Header</b>  <ol type='a'> <br/> <li>Authorization will be provided by the gateway session API after the successful verification of client ID and Secret [ Example: <TOKEN> ]</li> <li>REQUEST-ID unique UUID[ Example: 18235d89-cb13-479d-ad71-7a57d5f669a8 ]</li> <li>TIMESTAMP  actual time of the requested was initiated[ Example: 2022-10-06T10:10:00.587Z ]</li> <li>X-AUTH-TOKEN JWT Authentication token which was issued by ABDM after successful validation of username and password[ Example: <TOKEN> ]</li> <li>X-CM-ID  consent manager ID[ Example: sbx ]</li> <li>X-HIU-ID  HIU ID[ Example: HIU ]</li> </ol> </li> <br/> <li> <b>Request Body</b> <ol type='a'><br/> <li>intent This is a key value pair  which contains the purpose [ Example: {purpose: PROFILE_SHARE } ]</li> <li>metaData This is a key value pair which contains the location longitude and latitude[ Example: {hip_id: ABDM_HIP, context: 123, lat: 20.5937 long: 78.9629} ]</li> <li>profile which contains user details.</li> </ol> </ol>"
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for track the end to end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
        - name: X-CM-ID
          in: header
          required: true
          schema:
            type: string
          example: sbx
          description: Suffix of the consent manager to which the request was intended
        - name: X-HIU-ID
          in: header
          required: true
          schema:
            type: string
          example: HIU_ID
          description: Identifier of the health information user to which the request was intended
        - name: X-AUTH-TOKEN
          in: header
          required: true
          description: JWT Authentication token which was issued by ABDM after successful validation of username and password
          schema:
            type: string
            format: bearer
            minimum: 1
            maximum: 100
            example: Bearer <TOKEN>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - intent
                - metaData
                - profile
              properties:
                intent:
                  type: string
                  nullable: false
                  enum:
                    - PROFILE_SHARE
                    - RECORD_SHARE
                    - PAYMENT_SHARE
                  example: PROFILE_SHARE
                  description: The intention of share API call
                metaData:
                  type: object
                  description: A key-value pair carrying the location longitude and latitude.
                  nullable: false
                  required:
                    - hipId
                    - context
                    - latitude
                    - longitude
                  properties:
                    hipId:
                      type: string
                      nullable: false
                      example: HIP_1
                      description: The service ID of the health information provider. Allows alpha numeric character and special characters like [A-Z a-z 0-9]+[A-Z a-z 0-9 @//_//-]*[A-Z a-z 0-9]
                    context:
                      type: string
                      nullable: false
                      example: "6"
                      description: This is a counter Id. Allows alpha numeric character and special characters like ^(?:[a-zA-Z0-9 ]|[a-zA-Z0-9 ][a-zA-Z0-9.\\-_ ]*[a-zA-Z0-9 ]){1,250}$
                    hprId:
                      type: string
                      nullable: true
                      example: <EMAIL>
                      description: Healthcare Professionals Registry id. Allows alpha numeric character and special characters like [a-zA-Z0-9][a-zA-Z0-9_.]+[a-zA-Z0-9]@(dr.abdm|hpr.abdm)$|^[1-9][0-9]{13}$
                    latitude:
                      type: number
                      format: float
                      nullable: true
                      example: 20.5937
                      description: The latitude of the location.Allows alpha numeric character and special characters like ^[0-9-.]+$
                    longitude:
                      type: number
                      format: float
                      nullable: true
                      example: 78.9629
                      description: The longitude of the location.Allows alpha numeric character and special characters like ^[0-9-.]+$
                profile:
                  type: object
                  nullable: false
                  description: This should populated only for PROFILE_SHARE
                  required:
                    - patient
                  properties:
                    patient:
                      type: object
                      nullable: false
                      required:
                        - abhaAddress
                        - name
                        - gender
                        - yearOfBirth
                        - address
                        - phoneNumber
                      properties:
                        abhaNumber:
                          type: string
                          nullable: true
                          example: <ABHA_NUMBER>
                          description: The abha number of the patient. Should be only 14 digit. Allows alpha numeric character and special characters like ^(\\d+-?){13}\\d$
                        abhaAddress:
                          type: string
                          nullable: false
                          example: <ABHA_ADDRESS>
                          description: The abha address of the patient. Should start with Alphanumeric . and  _  in the middle and must be ending with @abdm or @sbx and Allows alpha numeric character and special characters like ^[a-zA-Z0-9][a-zA-Z0-9_.\-!]+[a-zA-Z0-9]@(abdm|sbx)$
                        name:
                          type: string
                          nullable: false
                          example: <NAME>
                          description: The name of the patient. Allows alpha numeric character and special characters like ^[a-zA-Z0-9.-_,]+(([',. -][a-zA-Z0-9. ])?[a-zA-Z0-9. ]*)*$
                        gender:
                          type: string
                          enum:
                            - M
                            - F
                            - O
                            - D
                            - T
                            - U
                          nullable: false
                          example: M
                          description: The gender of the patient
                        dayOfBirth:
                          type: string
                          format: number
                          nullable: true
                          example: <DOB>
                          description: The day of birth of the patient. Only allows numeric values between 1 abd 31 and ^(?!\\s*$)(0?[1-9]|[12][0-9]|3[01])$
                        monthOfBirth:
                          type: string
                          format: number
                          nullable: true
                          example: <DOB>
                          description: The month of birth of the patient. Only allows numeric values between 1 abd 12 and ^(?!\\s*$)(0?[1-9]|[1][0-2])$
                        yearOfBirth:
                          type: string
                          format: number
                          nullable: false
                          example: "9999"
                          description: The month of birth of the patient. Only allows numeric values and must be 4 digit ranging between 1900 and 2200 and ^(?!\\s*$)(19|20|21|22)\\d{2}$
                        address:
                          type: object
                          required:
                            - line
                          properties:
                            line:
                              type: string
                              nullable: true
                              example: Address line 1
                              description: The address line
                            district:
                              type: string
                              nullable: true
                              example: Coimbatore
                              description: The district and should only contain alphabets
                            state:
                              type: string
                              nullable: false
                              example: Tamil Nadu
                              description: The state and should only contain alphabets like [A-Z a-z]+[A-Z a-z //' ']*$
                            pincode:
                              type: string
                              nullable: false
                              example: <PINCODE>
                              description: Should be 5 digits and only contain numbers
                        phoneNumber:
                          type: string
                          nullable: true
                          example: <MOBILE_NUMBER>
                          description: The mobile number of the patient. Must be 10 digit and contain only 0-9 and it allows only numbers like ^(\+\d{1,3}[- ]?)?\d{10}$
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
