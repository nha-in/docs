# P2 PHR linking and records.
#
# Derived from NHA's Aarogya Setu Postman collection, which is NHA's own
# PHR. The same calls and the same error codes apply to any PHR.
#
# Rules this file follows: catalogue/openapi/CONVENTIONS.md
openapi: 3.1.1
info:
  title: ABDM P2 PHR linking and records
  summary: P2 PHR linking and records, from NHA's reference PHR.
  description: |
    P2 is how a patient finds records and attaches them to their ABHA address.
    Care context linking, user initiated linking, scan and share at a facility,
    and health locker subscriptions.

    It is the mirror of M2. M2 is the provider publishing a record; P2 is the
    patient discovering and linking it.

    Nothing in this file has been run against the sandbox from this repository. Sample values are scrubbed.
  version: abdm-v3
  license:
    name: MIT
    identifier: MIT
  contact:
    name: ABDM sandbox support
    url: https://devforum.abdm.gov.in
  x-abdm-gateway: hiecm
  x-abdm-module: p2
  x-abdm-phase: 2
  x-abdm-roles:
  - phr
  x-portal:
    module: p2
    label: P2 PHR linking and records
    position: 7
x-abdm-sources:
- file: catalogue/openapi/.raw/aarogya-setu.postman_collection.json
  role: upstream
  hash: sha256:84afbc33fc248dd13f63e12adcd8958c9be30e3877184555f5e5a0a50d5ec92c
  fetched: '2026-08-25'
  note: NHA's Aarogya Setu collection, 248 requests. Aarogya Setu is NHA's own
    PHR, so it stands in for any PHR implementation.
servers:
- url: https://phrsbx.abdm.gov.in
  description: Sandbox host, not yet
    confirmed.
- url: https://phr.abdm.gov.in
  description: Production.
security:
- gatewaySession: []
tags:
- name: care_context_link
  description: The Care Context Link service operations.
- name: health_locker
  description: From NHA's "Health locker service" folder in the Aarogya Setu collection.
- name: scan_and_share
  description: The Scan and Share service operations.
- name: user_initiated_linking
  description: From NHA's "User Initiated Linking service" folder in the Aarogya
    Setu collection.
