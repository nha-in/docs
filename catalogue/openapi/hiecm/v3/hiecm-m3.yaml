# Module M3: consent and HIU data fetch.
#
# Operations ingested from NHA's M3 OpenAPI file; callback payloads from
# NHA's M3 Postman collection, which is the only NHA source that carries the
# inbound half of the exchange.
#
# Rules this file follows: catalogue/openapi/CONVENTIONS.md
openapi: 3.1.1
info:
  x-portal:
    module: m3
    label: M3 Consent and fetching
    position: 4
  title: ABDM M3, consent and data fetch
  summary: Ask a patient for permission to see their records, then fetch the records
    that permission covers.
  description: |
    M3 is the requester side. You want to read someone else's records, so ABDM
    calls you a Health Information User, or HIU. You raise a consent request, the
    patient grants or denies it, and you fetch against the consent artefacts that
    result.

    Every `webhook` below carries a real payload. M3 is the only milestone
    where both halves of the asynchronous exchange are documented. Sample
    values are scrubbed.
  version: abdm-v3
  license:
    name: MIT
    identifier: MIT
  contact:
    name: ABDM sandbox support
    url: https://devforum.abdm.gov.in
  x-abdm-gateway: hiecm
  x-abdm-module: M3
  x-abdm-phase: 1
  x-abdm-roles:
  - hiu
x-abdm-sources:
- file: catalogue/openapi/.raw/ABDM_M3_API_Swagger.yaml
  role: upstream
  hash: sha256:6d56fd91a3f75575c4382de1489ad4a6a0091d0eece9dfa5278c4d248f6fcf6b
  fetched: '2026-08-25'
  note: NHA's M3 OpenAPI, supplied 2026-08-25. 13 operations. Carries no callbacks.
- file: catalogue/openapi/.raw/M3_postman_collection.json
  role: upstream
  hash: sha256:bc3df44584f306c7ab81f923dcd5fc6bc113c3786f83c4e7e6161a5683f79bf8
  fetched: '2026-08-25'
  note: NHA's M3 collection, 18 requests. Source of every callback payload in
    this file.
- file: catalogue/openapi/.raw/nha-2026-09-01/fixed/hiecm/consent-management-data-flow.yaml
  role: upstream
  hash: sha256:78f8bc3102976944a630081e63cf34e046ee6cd337065c815473cf77b31bdbf2
  fetched: '2026-09-01'
  note: NHA's 2026-09-01 consent and data flow drop, 28 operations, tagged HIU,
    HIP and PHR. Diffed against this file in
    catalogue/openapi/nha-drops/2026-09-01-diffs/m3-consent.md. Closes the
