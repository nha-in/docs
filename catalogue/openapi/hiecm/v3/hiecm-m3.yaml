servers:
- url: https://dev.abdm.gov.in/api
  description: ABDM Gateway (Dev / Sandbox)
- url: https://apis.abdm.gov.in/api
  description: ABDM Gateway (Production)
- url: https://apihspsbx.abdm.gov.in
  description: HSP Registry (Sandbox)
security:
- gatewaySession: []
tags:
- name: consent-request
  description: |
    Raising a consent request against a patient's ABHA address and checking what happened to it. The status call exists because the answer is asynchronous and a callback can be missed.
- name: consent-notification
  description: |
    Being told what the patient decided, and the provider being told the same. Granted, denied and revoked all arrive this way.
- name: health-information-fetch
  description: |
    Fetching records against a granted consent artefact id. The fetch call is acknowledged immediately and the data arrives later as a callback.
- name: auth
  description: Session token & gateway certificate APIs
- name: bridge
  description: Bridge URL registration & service management
- name: consent
  description: Consent request lifecycle, init, status, notify acknowledgement,
    fetch artefact
- name: data-retrieval
  description: Health data retrieval, HI request and transfer completion notification
- name: webhooks
  description: What ABDM sends to your registered URL. You do not call these;
    you receive them.
paths:
  /hiecm/consent/v3/request/init:
    post:
      tags:
      - consent
      summary: Initiate a consent request
      operationId: m3_consent_request_init
      description: |
        Also known as: Consent Init Request.
        Initiates a new consent request for a patient's health records.

        The Gateway notifies the patient via the ABHA App. The patient can approve or deny.
        The HIU receives the patient's decision via a callback to `{hiuBridgeUrl}/v0.5/consents/hiu/notify`.

        **Key fields:**
        - `purpose.code`, ABDM-defined purpose codes (e.g. `CAREMGT`, `BTG`, `PUBHLTH`, `HPAYMT`, `DSRCH`, `PATRQST`)
        - `hiTypes`, Health Information types requested
        - `permission.accessMode`, `VIEW` (read-only) or `STORE`
        - `permission.dataEraseAt`, Consent expiry after which data access is revoked
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/CmId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentInitRequest'
            examples:
              care_management:
                summary: Care Management consent
                value:
                  consent:
                    purpose:
                      text: Care Management
                      code: CAREMGT
                      refUri: http://terminology.hl7.org/CodeSystem/v3-ActReason
                    patient:
                      id: patient@sbx
                    hiu:
                      id: HIU_SERVICE_ID
                      name: City Health HIU
                    hip: null
                    careContexts: null
                    requester:
                      name: Dr. Sharma
                      identifier:
                        type: REGNO
                        value: MCI-12345
                        system: https://www.mciindia.org
                    hiTypes:
                    - Prescription
                    - DiagnosticReport
                    permission:
                      accessMode: VIEW
                      dateRange:
                        from: '2023-01-01T00:00:00.000Z'
                        to: '2024-01-01T00:00:00.000Z'
                      dataEraseAt: '2025-01-01T00:00:00.000Z'
                      frequency:
                        unit: HOUR
                        value: 1
                        repeats: 0
              break_the_glass:
                summary: Break-the-glass emergency consent
                value:
                  consent:
                    purpose:
                      text: Break the Glass
                      code: BTG
                    patient:
                      id: patient@sbx
                    hiu:
                      id: HIU_SERVICE_ID
                      name: City Health HIU
                    hip: null
                    careContexts: null
                    requester:
                      name: Dr. Emergency
                      identifier:
                        type: REGNO
                        value: MCI-99999
                    hiTypes:
                    - DischargeSummary
                    - OPConsultation
                    - Prescription
                    permission:
                      accessMode: VIEW
                      dateRange:
                        from: '2020-01-01T00:00:00.000Z'
                        to: '2024-12-31T00:00:00.000Z'
                      dataEraseAt: '2024-12-31T23:59:59.000Z'
                      frequency:
                        unit: HOUR
                        value: 1
                        repeats: 0
      responses:
        '202':
          description: Consent request initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  consentRequestId:
                    type: string
                    description: ID to track the consent request status
                    x-abdm-correction: C3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-abdm-nha-operation-id: consentRequestInit
      x-abdm-atom: hiecm.endpoint.m3-consent-request-init
  /hiecm/consent/v3/request/status:
    post:
      tags:
      - consent
      summary: Check the status of a consent request
      operationId: m3_consent_request_status
      description: |
        Also known as: Consent Request Status.
        Checks the current status of a previously initiated consent request.
        Can be polled periodically while awaiting patient action.

        **Status values:**
        - `REQUESTED`, Awaiting patient action
        - `GRANTED`, Patient approved; `consentArtefacts` array will contain artefact IDs
        - `DENIED`, Patient denied the request
        - `EXPIRED`, Request timed out without patient action
        - `REVOKED`, Previously granted consent was revoked by the patient
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/CmId'
      - $ref: '#/components/parameters/HiuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - consentRequestId
              properties:
                consentRequestId:
                  type: string
                  description: ID returned from the consent init call
                  examples:
                  - req-uuid-001
                  x-abdm-correction: C3
            examples:
              default:
                value:
                  consentRequestId: req-uuid-001
      responses:
        '200':
          description: Consent request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusResponse'
              examples:
                granted:
                  summary: Consent granted
                  value:
                    consentRequestId: req-uuid-001
                    status: GRANTED
                    consentArtefacts:
                    - id: consent-art-uuid-001
                requested:
                  summary: Awaiting patient action
                  value:
                    consentRequestId: req-uuid-001
                    status: REQUESTED
                    consentArtefacts: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-abdm-nha-operation-id: consentRequestStatus
      x-abdm-atom: hiecm.endpoint.m3-consent-request-status
  /hiecm/consent/v3/request/hiu/on-notify:
    post:
      tags:
      - consent
      summary: Acknowledge a consent notification
      operationId: m3_consent_hiu_on_notify
      description: |
        Also known as: Consent HIU On-Notify.
        **Async Callback:** After ABDM Gateway sends a consent grant/deny notification to the HIU
        bridge URL (`{bridgeUrl}/v0.5/consents/hiu/notify`), the HIU calls this Gateway endpoint
        to acknowledge receipt.

        The Gateway sends this notification when:
        - Patient grants the consent
        - Patient denies the consent
        - A previously granted consent is revoked
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/CmId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentHiuOnNotifyRequest'
            examples:
              grant_ack:
                summary: Acknowledge a granted consent
                value:
                  acknowledgement:
                  - status: OK
                    consentId: consent-art-uuid-001
                  response:
                    requestId: req-uuid-from-hiu-notify
              deny_ack:
                summary: Acknowledge a denied consent
                value:
                  acknowledgement:
                  - status: OK
                    consentId: consent-art-uuid-001
                  response:
                    requestId: req-uuid-from-hiu-notify
      responses:
        '202':
          description: Acknowledgement accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-abdm-nha-operation-id: consentHiuOnNotify
      x-abdm-atom: hiecm.endpoint.m3-consent-hiu-on-notify
  /hiecm/consent/v3/fetch:
    post:
      tags:
      - consent
      summary: Fetch the full consent artefact
      operationId: m3_consent_fetch
      description: |
        Also known as: Consent Fetch.
        Fetches the full consent artefact for a given consent artefact ID.
        Should be called after receiving the `on-notify` callback with status `GRANTED`.

        The artefact contains:
        - Exact care contexts approved
        - HI types permitted
        - Date range for data access
        - Data erase date
        - Digital signature for validation
        - HIP and HIU identifiers

        Store the artefact securely, it is required for the health information request.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/CmId'
      - $ref: '#/components/parameters/HiuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - consentId
              properties:
                consentId:
                  type: string
                  description: Consent artefact ID (from consentArtefacts array
                    in on-notify or status)
                  examples:
                  - consent-art-uuid-001
                  x-abdm-correction: C3
            examples:
              default:
                value:
                  consentId: consent-art-uuid-001
      responses:
        '200':
          description: Consent artefact details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentFetchResponse'
              examples: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-abdm-nha-operation-id: consentFetch
      x-abdm-atom: hiecm.endpoint.m3-consent-fetch
  /hiecm/data-flow/v3/health-information/request:
    post:
      tags:
      - data-retrieval
      summary: Request a patient's health information
      operationId: m3_hiu_health_information_request
      description: |
        Also known as: HIU Health Information Request.
        Requests health data from the HIP for a specific consent artefact.

        The HIU must:
        1. Generate an ECDH key pair before this call
        2. Pass the ECDH public key in `keyMaterial.dhPublicKey`
        3. Expose a `dataPushUrl` endpoint that can receive encrypted FHIR data from the HIP

        The HIP encrypts data using the HIU's public key (ECDH shared secret) and pushes
        it to `dataPushUrl`. The HIU decrypts using its private key + HIP's public key
        from the push request's `keyMaterial`.

        **Supported ECDH curves:** `Curve25519`
        **Supported crypto algorithms:** `ECDH`
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/CmId'
      - $ref: '#/components/parameters/HiuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HIUHealthInfoRequest'
            examples:
              default:
                value:
                  hiRequest:
                    consent:
                      id: consent-art-uuid-001
                    dateRange:
                      from: '2023-01-01T00:00:00.000Z'
                      to: '2024-01-01T00:00:00.000Z'
                    dataPushUrl: https://your-hiu-server.com/abdm/data/push
                    keyMaterial:
                      cryptoAlg: ECDH
                      curve: Curve25519
                      dhPublicKey:
                        expiry: '2024-12-31T00:00:00.000Z'
                        parameters: Curve25519/32byte
                        keyValue: base64-encoded-hiu-ecdh-public-key
                      nonce: base64-encoded-random-nonce-32bytes
      responses:
        '202':
          description: Health information request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId:
                    type: string
                    description: Transaction ID for tracking the data transfer
                      session
                    x-abdm-correction: C3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-abdm-nha-operation-id: hiuHealthInformationRequest
      x-abdm-atom: hiecm.endpoint.m3-hiu-health-information-request
  /hiecm/data-flow/v3/health-information/notify:
    post:
      tags:
      - data-retrieval
      summary: Notify the gateway that data was received
      operationId: m3_hiu_data_flow_notify
      description: |
        Also known as: HIU Data Flow Notification.
        After receiving all FHIR health data at the `dataPushUrl`, the HIU calls this endpoint
        to notify the ABDM Gateway that the data transfer session is complete.

        The `statusNotification.sessionStatus` should be:
        - `RECEIVED`, All data received successfully
        - `FAILED`, Data receipt failed (with details in `statusResponses`)

        The `notifier.type` must be `HIU` (contrast with M2 where the HIP sends the same
        endpoint with `notifier.type: HIP`, and the value it sends is `TRANSFERRED` rather
        than `RECEIVED`; the two milestones report the same event with different values
        because they are the two ends of the same transfer).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/CmId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataFlowNotifyRequest'
            examples:
              success:
                summary: All data received successfully
                value:
                  notification:
                    consentId: consent-art-uuid-001
                    transactionId: txn-uuid-data-001
                    doneAt: '2024-01-15T10:30:00.000Z'
                    notifier:
                      type: HIU
                      id: HIU_SERVICE_ID
                    statusNotification:
                      sessionStatus: RECEIVED
                      hipId: HIP_SERVICE_ID
                      statusResponses:
                      - careContextReference: VISIT-2024-001
                        hiStatus: OK
                        description: Data received and decrypted successfully
                      - careContextReference: LAB-2024-001
                        hiStatus: OK
                        description: Data received and decrypted successfully
              partial_failure:
                summary: One care context failed
                value:
                  notification:
                    consentId: consent-art-uuid-001
                    transactionId: txn-uuid-data-001
                    doneAt: '2024-01-15T10:30:00.000Z'
                    notifier:
                      type: HIU
                      id: HIU_SERVICE_ID
                    statusNotification:
                      sessionStatus: FAILED
                      hipId: HIP_SERVICE_ID
                      statusResponses:
                      - careContextReference: VISIT-2024-001
                        hiStatus: OK
                        description: Received
                      - careContextReference: LAB-2024-001
                        hiStatus: ERRORED
                        description: Checksum mismatch
      responses:
        '202':
          description: Notification accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-abdm-nha-operation-id: hiuDataFlowNotify
      x-abdm-atom: hiecm.endpoint.m3-hiu-data-flow-notify
  /hiecm/data-flow/v3/health-information/request/status/{transaction-id}:
    get:
      tags:
      - data-retrieval
      summary: Health Information Request Status
      operationId: m3_health_information_request_status
      description: |
        Polls the current status of a previously made health information request, by
        transaction id. An alternative to waiting for the `on-request` and data flow
        notify callbacks: useful if a callback was missed, or if the integration
        prefers to poll rather than depend on inbound delivery.
      security:
      - bearerAuth: []
      parameters:
      - name: transaction-id
        in: path
        required: true
        description: The health information request transaction id, from the original request.
        schema:
          type: string
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/CmId'
      responses:
        '200':
          description: Current status of the health information request.
          content:
            application/json:
              schema:
                type: object
                required:
                - transactionId
                - status
                properties:
                  transactionId:
                    type: string
                    x-abdm-correction: C3
                  status:
                    type: string
                    description: |
                      This field is not otherwise constrained. An observed
                      example uses `TRANSFERRED`, the HIP-side session status
                      value; that has not been confirmed against the sandbox.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-abdm-atom: hiecm.endpoint.m3-health-information-request-status
webhooks:
  /api/v3/hiu/consent/request/on-init:
    post:
      operationId: m3_on_consent_request_init
      summary: The consent request was accepted, with its request id
      description: |
        Carries the consent request and the request id. Store the request id: it is how a later notification is tied back to the request you made.


      responses:
        '200':
          description: Your bridge acknowledged the callback with 200 OK. The gateway validates the body
            you send back, so a 200 carrying the wrong body is still a failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                consentRequest:
                  type: object
                  properties:
                    id:
                      type: string
                  required:
                  - id
                error:
                  type: 'null'
                response:
                  type: object
                  properties:
                    requestId:
                      type: string
                  required:
                  - requestId
              required:
              - consentRequest
              - error
              - response
            examples:
              from_nha_collection:
                summary: Example values, scrubbed
                value:
                  consentRequest:
                    id: 77969467-5a92-44bb-9d6c-4caf24907ea5
                  error: null
                  response:
                    requestId: 6cb80f71-49fa-4f8c-93d5-de9916a708e8
      x-abdm-atom: hiecm.callback.m3-on-consent-request-init
      x-abdm-triggered-by: m3_consent_request_init
      tags:
      - webhooks
  /api/v3/hiu/consent/request/notify:
    post:
      operationId: m3_on_consent_request_notify_hiu
      summary: The patient's decision, sent to the requester
      description: |
        On a grant, carries every consent artefact id created against the request, with the request id. On a denial, carries the denial, with `reason` set if the gateway supplied one.


      responses:
        '200':
          description: Your bridge acknowledged the callback with 200 OK. The gateway validates the body
            you send back, so a 200 carrying the wrong body is still a failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notification:
                  type: object
                  properties:
                    consentRequestId:
                      type: string
                    status:
                      type: string
                    reason:
                      type:
                      - string
                      - 'null'
                      description: Set when the request was denied; null otherwise.
                    consentArtefacts:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                        required:
                        - id
                  required:
                  - consentArtefacts
                  - consentRequestId
                  - reason
                  - status
              required:
              - notification
            examples:
              from_nha_collection:
                summary: Example values, scrubbed
                value:
                  notification:
                    consentRequestId: 77969467-5a92-44bb-9d6c-4caf24907ea5
                    status: GRANTED
                    reason: null
                    consentArtefacts:
                    - id: 28ef6ae8-ad03-488d-b26e-940e27154cc0
      x-abdm-atom: hiecm.callback.m3-on-consent-request-notify-hiu
      x-abdm-answered-by: m3_consent_hiu_on_notify
      tags:
      - webhooks
  /api/v3/consent/request/hip/notify:
    post:
      operationId: m3_on_consent_request_notify_hip
      summary: The patient's decision, sent to the record holder
      description: |
        The same decision sent to the system that holds the records, with all care context references.

        `status` only ever carries `GRANTED`, `REVOKED` or `EXPIRED` on this callback.
      responses:
        '200':
          description: Your bridge acknowledged the callback with 200 OK. The gateway validates the body
            you send back, so a 200 carrying the wrong body is still a failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              - consentId
              - consentDetail
              - signature
              - grantAcknowledgement
              properties:
                status:
                  type: string
                  description: The values actually sent to a HIP on this callback.
                  enum:
                  - GRANTED
                  - REVOKED
                  - EXPIRED
                consentId:
                  type: string
                  x-abdm-correction: C3
                consentDetail:
                  type: object
                  required:
                  - schemaVersion
                  - consentId
                  - createdAt
                  - patient
                  - careContexts
                  - purpose
                  - hip
                  - hiu
                  - consentManager
                  - requester
                  - hiTypes
                  - permission
                  properties:
                    schemaVersion:
                      type: string
                    consentId:
                      type: string
                      x-abdm-correction: C3
                    createdAt:
                      type: string
                      format: date-time
                    patient:
                      type: object
                      required:
                      - id
                      properties:
                        id:
                          type: string
                    careContexts:
                      type: array
                      items:
                        type: object
                        required:
                        - patientReference
                        - careContextReference
                        properties:
                          patientReference:
                            type: string
                          careContextReference:
                            type: string
                    purpose:
                      type: object
                      required:
                      - text
                      - code
                      - refUri
                      properties:
                        text:
                          type: string
                        code:
                          type: string
                        refUri:
                          type: string
                    hip:
                      type: object
                      required:
                      - id
                      - name
                      properties:
                        id:
                          type: string
