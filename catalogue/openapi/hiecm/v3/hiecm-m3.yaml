  /health-information/transfer:
    post:
      operationId: m3_on_health_information_transfer
      summary: The encrypted health data itself, pushed to the URL you supplied
      description: |
        The actual encrypted FHIR bundle. The HIP Data Bridge posts this directly to
        the `dataPushUrl` you supplied in the health information request; it is not
        routed through the Gateway, and this literal path is illustrative rather than
        fixed, because `dataPushUrl` is a URL you host and register yourself.

        Decrypt `entries[].content` with the ECDH shared secret derived from your
        private key and `keyMaterial`. `entries[].checksum` is the MD5 of the content
        before encryption, so verify it after decrypting. Large payloads arrive across
        several calls, paginated by `pageNumber` and `pageCount`.
      responses:
        '202':
          description: Accepted. Verify the checksum after decrypting before treating the transfer as complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pageNumber
              - pageCount
              - transactionId
              - entries
              - keyMaterial
              properties:
                pageNumber:
                  type: integer
                  description: Current page number, for a multi-page transfer.
                pageCount:
                  type: integer
                  description: Total number of pages in this transfer.
                transactionId:
                  type: string
                  description: The transaction id issued when the health information was requested.
                  x-abdm-correction: C3
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - content
                    - media
                    - checksum
                    - careContextReference
                    properties:
                      content:
                        type: string
                        description: Encrypted FHIR bundle content.
                      media:
                        type: string
                        enum:
                        - application/fhir+json
                      checksum:
                        type: string
                        description: MD5 checksum of the content, taken before encryption.
                      careContextReference:
                        type: string
                        description: The care context this entry's data belongs to.
                keyMaterial:
                  $ref: '#/components/schemas/ECDHKeyMaterial'
            examples:
              sample:
                summary: Example values, scrubbed
                value:
                  pageNumber: 1
                  pageCount: 1
                  transactionId: 8376a2b0-3fc9-4bb5-8af5-54a49a3910f4
                  entries:
                  - content: encrypted-fhir-bundle-content
                    media: application/fhir+json
                    checksum: d41d8cd98f00b204e9800998ecf8427e
                    careContextReference: manishk@abdm-02
                  keyMaterial:
                    cryptoAlg: ECDH
                    curve: Curve25519
                    dhPublicKey:
                      expiry: '2024-12-31T00:00:00.000Z'
                      parameters: Curve25519/32byte
                      keyValue: base64-encoded-hip-ecdh-public-key
                    nonce: base64-encoded-random-nonce-32bytes
      x-abdm-atom: hiecm.callback.m3-on-health-information-transfer
      tags:
      - webhooks
components:
  securitySchemes:
    gatewaySession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `accessToken` from `POST /api/hiecm/gateway/v3/sessions`, which is described in hiecm-gateway.yaml. Send it as `Authorization: Bearer <ACCESS_TOKEN>`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token obtained from POST /hiecm/gateway/v3/sessions
  parameters:
    RequestId:
      name: REQUEST-ID
      in: header
      required: true
      description: |
        A fresh UUID that you generate for this request. The callback that answers it carries the same value. In M3 a single consent can produce several callbacks, so keep the mapping from request id to consent request id rather than relying on ordering.
      schema:
        type: string
        x-abdm-correction: C3
      example: 5f7a4a1e-59ba-4c0c-9e0c-8e6b3b6e2f11
    Timestamp:
      name: TIMESTAMP
      in: header
      required: true
      description: |
        The current time in ISO 8601 UTC, with milliseconds and the `Z` suffix. NHA's collection fills this with Postman's `$isoTimestamp`, which emits exactly this format. The gateway rejects a request whose timestamp has drifted too far from its own clock, so take this from a synchronised clock rather than from a local one.
      schema:
        type: string
        format: date-time
      example: '2026-08-25T15:51:15.339Z'
    CmId:
      name: X-CM-ID
      in: header
      required: true
      description: |
        Which consent manager you are talking to. `sbx` on the sandbox and `abdm` in production.
      schema:
        type: string
      examples:
        sandbox:
          value: sbx
        production:
          value: abdm
    HiuId:
      name: X-HIU-ID
      in: header
      required: true
      description: |
        Identifier of the health information user the request or callback is intended for.
      schema:
        type: string
      example: IN2810014366
  schemas:
    SessionRequest:
      type: object
      required:
      - clientId
      - clientSecret
      - grantType
      properties:
        clientId:
          type: string
          description: Client ID issued during HIU registration
        clientSecret:
          type: string
          description: Client secret (keep confidential)
        grantType:
          type: string
          enum:
          - client_credentials
    SessionResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          examples:
          - bearer
        expiresIn:
          type: integer
          description: Token lifetime in seconds
          examples:
          - 1800
    CertsResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty:
                type: string
              use:
                type: string
              kid:
                type: string
              n:
                type: string
              e:
                type: string
    OpenIdConfiguration:
      type: object
      properties:
        issuer:
          type: string
        token_endpoint:
          type: string
        jwks_uri:
          type: string
        authorization_endpoint:
          type: string
    BridgeUrlRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          examples:
          - https://your-hiu-server.com/abdm/callback
    BridgeService:
      type: object
      properties:
        serviceId:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - HIP
          - HIU
          - HRP
        active:
          type: boolean
        bridgeId:
          type: string
        facilityId:
          type: string
    RegisterBridgeServicesRequest:
      type: object
      required:
      - facilityId
      - facilityName
      - HRP
      properties:
        facilityId:
          type: string
          examples:
          - IN07100XXXXX
        facilityName:
          type: string
          examples:
          - City Health HIU
        HRP:
          type: array
          items:
            type: object
            required:
            - bridgeId
            - hipName
            - type
            - active
            properties:
              bridgeId:
                type: string
              hipName:
                type: string
              type:
                type: string
                enum:
                - HIP
                - HIU
              active:
                type: boolean
    ConsentInitRequest:
      type: object
      required:
      - consent
      properties:
        consent:
          type: object
          required:
          - purpose
          - patient
          - hiu
          - requester
          - hiTypes
          - permission
          properties:
            purpose:
              type: object
              required:
              - text
              - code
              properties:
                text:
                  type: string
                  examples:
                  - Care Management
                code:
                  type: string
                  enum:
                  - CAREMGT
                  - BTG
                  - PUBHLTH
                  - HPAYMT
                  - DSRCH
                  - PATRQST
                  description: |
                    ABDM consent purpose codes:
                    - CAREMGT: Care Management
                    - BTG: Break the Glass (emergency)
                    - PUBHLTH: Public Health
                    - HPAYMT: Health Payment
                    - DSRCH: Disease Specific Healthcare Research
                    - PATRQST: Patient Requested
                  examples:
                  - CAREMGT
                refUri:
                  type: string
                  format: uri
            patient:
              type: object
              required:
              - id
              properties:
                id:
                  type: string
                  description: Patient's ABHA address
                  examples:
                  - patient@sbx
            hiu:
              type: object
              required:
              - id
              - name
              properties:
                id:
                  type: string
                  description: HIU service ID
                  examples:
                  - HIU_SERVICE_ID
                name:
                  type: string
                  description: HIU display name.
                type:
                  type: string
                  description: Not otherwise constrained.
            hip:
              type:
              - object
              - 'null'
              description: Specific HIP to request from (null = any HIP)
              required:
              - id
              - name
              properties:
                id:
                  type: string
                name:
                  type: string
                  description: HIP display name.
                type:
                  type: string
                  description: Not otherwise constrained.
            careContexts:
              type:
              - array
              - 'null'
              description: Specific care contexts (null = all matching contexts)
              items:
                type: object
                properties:
                  patientReference:
                    type: string
                  careContextReference:
                    type: string
            requester:
              type: object
              required:
              - name
              - identifier
              properties:
                name:
                  type: string
                  description: Doctor / requester name
                identifier:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - REGNO
                      - NMC
                      - MCI
                      - AYUSH
                    value:
                      type: string
                    system:
                      type: string
                      format: uri
            hiTypes:
              type: array
              items:
                $ref: '#/components/schemas/HIType'
              description: Health Information types being requested
            permission:
              $ref: '#/components/schemas/ConsentPermission'
    ConsentPermission:
      type: object
      required:
      - accessMode
      - dateRange
      - dataEraseAt
      - frequency
      properties:
        accessMode:
          type: string
          enum:
          - VIEW
          - STORE
          - QUERY
          - STREAM
          examples:
          - VIEW
        dateRange:
          type: object
          properties:
            from:
              type: string
              format: date-time
              description: Start of the data access window
            to:
              type: string
              format: date-time
              description: End of the data access window
        dataEraseAt:
          type: string
          format: date-time
          description: Consent expiry, after this the HIU must delete the data
        frequency:
          type: object
          properties:
            unit:
              type: string
              enum:
              - HOUR
              - DAY
              - WEEK
              - MONTH
              - YEAR
            value:
              type: integer
              description: Frequency value
            repeats:
              type: integer
              description: Number of repeats (0 = unlimited during consent period)
    ConsentStatusResponse:
      type: object
      properties:
        consentRequestId:
          type: string
          x-abdm-correction: C3
        status:
          type: string
          enum:
          - REQUESTED
          - GRANTED
          - DENIED
          - EXPIRED
          - REVOKED
        consentArtefacts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Consent artefact ID, use this to fetch the artefact
                x-abdm-correction: C3
    ConsentHiuOnNotifyRequest:
      type: object
      required:
      - acknowledgement
      - response
      properties:
        acknowledgement:
          type: array
          items:
            type: object
            required:
            - status
            - consentId
            properties:
              status:
                type: string
                enum:
                - OK
                - ERROR
              consentId:
                type: string
                x-abdm-correction: C3
        response:
          $ref: '#/components/schemas/CallbackResponse'
    ConsentFetchResponse:
      type: object
      properties:
        consent:
          type: object
          properties:
            status:
              type: string
              enum:
              - GRANTED
              - DENIED
              - REVOKED
              - EXPIRED
            consentDetail:
              type: object
              properties:
                consentId:
                  type: string
                  x-abdm-correction: C3
                createdAt:
                  type: string
                  format: date-time
                purpose:
                  type: object
                  properties:
                    text:
                      type: string
                    code:
                      type: string
                patient:
                  type: object
                  properties:
                    id:
                      type: string
                careContexts:
                  type: array
                  items:
                    type: object
                    properties:
                      patientReference:
                        type: string
                      careContextReference:
                        type: string
                hiTypes:
                  type: array
                  items:
                    $ref: '#/components/schemas/HIType'
                permission:
                  $ref: '#/components/schemas/ConsentPermission'
                hiu:
                  type: object
                  properties:
                    id:
                      type: string
                hip:
                  type: object
                  properties:
                    id:
                      type: string
            signature:
              type: string
              description: Base64-encoded digital signature of the consent artefact
    HIUHealthInfoRequest:
      type: object
      required:
      - hiRequest
      properties:
        hiRequest:
          type: object
          required:
          - consent
          - dateRange
          - dataPushUrl
          - keyMaterial
          properties:
            consent:
              type: object
              required:
              - id
              properties:
                id:
                  type: string
                  description: Consent artefact ID from the granted consent
                  x-abdm-correction: C3
            dateRange:
              type: object
              required:
              - from
              - to
              properties:
                from:
                  type: string
                  format: date-time
                  description: Must be within the consent's permitted date range
                to:
                  type: string
                  format: date-time
            dataPushUrl:
              type: string
              format: uri
              description: HTTPS endpoint on the HIU server to receive encrypted
                FHIR data
              examples:
              - https://your-hiu-server.com/abdm/data/push
            keyMaterial:
              $ref: '#/components/schemas/ECDHKeyMaterial'
    ECDHKeyMaterial:
      type: object
      description: ECDH key material for end-to-end encryption of health data
      required:
      - cryptoAlg
      - curve
      - dhPublicKey
      - nonce
      properties:
        cryptoAlg:
          type: string
          enum:
          - ECDH
          examples:
          - ECDH
        curve:
          type: string
          enum:
          - Curve25519
          examples:
          - Curve25519
        dhPublicKey:
          type: object
          required:
          - expiry
          - parameters
          - keyValue
          properties:
            expiry:
              type: string
              format: date-time
              description: Key expiry time
            parameters:
              type: string
              examples:
              - Curve25519/32byte
            keyValue:
              type: string
              description: Base64-encoded ECDH public key (32 bytes for Curve25519)
        nonce:
          type: string
          description: Base64-encoded random nonce (32 bytes), unique per request
    DataFlowNotifyRequest:
      type: object
      required:
      - notification
      properties:
        notification:
          type: object
          required:
          - consentId
          - transactionId
          - doneAt
          - notifier
          - statusNotification
          properties:
            consentId:
              type: string
              x-abdm-correction: C3
            transactionId:
              type: string
              x-abdm-correction: C3
            doneAt:
              type: string
              format: date-time
            notifier:
              type: object
              required:
              - type
              - id
              properties:
                type:
                  type: string
                  enum:
                  - HIP
                  - HIU
                  description: Must be "HIU" for M3 (vs "HIP" for M2)
                  examples:
                  - HIU
                id:
                  type: string
                  examples:
                  - HIU_SERVICE_ID
            statusNotification:
              type: object
              required:
              - sessionStatus
              - hipId
              - statusResponses
              properties:
                sessionStatus:
                  type: string
                  description: |
                    HIU-side value, this is the M3 half of the exchange. RECEIVED on
                    success, not TRANSFERRED, which is what the HIP sends on the M2
                    side of the same event.
                  enum:
                  - RECEIVED
                  - FAILED
                hipId:
                  type: string
                statusResponses:
                  type: array
                  items:
                    type: object
                    properties:
                      careContextReference:
                        type: string
                      hiStatus:
                        type: string
                        enum:
                        - OK
                        - ERRORED
                      description:
                        type: string
    CallbackResponse:
      type: object
      description: Echo of the requestId from the original Gateway-to-HIU request
      required:
      - requestId
      properties:
        requestId:
          type: string
          description: requestId received in the original Gateway notification
            to HIU bridge
    HIType:
      type: string
      enum:
      - Prescription
      - DiagnosticReport
      - OPConsultation
      - DischargeSummary
      - ImmunizationRecord
      - HealthDocumentRecord
      - WellnessRecord
      - Invoice
      description: |
        ABDM Health Information type categories.
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          pattern: '^(ABDM-\d{4}|\d{3,6})(: )?$'
          description: |
            A string matching this pattern. Observed values include `ABDM-1006`,
            `900901` and `404`.
        message:
          type: string
  responses:
    BadRequest:
      description: Bad request, invalid parameters or missing fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized, missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
