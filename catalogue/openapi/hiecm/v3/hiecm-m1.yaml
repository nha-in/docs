                description: Display name of the HIP
                examples:
                - City General Hospital
              hipId:
                type: string
                description: Unique HIP service identifier
                examples:
                - CityGeneralHospital_HIP
              hipType:
                type: string
                enum:
                - HOSPITAL
                - CLINIC
                - LAB
                - PHARMACY
                - WELLNESS
                - DIAGNOSTIC
                - OTHER
                examples:
                - HOSPITAL
              facilityName:
                type: string
                examples:
                - City General Hospital
    PatientShareRequest:
      type: object
      required:
      - intent
      - metaData
      - profile
      description: Patient profile share payload, forwarded by Gateway to HIP
        callback
      properties:
        intent:
          type: string
          enum:
          - PROFILE_SHARE
          description: Always `PROFILE_SHARE` for scan-and-share flows
        metaData:
          type: object
          required:
          - hipId
          - context
          properties:
            hipId:
              type: string
              description: HIP identifier embedded in the QR code
              examples:
              - CityGeneralHospital_HIP
            context:
              type: string
              description: Counter or context value from the QR code
              examples:
              - '42'
            hprId:
              type: string
              description: Health Professional Registry ID of the scanning clinician
              examples:
              - dr.smith@hpr.abdm
        profile:
          type: object
          properties:
            patient:
              $ref: '#/components/schemas/SharedPatientProfile'
    SharedPatientProfile:
      type: object
      description: Patient profile data shared via Scan & Share
      properties:
        abhaNumber:
          type: string
          examples:
          - 91-1234-5678-9012
        abhaAddress:
          type: string
          examples:
          - johnkumar@sbx
        name:
          type: string
          examples:
          - John Kumar
        gender:
          type: string
          enum:
          - M
          - F
          - O
          examples:
          - M
        dob:
          type: string
          format: date
          examples:
          - '1990-01-15'
        mobile:
          type: string
          examples:
          - '9876543210'
        kycPhoto:
          type:
          - string
          - 'null'
          description: Base64-encoded KYC photo (may be omitted if patient declines)
        address:
          type: object
          properties:
            line:
              type: string
              examples:
              - 123 Main Street
            district:
              type: string
              examples:
              - Mumbai
            state:
              type: string
              examples:
              - Maharashtra
            pinCode:
              type: string
              examples:
              - '400001'
    OnShareRequest:
      type: object
      required:
      - acknowledgement
      description: HIP acknowledgement sent to the Gateway after processing the
        patient profile
      properties:
        acknowledgement:
          type: object
          required:
          - status
          - abhaAddress
          properties:
            status:
              type: string
              enum:
              - SUCCESS
              - FAILURE
              description: Processing result
              examples:
              - SUCCESS
            abhaAddress:
              type: string
              description: ABHA Address of the patient who shared their profile
              examples:
              - johnkumar@sbx
            profile:
              type: object
              description: Present on SUCCESS, echoes context and provides assigned
                token
              properties:
                context:
                  type: string
                  description: Context value from the original share request
                  examples:
                  - '42'
                tokenNumber:
                  type: string
                  description: Queue/token number assigned to the patient by the
                    HIP
                  examples:
                  - TKN-0042
            error:
              type: object
              description: Present on FAILURE
              properties:
                code:
                  type: string
                  examples:
                  - HIP_ERROR_001
                message:
                  type: string
                  examples:
                  - Unable to process at this time
  responses:
    BadRequest:
      description: Bad Request, invalid scope, loginHint, or encrypted field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_scope:
              value:
                scope: Invalid Scope
                timestamp: '2024-05-10 11:13:04'
            invalid_login_id:
              value:
                loginId: Invalid LoginId
                timestamp: '2024-05-10 11:15:14'
            invalid_login_hint:
              value:
                loginHint: Invalid LoginHint
                timestamp: '2024-05-10 11:16:00'
    Unauthorized:
      description: Unauthorized, missing, invalid, or expired Bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
x-abdm-errors:
  notes: |
    ## Four error shapes, not one

    Do not write a parser that expects a single shape.

    ### Shape 1: the wrapped ABDM error

    ```json
    {
        "error": {
            "code": "ABDM-1204",
            "message": "UIDAI Error code : 300 : Biometric data did not match."
        }
    }
    ```

    The code lives at `error.code`. This comes from the ABHA service's own business logic.

    ### Shape 2: the flat ABDM error

    ```json
    {
        "code": "ABDM-1094",
        "message": "Access to this feature is restricted. Please contact NHA to enable it.",
        "timestamp": "2024-10-25 15:02:34"
    }
    ```

    Same family of codes, no `error` wrapper, plus a `timestamp`. The collection shows `ABDM-1094` in both shapes on different calls, so the wrapper is not tied to the code. Read `error.code` first and fall back to a top level `code`.

    ### Shape 3: field validation

    ```json
    {
        "txnId": "Invalid Transaction Id",
        "timestamp": "2025-01-15 13:21:16"
    }
    ```

    No code at all. The key names the field you got wrong. Several bad fields produce several keys:

    ```json
    {
        "scope": "Invalid Scope",
        "authData": "Invalid Auth Data",
        "timestamp": "2025-01-15 13:39:03"
    }
    ```

    Treat every key except `timestamp` as a field name. These always arrive as HTTP 400.

    ### Shape 4: the API gateway error

    ```json
    {
        "code": "900901",
        "message": "Invalid Credentials",
        "description": "Invalid JWT token. Make sure you have provided the correct security credentials"
    }
    ```

    A numeric code, not an `ABDM-` code, plus a `description` field the other shapes lack. This comes from the API gateway in front of the ABHA service, before your request reaches the business logic. It almost always means the `Authorization` header is wrong or expired.
  source: Saved example responses in NHA's M1 ABHA Postman collection. NHA's M1
    document carries its code reference as screenshots with no text.
  codes:
  - code: ABDM-1013
    message: Invalid ABHA Number
    action: Fix request
  - code: ABDM-1094
    message: Access to this feature is restricted. Please contact NHA to enable
      it.
    action: Fix auth
  - code: ABDM-1094
    message: Invalid Benefit Name
    action: Fix auth
  - code: ABDM-1138
    message: The benefit record has already been de-linked
    action: Treat as success
  - code: ABDM-1140
    message: The benefit record has already been linked
    action: Treat as success
  - code: ABDM-1204
    message: A UIDAI failure passed through. The UIDAI code and text sit inside
      the message string
    action: Fix request
  - code: ABDM-1224
    message: Login via Biometric is not allowed.
    action: Fix auth
  - code: ABDM-9999
    message: 'Recorded as `ABDM-9999: ` with an `ABDM-1094` message stuck to the
      front of the text'
    action: Fix auth
x-abdm-errors-untagged:
  source: The same collection, and the only source that recorded HTTP statuses.
  codes:
  - code: '900901'
    http: 401
    message: Invalid Credentials, invalid JWT token. From the API gateway in front
      of the ABHA service, before your request reaches the business logic
    action: Fix auth
  - code: '900900'
    http: 500
    message: Unclassified authentication failure. The one saved example had a
      bad path and a bad token together, so read it as a client error first
    action: Fix auth
  - code: '404'
    http: 404
    message: No matching resource found for given API Request`. A wrong path,
      not a missing record
    action: Fix request
x-abdm-errors-uidai:
  source: Codes from the Unique Identification Authority of India, passed through
    inside the message of ABDM-1204. NHA passes through more than these, so parse
    the message.
  codes:
  - code: '300'
    message: Biometric mismatch
  - code: '561'
    message: Request expired
  - code: '563'
    message: Duplicate request
  - code: '810'
    message: Missing biometric data
