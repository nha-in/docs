                  loginId: '{{RSA_encrypted_abha_address}}'
              aadhaar_otp:
                summary: Aadhaar OTP
                value:
                  scope:
                  - abha-address-login
                  - aadhaar-verify
                  loginHint: abha-address
                  loginId: '{{RSA_encrypted_abha_address}}'
