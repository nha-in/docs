  /v3/profile/account/abha/search:
    post:
      operationId: m1_find_abha_search
      x-abdm-use-case: Fetch ABHA by mobile number
      tags:
      - find-abha
      summary: Find an ABHA for somebody who does not know theirs
      description: |
        Takes an encrypted mobile number, Aadhaar number or biometric result and
        sends an OTP to the mobile on record. The response carries a `txnId` and
        a message naming the masked mobile the OTP went to, so the person can
        confirm it is theirs before waiting for it.

        Two things in NHA's collection disagree about the shape that comes back,
        and both are recorded below. The test script reads `jsonData[0].txnId`,
        so it expects a JSON array, which fits one mobile number mapping to
        several accounts. The saved example is a single object. That example
        also carries a URL of `profile/login/request/otp`, so it was probably
        saved against the wrong request, which makes the script the more
        trustworthy of the two. Neither has been run from this repository.
        Write the client to read an array, and keep the single object in mind
        until the sandbox settles it.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/BenefitName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                mobile:
                  type: string
              required:
              - mobile
              - scope
            examples:
              find_abha_using_mobile_otp:
                summary: find abha using mobile otp
                value:
                  scope:
                  - search-abha
                  mobile: <MOBILE>
      responses:
        '200':
          description: Recorded in NHA's own collection. Values are scrubbed.
            Two shapes are recorded because the collection's test script and its
            saved example disagree, and the script is the more trustworthy of
            the two.
          content:
            application/json:
              schema:
                oneOf:
                - title: Array, what the collection's test script expects
                  description: The script reads `jsonData[0].txnId`, so it treats
                    the body as a list. One mobile number can map to several accounts,
                    which fits a list.
                  type: array
                  items:
                    type: object
                    properties:
                      txnId:
                        type: string
                      message:
                        type: string
                    required:
                    - txnId
                - title: Single object, what the saved example shows
                  description: The example NHA saved carries a URL of `profile/login/request/otp`,
                    so it was probably saved against the wrong request and describes
                    that call rather than this one.
                  type: object
                  properties:
                    txnId:
                      type: string
                    message:
                      type: string
                  required:
                  - message
                  - txnId
              examples:
                array_expected_by_the_collection_script:
                  summary: array expected by the collection script
                  value:
                  - txnId: <TXN_ID>
                    message: OTP is sent to Mobile number ending with ******0161
                example:
                  summary: example
                  value:
                    txnId: <TXN_ID>
                    message: OTP is sent to Mobile number ending with ******0161
      x-abdm-atom: hiecm.endpoint.m1-find-abha-search
