  /abha/api/v3/profile/login/request/otp:
    post:
      tags:
        - ABHA LOGIN
        - FIND ABHA
      summary: "Use Case: ABHA Login - Send OTP using Aadhaar number, ABHA number, Mobile number, Biometric Login, Search ABHA, Find ABHA via Biometrics"
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      requestBody:
        description: "<b>Below is the Request Body description:</b><br><br>\r

          \ \r

          \ <b>Note:</b> Mandatory fields can't be null. <ul>  <li> <p><strong>scope</strong> (required):</p>  <ul>  <li><strong>Description:</strong> Specifies the scope of the OTP request.</li>  <li><strong>Example:</strong> <code>[\"abha-login\", \"aadhaar-verify\"]</code></li>  <li><strong>Possible Values:</strong> <code>abha-login</code>, <code>aadhaar-verify</code>, <code>mobile-verify</code>, <code>re-activate</code>, <code> search-abha </code> <code>retrieval</code>, <code>re-kyc</code> <code>aadhaar-face-verify</code>, <code>aadhaar-iris-verify</code>, <code>aadhaar-bio-verify</code>etc.</li>  </ul>  </li>  <li> <p><strong>loginHint</strong> (required):</p>  <ul>  <li><strong>Description:</strong> Indicates the type of identifier being used for the OTP request.</li>  <li><strong>Example:</strong> <code>aadhaar</code></li>  <li><strong>Possible Values:</strong> <code>aadhaar</code>, <code>mobile</code>, <code>abha-number</code> <code> index </code> </li>  </ul>  </li>  <li> <p><strong>loginId</strong> (required):</p>  <ul>  <li><strong>Description:</strong> The encrypted identifier (ABHA Number, or Mobile Number) for which the OTP is being requested.</li>  <li><strong>Example:</strong> <code>{{encrypted aadhaar number}}, {{encrypted mobile number}}, {{encrypted abha-number}}, {{rsaIndexEncryptionOutput}}</code></li>  </ul>  </li>  <li> <p><strong>otpSystem</strong> (required):</p>  <ul>  <li><strong>Description:</strong> Specifies the system used for OTP generation.</li>  <li><strong>Example:</strong> <code>abdm</code></li>  <li><strong>Possible Values:</strong> <code>abdm</code>, <code>aadhaar</code></li>  </ul>  </li>  </ul>  "
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                    example: abha-login, aadhaar-verify, mobile-verify,aadhaar-face-verify, aadhaar-bio-verify, aadhaar-iris-verify, search-abha, retrieval
                  example:
                    - abha-login
                    - aadhaar-verify
                loginHint:
                  type: string
                  example: abha-number,aadhaar, mobile, index
                loginId:
                  type: string
                  example: '{{encrypted aadhaar number}},{{encrypted mobile number}},{{encrypted abha-number}},     "{{rsaIndexEncryptionOutput}}"'
                otpSystem:
                  type: string
                  example: aadhaar,abdm
              required:
                - loginHint
                - loginId
                - otpSystem
                - scope
            examples:
              Login Via ABHA Number - Using Aadhaar OTP - Send OTP:
                value:
                  scope:
                    - abha-login
                    - aadhaar-verify
                  loginHint: abha-number
                  loginId: "{{encrypted abha-number}}"
                  otpSystem: aadhaar
              Login Via ABHA Number - Using ABHA OTP - Send OTP:
                value:
                  scope:
                    - abha-login
                    - mobile-verify
                  loginHint: abha-number
                  loginId: "{{encrypted abha-number}}"
                  otpSystem: abdm
              Login Via Aadhaar Number - Using Aadhaar OTP - Send OTP:
                value:
                  scope:
                    - abha-login
                    - aadhaar-verify
                  loginHint: aadhaar
                  loginId: "{{encrypted aadhaar-number}}"
                  otpSystem: aadhaar
              Login Via Biometric ( Using Face) - Send Face  Authentication Request:
                value:
                  scope:
                    - abha-login
                    - aadhaar-face-verify
                  loginHint: abha-number
                  loginId: "{{encrypted abha-number}}"
                  otpSystem: abdm
              Login Via Biometric (Using Fingerprint ) - Send Fingerprint Authentication Request:
                value:
                  scope:
                    - abha-login
                    - aadhaar-bio-verify
                  loginHint: abha-number
                  loginId: "{{encrypted abha-number}}"
                  otpSystem: abdm
              Login Via Biometric (Using IRIS) - Send Iris Authentication Request:
                value:
                  scope:
                    - abha-login
                    - aadhaar-iris-verify
                  loginHint: abha-number
                  loginId: "{{encrypted abha-number}}"
                  otpSystem: abdm
              Login Via Mobile Number - Using Mobile OTP - Send OTP:
                value:
                  scope:
                    - abha-login
                    - mobile-verify
                  loginHint: mobile
                  loginId: "{{encrypted mobile number}}"
                  otpSystem: abdm
              Find ABHA Via Mobile Number - Send OTP:
                value:
                  scope:
                    - abha-login
                    - search-abha
                    - mobile-verify
                  loginHint: index
                  loginId: "{{rsaIndexEncryptionOutput}}"
                  otpSystem: abdm
                  txnId: "{{searchTxnId}}"
              Find ABHA Via Aadhaar linked Mobile Number - Send OTP:
                value:
                  scope:
                    - abha-login
                    - search-abha
                    - aadhaar-verify
                  loginHint: index
                  loginId: "{{rsaIndexEncryptionOutput}}"
                  otpSystem: aadhaar
                  txnId: "{{searchTxnId}}"
              Find ABHA Via Biometric (Fingerprint) - Send Fingerprint Authentication Request:
                value:
                  scope:
                    - abha-login
                    - search-abha
                    - aadhaar-bio-verify
                  loginHint: index
                  loginId: "{{rsaIndexEncryptionOutput}}"
                  otpSystem: aadhaar
                  txnId: "{{searchTxnId}}"
              Find ABHA Via Biometric (Face) - Send Face Authentication Request:
                value:
                  scope:
                    - abha-login
                    - search-abha
                    - aadhaar-face-verify
                  loginHint: index
                  loginId: "{{rsaIndexEncryptionOutput}}"
                  otpSystem: aadhaar
                  txnId: "{{searchTxnId}}"
              Find ABHA Via Biometric (Iris) - Send Iris Authentication Request:
                value:
                  scope:
                    - abha-login
                    - search-abha
                    - aadhaar-iris-verify
                  loginHint: index
                  loginId: "{{rsaIndexEncryptionOutput}}"
                  otpSystem: aadhaar
                  txnId: "{{searchTxnId}}"
              Forgot ABHA via Aadhaar OTP- Send OTP:
                value:
                  scope:
                    - abha-login
                    - aadhaar-verify
                  loginHint: aadhaar
                  loginId: "{{encrypted Aadhaar}}"
                  otpSystem: aadhaar
              Forgot ABHA via Mobile OTP-Send OTP:
                value:
                  scope:
                    - abha-login
                    - mobile-verify
                  loginHint: mobile
                  loginId: "{{encrypted mobile number}}"
                  otpSystem: abdm
      responses:
        "200":
          description: |-
            The 200 response code indicates a successful request. In this context, it refers to the successful generation and delivery of an OTP (One-Time Password) for various services.<br><br> <strong>Types of OTP Responses:</strong> <ol>
             <li><strong>Login Via Mobile Number - Positive flow:</strong> This action allows users to log in to their ABHA (Ayushman Bharat Health Account) using their mobile number. An OTP (One-Time Password) is sent to the provided mobile number. This ensures that the user’s identity is securely verified before granting access to their ABHA profile.</li>
             <br>
            <li><strong>Login Via ABHA Number using ABHA OTP - Positive flow:</strong> This action allows users to log in to their ABHA using their ABHA Number. An OTP is sent to the mobile number registered with the ABHA Number. This ensures that the user’s identity is securely verified before granting access to their ABHA profile.</li> </ol>
             
             <ol start="3">
            <li><strong>Login Via ABHA Number - Using Aadhaar OTP-positive flow:</strong> This action allows users to log in to their ABHA using their Aadhaar Number. An OTP is sent to the mobile number registered with the aadhaar Number. This ensures that the user’s identity is securely verified before granting access to their ABHA profile.</li> </ol> <ol start ="4">
            <li><strong>Login via Aadhaar- Positive Flow.</strong> This action allows users to log in to their ABHA using their Aadhaar number. An OTP is sent to the mobile number registered with the Aadhaar. This ensures that the user’s identity is securely verified before granting access to their ABHA profile.</li> </ol> <ol start ="5">
            <li><strong>Forgot ABHA via Mobile OTP- Positive flow:</strong> This action allows users to retrieve their ABHA number by sending an OTP to the mobile number registered with their ABHA profile. This ensures that the user’s identity is securely verified before retrieving the ABHA number</li> 
            <br>
            <li><strong>Forgot ABHA via Aadhaar OTP- Positive Flow:</strong>  This action allows users to retrieve their ABHA number by sending an OTP to the mobile number registered with their Aadhaar. This ensures that the user’s identity is securely verified before retrieving the ABHA number.</li>
            <br>
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                    example: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                  message:
                    type: string
                    example: OTP sent to Aadhaar registered mobile number ending with ******0903
              examples:
                Login Via ABHA Number - Using Aadhaar OTP - Send OTP:
                  value:
                    txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                    message: OTP sent to Aadhaar registered mobile number ending with ******0903
                Login Via ABHA Number - Using ABHA OTP - Send OTP:
                  value:
                    txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                    message: OTP sent to Aadhaar registered mobile number ending with ******0903
                Login Via Aadhaar Number - Using Aadhaar OTP - Send OTP:
                  value:
                    txnId: 86b3d4c8-114e-4fd1-8604-93a684730827
                    message: OTP sent to Aadhaar registered mobile number ending with ******0903
                Login Via Mobile Number - Using Mobile OTP - Send OTP:
                  value:
                    txnId: d4196ae3-f302-45bc-9460-a798a17b4c3a
                    message: OTP sent to Aadhaar registered mobile number ending with ******0903
                Login Via Biometric - Using Face - Send OTP:
                  value:
                    txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                    message: FACE authentication request successfully sent.
                Login Via Biometric - Using Fingerprint - Send OTP:
                  value:
                    txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                    message: FingerPrint authentication request successfully sent.
                Login Via Biometric - Using Iris - Send OTP:
                  value:
                    txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                    message: IRIS authentication request successfully sent.
                Find ABHA Via Biometric (Face) - Send Face Authentication Request:
                  value:
                    txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                    message: Face authentication request successfully sent.
                Find ABHA Via Biometric (Fingerprint) - Send Fingerprint Authentication Request:
                  value:
                    txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                    message: FingerPrint authentication request successfully sent.
                Find ABHA Via Biometric (Iris) - Send Iris Authentication Request:
                  value:
                    txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                    message: Iris authentication request successfully sent.
                Forgot ABHA via Mobile OTP- Positive flow:
                  value:
                    txnId: d41a143c-4751-46d4-aee5-94bf6d9c1bd6
                    message: OTP sent to Aadhaar registered mobile number ending with ******0903
