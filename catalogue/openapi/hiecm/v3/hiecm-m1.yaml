        description: '<b>Below is the Request Body description:</b><ol><li><p><strong>scope</strong> (required):</p><ul><li><strong>Description:</strong> Specifies the scope of the OTP request.</li><li><strong>Example:</strong> <code>["abha-address-login","mobile-verify",,"aadhaar-verify"]</code></li><li><strong>Possible Values:</strong> <code>abha-address-login,mobile-verify,aadhaar-verify,aadhaar-bio-verify,aadhaar-face-verify,aadhaar-iris-verify</code></li></ul></li></ol><ol start="2"><li><p><strong>authData</strong> (required):</p><ol><li><strong>authMethods:</strong><ul><li><strong>Description:</strong> Specifies the auth method of the OTP request.</li><li><strong>Example:</strong> <code>["otp"]</code>,<code>["bio"]</code>,<code>["face"]</code>,<code>["iris"]</code></li><li><strong>Possible Values:</strong> <code>otp</code></li></ul></li><br><li><strong>Incase authMethod is Otp:</strong><ol><li><strong>txnId:</strong><ul><li><strong>Description:</strong> Transaction id of the request.</li><li><strong>Example:</strong> <code>{{txnId}}</code></li><li><strong>Possible Values:</strong> <code>{{txnId}}</code></li></ul></li><li><strong>otpValue:</strong><ul><li><strong>Description:</strong> Encrypted otp value.</li><li><strong>Example:</strong> <code>{{encryptedOtpValue}}</code></li><li><strong>Possible Values:</strong> <code>{{encryptedOtpValue}}</code>.</li></ul></li> </ol><li><strong>Incase authMethod is face:</strong><ol><li><strong>txnId:</strong><ul><li><strong>Description:</strong> Transaction id of the request.</li><li><strong>Example:</strong> <code>{{txnId}}</code></li><li><strong>Possible Values:</strong> <code>{{txnId}}</code></li></ul></li><li><strong>faceAuthPid:</strong><ul><li><strong>Description:</strong> Value for this would be faceAuthPid.</li><li><strong>Example:</strong> <code>{{faceAuthPid}}</code></li><li><strong>Possible Values:</strong> <code>{{faceAuthPid}}</code>.</li></ul></li></li></ol><li><strong>Incase authMethod is bio:</strong><ol><li><strong>txnId:</strong><ul><li><strong>Description:</strong> Transaction id of the request.</li><li><strong>Example:</strong> <code>{{txnId}}</code></li><li><strong>Possible Values:</strong> <code>{{txnId}}</code></li></ul></li><li><strong>fingerprintAuthPid:</strong><ul><li><strong>Description:</strong> Value for this would be finger print auth pid.</li><li><strong>Example:</strong> <code>{{fingerprintAuthPid}}</code></li><li><strong>Possible Values:</strong> <code>{{fingerprintAuthPid}}</code>.</li></ul></li></li></li> </ol> <li><strong>Incase authMethod is bio:</strong><ol><li><strong>txnId:</strong><ul><li><strong>Description:</strong> Transaction id of the request.</li><li><strong>Example:</strong> <code>{{txnId}}</code></li><li><strong>Possible Values:</strong> <code>{{txnId}}</code></li></ul></li><li><strong>irisAuthPid:</strong><ul><li><strong>Description:</strong> Value for this would be iris  auth pid.</li><li><strong>Example:</strong> <code>{{irisAuthPid}}</code></li><li><strong>Possible Values:</strong> <code>{{irisAuthPid}}</code>.</li></ul></li> '
