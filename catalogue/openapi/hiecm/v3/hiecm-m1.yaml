              properties:
                aadhaar:
                  type: string
                  description: RSA-encrypted Aadhaar number
                bioType:
                  type: string
                  description: Biometric type, FMR (Fingerprint Minutiae Record)
                  enum:
                  - FMR
                  - FIR
                  examples:
                  - FMR
                pid:
                  type: string
                  description: Encrypted PID block from certified biometric device
            face:
              type: object
              description: Face authentication data
              required:
              - aadhaar
              - pid
              properties:
                aadhaar:
                  type: string
                  description: RSA-encrypted Aadhaar number
                pid:
                  type: string
                  description: Encrypted face PID block
            iris:
              type: object
              description: Iris scan authentication data
              required:
              - aadhaar
              - pid
              properties:
                aadhaar:
                  type: string
                  description: RSA-encrypted Aadhaar number
                pid:
                  type: string
                  description: Encrypted iris PID block
            child:
              type: object
              description: Child ABHA creation data (parent must be authenticated)
              required:
