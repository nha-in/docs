      x-stoplight:
        id: ylrpfy8miqlmm
      description: This API endpoint is used to request an OTP (One-Time Password) for verifying an ABHA (Ayushman Bharat Health Account) profile. The OTP is sent to the user’s registered mobile number or email address, ensuring secure access to their ABHA profile. This is essential for verifying the user’s identity and ensuring secure access to their ABHA profile.<br> <br>**Example of OTP Request**<br> <br>Example1:<br> **Update Email :** This action allows users to update their email address by sending an OTP to the new email address. The OTP is essential for verifying the user’s identity and ensuring secure access to their profile.  <br> <br>Example2:<br> **Update Mobile :** This action allows users to update their mobile number by sending an OTP to the new mobile number. The OTP is essential for verifying the user’s identity and ensuring secure access to their profile. <br> <br>Example3:<br> **Re-KYC - Send OTP:** This action allows users to re-verify their KYC (Know Your Customer) details by sending an OTP to the registered mobile number linked with their Aadhaar. The OTP is essential for verifying the user’s identity and ensuring secure access to their profile.<br><br> <br>Example8:<br> **PASSWORD_UPDATE_REQUEST_OTP - AADHAAR:** This action allows users to request an OTP for updating their password using their Aadhaar number. The OTP is essential for verifying the user’s identity and ensuring secure password updates. "<br><br><br>Example9:<br> **CHILD ABHA KYC - Request OTP:** This action allows users to initiate KYC verification for a Child ABHA by requesting an OTP on the Aadhaar-linked mobile number of the child/guardian. This OTP is used to complete the Re-KYC process for a Child ABHA account and ensure the linked Aadhaar details are verified.<br><br><b>Note:</b><br> **1.**OTP will be valid for 10 minute only <br><br>
      operationId: m1_post_v3_profile_account_request_otp
  /abha/api/v3/profile/account/verify:
    post:
      tags:
        - ABHA PROFILE
        - CHILD ABHA (These APIs are intended for use only by specific Government integrators, approved by NHA)
      summary: "Use Case: Verify OTP - ReKyc, Update Mobile, CHILD ABHA KYC"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                    example: abha-profile , mobile-verify
                  example:
                    - abha-profile
                    - change-password
                    - re-kyc
                    - mobile-verify
                    - email-verify
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                        example: otp
                    otp:
                      type: object
                      properties:
                        txnId:
                          type: string
                          example: "{{txnId}}"
                        otpValue:
                          type: string
                          example: "{{encrypted otp}}"
                      required:
                        - txnId
                        - otpValue
                  required:
                    - authMethods
                reasons:
                  type: array
                  items:
                    type: string
                    example: aaa , bbb
              required:
                - scope
                - authData
            examples:
              PASSWORD_VERIFY_OTP:
                value:
                  scope:
                    - abha-profile
                    - change-password
                  authData:
                    authMethods:
                      - otp
                    otp:
                      txnId: "{{txnId}}"
                      otpValue: "{{encrypted otp}}"
              Re-KYC - Verify OTP:
                value:
                  scope:
                    - abha-profile
                    - re-kyc
                  authData:
                    authMethods:
                      - otp
                    otp:
                      txnId: "{{txnId}}"
                      otpValue: "{{encrypted otp}}"
              Update Mobile- Verify OTP:
                value:
                  scope:
                    - abha-profile
                    - mobile-verify
                  authData:
                    authMethods:
                      - otp
                    otp:
                      txnId: "{{txnId}}"
                      otpValue: "{{encrypted otp}}"
              Update Email-Verify OTP:
                value:
                  scope:
                    - abha-profile
                    - email-verify
                  authData:
                    authMethods:
                      - otp
                    otp:
                      txnId: "{{txnId}}"
                      otpValue: "{{encrypted otp}}"
              PASSWORD_SET:
                value:
                  scope:
                    - abha-profile
                    - change-password
                  authData:
                    authMethods:
                      - password
                    password:
                      newPassword: "{{encrypted new password}}"
                      oldPassword: "{{encrypted old password}}"
              PASSWORD_UPDATE-OLD PASSWORD:
                value:
                  scope:
                    - abha-profile
                    - change-password
                  authData:
                    authMethods:
                      - password
                    password:
                      newPassword: "{{encrypted new password}}"
                      confirmPassword: "{{encrypted confirm password}}"
                      oldPassword: "{{encrypted old password}}"
              Request CHILD KYC - Verify OTP:
                value:
                  scope:
                    - abha-profile
                    - re-kyc
                  authData:
                    authMethods:
                      - otp
                    otp:
                      txnId: "{{txnId}}"
                      otpValue: "{{encrypted otp value}}"
        description: "<b>Below is the Request Body description:</b><br> <br><!--<div> <table> <thead> <tr> <th>Attributes</th> <th>Description</th> </tr> </thead> <tbody> <tr> <td>scope <sup>* required</td> <td>Aadhaar/Abha/mobile</td> </tr> <tr> <td>loginHint <sup> * required</td> <td>Aadhaar,Abha And Mobile Number</td> </tr> <tr> <td>loginId <sup>* required </sup></td> <td>encrypted mobile-number</td> </tr> <tr> <td>otpSystem <sup>* required</td> <td>abdm/aadhaar</td> </tr> </tbody> </table> </div> <hr> --> <b>Note:</b> Mandatory fields can't be null. <ol> <li> <p><strong>scope</strong> (required):</p> <ul> <li><strong>Description:</strong> Specifies the scope of the OTP request.</li> <li><strong>Example:</strong> <code>[\\\"abha-profile\", \\\"mobile-verify\\\"]</code></li> <li><strong>Possible Values:</strong> <code>abha-profile</code>, <code>change-password</code>,<code>re-kyc</code>,<code>mobile-verify</code> ,<code>email-verify</code>etc.</li> </ul> </li>  "
      security:
        - bearerAuth: []
      parameters:
        - name: X-token
          in: header
