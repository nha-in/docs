                  summary: Invalid Preferred Flag
                  value:
                    preferred: Invalid Preferred Flag
                    timestamp: "2024-05-10T12:00:14.000Z"
                ABHA Address-Invalid Transaction Id:
                  summary: Invalid Transaction Id
                  value:
                    txnId: Invalid Transaction Id
                    timestamp: "2024-05-10T12:01:22.000Z"
        "401":
          description: The 401 response code indicates an unauthorized request. In this context, it refers to the lack of proper authentication during the operation of the Invalid Credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
