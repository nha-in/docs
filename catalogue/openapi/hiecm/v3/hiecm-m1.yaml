  /abha/api/v3/profile/account/request/otp:
    post:
      tags:
        - ABHA PROFILE
        - CHILD ABHA (These APIs are intended for use only by specific Government integrators, approved by NHA)
      summary: "Use Case: Send OTP - ReKyc, Update Mobile, Child ABHA KYC Request OTP"
      security:
        - bearerAuth: []
      parameters:
        - name: X-token
          in: header
          required: true
          schema:
            type: string
          example: Bearer {{X-token}}
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                    example: abha-login, aadhaar-verify
                  example:
                    - abha-login
                    - aadhaar-verify
                    - mobile-verify
                    - email-verify
                    - re-kyc
                    - aadhaar-face-verify
                    - aadhaar-bio-verify
                    - aadhaar-iris-verify
                loginHint:
                  type: string
                  example: email, mobile, abha-number, password
                loginId:
                  type: string
                  example: "{{encrypted email}}, {{encrypted mobile number}}, {{encrypted abha-number}}, {{encrypted password}}"
                otpSystem:
                  type: string
                  example: abdm, aadhaar
              required:
                - scope
                - loginHint
                - loginId
                - otpSystem
            examples:
              Update Email-Send OTP:
                value:
                  scope:
                    - abha-profile
                    - email-verify
                  loginHint: email
                  loginId: "{{encrypted email}}"
                  otpSystem: abdm
              Update Mobile-Send OTP:
                value:
                  scope:
                    - abha-profile
                    - mobile-verify
                  loginHint: mobile
                  loginId: "{{encrypted mobile number}}"
                  otpSystem: abdm
              ReKyc-Send OTP:
                value:
                  scope:
                    - abha-profile
                    - re-kyc
                  loginHint: abha-number
                  loginId: "{{encrypted abha-number}}"
                  otpSystem: aadhaar
              Change Password via ABHA OTP-Send OTP:
                value:
                  scope:
                    - abha-profile
                    - change-password
                  loginHint: password
                  loginId: "{{encrypted password}}"
                  otpSystem: abdm
              Change Password via Aadhaar OTP-Send OTP:
                value:
                  scope:
                    - abha-profile
                    - change-password
                  loginHint: password
                  loginId: "{{encrypted password}}"
                  otpSystem: aadhaar
              Request CHILD KYC:
                value:
                  scope:
                    - abha-profile
                    - re-kyc
                  loginHint: aadhaar
                  loginId: "{{encrypted aadhaar number}}"
                  otpSystem: aadhaar
      responses:
        "200":
          description: The OTP was successfully sent to the user’s registered contact method.<br><br> <strong>Types of OTP Responses:</strong> <ol> <li><strong>Update Mobile - Positive Flow:</strong> This action allows users to update their mobile number by sending an OTP to the new mobile number. The OTP is essential for verifying the user’s identity and ensuring secure access to their profile.</li> </ol> <ol start ="2"> <li><strong>Re-KYC- Positive Flow:</strong> This action allows users to re-verify their KYC (Know Your Customer) details by sending an OTP to the registered mobile number linked with their Aadhaar. The OTP is essential for verifying the user’s identity and ensuring secure access to their profile.</li> </ol> <ol start="3"> <li><strong>Update Email- Positive flow.</strong> This action allows users to update their email address by sending an OTP to the new email address. The OTP is essential for verifying the user’s identity and ensuring secure access to their profile</li> </ol><ol start ="4"> <li><strong> Change Password via ABHA OTP- Positive Flow:</strong>This action allows users to request an OTP for updating their password using their ABHA (Ayushman Bharat Health Account) number. The OTP is sent to the mobile number registered with the ABHA number. Upon successful verification of the OTP, the user can proceed to update their password.</li> </ol> <ol start ="5"> <li><strong> Change Password via Aadhaar OTP- Positive Flow:</strong>This action allows users to request an OTP for updating their password using their Aadhaar number. The OTP is sent to the mobile number registered with the Aadhaar Number. Upon successful verification of the OTP, the user can proceed to update their password.</li> </ol> <ol start= "6"><li>**CHILD ABHA KYC - Positive Flow** This action allows users to initiate KYC verification for a Child ABHA by requesting an OTP on the Aadhaar-linked mobile number of the child/guardian. This OTP is used to complete the Re-KYC process for a Child ABHA account and ensure the linked Aadhaar details are verified.<br></li></ol>
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                    example: c2095ea0-52ed-44ee-b8fc-02375b874e7a
                  message:
                    type: string
                    example: OTP is sent to Aadhaar registered mobile number ending with *******0903
              examples:
                ReKYC-Send OTP:
                  value:
                    txnId: c2095ea0-52ed-44ee-b8fc-02375b874e7a
                    message: OTP is sent to Aadhaar registered mobile number ending with *******0903
                KYC Child ABHA -Send OTP:
                  value:
                    txnId: c2095ea0-52ed-44ee-b8fc-02375b874e7a
                    message: OTP is sent to Aadhaar registered mobile number ending with *******0903
                Update Email-Positive flow:
                  value:
                    txnId: b74951fe-3a59-4209-b398-390c9569781f
                    message: OTP sent to email address ending with ***********<EMAIL>
                Update Mobile-Positive flow:
                  value:
                    txnId: 1c5fa806-67e1-4ad5-a848-0c4d805cd824
                    message: OTP sent to mobile number ending with ******0903
                Change Password via Aadhaar OTP - Positive Flow:
                  value:
                    txnId: aa08e116-6056-4311-ac9f-015fee53b2bf
                    message: OTP is sent to Aadhaar registered mobile number ending with *******0903
                Change Password via ABHA OTP - Positive Flow:
                  value:
                    txnId: 759f0f46-9b87-4160-afc3-cafb38a9b759
                    message: OTP is sent to Mobile number ending with ******0903
        "400":
          description: The request was invalid. This can occur due to various reasons such as invalid login ID, invalid scope, etc. <br><br> <strong>Types of OTP Responses </strong><ol start="1"> <li><strong>Update Email - Invalid LoginId.</strong> This error occurs when the login ID provided for the email update OTP is invalid. The login ID should be the encrypted email address.</li> </ol><ol start ="2"> <li><strong>Update Email- Invalid Login Hint:</strong>This error occurs when the login hint provided for the email update OTP is invalid. The login hint should indicate the type of identifier being used, such as email.</li> </ol> <ol start="3"> <li><strong>Update Email- Invalid X-token.</strong> This error occurs when the X-token provided for the email update OTP is invalid. The X-token is essential for authenticating the request, and an invalid token means the server cannot verify the user’s identity.</li> </ol> <ol start ="4"> <li><strong>Update Mobile- Invalid LoginId:</strong> This error occurs when the login ID provided for the mobile update OTP is invalid. The login ID should be the encrypted mobile number.</li> </ol> <ol start="5"> <li><strong>Update Mobile- Invalid Login Hint.</strong> This error occurs when the login hint provided for the mobile update OTP is invalid. The login hint should indicate the type of identifier being used, such as mobile.</li> </ol> <ol start ="6"> <li><strong>Update Mobile- Already verified mobile number :</strong> This OTP is generated for authentication or verification purposes related to DL,the unique identification number issued by the Indian government</li> </ol> <ol start="7"> <li><strong>Update Mobile-Invalid Scope.</strong> This error occurs when the scope provided in the OTP request for mobile update is invalid. The scope specifies the purpose of the OTP request, such as abha-enrol, mobile-verify, etc.</li> </ol> <ol start ="8"> <li><strong>Update Mobile - Already Verified Mobile Number:</strong> This error occurs when the mobile number provided for the update is already verified. The system recognizes that the mobile number is already linked and verified with the user’s profile.</li> </ol> <ol start="9"> <li><strong>ReKyc - Invalid Scope.</strong> This error occurs when the scope provided in the OTP request for re-KYC is invalid. The scope specifies the purpose of the OTP request, such as re-kyc, kyc-update, etc.</li> </ol> <ol start ="10"> <li><strong>ReKyc - Invalid X-token:</strong> This error occurs when the X-token provided for the re-KYC OTP is invalid. The X-token is essential for authenticating the request, and an invalid token means the server cannot verify the user’s identity.</li> </ol> <ol start="11"> <li><strong>ReKyc- Invalid LoginId.</strong> This error occurs when the login ID provided for the re-KYC OTP is invalid. The login ID should be the encrypted identifier, such as Aadhaar number or mobile number.</li> </ol> <ol start ="12"> <li><strong>ReKyc - Invalid Login Hint:</strong> This error occurs when the login hint provided for the re-KYC OTP is invalid. The login hint should indicate the type of identifier being used, such as Aadhaar or mobile.</li> </ol> <ol start="13"> <li><strong>Password_Update_Request_OTP_Aadhaar-Invalid Scope.</strong> This error occurs when the scope provided in the OTP request for updating the password using Aadhaar is invalid. The scope specifies the purpose of the OTP request, such as password-update, aadhaar-verify, etc.</li> </ol> <ol start ="14"> <li><strong>Password_Update_Request_OTP_Aadhaar-Invalid LoginId:</strong> This OTP is generated for authentication or verification purposes related to DL, the unique identification number issued by the Indian government</li> </ol> <ol start="15"> <li><strong>Password_Update_Request_OTP_Aadhaar-Invalid LoginHint.</strong> This error occurs when the login ID provided for the password update OTP using Aadhaar is invalid. The login ID should be the encrypted Aadhaar number.</li> </ol>
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      Invalid Scope:
