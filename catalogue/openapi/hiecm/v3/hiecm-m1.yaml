          description: The 200 response code indicates a successful request. In this context, the entered OTP was verified, confirming the user’s identity and  the account was  accessed by verified user.<br><br> <li><strong>ABHA Address Verification via Mobile OTP:</strong> This action allows users to verify their ABHA address using an OTP sent to the mobile number registered with their Abha address. This ensures that the user’s ABHA address is securely verified.</li><br><li><strong>ABHA Address Verification via Aadhaar OTP:</strong> This action allows users to verify their ABHA address using an OTP sent to the mobile number registered with their Aadhaar. This ensures that the user’s ABHA address is securely verified.</li><br><li><strong>ABHA Address Verification via Biometric :</strong> This action allows users to verify their ABHA address using Biometric Authentication modes(Fingerprint, Face, Iris) . This ensures that the user’s ABHA address is securely verified.</li>
