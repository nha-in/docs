  /v3/profile/login/verify:
    post:
      operationId: m1_login_verify
      x-abdm-use-case: ABHA verification, mobile OTP
      tags:
      - abha-login
      summary: Verify a login OTP and get a user token
      description: |
        Returns the user scoped token that profile calls need, sent afterwards as
        the `X-token` header. That token identifies one person, so it is not
        interchangeable with the gateway session token, which identifies your
        application.

        If the identifier the person used maps to more than one ABHA, this
        responds with the list instead of a token, and you continue with the
        user selection call.

        The saved responses in NHA's collection cover 400, 401, 404 and 422 as
        well as 200, so read the body rather than only the status.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/BenefitName'
      - $ref: '#/components/parameters/TToken'
      - $ref: '#/components/parameters/XToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                    otp:
                      type: object
                      properties:
                        txnId:
                          type: string
                        otpValue:
                          type: string
                      required:
                      - otpValue
                      - txnId
                    password:
                      type: object
                      properties:
                        ABHANumber:
                          type: string
                        password:
                          type: string
                      required:
                      - ABHANumber
                      - password
                    face:
                      type: object
                      properties:
                        txnId:
                          type: string
                      required:
                      - txnId
                    bio:
                      type: object
                      properties:
                        txnId:
                          type: string
                        fingerPrintAuthPid:
                          type: string
                      required:
                      - fingerPrintAuthPid
                      - txnId
                  required:
                  - authMethods
              required:
              - authData
              - scope
            examples:
              login_abha_via_mobile_number:
                summary: login abha via mobile number
                value:
                  scope:
                  - abha-login
                  - mobile-verify
                  authData:
                    authMethods:
                    - otp
                    otp:
                      txnId: <TXN_ID>
                      otpValue: <OTPVALUE>
              login_abha_via_aadhaar_number:
                summary: login abha via aadhaar number
                value:
                  scope:
                  - abha-login
                  - aadhaar-verify
                  authData:
                    authMethods:
                    - otp
                    otp:
                      txnId: <TXN_ID>
                      otpValue: <OTPVALUE>
              login_abha_number_password:
                summary: login abha number password
                value:
                  scope:
                  - abha-login
                  - password-verify
                  authData:
                    authMethods:
                    - password
                    password:
                      ABHANumber: <ABHA_NUMBER>
                      password: <PASSWORD>
      responses:
        '200':
          description: Recorded in NHA's own collection. Values are scrubbed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                  authResult:
                    type: string
                  message:
                    type: string
                  token:
                    type: string
                  expiresIn:
                    type: integer
                  refreshToken:
                    type: string
                  refreshExpiresIn:
                    type: integer
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        ABHANumber:
                          type: string
                        preferredAbhaAddress:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                        profilePhoto:
                          type: string
                        mobileVerified:
                          type: boolean
                      required:
                      - ABHANumber
                      - mobileVerified
                      - name
                      - preferredAbhaAddress
                      - profilePhoto
                      - status
                required:
                - accounts
                - authResult
                - expiresIn
                - message
                - refreshExpiresIn
                - refreshToken
                - token
                - txnId
              examples:
                example:
                  summary: example
                  value:
                    txnId: <TXN_ID>
                    authResult: success
                    message: Aadhaar Face Authentication Success
                    token: <TOKEN>
                    expiresIn: 1800
                    refreshToken: <REFRESHTOKEN>
                    refreshExpiresIn: 1296000
                    accounts:
                    - ABHANumber: <ABHA_NUMBER>
                      preferredAbhaAddress: <ABHA_ADDRESS>
                      name: <NAME>
                      status: ACTIVE
                      profilePhoto: <BASE64_PHOTO>
                      mobileVerified: false
        '400':
          description: Recorded in NHA's own collection. Values are scrubbed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  faceDto:
                    type: string
                  timestamp:
                    type: string
                  PID:
                    type: string
                  scope:
                    type: string
                  authData:
                    type: string
                  txnId:
                    type: string
                  authMethod:
                    type: string
                  bioDto:
                    type: string
                required:
                - timestamp
              examples:
                invalid_dto:
                  summary: invalid dto
                  value:
                    faceDto: Invalid Aadhaar face request
                    timestamp: '2025-01-15 13:29:43'
                invalid_dto_alt:
                  summary: invalid dto alt
                  value:
                    faceDto: Invalid Aadhaar face request
                    timestamp: '2025-01-15 13:32:04'
        '401':
          description: Recorded in NHA's own collection. Values are scrubbed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  description:
                    type: string
                required:
                - code
                - description
                - message
              examples:
                invalid_authorization:
                  summary: invalid authorization
                  value:
                    code: '900901'
                    message: Invalid Credentials
                    description: Invalid JWT token. Make sure you have provided
                      the correct security credentials
        '404':
          description: Recorded in NHA's own collection. Values are scrubbed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  type:
                    type: string
                  message:
                    type: string
                  description:
                    type: string
                required:
                - code
                - description
                - message
                - type
              examples:
                invalid_url:
                  summary: invalid url
                  value:
                    code: '404'
                    type: Status report
                    message: Runtime Error
                    description: No matching resource found for given API Request
        '422':
          description: Recorded in NHA's own collection. Values are scrubbed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
              examples:
                used_pid:
                  summary: used pid
                  value:
                    error:
                      code: ABDM-1204
                      message: 'UIDAI Error code : 563 : Duplicate request (this
                        error occurs when exactly same authentication request
                        was re-sent by AUA)'
                expired_pid:
                  summary: expired pid
                  value:
                    error:
                      code: ABDM-1204
                      message: 'UIDAI Error code : 561 : Request expired (“Pid->ts”
                        value is older than N hours where N is a configured threshold
                        in authentication server)'
      x-abdm-atom: hiecm.endpoint.m1-login-verify
