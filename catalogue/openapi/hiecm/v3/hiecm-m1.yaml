            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                    example: "{{txnId}}"
                  abhaAddress:
                    type: string
                    example: "{{abhaAddress}}"
                  preferred:
                    type: integer
                    example: 1
              examples:
                ABHA Address-Positive flow:
                  value:
                    txnId: 23acf181-339d-4771-b532-5c5df4a28d19
                    healthIdNumber: <ABHA_NUMBER>
                    preferredAbhaAddress: <ABHA_ADDRESS>
        "400":
          description: The 400 response code indicates a bad request. In this context, it refers to various errors encountered during the operation of the Suggestion API.<br><br> <p><strong>Types of Suggestion API Errors:</strong></p> <ol> <li><strong>Invalid Preferred Flag:</strong> This error occurs when the transaction ID provided in the request is invalid. The transaction ID is essential for tracking the request and ensuring that the correct information is processed. An invalid transaction ID means the server cannot verify the request, leading to a failure in enrolling the ABHA address. .</li> </ol> <ol start="2"> <li><strong>Invalid Transaction Id:</strong>This error occurs when the preferred flag provided in the request is invalid. The preferred flag indicates the user’s preference for the suggested ABHA address. An invalid preferred flag means the server cannot process the user’s preference correctly, leading to a failure in enrolling the ABHA address.</li> </ol>
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferred:
                    type: string
                    example: Invalid Preferred Flag
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-05-10T12:00:14.000Z"
              examples:
