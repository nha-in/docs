      x-stoplight:
        id: rzx3lv9ybtbv3
      description: '"This API endpoint is used to verify the OTP (One-Time Password) for logging into an ABHA (Ayushman Bharat Health Account) profile. It is used to verify the OTP sent to the user’s registered mobile number or email address for the purpose of logging into their ABHA profile. The OTP is essential for verifying the user’s identity and ensuring secure access to their profile.<br> <br>**Example of OTP Request**<br> <br>Example 1:<br> **Login via ABHA Number - Using Aadhaar OTP:** This endpoint verifies the OTP sent to the user’s registered mobile number for logging into their ABHA profile using their ABHA number and Aadhaar OTP.  <br> <br>Example 2:<br> **Login via ABHA Number - Using ABHA OTP:** This endpoint verifies the OTP sent to the user’s registered mobile number for logging into their ABHA profile using their ABHA number and ABHA OTP. <br> <br>Example3:<br> **Verify Password:** This endpoint verifies the user’s password for logging into their ABHA profile.<br> <br>Example 4:<br> **Login via Aadhaar:** verifies the OTP sent to the user’s registered mobile number for logging into their ABHA profile using their Aadhaar number..<br><br> Example 5:<br> **Login via Mobile number:** This endpoint verifies the OTP sent to the user’s registered mobile number for logging into their ABHA profile using their mobile number.  <br><br> Example 6:<br>  **ABHA PROFILE (Login via Biometric) -** Its used to verify the user’s identity using biometric data (such as fingerprints, face, Iris) for logging into their ABHA profile. The request body should include the scope, authentication methods, and biometric data. <br> <br> For Login via Biometric using face <br> <strong>scope: </strong> <code>abha-login</code>, <code> aadhaar-face-verify </code>   <br><br> For Login via Biometric using fingerprint <br> <strong>scope: </strong> <code>abha-login</code>, <code> aadhaar-bio-verify </code> <br><br>For Login via Biometric using Iris <br> <strong>scope: </strong> <code>abha-login</code>, <code> aadhaar-iris-verify </code>   <br><br>Example 7:<br>  **Find ABHA  - Verify OTP:** It is used to verify the OTP to Fetch Complete ABHA Details along with JWT Tokens. <br><br><strong>Note : </strong> OTP will be valid for 10 minute only <br><br>Example 8:<br>  **Find ABHA  - Verify via Biometric:** It is used to find the ABHA details using Biometric(Fingerprint, Face, Iris) data in the form of PID.'
      operationId: m1_post_v3_profile_login_verify
  /abha/api/v3/profile/login/verify/user:
    post:
      tags:
        - ABHA LOGIN
      summary: "Use Case: This API is used to verify and confirm the selected ABHA user during login, so the correct account is authenticated and access is granted securely."
      description: This API is used to verify the selected ABHA user during the login journey after the user has searched or identified available ABHA accounts. It confirms that the user is proceeding with the correct ABHA number and validates the requested authentication flow. This step helps securely continue login for the chosen account and prevents access to the wrong profile. It is typically used when multiple ABHA accounts are available against the same mobile number or identifier. After successful verification, the user can proceed with the remaining authentication steps.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ABHANumber:
                  type: string
                  example: "{{abha-number}}"
                txnId:
                  type: string
                  example: "{{txnId}}"
              required:
                - ABHANumber
                - txnId
            examples:
              Login Via Mobile Number - Verify User:
                value:
                  ABHANumber: "{{abha-number}}"
                  txnId: "{{txnId}}"
      security:
        - bearerAuth: []
      parameters:
        - name: T-token
