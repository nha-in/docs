      x-abdm-use-case: Fetch ABHA by Aadhaar number
      tags:
      - benefit-apis
      summary: Link or unlink a benefit record from an ABHA
      description: |
        One call does both directions. NHA's saved success response names the
        scheme and confirms the link in a human readable `status` string rather
        than a code, so match on the HTTP status and the scheme, not on that
        text.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/BenefitName'
      - $ref: '#/components/parameters/XToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - scope
              properties:
                scope:
                  type: array
                  items:
                    type: string
                    enum:
                    - link
                    - de-link
                  description: |
                    The direction. The recorded requests send `["de-link"]`, and the collection's comment shows `["link"]` for linking. Note the hyphen in `de-link`.
                  example:
                  - link
                loginHint:
                  type: string
                  description: |
                    How the account is identified when the call is not made with an X-token: the recorded variants send `abha-number` or `xmlUid`. Absent on the X-token variant.
                  example: abha-number
                loginId:
                  type: string
                  description: |
                    The identifier named by `loginHint`, RSA encrypted against NHA's public key, never raw. Present only alongside `loginHint`.
                  example: <RSA_ENCRYPTED_ABHA_NUMBER>
      responses:
        '200':
          description: Recorded in NHA's own collection. Values are scrubbed.
          content:
            application/json:
