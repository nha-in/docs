                      aadhaar: "{{encrypted aadhaar number}}"
                      fingerPrintAuthPid: "{{fingerPrintAuthPid}}"
                      mobile: "{{mobile number}}"
                  consent:
                    code: abha-enrollment
                    version: "1.4"
              Create ABHA via Biometrics- Aadhaar Faceauth:
                value:
                  authData:
                    authMethods:
                      - face_auth
                    face:
                      txnId: 881f2bf5-7377-4067-b50e-1e6ff100b3cc
                      aadhaar: "{{encrypted aadhaar number}}"
                      mobile: "{{mobile number}}"
                  consent:
                    code: abha-enrollment
                    version: "1.4"
              Create ABHA via Biometrics- Aadhaar IRIS:
                value:
                  authData:
                    authMethods:
                      - iris
                    iris:
                      aadhaar: "{{encrypted aadhaar number}}"
                      pid: "{{PID}}"
                      mobile: "{{mobile number}}"
                  consent:
                    code: abha-enrollment
                    version: "1.4"
              CHILD ABHA-Create CHILD ABHA:
                value:
                  authData:
                    authMethods:
                      - child
                    child:
                      dayOfBirth: "{{day Of Birth}}"
                      monthOfBirth: "{{month Of Birth}}"
                      yearOfBirth: "{{year Of Birth}}"
                      gender: "{{Gender}}"
                      password: ""
                      name: "{{Name}}"
                      profilePhoto: ""
                      parentConsent: "true"
                  consent:
                    code: abha-enrollment
                    version: "1.4"
        description: <b>Below is the Request Body description:</b><br><br>  <ol> <li> <p><strong>CHILD ABHA - Create CHILD ABHA</strong></p> <ul> <li><strong>Description:</strong> This API endpoint is used to create a CHILD ABHA number for a minor using their demographic details. The CHILD ABHA number helps in uniquely identifying minors and linking their health records across multiple systems:</li> <li><strong>dayOfBirth:</strong> The day of the user’s birth. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>&lt;DOB&gt;</code></li> </ul> </li> <li><strong>monthOfBirth:</strong> The month of the user’s birth. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>&lt;DOB&gt;</code></li> </ul> </li> <li><strong>yearOfBirth:</strong> The year of the user’s birth. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>&lt;DOB&gt;</code></li> </ul> </li> <li><strong>name:</strong> The user’s name. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>John</code></li> </ul> </li> <li><strong>gender:</strong> The user’s gender. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>M</code></li> </ul> </li> <li><strong>name:</strong> The user’s last name. <ul><li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>Doe John</code></li> </ul> </li>  <li><strong>stateCode:</strong> The code of the user’s state. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>27</code></li> </ul> </li> <li><strong>parentConsent:</strong> Consent of the parent should be true <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>true</code></li> </ul> </li> </ul> </li> </ul> </li> </ul> </li> <li> <p><strong>Demo Auth API</strong></p> <ul> <li><strong>Description:</strong> This API endpoint is used for the demo authentication of an individual using their Aadhaar number. It verifies the demographic details against the Aadhaar database and generates an ABHA number if the details match.</li> <li><strong>dateOfBirth:</strong> The day of the user’s birth. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>&lt;DOB&gt;</code></li> </ul> </li> <li><strong>districtCode:</strong> The code of the user’s district. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>486</code></li> </ul> </li> <li><strong>stateCode:</strong> The code of the user’s state. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>1</code></li> </ul> </li> <li><strong>name:</strong> The user’s name. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>John Doe</code></li> </ul> </li> <li><strong>gender:</strong> The user’s gender. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>M</code></li> </ul> </li> <li><strong>mobile:</strong> The user’s mobile number. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>******1234</code></li> </ul> </li> </ul> </li> <li> <p><strong>Create ABHA by Verifying OTP</strong></p> <ul> <li><strong>Description:</strong> This API endpoint is used to create an ABHA (Ayushman Bharat Health Account) number by verifying an OTP sent to the user’s registered mobile number.</li> </ul> </li> <li> <p><strong>Create ABHA Via Biometrics</strong></p> <ul> <li><strong>Description:</strong> This API endpoint is used to create an ABHA (Ayushman Bharat Health Account) number by using users biometrics. In this flow user will be using Aadhaar authentication and biometrics verification(FingerPrint, Face and Iris). </li> </ul> </li> </ol>
      security:
        - bearerAuth: []
      parameters:
        - name: TIMESTAMP
          in: header
          required: true
