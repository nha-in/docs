        "200":
          description: "The 200 response code indicates a successful request. In this context, it refers to the successful verification of an OTP (One-Time Password) for various services.<br><br>

            \  <strong>Types of OTP Verifications:</strong>

            \ <ol>

            \ <li><strong>PASSWORD_VERIFY_OTP- Positive Flow : </strong>The 200 response code indicates a successful request. In this context, it refers to the successful verification of the OTP (One-Time Password) for password verification purposes.</li>

            \ </ol>

            \    <ol start=\"2\">

            \ <li><strong>Re-KYC- Positive Flow

            :</strong> The 200 response code indicates a successful request. In this context, it refers to the successful completion of the Re-KYC process.</li>

            \ </ol>

            \  <ol start =\"3\">

            \ <li><strong>Update Mobile- Positive Flow: </strong> The 200 OK response code indicates a successful request. In this context, it refers to the successful update of the mobile number.</li>

            \ </ol>

            \  <ol start =\"4\">

            \ <li><strong>Update Email- Positive Flow:</strong> The 200 OK response code indicates a successful request. In this context, it refers to the successful update of the email address.</li>

            \ </ol>

            \  <ol start=\"5\">

            \ <li><strong>PASSWORD UPDATE-OLD PASSWORD- Positive Flow:</strong>The 200 OK response code indicates a successful request. In this context, it refers to the successful update of the password when the old password is verified.</li>

            \ </ol>

            \  <ol start=\"6\">

            \ <li><strong>CHILD ABHA KYC - Verify OTP- Positive Flow:</strong>This action allows users to complete the KYC verification for a Child ABHA by verifying the OTP sent to the Aadhaar-linked mobile number of the child/guardian. Successful verification completes the Re-KYC process for the Child ABHA account.</li>

            \ </ol>

            \ "
