  /abha/api/v3/phr/web/login/abha/request/otp:
    post:
      tags:
        - ABHA ADDRESS VERIFICATION
      summary: "Use Case: Sends an OTP to the Mobile Number, Aadhaar Number, Request Biometric Authentication"
      description: This API is designed to facilitate secure user authentication by sending a One-Time Password (OTP) to the user’s mobile number. This ensures that only authorized users can access their accounts  <br><br> **ABHA ADDRESS Verification via Mobile OTP:** Sends an OTP to the mobile number used for ABHA enrollment.<br><br> **ABHA ADDRESS Verification via Aadhaar OTP:** Sends an OTP to the mobile number linked to the user’s Aadhaar number.<br><br> **ABHA ADDRESS Verification via Biometric (Fingerprint Authentication):** Sends Fingerprint Authentication request.<br><br> **ABHA ADDRESS Verification via Biometric (Face Authentication):** Sends Face Authentication request.<br><br> **ABHA ADDRESS Verification via Biometric (Iris Authentication):** Sends an Iris Authentication request.<br>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                    example: abha-address-login
                  example:
                    - abha-address-login
                    - mobile-verify
                    - aadhaar-face-verify
                    - aadhaar-bio-verify
                    - aadhaar-iris-verify
                loginHint:
                  type: string
                  example: abha-address
                loginId:
                  type: string
                  example: "{{encryptedAbhaAddress}}"
                otpSystem:
                  type: string
                  example: abdm
              required:
                - scope
                - loginHint
                - loginId
                - otpSystem
            examples:
              ABHA Address Verification via Mobile OTP:
                value:
                  scope:
                    - abha-address-login
                    - mobile-verify
                  loginHint: abha-address
                  loginId: "{{encryptedAbhaAddress}}"
                  otpSystem: abdm
              ABHA Address Verification via Aadhaar- OTP:
                value:
                  scope:
                    - abha-address-login
                    - aadhaar-verify
                  loginHint: abha-address
                  loginId: "{{encryptedAbhaAddress}}"
                  otpSystem: aadhaar
              ABHA Address Verification via Biometric - (FingerPrint):
                value:
                  scope:
                    - abha-login
                    - aadhaar-bio-verify
                  loginHint: abha-address
                  loginId: "{{encryptedAbhaAddress}}"
                  otpSystem: aadhaar
              ABHA Address Verification via Biometric - (Face):
                value:
                  scope:
                    - abha-login
                    - aadhaar-face-verify
                  loginHint: abha-address
                  loginId: "{{encryptedAbhaAddress}}"
                  otpSystem: aadhaar
              ABHA Address Verification via Biometric - (IRIS):
                value:
                  scope:
                    - abha-login
                    - aadhaar-iris-verify
                  loginHint: abha-address
                  loginId: "{{encryptedAbhaAddress}}"
                  otpSystem: aadhaar
        description: <b>Below is the Request Body description:</b><br><br><b>Note:</b> Mandatory fields can't be null.<ol><li><p><strong>scope</strong> (required):</p><ul><li><strong>Description:</strong> Specifies the scope of the OTP request.</li><li><strong>Example:</strong> <code>["abha-address-login","mobile-verify","aadhaar-verify"]</code></li><li><strong>Possible Values:</strong> <code>abha-address-login</code>,<code>mobile-verify</code>,<code>aadhaar-verify</code> <code>aadhaar-face-verify</code> <code>aadhaar-bio-verify</code> <code>aadhaar-iris-verify</code>.</li></ul></li><li><p><strong>loginHint</strong> (required):</p><ul><li><strong>Description:</strong> Indicates the type of identifier being used for the OTP request.</li><li><strong>Example:</strong> <code>abha-address</code></li><li><strong>Possible Values:</strong> <code>abha-address</code></li></ul></li><li><p><strong>loginId</strong> (required):</p><ul><li><strong>Description:</strong> Encrypted abha address</li><li><strong>Example:</strong> <code>{{encryptedAbhaAddress}}</code></li><li><strong>Possible Values:</strong> <code>{{encryptedAbhaAddress}}</code></li></ul></li><li><p><strong>otpSystem</strong> (required):</p><ul><li><strong>Description:</strong> Otp system </li><li><strong>Example:</strong> <code>abdm,aadhaar</code></li><li><strong>Possible Values:</strong> <code>abdm,aadhaar</code></li></ul></li></ol>
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      responses:
        "200":
          description: The 200 response code indicates that the OTP has been successfully sent to the  mobile number. This response confirms that the authentication process has been initiated, ensuring that only authorized users can access their accounts. The OTP must be entered correctly to proceed with the authentication.
          content:
