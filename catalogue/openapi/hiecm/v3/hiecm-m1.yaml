            against the sandbox and record what comes back before relying on it.
      x-abdm-atom: hiecm.endpoint.m1-enrolment-list-children
  /v3/enrollment/request/otp:
    post:
      operationId: m1_enrolment_request_otp
      x-abdm-use-case: ABHA creation, Aadhaar OTP
      tags:
      - abha-creation
      summary: Send an OTP to begin or continue an enrolment
      description: |
        The first call of most enrolment flows, and the one people reuse without
        noticing. What it does depends on `scope` and `loginHint`.

        Starting an enrolment: `scope` is `["abha-enrol"]`, `loginHint` is
        `aadhaar`, `loginId` is the encrypted Aadhaar number and `otpSystem` is
        `aadhaar`. The OTP goes to the mobile registered with Aadhaar.

        Verifying a mobile or email afterwards: `scope` gains `mobile-verify` or
        `email-verify`, `otpSystem` becomes `abdm`, and you pass the `txnId` from
        the enrolment you are continuing.

        `loginId` is encrypted, never the raw value. Encrypt it against NHA's
        public key first.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                loginHint:
                  type: string
                loginId:
                  type: string
                otpSystem:
                  type: string
                txnId:
                  type: string
              required:
              - loginHint
              - loginId
              - otpSystem
              - scope
            examples:
              create_abha_aadhaar_otp:
                summary: create abha aadhaar otp
                value:
                  scope:
                  - abha-enrol
                  loginHint: aadhaar
                  loginId: _encrypted_12_digit_aadhaar_no_
                  otpSystem: aadhaar
              create_abha_aadhaar_otp_alt:
                summary: create abha aadhaar otp alt
                value:
                  txnId: <TXN_ID>
                  scope:
                  - abha-enrol
                  - mobile-verify
                  loginHint: mobile
                  loginId: <ENCRYPTED_MOBILE_NUMBER>
                  otpSystem: abdm
              create_abha_aadhaar_otp_alt_alt:
                summary: create abha aadhaar otp alt alt
                value:
                  txnId: <TXN_ID>
                  scope:
                  - abha-enrol
                  - email-verify
                  loginHint: email
                  loginId: <EMAIL_ENCRYPTION>
                  otpSystem: abdm
      responses:
        '200':
          description: The call was accepted. NHA's collection saves no response
