                    - message
                  message:
                    type: string
                  timestamp:
                    type: string
                  loginId:
                    type: string
              examples:
                already_link:
                  summary: already link
                  value:
                    error:
                      code: ABDM-1140
                      message: The benefit record has already been linked
                already_de_link:
