paths:
  /abha/api/v3/enrollment/request/otp:
    post:
      tags:
        - ABHA ENROLLMENT Via AADHAAR
      summary: "Use Case: ABHA enrollment - Send OTP using Aadhaar number Mobile number, ABHA number and Email address"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                  example:
                    - email-verify
                    - abha-enrol
                    - mobile-verify
                loginHint:
                  type: string
                  example: aadhaar
                loginId:
                  type: string
                  example: "{{encrypted aadhaar number}},{{encrypted mobile number}},{{encrypted email address}}"
                otpSystem:
                  type: string
                  example: abdm,aadhaar
              required:
                - scope
                - loginHint
                - loginId
                - otpSystem
            examples:
              ABHA enrolment via Aadhaar-Send OTP:
                value:
                  txnId: "{{txnId}}"
                  scope:
                    - abha-enrol
                  loginHint: aadhaar
                  loginId: "{{encrypted aadhaar number}}"
                  otpSystem: aadhaar
              Mobile Update - Send OTP:
                value:
                  txnId: "{{txnId}}"
                  scope:
                    - abha-enrol
                    - mobile-verify
                  loginHint: mobile
                  loginId: "{{encrypted mobileNumber}}"
                  otpSystem: abdm
              ABHA Creation via Aadhaar OTP-Send OTP:
                value:
                  txnId: "{{txnId}}"
                  scope:
                    - abha-enrol
                  loginHint: aadhaar
                  loginId: "{{encrypted aadhaar number}}"
                  otpSystem: aadhaar
          application/xml:
            schema:
              type: object
              properties: {}
            examples:
              "":
                value: |-
                  {
                      "txnId": "",
                      "scope": [
                          "abha-enrol"
                      ],
                      "loginHint": "aadhaar",
                      "loginId": "{{encrypted aadhaar}}",
                      "otpSystem": "aadhaar"
                  } 
        description: "<b>Below is the Request Body description:</b><br><br>\r

          \ \r

          <!--<div> <table> <thead> <tr> <th>Attributes</th> <th>Description</th> </tr> </thead> <tbody> <tr> <td>scope <sup>* required</td> <td>Aadhaar/Abha/mobile</td> </tr> <tr> <td>loginHint <sup> * required</td> <td>Aadhaar,Abha And Mobile Number</td> </tr> <tr> <td>loginId <sup>* required </sup></td> <td>encrypted mobile-number</td> </tr> <tr> <td>otpSystem <sup>* required</td> <td>abdm/aadhaar</td> </tr> </tbody> </table> </div> <hr> --> <b>Note:</b> Mandatory fields can't be null.. <ol> <li> <p><strong>scope</strong> (required):</p> <ul> <li><strong>Description:</strong> Specifies the scope of the OTP request.</li> <li><strong>Example:</strong> <code>[\"abha-enrol\", \"mobile-verify\",]</code></li> <li><strong>Possible Values:</strong> <code>abha-enrol</code>, <code>mobile-verify</code> ,<code>email-verify</code>.</li> </ul> </li> <li> <p><strong>loginHint</strong> (required):</p> <ul> <li><strong>Description:</strong> Indicates the type of identifier being used for the OTP request.</li> <li><strong>Example:</strong> <code>aadhaar</code></li> <li><strong>Possible Values:</strong><code>aadhaar</code>, <code>mobile</code></li> </ul> </li> <li>  <p><strong>loginId</strong> (required):</p> <ul> <li><strong>Description:</strong> The encrypted identifier (ABHA Number, or Mobile Number) for which the OTP is being requested.</li> <li><strong>Example:</strong> <code>{{encrypted aadhaar number}}</code>, <code>{{encrypted mobile number}}</code>,<code>{{encrypted email address}}</code></li> </ul> </li>  <li> <p><strong>otpSystem</strong> (required):</p> <ul> <li><strong>Description:</strong> Specifies the system used for OTP generation.</li> <li><strong>Example:</strong> <code>abdm</code>, <code>aadhaar</code></li> <li><strong> Possilbe Values:</strong> <code>aadhaar, abdm</code></li> </ul> </li> </ol> <ol>"
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      responses:
        "200":
          description: |-
            The 200 response code indicates a successful request. In this context, it refers to the successful generation and delivery of an OTP (One-Time Password) for various services.<br><br> <strong>Types of OTP Responses:</strong> <ol> <li><strong>AADHAAR OTP Response:</strong> This OTP is generated for authentication or verification purposes related to AADHAAR, the unique identification number issued by the Indian government.</li> </ol>
             <ol start ="2">
            <li><strong>ABHA OTP Response:</strong> This OTP is generated for authentication or verification purposes related to ABHA (Ayushman Bharat Health Account), which is part of India’s health ID system</li> </ol>
             <ol start="3">
            <li><strong>Mobile OTP Response.</strong> This OTP is generated for general mobile number verification purposes, such as logging into an account, completing a transaction, or verifying identity</li> </ol> <ol start ="4"> <li><strong>Email OTP Response:</strong> This OTP is generated for verification purposes of Email, the OTP is send to the registered email address </li> </ol>
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                    example: c6a49f66-c740-4a7d-a93d-8c0431bbb8f3
                  message:
                    type: string
                    example: OTP is sent to Aadhaar registered mobile number ending with*******0903,OTP sent to Aadhaar registered mobile number ending with ******0903,OTP sent to email address ending with *************<EMAIL>
              examples:
                ABHA Creation via Aadhaar OTP-REQUEST OTP FOR AADHAAR AUTHENTICATION:
                  value:
                    txnId: c6a49f66-c740-4a7d-a93d-8c0431bbb8f3
                    message: OTP is sent to Aadhaar registered mobile number ending with*******0903
                Mobile Update - Send OTP- positive flow:
                  value:
                    txnId: 37d8d312-35a0-41e7-a6e4-107h6b18a5fa
                    message: OTP sent to mobile number ending with ******0903
                ABHA enrolment via Aadhaar-positive flow:
                  value:
                    txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                    message: OTP sent to Aadhaar registered mobile number ending with ******0903
                Email Verify via OTP-positive flow:
                  value:
                    txnId: 37d8d312-35a0-41e7-a6e4-1074eb18a5fa
                    message: OTP sent to email address ending with *************<EMAIL>
        "400":
          description: 'The 400 response code indicates a bad request. In this context, it refers to various errors encountered during the OTP (One-Time Password) generation or validation process.<br><br> <strong>Types of OTP Response Errors:</strong> <ol> <li><strong>ABHA enrolment via Aadhar - Invalid Scope</strong>: This error occurs when the scope provided in the OTP request is invalid. The scope specifies the purpose of the OTP request, such as abha-enrol, mobile-verify, etc.</li> </ol> <ol start="2"> <li><strong>ABHA enrolment via Aadhar  -Send OTP- Invalid LoginId</strong>: This error occurs when the login ID provided for the Aadhaar OTP is invalid. The login ID should be the encrypted Aadhaar number.</li> </ol> <ol start="3"> <li><strong>Mobile Update -Send OTP- Invalid Scope</strong>:  This error occurs when the scope provided in the OTP request for mobile update is invalid.</li> </ol> <ol start="4"> <li><strong>Mobile Update -Send OTP- Invalid LoginId</strong>: This error occurs when the login ID provided for the mobile OTP is invalid. The login ID should be the encrypted mobile number.</li> </ol> <ol start="5"> <li><strong>Mobile Update -Send OTP- Invalid LoginHint</strong>: This error occurs when the login hint provided for the mobile OTP is invalid. The login hint should indicate the type of identifier being used, such as mobile.</li> </ol>  <ol start="6"> <li><strong>ABHA Creation via Aadhar- Invalid Scope</strong>: This error occurs when the scope provided in the OTP request for ABHA creation via Aadhaar is invalid.</li> </ol> <ol start="7"> <li><strong>ABHA Creation via Aadhar- Invalid Login Hint</strong>: This error occurs when the login hint provided for the Aadhaar OTP is invalid. The login hint should indicate the type of identifier being used, such as aadhaar.</li> </ol> <ol start="8"> <li><strong>ABHA enrolment via Aadhar  - Invalid Scope</strong>: The scope of the OTP response is invalid.</li> </ol><ol start="9"> <li><strong>ABHA Verify via Email- Invalid Scope</strong>: This error occurs when the scope provided in the OTP request for ABHA creation via email is invalid.</li> </ol> <ol start="10"> <li><strong>ABHA Verify via Email- Invalid Login Hint</strong>: This error occurs when the login hint provided for the email OTP is invalid. The login hint should indicate the type of identifier being used, such as aadhaar.</li> </ol> <ol start="11"> <li><strong>ABHA Verify via Email  - Invalid LoginHint</strong>: This error occurs when the email ID provided for the email OTP is invalid. The login ID should be the encrypted email address..</li> </ol> '
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      scope:
                        type: string
                        example: Invalid Scope
                      timestamp:
                        type: string
                        format: date-time
                        example: "2024-05-10T11:13:04.000Z"
                  - type: object
                    properties:
                      loginId:
                        type: string
                        example: Invalid LoginId
                      timestamp:
                        type: string
                        format: date-time
                        example: "2024-05-10T11:15:14.000Z"
                  - type: object
                    properties:
                      loginHint:
                        type: string
                        example: Invalid Login Hint
                      timestamp:
                        type: string
                        format: date-time
                        example: "2024-05-10T11:16:16.000Z"
              examples:
                ABHA enrolment via Aadhaar-Invalid scope:
                  value:
                    scope: Invalid Scope
                    timestamp: "2024-05-10T11:13:04.000Z"
                ABHA enrolment via Aadhaar-Invalid LoginId:
                  value:
                    loginId: Invalid LoginId
                    timestamp: "2024-05-10T11:15:14.000Z"
                ABHA enrolment via Aadhaar-Invalid Login Hint:
                  value:
                    loginHint: Invalid Login Hint
                    timestamp: "2024-05-10T11:16:16.000Z"
                Mobile Update - Send OTP-Invalid Scope:
                  value:
                    scope: Invalid Scope
                    timestamp: "2024-05-10T11:13:04.000Z"
                Mobile Update - Send OTP-Invalid LoginId:
                  value:
                    loginId: Invalid LoginId
                    timestamp: "2024-05-10T11:15:14.000Z"
                Mobile Update - Send OTP-Invalid Login Hint:
                  value:
                    loginHint: Invalid Login Hint
                    timestamp: "2024-05-10T11:16:16.000Z"
                ABHA Creation via Aadhaar OTP-Invalid scope:
                  value:
                    scope: Invalid Scope
                    timestamp: "2024-05-10T11:13:04.000Z"
                ABHA Creation via Aadhaar OTP-Invalid Login Hint:
                  value:
                    loginHint: Invalid Login Hint
                    timestamp: "2024-05-10T11:16:16.000Z"
                ABHA Verify via Email-Invalid Login Hint:
                  value:
                    loginHint: Invalid Login Hint
                    timestamp: "2024-05-10T11:16:16.000Z"
                ABHA Verify via Email-Invalid scope:
                  value:
                    scope: Invalid Scope
                    timestamp: "2024-05-10T11:13:04.000Z"
                ABHA Verify via Email-Invalid LoginId:
                  value:
                    loginId: Invalid LoginId
                    timestamp: "2024-05-10T11:15:14.000Z"
        "401":
          description: 'The 401 response code indicates an unauthorized request. In this context, it refers to the lack of proper authentication during the operation of the Invalid Credentials <br><br> <strong>Types of OTP Response Errors:</strong> <ol> <li><strong>ABHA Enrolment via Aadhaar - Invalid Access Token</strong>: This error occurs when the access token provided for authorization is invalid. The access token is essential for authenticating the request, and an invalid token means the server cannot verify the user’s identity.</li> </ol> <ol start="2"> <li><strong>Mobile Update - Send OTP - Invalid Access Token</strong>: This error occurs when the access token provided for authorization is invalid. The access token is essential for authenticating the request, and an invalid token means the server cannot verify the user’s identity.</li> </ol> <ol start="3"> <li><strong>ABHA Creation via Aadhaar OTP - Invalid Access Token</strong>:  This error occurs when the access token provided for authorization is invalid. The access token is essential for authenticating the request, and an invalid token means the server cannot verify the user’s identity.</li> </ol> <ol start="4"> <li><strong>EMail verification via  OTP - Invalid Access Token</strong>:  This error occurs when the access token provided for authorization is invalid. The access token is essential for authenticating the request, and an invalid token means the server cannot verify the user’s identity.</li> </ol> '
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "900901"
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: Invalid JWT token. Make sure you have provided the correct security credentials
              examples:
                ABHA enrolment via Aadhaar-Invalid access token:
                  value:
                    code: "900901"
                    message: Invalid Credentials
                    description: Invalid JWT token. Make sure you have provided the correct security credentials
                Mobile Update - Send OTP-Invalid access token:
                  value:
                    code: "900901"
                    message: Invalid Credentials
                    description: Invalid JWT token. Make sure you have provided the correct security credentials
                ABHA Creation via Aadhaar OTP-Invalid access token:
                  value:
                    code: "900901"
                    message: Invalid Credentials
                    description: Invalid JWT token. Make sure you have provided the correct security credentials
                Email verify via  OTP-Invalid access token:
                  value:
                    code: "900901"
                    message: Invalid Credentials
                    description: Invalid JWT token. Make sure you have provided the correct security credentials
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "900900"
                  message:
                    type: string
                    example: Unclassified Authentication Failure
                  description:
                    type: string
                    example: "Access failure for API: /abha/api/v3, version: v3 status: (900900) - Unclassified Authentication Failure"
      description: "This API endpoint is used to generate and send an OTP (One-Time Password) to the user’s registered mobile number. The OTP is essential for verifying the user’s identity and ensuring secure access to the ABHA (Ayushman Bharat Health Account) enrollment process. Depending on the type of identifier provided (Aadhaar Number, ABHA Number, or Mobile Number), the OTP will be generated and sent to the corresponding registered mobile number.\r

        <br> <br> </ol>**Usage of this API for below scenarios: OTP Request**<br><br> **1. AADHAR OTP:**When the user wants to enroll using their Aadhar Number, an OTP is sent to the mobile number registered with their Aadhar linked mobile number. For this pass loginHint as \"Aadhar-number\".   <br>  **2. Mobile OTP:** When the user wants to enroll using their Mobile Number, an OTP is sent to the provided mobile number. For this pass loginHint as \"mobile-number\".<br><b>Note:</b><br> **1.**OTP will be valid for 10 minute only <br><br>"
      operationId: m1_post_v3_enrollment_request_otp
  /abha/api/v3/enrollment/enrol/auth/init:
    post:
      tags:
        - ABHA CREATION USING FACE AUTH
      summary: "UseCase : It will generate the Transaction ID. This Transaction ID will be used for whole face authentication process."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                  example:
                    - abha-enrol
                    - face-auth
              required:
                - scope
                - authData
            examples:
              Init Transaction:
                value:
                  scope:
                    - abha-enrol
                    - face-auth
        description: <b>Below is the Request Body description:<br></b><br> <!--<br> <div> <table> <thead> <tr> <th>Attributes</th> <th>Description</th> </tr> </thead> <tbody> <tr> <td>loginHint <sup> * required</td> <td>Aadhaar,Abha And Mobile Number</td> </tr> <tr> <td>loginId <sup>* required </sup></td> <td>encrypted mobile-number</td> </tr> <tr> <td>otpSystem <sup>* required</td> <td>abdm/aadhaar</td> </tr> <tr> <td>scope <sup>* required</td> <td>Aadhaar/Abha/mobile</td> </tr> </tbody> </table> </div> <hr> --> <b>Note:</b> Mandatory fields can't be null. <p><strong>scope</strong> (required):</p> <ul> <li><strong>Description:</strong> It will generate the Transaction id. This Transaction Id will be used for whole face authentication process.</li> <li><strong>Type:</strong> Array of strings</li> <li><strong>Example:</strong> <code>["abha-enrol", "face-auth"]</code></li> <li><strong>Possible Values:</strong> <code>abha-enrol</code>, <code>face-auth</code></li> </ul> </li> </ol>
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      responses:
        "200":
          description: The 200 response code indicates a successful request. In this context, it refers to the successful generation of Transaction Id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                    example: 9c5d453e-756f-45e1-9766-43b9cc1190de
                  message:
                    type: string
                    example: Transaction Id generated Successfully
              examples:
                Init Transaction:
                  value:
                    txnId: 23acf181-339d-4771-b532-5c5df4a28d19
                    message: Transaction Id generated Successfully
        "400":
          description: The 400 response code indicates a bad request.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      scope:
                        type: string
                        example: Invalid Scope
                      timestamp:
                        type: string
                        format: date-time
                        example: "2024-05-10T11:41:47.000Z"
        "401":
          description: The 401 response code indicates an unauthorized request. In this context, it refers to the lack of proper authentication during the operation of the Invalid Credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "900901"
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: Invalid JWT token. Make sure you have provided the correct security credentials
              examples:
                Invalid access token:
                  value:
                    code: "900901"
                    message: Invalid Credentials
                    description: Invalid JWT token. Make sure you have provided the correct security credentials
        "500":
          description: <b>Internal Server Error</b><br><br>  An Internal Server Error (500) indicates that the server encountered an unexpected condition that prevented it from fulfilling the request.
      description: "This API will help to generate transaction id. This transaction Id will be used for whole face authentication process. <br><br> The user can submit this transaction ID to the <strong>ABHA</strong> app using either intent-based sharing or by generating a QR code. <br><br>User can use this transaction ID to generate QR code using any QR generator tool. Open ABHA app and scan this QR code on ABHA App to start and complete the face capture process.<br><br>The data format of the QR code should follow this pattern: <br>https://<phr-env-base-url>/face-auth?txnId=<txn-id-from-the-response-of-init-api>. <br><br><strong>For example:</strong> https://phrsbx.abdm.gov.in/face-auth?txnId=bac7251b-cd25-44d5-9707-f3d2ba181c1c <br><br> For Sandbox- phr-env-base-url - https://phrsbx.abdm.gov.in<br> For Production - phr-env-base-url - https://phr.abdm.gov.in"
      operationId: m1_post_v3_enrollment_enrol_auth_init
  /abha/api/v3/enrollment/enrol/capturePID:
    post:
      tags:
        - ABHA CREATION USING FACE AUTH
      summary: "UseCase : This API is used to check the status of the transaction ID."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                  example:
                    - abha-enrol
                    - face-verify
                txnId:
                  type: string
                  example: ea1dc7aa-d7c3-40ab-bee8-84c6f1eb90fa
              required:
                - scope
                - txnId
            examples:
              Capture PID:
                value:
                  scope:
                    - abha-enrol
                    - face-verify
                  txnId: ea1dc7aa-d7c3-40ab-bee8-84c6f1eb90fa
        description: <b>Below is the Request Body description:<br></b><br> <!--<br> <div> <table> <thead> <tr> <th>Attributes</th> <th>Description</th> </tr> </thead> <tbody> <tr> <td>loginHint <sup> * required</td> <td>Aadhaar,Abha And Mobile Number</td> </tr> <tr> <td>loginId <sup>* required </sup></td> <td>encrypted mobile-number</td> </tr> <tr> <td>otpSystem <sup>* required</td> <td>abdm/aadhaar</td> </tr> <tr> <td>scope <sup>* required</td> <td>Aadhaar/Abha/mobile</td> </tr> </tbody> </table> </div> <hr> --> <b>Note:</b> Mandatory fields can't be null. <p><strong>scope</strong> (required):</p> <ul> <li><strong>Description:</strong> Once you initiate the transaction id, the status of the transaction id can be checked by using this capturePID api.</li> <li><strong>Type:</strong> Array of strings</li> <li><strong>Example:</strong> <code>["abha-enrol", "face-verify"]</code></li> <li><strong>Possible Values:</strong> <code>abha-enrol</code>, <code>face-verify</code></li> </ul> </li> </ol>  <p><strong>txnId</strong> (required):</p> <ul> <li><strong>Description:</strong> Transaction Id generated by you by calling <strong>auth/init </strong> will be used here</li> <li><strong>Type:</strong> Array of strings</li> <li><strong>Example:</strong> <code>ea1dc7aa-d7c3-40ab-bee8-84c6f1eb90fc</code></li></ol>
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      responses:
        "200":
          description: The 200 response code indicates a successful request. The reponse of the API will return status of that transactionId. It can be either <strong>PENDING,VERIFIED,FAILED,COMPLETE. </strong>
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: PENDING
                  message:
                    type: string
                    example: Awaiting PID capture
              examples:
                Status Pending:
                  value:
                    status: PENDING
                    message: Awaiting PID capture
                Status Verified:
                  value:
                    status: VERIFIED
                    message: Awaiting PID capture
                Status Failed:
                  value:
                    status: FAILED
                    message: PID capture failed. Please regenarate the QR Code.
                Status COMPLETE:
                  value:
                    status: COMPLETE
                    message: PID captured successfully
                    txnId: ea1dc7aa-d7c3-40ab-bee8-84c6f1eb90fc
        "400":
          description: The 400 response code indicates a bad request.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                            example: ABDM-1017
                          message:
                            type: string
                            example: Invalid transaction, either the transaction is expired or not found
              examples:
                Invalid transaction Id:
