                  healthId:
                    type: string
                  status:
                    type: string
                required:
                - benefitName
                - healthId
                - status
              examples:
                link:
                  summary: link
                  value:
                    benefitName: healthid api
                    healthId: <ABHA_ADDRESS>
                    status: Benefit record has been linked successfully
                de_link:
