  /patient-share/v3/share:
    post:
      tags:
      - Scan & Share
      summary: '[HIP Callback] Receive Patient Profile Share'
      operationId: m1_receive_patient_share
      description: |
        **This endpoint is implemented by the HIP**, the ABDM Gateway forwards the
        patient's profile to the HIP's registered callback URL when the patient
        scans the HIP's QR code and consents to share their profile.

        The HIP must respond with a 2xx status and subsequently call `POST /patient-share/v3/on-share`.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientShareRequest'
            examples:
              default:
                value:
                  intent: PROFILE_SHARE
                  metaData:
                    hipId: CityGeneralHospital_HIP
                    context: '123'
                    hprId: testhpr@hpr.abdm
                  profile:
                    patient:
                      abhaNumber: 91-1234-5678-9012
                      abhaAddress: johnkumar@sbx
                      name: John Kumar
                      gender: M
                      dob: '1990-01-15'
                      mobile: '9876543210'
                      kycPhoto: '{{base64_photo}}'
                      address:
                        line: 123 Main Street
                        district: Mumbai
                        state: Maharashtra
                        pinCode: '400001'
      responses:
        '200':
          description: Profile received by HIP
      x-abdm-nha-operation-id: receivePatientShare
      x-abdm-atom: hiecm.endpoint.m1-receive-patient-share
  /patient-share/v3/on-share:
    post:
      tags:
      - Scan & Share
      summary: Send Share Acknowledgement (HIP → Gateway)
      operationId: m1_on_share_acknowledgement
      description: |
        HIP sends an acknowledgement back to the ABDM Gateway after receiving
        and processing the patient's shared profile.
        Typically includes a token/queue number assigned to the patient.
        **Server:** `https://dev.abdm.gov.in/api/hiecm`
      servers:
      - url: https://dev.abdm.gov.in/api/hiecm
        description: ABDM Gateway
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnShareRequest'
            examples:
              success:
                summary: Successful acknowledgement with token
                value:
                  acknowledgement:
                    status: SUCCESS
                    abhaAddress: johnkumar@sbx
                    profile:
                      context: '123'
                      tokenNumber: TKN-0042
              failure:
                summary: Failure acknowledgement
                value:
                  acknowledgement:
                    status: FAILURE
                    abhaAddress: johnkumar@sbx
                    error:
                      code: HIP_ERROR_001
                      message: Unable to process profile at this time
      responses:
        '200':
          description: Acknowledgement accepted by Gateway
      x-abdm-nha-operation-id: onShareAcknowledgement
      x-abdm-atom: hiecm.endpoint.m1-on-share-acknowledgement
components:
  securitySchemes:
    gatewaySession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `accessToken` from `POST /api/hiecm/gateway/v3/sessions`, which is described in hiecm-gateway.yaml. Send it as `Authorization: Bearer <ACCESS_TOKEN>`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token from `POST /api/hiecm/gateway/v3/sessions`.
        Header: `Authorization: Bearer {accessToken}`
    xToken:
      type: apiKey
      in: header
      name: X-Token
      description: |
        Short-lived session token returned in login/verify responses.
        Required for all `/profile/account/*` operations.
        Header: `X-Token: {token}`
  parameters:
    RequestId:
      name: REQUEST-ID
      in: header
      required: true
      description: |
        Unique UUID v4 per request. Used for idempotency and distributed tracing.
        Generate a fresh UUID for every call.
      schema:
        type: string
        examples:
        - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        x-abdm-correction: C3
    Timestamp:
      name: TIMESTAMP
      in: header
      required: true
      description: ISO 8601 UTC timestamp of the request.
      schema:
        type: string
        format: date-time
        examples:
        - '2024-11-20T06:55:56.832Z'
    XToken:
      name: X-token
      in: header
      required: false
      description: |
        The user scoped token returned when a person logs in or verifies an OTP. Profile calls act on one account, so they need this in addition to the gateway token. Required on the calls that read or change a specific person's account.

        The value carries a `Bearer ` prefix, exactly like the Authorization header: every one of the 33 X-token values in NHA's collection is `Bearer <token>`, never the bare token. Sending the bare token reads as an invalid token error.
      schema:
        type: string
      example: Bearer <X_TOKEN_FROM_LOGIN_VERIFY>
    BenefitName:
      name: BENEFIT_NAME
      in: header
      required: false
      description: |
        The benefit scheme an enrolment belongs to. Observed on the enrolment and benefit calls in NHA's collection, where the literal value is `healthid api` on the enrol and search calls, and `healthid` on the login OTP and verify calls under Find ABHA and on some of the benefit calls. On the enrolment OTP request the header is present but explicitly disabled, so NHA does not send it there.

        NHA's own collection spells this header four different ways across its requests: `BENEFIT_NAME` (most), `Benefit-Name` (the demo auth and child ABHA calls), `BENEFIT-NAME` (child update, state district search) and `Benefit_Name` (once). Underscore and hyphen are different header names on the wire, so this is a real inconsistency in the source, recorded here rather than smoothed over. The benefit programme calls also show scheme values beyond healthid: `COVIN` on an IRIS enrol and a profile photo update, and a disabled `PAN`. Nothing here has been run from this repository, so confirm the spelling and the exact values with NHA before using them in production.
      schema:
        type: string
      example: healthid api
    TToken:
      name: T-token
      in: header
      required: false
      schema:
        type: string
      description: The transaction token that carries state between the two halves
        of a login. Returned by the verify call and sent back on the account selection
        call. Like X-token, the value carries a `Bearer ` prefix in every one
        of NHA's recorded requests.
    RToken:
      name: R-token
      in: header
      required: false
      schema:
        type: string
      description: The refresh token, sent when asking for a new user token without
        making the person log in again. Like X-token, the value carries a `Bearer
        ` prefix in NHA's recorded request.
    AadhaarNumberHeader:
      name: aadhaarNumber
      in: header
      required: true
      description: |
        The person's Aadhaar number, RSA encrypted against NHA's public key and sent as a header rather than in a body. The recorded value is an encrypted blob, never the raw number: encrypt it the same way as an enrolment `loginId`. See the input encryption concept atom for the padding rules.
      schema:
        type: string
      example: <RSA_ENCRYPTED_AADHAAR_NUMBER>
    HealthIdNumberHeader:
      name: healthIdNumber
      in: header
      required: true
      description: |
        The 14 digit ABHA number, sent plain in the recorded request, in the dashed `91-XXXX-XXXX-XXXX` form.
      schema:
        type: string
      example: <ABHA_NUMBER>
    KeyType:
      name: KEY_TYPE
      in: header
      required: false
      schema:
        type: string
      description: Which NHA public key the encryption helper should use.
    TransactionId:
      name: TRANSACTION_ID
      in: header
      required: false
      schema:
        type: string
      description: The enrolment transaction this call belongs to, when the transaction
        is not carried in the body.
    AbhaNumber:
      name: abhaNumber
      in: path
      required: true
      schema:
        type: string
      example: <ABHA_NUMBER>
      description: A fourteen digit ABHA number, written in the hyphenated form
        NHA uses, for example 91-1234-5678-9012.
  schemas:
    SessionRequest:
      type: object
      required:
      - clientId
      - clientSecret
      - grantType
      properties:
        clientId:
          type: string
          description: Client ID provided during HIP/HIU registration
          examples:
          - NHATEST_001
        clientSecret:
          type: string
          description: Client secret provided during registration
          examples:
          - your-client-secret
        grantType:
          type: string
          enum:
          - client_credentials
          description: OAuth 2.0 grant type, always `client_credentials`
          examples:
          - client_credentials
    SessionResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT Bearer token for API authentication
        tokenType:
          type: string
          examples:
          - Bearer
        expiresIn:
          type: integer
          description: Token expiry duration in seconds
          examples:
          - 1800
        refreshToken:
          type:
          - string
          - 'null'
    CertificateResponse:
      type: object
      properties:
        publicKey:
          type: string
          description: |
            RSA public key in PEM format. Use this to encrypt:
            Aadhaar, Mobile, OTP, Password, ABHA Number, Email, Photos.
          examples:
          - |-
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9...
            -----END PUBLIC KEY-----
    TxnResponse:
      type: object
      properties:
        txnId:
          type: string
          description: |
            Transaction ID, must be passed back in the subsequent verification call.
            Valid for a limited time (typically 10 minutes).
          examples:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
          x-abdm-correction: C3
        message:
          type: string
          examples:
          - OTP sent successfully
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          examples:
          - Operation completed successfully
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error description
        timestamp:
          type: string
          description: Error timestamp
        details:
          type: object
          description: Additional field-level error details
          additionalProperties: true
    OtpData:
      type: object
      required:
      - txnId
      - otpValue
      description: OTP payload for verification requests
      properties:
        timeStamp:
          type: string
          format: date-time
          description: Unix timestamp of OTP generation
        txnId:
          type: string
          description: Transaction ID from the OTP request step
          x-abdm-correction: C3
        otpValue:
          type: string
          description: RSA-encrypted 6-digit OTP
    PasswordData:
      type: object
      description: Password payload for authentication/change requests
      properties:
        value:
          type: string
          description: RSA-encrypted current password
        newPassword:
          type: string
          description: RSA-encrypted new password (only for change-password actions)
    TokenPair:
      type: object
      description: Authentication tokens returned on successful enrollment/login
      properties:
        token:
          type: string
          description: X-Token for profile operations (short-lived)
        refreshToken:
          type: string
          description: Refresh token to obtain a new X-Token
    EnrollmentOtpRequest:
      type: object
      required:
      - scope
      - loginHint
      - loginId
      properties:
        txnId:
          type: string
          description: Existing transaction ID (for mobile update flows; empty
            string for first call)
          examples:
          - ''
        scope:
          type: array
          description: Defines the enrollment sub-flow
          items:
            type: string
            enum:
            - abha-enrol
            - mobile-verify
            - dl-flow
          minItems: 1
          examples:
          - - abha-enrol
        loginHint:
          type: string
          description: Type of identifier provided in `loginId`
          enum:
          - aadhaar
          - mobile
          examples:
          - aadhaar
        loginId:
          type: string
          description: RSA-encrypted Aadhaar number or mobile number
          examples:
          - '{{RSA_encrypted_aadhaar}}'
        otpSystem:
          type: string
          description: |
            OTP delivery channel:
            - `aadhaar`, OTP to Aadhaar-linked mobile (via UIDAI)
            - `abdm`, OTP to ABHA-registered mobile (via ABDM)
          enum:
          - aadhaar
          - abdm
          examples:
          - aadhaar
    EnrolByAadhaarRequest:
      type: object
      required:
      - authData
      properties:
        authData:
          type: object
          required:
          - authMethods
          properties:
            authMethods:
              type: array
              description: Authentication method(s), determines which auth data
                object is required
              items:
                type: string
                enum:
                - otp
                - bio
                - face
                - iris
                - child
                - demo_auth
              examples:
              - - otp
