        "500":
          description: Internal Server Error
      description: '"This API endpoint is used to request an OTP (One-Time Password) for logging into an ABHA (Ayushman Bharat Health Account) profile. It is used to send the OTP to the user’s registered mobile number or email address for the purpose of logging into their ABHA profile. The OTP is essential for verifying the user’s identity and ensuring secure access to their profile.<br> <br>**Example of OTP Request**<br> <br>Example 1:<br> **Login via ABHA Number - Using Aadhaar OTP:** This endpoint sends the OTP to the user’s registered mobile number for logging into their ABHA profile using their ABHA number and Aadhaar.<br> <br>Example 2:<br> **Login via ABHA Number - Using ABHA OTP:** This endpoint sends the OTP to the user’s registered mobile number for logging into their ABHA profile using their ABHA number and ABHA number. <br> <br>Example 3 :<br> **Login via Aadhaar:** This endpoint sends the OTP to the user’s registered mobile number for logging into their ABHA profile using their Aadhaar number.<br><br> Example 4:<br> **Login via Mobile number:** This endpoint sends the OTP to the user’s registered mobile number for logging into their ABHA profile using their mobile number.  <br><br> Example 5:<br>  **ABHA PROFILE (Login via Biometric) -** It is used to send the OTP to user registered mobile number for logging into their ABHA profile. The request body should include the scope, loginHint loginId, otpSystem. <br> <br> For Login via Biometric using face <br> <strong>scope: </strong> <code>abha-login</code>, <code> aadhaar-face-verify </code>   <br><br> For Login via Biometric using fingerprint <br> <strong>scope: </strong> <code>abha-login</code>, <code> aadhaar-bio-verify </code> <br><br>For Login via Biometric using Iris <br> <strong>scope: </strong> <code>abha-login</code>, <code> aadhaar-iris-verify </code>   <br><br>Example 6:<br>  **Find ABHA  - Send OTP:** It is used to send OTP on user registered Mobile number to fetch complete ABHA Details along with JWT Tokens. <br><br> For requesting an OTP incase of Find ABHA, the loginHint will be <code>index </code> and loginId will be RSA encrypted index key to fetch the complete ABHA details of that particular ABHA number. <br><br>Example 7:<br>  **Find ABHA  - FingerprintAuth / IrisAuth:** It is used to request Biometric authentication (Fingerprint/Iris) to fetch complete ABHA Details along with JWT Tokens. <br><br> For authentication request  incase of Find ABHA, the loginHint will be <code>index </code> and loginId will be RSA encrypted index key to fetch the complete ABHA details of that particular ABHA number. <br><br>Example :8<br>  **Find ABHA  - FaceAuth:** This API will help to generate transaction id. This transaction Id will be used for whole face authentication process. <br><br> The user can submit this transaction ID to the <strong>ABHA</strong> app using either intent-based sharing or by generating a QR code. <br><br>User can use this transaction ID to generate QR code using any QR generator tool. Open ABHA app and scan this QR code on ABHA App to start and complete the face capture process.<br><br>The data format of the QR code should follow this pattern: <br>https://<phr-env-base-url>/face-auth?txnId=<txn-id-from-the-response-of-init-api>. <br><br><strong>For example:</strong> "https://phrsbx.abdm.gov.in/face-auth?txnId=bac7251b-cd25-44d5-9707-f3d2ba181c1c" <br><br> For Sandbox - phr-env-base-url - https://phrsbx.abdm.gov.in<br> For Production - phr-env-base-url - https://phr.abdm.gov.in <br><br><strong>Note : </strong> OTP will be valid for 10 minute only <br><br> '
      operationId: m1_post_v3_profile_login_request_otp
  /abha/api/v3/profile/login/verify:
    post:
      tags:
        - ABHA LOGIN
        - FIND ABHA
      summary: "Use Case: ABHA Login - Verify OTP using Aadhaar number, ABHA number, Mobile number, Biometric Verify Login, Find ABHA via Aadhaar, Mobile, Biometrics"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items:
                    type: string
                    example: abha-login, aadhaar-verify
                  example:
                    - abha-login
                    - aadhaar-verify
                    - mobile-verify
                    - retrieval
                    - re-activate
                    - aadhaar-face-verify
                    - aadhaar-bio-verify
                    - aadhaar-iris-verify
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                        example: otp
                      example:
                        - otp
                        - bio
                        - face
                        - demo
                    otp:
                      type: object
                      properties:
                        otpValue:
                          type: string
                          example: "{{encrypted OTP}}"
                        txnId:
                          type: string
                          example: "{{transactionId}}"
                      required:
                        - otpValue
                        - txnId
                  required:
                    - authMethods
              required:
                - authData
                - scope
            examples:
              Verify Login via Aadhaar:
                value:
                  scope:
                    - abha-login
                    - aadhaar-verify
                  authData:
                    authMethods:
                      - otp
                    otp:
                      txnId: "{{txnId}}"
                      otpValue: "{{encrypted OTP}}"
              Verify Login via Mobile:
                value:
                  scope:
                    - abha-login
                    - mobile-verify
                  authData:
                    authMethods:
                      - otp
                    otp:
                      txnId: "{{txnId}}"
                      otpValue: "{{encrypted OTP}}"
              Verify Login via Password:
                value:
                  scope:
                    - abha-login
                    - password-verify
                  authData:
                    authMethods:
                      - password
                    password:
                      ABHANumber: "{{abha-number}}"
                      password: "{{encrypted password}}"
              Verify Login via Biometric - Face:
                value:
                  scope:
                    - abha-login
                    - aadhaar-face-verify
                  authData:
                    authMethods:
                      - face
                    face:
                      txnId: "{{txnId}}"
                      faceAuthPid: "{{PID}}"
              Verify Login via Biometric - FingerPrint:
                value:
                  scope:
                    - abha-login
                    - aadhaar-bio-verify
                  authData:
                    authMethods:
                      - bio
                    bio:
                      txnId: "{{txnId}}"
                      fingerPrintAuthPid: "{{PID}}"
              Verify Login via Biometric - IRIS:
                value:
                  scope:
                    - abha-login
                    - aadhaar-iris-verify
                  authData:
                    authMethods:
                      - iris
                    iris:
                      txnId: "{{txnId}}"
                      irisAuthPid: "{{PID}}"
              Forgot ABHA via Mobile OTP-Verify OTP:
                value:
                  scope:
                    - abha-login
                    - mobile-verify
                  authData:
                    authMethods:
                      - otp
                    otp:
                      txnId: "{{txnId}}"
                      otpValue: "{{encrypted OTP}}"
              Forgot ABHA via Aadhaar OTP-Verify OTP:
                value:
                  scope:
                    - abha-login
                    - aadhaar-verify
                  authData:
                    authMethods:
                      - otp
                    otp:
                      txnId: "{{txnId}}"
                      otpValue: "{{encrypted OTP}}"
        description: <b>Below is the Request Body description:</b><br><br><!--<div> <table> <thead> <tr> <th>Attributes</th> <th>Description</th> </tr> </thead> <tbody> <tr> <td>scope <sup>* required</sup></td> <td>Aadhaar/Abha/mobile</td> </tr> <tr> <td>loginHint <sup>* required</sup></td> <td>Aadhaar,Abha And Mobile Number</td> </tr> <tr> <td>loginId <sup>* required</sup></td> <td>encrypted mobile-number</td> </tr> <tr> <td>otpSystem <sup>* required</sup></td> <td>abdm/aadhaar</td> </tr> </tbody> </table> </div> <hr> --> <b>Note:</b> Mandatory fields can't be null.<ol> <li> <p><strong>scope</strong> (required):</p> <ul> <li><strong>Description:</strong> Specifies the scope of the OTP verification.</li> <li><strong>Example:</strong> <code>["abha-login", "aadhaar-verify"]</code></li> <li><strong>Possible Values:</strong> <code>abha-login</code>, <code>aadhaar-verify</code>, <code>mobile-verify</code>, <code>re-activate</code>, <code>retrieval</code>,<code>aadhaar-face-verify</code>, <code>aadhaar-bio-verify</code> ,<code>aadhaar-iris-verify</code>, <code>re-kyc</code>, etc.</li> </ul> </li> <li> <p><strong>auth methods</strong> (required):</p> <ul> <li><strong>Description:</strong> Indicates the type of auth method being used for the OTP verification.</li> <li><strong>Example:</strong> <code>otp</code></li> <li><strong>Possible Values:</strong> <code>otp</code>, <code>bio</code>, <code>face</code>, <code>demo</code></li> </ul> </li> </ol>
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      responses:
        "200":
          description: "The 200 response code indicates a successful request. In this context, it refers to the successful generation and delivery of an OTP (One-Time Password) for various services.<br><br> <strong>Types of OTP Responses:</strong> <ol> <li><strong>Login via ABHA Number - Using Aadhaar OTP (Positive Flow) :</strong> This endpoint handles the login process via ABHA number using an Aadhaar OTP. If the OTP entered by the user matches the OTP sent by Aadhaar, the system will authenticate the user and display the user's profile along with a JWT token and profile details.</li>

            <li><strong>Login via ABHA Number - Using ABHA OTP  (Positive Flow) :  </strong>This endpoint handles the login process via ABHA number using an ABHA OTP. If the OTP entered by the user matches the OTP sent by Aadhaar, the system will authenticate the user and display the user's profile along with a JWT token and profile details.</li>

            <li><strong>Login via Mobile Number - (Positive Flow) :  </strong>This endpoint handles the login process via mobile number using an mobile OTP. If the OTP entered by the user matches the OTP sent by Aadhaar, the system will authenticate the user and display the user's profile along with a JWT token and profile details.</li>

            \ <li><strong>Login via Password -  (Positive Flow) : </strong>This endpoint handles the login process via Password using password. If the password(encrypted) entered by the user matches the password already set by user, then the system will authenticate the user and display the user's profile along with a JWT token and profile details.</li>

            \  <li><strong>Login via Biometric - FingerPrint/Face/Iris -  (Positive Flow) : </strong>This endpoint handles the login process via encrypted PID. If the pid(encrypted) entered by the user matches the details of the user, then the system will authenticate the user and display the user's profile along with a JWT token and profile details.</li>

            \   <li><strong>Forgot ABHA via Aadhaar OTP - Positive Flow:</strong> This scenario describes the process of recovering an ABHA number using an Aadhaar OTP. The user provides their Aadhaar number and the correct OTP received on their registered mobile number. Upon successful verification, the ABHA number is recovered.</li>

            \   <li><strong>Forgot ABHA via Mobile OTP - Positive Flow:</strong> This scenario describes the process of recovering an ABHA number using a Mobile OTP. The user provides their registered Mobile number and the correct OTP received on their mobile number. Upon successful verification, the ABHA number is recovered.</li>

            \  <li><strong>Find ABHA via Biometric  - Positive Flow:</strong> This scenario describes the process of Finding an ABHA details using a Biometric . The user provides correct Biometric data in the form pid. Upon successful verification, the ABHA number is recovered.</li>\ 

            \   "
