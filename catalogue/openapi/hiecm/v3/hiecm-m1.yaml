                      txnId: "{{txnId}}"
                      otpValue: "{{encrypted otp}}"
        description: <b>Below is the Request Body description:<br></b><br> <!--<br> <div> <table> <thead> <tr> <th>Attributes</th> <th>Description</th> </tr> </thead> <tbody> <tr> <td>loginHint <sup> * required</td> <td>Aadhaar,Abha And Mobile Number</td> </tr> <tr> <td>loginId <sup>* required </sup></td> <td>encrypted mobile-number</td> </tr> <tr> <td>otpSystem <sup>* required</td> <td>abdm/aadhaar</td> </tr> <tr> <td>scope <sup>* required</td> <td>Aadhaar/Abha/mobile</td> </tr> </tbody> </table> </div> <hr> --> <b>Note:</b> Mandatory fields can't be null. <ol> <li> <p><strong>authData</strong> (required):</p> <ul> <li><strong>Description:</strong> Contains the authentication methods and OTP details.</li> <li><strong>Properties:</strong> <ul> <li><strong>authMethods:</strong> Specifies the method of authentication. <ul> <li><strong>Type:</strong> Array of strings</li> <li><strong>Example:</strong> <code>["OTP"]</code></li> </ul> </li> <li><strong>otp:</strong> Contains the OTP value and transaction ID. <ul> <li><strong>Properties:</strong> <ul> <li><strong>otpValue:</strong> The encrypted OTP provided by the user. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>{{encrypted OTP}}</code></li> </ul> </li> <li><strong>txnId:</strong> The transaction ID associated with the OTP request. <ul> <li><strong>Type:</strong> String</li> <li><strong>Example:</strong> <code>{{transactionId}}</code></li> </ul> </li> </ul> </li> </ul> </li> </ul> </li> </ul> </li> <li> <p><strong>scope</strong> (required):</p> <ul> <li><strong>Description:</strong> Specifies the scope of the OTP verification.</li> <li><strong>Type:</strong> Array of strings</li> <li><strong>Example:</strong> <code>["abha-enrol", "mobile-verify"]</code></li> <li><strong>Possible Values:</strong> <code>abha-enrol</code>, <code>mobile-verify</code>,<code>email-verify</code> etc.</li> </ul> </li> </ol>
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
            format: date-time
          example: "2022-10-06T15:10:00.587Z"
      responses:
        "200":
          description: "The 200 response code indicates a successful request. In this context, it refers to the successful generation and delivery of an OTP (One-Time Password) for various services.<br><br> <strong>Types of OTP Responses:</strong> <ol> <li><strong> Mobile Update-Verify OTP-Positive flow:</strong> Indicates a successful request. The response includes a message indicating that the OTP has been verified successfully.</li> </ol>

            \ <ol start =\"2\">

            <li><strong>Mobile Update-Verify OTP-OTP Expired:</strong> This error occurs when the OTP provided for verification has expired. The OTP must be used within the valid time frame to ensure secure authentication.</li> </ol>

            \ "
          content:
            application/json:
              schema:
                type: object
                properties:
                  txnId:
                    type: string
                    example: 9c5d453e-756f-45e1-9766-43b9cc1190de
                  authResult:
                    type: string
                    example: failed
                  message:
