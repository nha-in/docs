                  - '15'
                monthOfBirth:
                  type: string
                  examples:
                  - '03'
                yearOfBirth:
                  type: string
                  examples:
                  - '2015'
                firstName:
                  type: string
                  examples:
                  - Ravi
                middleName:
                  type: string
                  examples:
                  - ''
                lastName:
                  type: string
                  examples:
                  - Kumar
                gender:
                  type: string
                  enum:
                  - M
                  - F
                  - O
                  examples:
                  - M
                parentAbhaNumber:
                  type: string
                  description: Parent's 14-digit ABHA Number
                  examples:
                  - 91-1234-5678-9012
                parentAbhaAddress:
                  type: string
                  description: Parent's ABHA Address (alternative to parentAbhaNumber)
                  examples:
                  - parentuser@sbx
            demo_auth:
              type: object
              description: Demographic authentication data
              required:
              - aadhaarNumber
              - name
              - dob
              - gender
              properties:
                aadhaarNumber:
                  type: string
                  description: RSA-encrypted Aadhaar number
                name:
                  type: string
                  description: Full name as per Aadhaar
                  examples:
                  - John Kumar
                dob:
                  type: string
                  format: date
                  description: Date of birth (YYYY-MM-DD)
                  examples:
                  - '1990-01-15'
                gender:
                  type: string
                  enum:
                  - M
                  - F
                  - O
                  examples:
                  - M
