        "500":
          description: <b>Internal Server Error</b><br><br>  An Internal Server Error (500) indicates that the server encountered an unexpected condition that prevented it from fulfilling the request.
      description: This API is designed to verify the status of a transaction ID that was generated during the invocation of the <code>auth/init</code> API. It serves as a follow-up mechanism to ensure that the transaction is still valid, active, and has not expired or been invalidated. <br> <br> Wait for PID capture and submission confirmation from the ABHA App.The reponse of the API will return status of that transactionId. It can be either <strong>PENDING,VERIFIED,FAILED,COMPLETE.</strong> <br> <br> Once the status in the response of this API is returned as <strong> COMPLETE </strong> , it indicates that the face authentication process has been successfully completed. At this stage, the next step is to invoke the <code>/enrollment/enrol/byAadhaar</code> (You can find this API in ABHA ENROLLMENT Via AADHAAR section) API to proceed further. <br><br>User can poll the <code>/capturePID</code> API in every 5 - 10 seconds interval to check the status of face capture process or alternatively skip this step and call the <code>/enrollment/enrol/byAadhaar</code> API once they see the PID submission success message in the ABHA app.
      operationId: m1_post_v3_enrollment_enrol_capturepid
  /abha/api/v3/enrollment/enrol/byAadhaar:
    post:
      tags:
        - ABHA ENROLLMENT Via AADHAAR
        - CHILD ABHA (These APIs are intended for use only by specific Government integrators, approved by NHA)
        - ABHA CREATION USING FACE AUTH
      summary: "UseCase : Create ABHA number Via Aadhaar by verifying Aadhaar OTP, using Biometrics, using demoAuth and Child ABHA Creation."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                authData:
                  type: object
                  properties:
                    authMethods:
                      type: array
                      items:
                        type: string
                      example:
                        - otp
                        - demo_auth
                        - bio
                        - face
                        - iris
                        - child
                  required:
                    - authMethods
                  anyOf:
                    - type: object
                      properties:
                        otp:
                          type: object
                          properties:
                            txnId:
                              type: string
                              example: "{{txnId}}"
                            otpValue:
                              type: string
                              example: "{{encrypted otp}}"
                            mobile:
                              type: string
                              example: "{{mobile number}}"
                          required:
                            - txnId
                            - otpValue
                            - mobile
                      required:
                        - otp
                    - type: object
                      properties:
                        demo_auth:
                          type: object
                          properties:
                            aadhaarNumber:
                              type: string
                              example: "{{encrypted aadhaar number}}"
                            districtCode:
                              type: string
                              example: "{{District code}}"
                            stateCode:
                              type: string
                              example: "{{State code}}"
                            dateOfBirth:
                              type: string
                              example: "{{DOB}}"
                            gender:
                              type: string
                              example: "{{Gender}}"
                            name:
                              type: string
                              example: "{{Full name}}"
                            mobile:
                              type: string
                              example: "{{Mobile number}}"
                            pinCode:
                              type: string
                              example: "{{Pincode}}"
                            address:
                              type: string
                              example: "{{Address}}"
                            profilePhoto:
                              type: string
                              example: "{{Base64 plain String}}"
                          required:
                            - aadhaarNumber
                            - name
                            - gender
                            - dateOfBirth
                            - districtCode
                            - stateCode
                      required:
                        - demo_auth
                    - type: object
                      properties:
                        bio:
                          type: object
                          properties:
                            aadhaar:
                              type: string
                              example: "{{encrypted aadhaar number}}"
                            fingerPrintAuthPid:
                              type: string
                              example: "{{fingerPrintAuthPid}}"
                            mobile:
                              type: string
                              example: "{{mobile number}}"
                          required:
                            - aadhaar
                            - fingerPrintAuthPid
                            - mobile
                      required:
                        - bio
                    - type: object
                      properties:
                        face:
                          type: object
                          properties:
                            aadhaar:
                              type: string
                              example: "{{encrypted aadhaar number}}"
                            rdPidData:
                              type: string
                              example: "{{faceAuthPid}}"
                            mobile:
                              type: string
                              example: "{{mobile number}}"
                          required:
                            - aadhaar
                            - fingerPrintAuthPid
                            - mobile
                      required:
                        - face
                    - type: object
                      properties:
                        iris:
                          type: object
                          properties:
                            aadhaar:
                              type: string
                              example: "{{encrypted aadhaar number}}"
                            Pid:
                              type: string
                              example: "{{PID}}"
                            mobile:
                              type: string
                              example: "{{mobile number}}"
                          required:
                            - aadhaar
                            - fingerPrintAuthPid
                            - mobile
                      required:
                        - iris
                    - type: object
                      properties:
                        child:
                          type: object
                          properties:
                            dayOfBirth:
                              type: string
                              example: "{{day Of Birth}}"
                            monthOfBirth:
                              type: string
                              example: "{{month Of Birth}}"
                            yearOfBirth:
                              type: string
                              example: "{{year Of Birth}}"
                            gender:
                              type: string
                              example: "{{Gender}}"
                            password:
                              type: string
                              example: ""
                            name:
                              type: string
                              example: "{{Name}}"
                            profilePhoto:
                              type: string
                              example: ""
                            parentConsent:
                              type: string
                              example: "true"
                          required:
                            - dayOfBirth
                            - monthOfBirth
                            - yearOfBirth
                            - gender
                            - name
                            - parentConsent
                      required:
                        - child
                consent:
                  type: object
                  properties:
                    code:
                      type: string
                      example: abha-enrollment
                    version:
                      type: string
                      example: "1.4"
              required:
                - authData
                - consent
            examples:
              Create ABHA by verifying OTP:
                value:
                  authData:
                    authMethods:
                      - otp
                    otp:
                      txnId: "{{txnId}}"
                      otpValue: "{{encrypted otp}}"
                      mobile: "{{mobile number}}"
                  consent:
                    code: abha-enrollment
                    version: "1.4"
              DemoAuth API:
                value:
                  authData:
                    authMethods:
                      - demo_auth
                    demo_auth:
                      aadhaarNumber: "{{encrypted aadhaar number}}"
                      districtCode: "{{District code}}"
                      stateCode: "{{State code}}"
                      dateOfBirth: "{{DOB}}"
                      gender: "{{Gender}}"
                      name: "{{Full name}}"
                      mobile: "{{Mobile number}}"
                      profilePhoto: "{{Base64 plain String}}"
                      pinCode: <PINCODE>
                      address: <ADDRESS>
                  consent:
                    code: abha-enrollment
                    version: "1.4"
              Create ABHA via Biometrics- Aadhaar Bio (Fingerprint):
