          type: string
        descriptor:
          type: object
          properties:
            name:
              type: string
        city:
          type: object
          properties:
            name:
              type: string
            code:
              type: string
        country:
          type: object
          properties:
            name:
              type: string
            code:
              type: string
        gps:
          type: string
        address:
          type: string
        radius:
          type: object
          properties:
            type:
              type: string
            value:
              type: string
            unit:
              type: string
