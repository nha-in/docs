# UHI services: each service's identity, journeys, search variants and limits,
# and the first-service decision. Words live in site/docs/uhi/v1/services/*.mdx.
uhi.decision.first-service:
  type: decision
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: Which UHI service to build first
  summary: Start with one signed PM-JAY HEM search and its callback, the smallest exchange on the network, then build the service for your role.
  page: site/docs/uhi/v1/services/index.mdx
  heading: which-service-to-build-first
  url: /docs/uhi/v1/services#which-service-to-build-first
  related:
    decisions: [uhi.decision.choose-role]
    flows: [uhi.flow.pmjay-hem-discovery]
    concepts: [uhi.concept.pmjay-hem-service-identity, uhi.concept.service-reach]
    glossary: [shared.glossary.uhi]

uhi.concept.consultation-service-identity:
  type: concept
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: Physical Consultation service identity
  summary: The fixed values every Physical Consultation call carries, including context.domain nic2004:85111 and the case-sensitive fulfillment type Physical.
  page: site/docs/uhi/v1/services/consultation.mdx
  heading: service-identity
  url: /docs/uhi/v1/services/consultation#service-identity
  related:
    flows: [uhi.flow.consultation-discovery]
    glossary: [uhi.glossary.context-domain, uhi.glossary.fulfillment-type]

uhi.flow.consultation-discovery:
  type: flow
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: "Physical Consultation discovery: broadcast search, then slots from the HSPA"
  summary: A broadcast search through the Gateway returns doctors from every matching HSPA; a second search sent directly to the chosen HSPA returns slots.
  page: site/docs/uhi/v1/services/consultation.mdx
  heading: journey-1-discovery
  url: /docs/uhi/v1/services/consultation#journey-1-discovery
  related:
    endpoints: [uhi.endpoint.network-gateway-search, uhi.endpoint.network-search, uhi.endpoint.network-registry-lookup]
    callbacks: [uhi.callback.network-on-search, uhi.callback.network-gateway-on-search]
    concepts: [uhi.concept.consultation-service-identity, uhi.concept.aggregate-answers, uhi.concept.direct-calls]
    flows: [uhi.flow.consultation-order]

uhi.flow.consultation-order:
  type: flow
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: "Physical Consultation order: init to on_confirm"
  summary: The EUA sends the patient and slot, the HSPA holds it and returns the order id and five terms, and confirm with every term AGREED returns the PIN.
  page: site/docs/uhi/v1/services/consultation.mdx
  heading: journey-2-order
  url: /docs/uhi/v1/services/consultation#journey-2-order
  related:
    endpoints: [uhi.endpoint.consultation-init, uhi.endpoint.consultation-confirm, uhi.endpoint.consultation-on-confirm-audit]
    callbacks: [uhi.callback.consultation-on-init, uhi.callback.consultation-on-confirm]
    concepts: [uhi.concept.consultation-terms, uhi.concept.audit-copies]
    flows: [uhi.flow.consultation-discovery, uhi.flow.consultation-fulfilment]

uhi.flow.consultation-fulfilment:
  type: flow
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: "Physical Consultation fulfilment: PIN check-in, on_update and status"
  summary: The patient checks in with the PIN, the HSPA pushes each state change in on_update, and the EUA calls status only when an update never arrives.
  page: site/docs/uhi/v1/services/consultation.mdx
  heading: journey-3-fulfilment
  url: /docs/uhi/v1/services/consultation#journey-3-fulfilment
  related:
    endpoints: [uhi.endpoint.consultation-status, uhi.endpoint.consultation-on-status-audit, uhi.endpoint.consultation-on-update-audit]
    callbacks: [uhi.callback.consultation-on-status, uhi.callback.consultation-on-update-to-eua, uhi.callback.consultation-on-update-to-hspa]
    concepts: [uhi.concept.consultation-reason-codes, uhi.concept.audit-copies]
    flows: [uhi.flow.consultation-order]

uhi.flow.consultation-post-fulfilment:
  type: flow
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: "Physical Consultation post-fulfilment: cancel, on_cancel and on_message"
  summary: The patient cancels through the EUA or the doctor through the HSPA, each with a reason code and who cancelled; either side can message the other.
  page: site/docs/uhi/v1/services/consultation.mdx
  heading: journey-4-post-fulfilment
  url: /docs/uhi/v1/services/consultation#journey-4-post-fulfilment
  related:
    endpoints: [uhi.endpoint.consultation-cancel, uhi.endpoint.consultation-on-cancel-audit]
    callbacks: [uhi.callback.consultation-on-cancel, uhi.callback.consultation-on-message-to-eua, uhi.callback.consultation-on-message-to-hspa]
    concepts: [uhi.concept.consultation-reason-codes, uhi.concept.audit-copies]
    flows: [uhi.flow.consultation-order]

uhi.concept.consultation-terms:
  type: concept
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: Physical Consultation terms content
  summary: What each of the five terms in on_init must say to the patient before confirm, with the clauses every EUA and HSPA keeps.
  page: site/docs/uhi/v1/services/consultation.mdx
  heading: terms-content
  url: /docs/uhi/v1/services/consultation#terms-content
  related:
    flows: [uhi.flow.consultation-order]
    callbacks: [uhi.callback.consultation-on-init]
    endpoints: [uhi.endpoint.consultation-confirm]

uhi.concept.consultation-reason-codes:
  type: concept
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: Physical Consultation cancellation and PIN override reason codes
  summary: The fixed patient, doctor and override reason codes for cancel, on_cancel and PIN override, sent exactly as listed with labels of your own.
  page: site/docs/uhi/v1/services/consultation.mdx
  heading: cancellation-and-override-reason-codes
  url: /docs/uhi/v1/services/consultation#cancellation-and-override-reason-codes
  related:
    flows: [uhi.flow.consultation-post-fulfilment, uhi.flow.consultation-fulfilment]
    endpoints: [uhi.endpoint.consultation-cancel]
    callbacks: [uhi.callback.consultation-on-cancel]

uhi.test.consultation-go-live-checklist:
  type: test
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: Physical Consultation go-live checklist
  summary: The twenty items to complete before requesting production sign-off for Physical Consultation, from M2 and signing to promotion.
  page: site/docs/uhi/v1/services/consultation.mdx
  heading: go-live-checklist
  url: /docs/uhi/v1/services/consultation#go-live-checklist
  related:
    flows: [uhi.flow.consultation-discovery, uhi.flow.consultation-order, uhi.flow.consultation-fulfilment]
    tests: [uhi.test.run-test-cases, uhi.test.every-service-checks]

uhi.concept.ambulance-service-identity:
  type: concept
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: Ambulance Booking service identity
  summary: The fixed values every Ambulance Booking call carries, including context.domain nic2008:86909, item code AMBULANCE and fulfillment type EMERGENCY.
  page: site/docs/uhi/v1/services/ambulance.mdx
  heading: service-identity
  url: /docs/uhi/v1/services/ambulance#service-identity
  related:
    flows: [uhi.flow.ambulance-discovery]
    glossary: [uhi.glossary.context-domain, uhi.glossary.fulfillment-type]

uhi.flow.ambulance-discovery:
  type: flow
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: "Ambulance Booking discovery: search to on_search through the Gateway"
  summary: An emergency search with the pickup location reaches every ambulance HSPA; those serving the area answer with ambulances, arrival windows and prices.
  page: site/docs/uhi/v1/services/ambulance.mdx
  heading: journey-1-discovery
  url: /docs/uhi/v1/services/ambulance#journey-1-discovery
  related:
    endpoints: [uhi.endpoint.network-gateway-search, uhi.endpoint.network-search]
    callbacks: [uhi.callback.network-on-search, uhi.callback.network-gateway-on-search]
    concepts: [uhi.concept.ambulance-service-identity, uhi.concept.aggregate-answers]
    flows: [uhi.flow.ambulance-order]
    tests: [uhi.test.ambulance-search-filters, uhi.test.ambulance-on-search]

uhi.flow.ambulance-order:
  type: flow
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: "Ambulance Booking order: init to on_init"
  summary: The EUA sends the patient's details directly to the chosen HSPA, which returns a quote and five terms; the provider then calls to arrange dispatch.
  page: site/docs/uhi/v1/services/ambulance.mdx
  heading: journey-2-order
  url: /docs/uhi/v1/services/ambulance#journey-2-order
  related:
    endpoints: [uhi.endpoint.ambulance-init]
    callbacks: [uhi.callback.ambulance-on-init]
    concepts: [uhi.concept.direct-calls]
    flows: [uhi.flow.ambulance-discovery]
    tests: [uhi.test.ambulance-init]

