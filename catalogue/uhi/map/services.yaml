uhi.flow.pmjay-hem-discovery:
  type: flow
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: "PM-JAY HEM discovery: search to on_search"
  summary: A signed search through the Gateway reaches the single PM-JAY HEM HSPA, which returns empanelled hospitals in one on_search on your callback.
  page: site/docs/uhi/v1/services/pmjay-hem.mdx
  heading: journey
  url: /docs/uhi/v1/services/pmjay-hem#journey
