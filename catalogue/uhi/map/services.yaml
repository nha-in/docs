uhi.concept.blood-bank-limits:
  type: concept
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: Blood Bank limits to code against
  summary: GPS gaps, stock counts that update at different rates, no end signal, no pagination and no reservation, each with what your EUA does about it.
  page: site/docs/uhi/v1/services/blood-bank.mdx
  heading: limits-to-code-against
  url: /docs/uhi/v1/services/blood-bank#limits-to-code-against
  related:
    flows: [uhi.flow.blood-bank-discovery]
    concepts: [uhi.concept.render-as-results-arrive, uhi.concept.paginate-client-side]

uhi.concept.jan-aushadhi-service-identity:
  type: concept
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: Jan Aushadhi service identity for flows A, B and C
  summary: One domain, nic2008:47721, and three fulfillment types that select Kendras, medicines or stock, with the PMBI HSPA's id, URL and key id.
  page: site/docs/uhi/v1/services/jan-aushadhi.mdx
  heading: service-identity
  url: /docs/uhi/v1/services/jan-aushadhi#service-identity
  related:
    flows: [uhi.flow.jan-aushadhi-find-kendra, uhi.flow.jan-aushadhi-find-medicine]
    glossary: [uhi.glossary.context-domain, uhi.glossary.fulfillment-type, uhi.glossary.pmbi]

uhi.concept.jan-aushadhi-search-variants:
  type: concept
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: Jan Aushadhi location filters, medicine name and ownership codes
  summary: Kendra code, state and district, pincode or GPS for flows A and C, a medicine name for flow B, and the Kendra ownership codes.
  page: site/docs/uhi/v1/services/jan-aushadhi.mdx
  heading: search-variants
  url: /docs/uhi/v1/services/jan-aushadhi#search-variants
  related:
    flows: [uhi.flow.jan-aushadhi-find-kendra, uhi.flow.jan-aushadhi-find-medicine]
    endpoints: [uhi.endpoint.network-gateway-search]

uhi.flow.jan-aushadhi-find-kendra:
  type: flow
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: "Jan Aushadhi: find a Kendra"
  summary: A search of type JANAUSHADHI through the Gateway reaches the PMBI HSPA, which returns Kendras by location or Kendra code in one on_search.
  page: site/docs/uhi/v1/services/jan-aushadhi.mdx
  heading: journey-1-find-a-kendra
  url: /docs/uhi/v1/services/jan-aushadhi#journey-1-find-a-kendra
  related:
    endpoints: [uhi.endpoint.network-gateway-search]
    callbacks: [uhi.callback.network-on-search]
    concepts: [uhi.concept.jan-aushadhi-search-variants, uhi.concept.jan-aushadhi-service-identity]
    glossary: [uhi.glossary.pmbi]

uhi.flow.jan-aushadhi-find-medicine:
  type: flow
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: "Jan Aushadhi: find a medicine, then the Kendras that stock it"
  summary: A medicine search turns a name into a medicineId, and a second, separate search with that id returns the Kendras that stock it with a stock flag.
  page: site/docs/uhi/v1/services/jan-aushadhi.mdx
  heading: journey-2-find-a-medicine-then-a-kendra-that-stocks-it
  url: /docs/uhi/v1/services/jan-aushadhi#journey-2-find-a-medicine-then-a-kendra-that-stocks-it
  related:
    endpoints: [uhi.endpoint.network-gateway-search]
    callbacks: [uhi.callback.network-on-search]
    concepts: [uhi.concept.jan-aushadhi-search-variants, uhi.concept.jan-aushadhi-service-identity]
    flows: [uhi.flow.jan-aushadhi-find-kendra]
    glossary: [uhi.glossary.pmbi]

