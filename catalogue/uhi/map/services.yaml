  type: concept
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: PM-JAY HEM search variants and speciality codes
  summary: State alone or state plus one filter, or GPS with no state; numeric codes as numbers, and speciality codes from the PM-JAY speciality list API.
  page: site/docs/uhi/v1/services/pmjay-hem.mdx
  heading: search-variants
  url: /docs/uhi/v1/services/pmjay-hem#search-variants
