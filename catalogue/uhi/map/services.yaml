  type: flow
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: "Blood Bank discovery: search to on_search from every Blood Bank HSPA"
  summary: One search through the Gateway reaches every registered Blood Bank HSPA; aggregate their on_search answers by transaction_id within 10 to 15 seconds.
  page: site/docs/uhi/v1/services/blood-bank.mdx
  heading: journey
  url: /docs/uhi/v1/services/blood-bank#journey
  related:
    endpoints: [uhi.endpoint.network-gateway-search, uhi.endpoint.network-search]
