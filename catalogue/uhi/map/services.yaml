uhi.concept.blood-bank-search-variants:
  type: concept
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: Blood Bank search modes, blood group and component codes
  summary: GPS and radius or state and district, with the blood group in item and the component in category, and the code lists for both.
  page: site/docs/uhi/v1/services/blood-bank.mdx
  heading: search-variants
  url: /docs/uhi/v1/services/blood-bank#search-variants
  related:
