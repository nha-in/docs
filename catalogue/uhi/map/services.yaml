    glossary: [uhi.glossary.pm-jay-hem]

uhi.concept.pmjay-hem-limits:
  type: concept
  gateway: uhi
  milestone: n/a
  version: uhi-v1
  title: PM-JAY HEM limits to code against
  summary: GPS gaps, an unreliable accreditation flag, no end signal, no pagination and a lagging procedure list, each with what your EUA does about it.
  page: site/docs/uhi/v1/services/pmjay-hem.mdx
  heading: limits-to-code-against
  url: /docs/uhi/v1/services/pmjay-hem#limits-to-code-against
  related:
    flows: [uhi.flow.pmjay-hem-discovery]
    concepts: [uhi.concept.render-as-results-arrive, uhi.concept.paginate-client-side]
    tests: [uhi.test.pmjay-hem-edge-cases]

