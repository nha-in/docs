adjudicator_pmjay_sbxhcx_nhcxpayerservice_v1_get_user_role: "Adjudicator: get the user role for a case"
adjudicator_pmjay_hcx_nhcxpayerservice_wrapper_process_case: "Adjudicator: act on a case"
adjudicator_process_request: "Provider: make the dummy payer act on a request"
