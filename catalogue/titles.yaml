# Hand written titles, keyed by operationId.
#
# scripts/build-api-reference.mjs derives every title from NHA's summary, and
# falls back to the method and path when the summary names nothing. These are
# the operations where neither works: NHA's summary is collection bookkeeping
# ("3 flows: Suggestion API"), a bare route, or a sentence about who calls the
# endpoint rather than what it does.
#
# This file sits outside catalogue/openapi on purpose, for three reasons.
# scripts/ingest-nha.mjs rewrites the module YAMLs wholesale on every run, so a
# title stored in one would not survive the next ingest of an NHA drop.
# listSpecTree treats every YAML under <platform>/<version> as a module, so a
# file kept there renders as an extra, empty module in the sidebar. And
# lint:agent reads every YAML anywhere under openapi/ as a specification and
# fails it for missing x-abdm-gateway.
#
# Add a row only when the generated title is wrong or unreadable. A title here
# is a claim about what the operation does, so it is written from the
# operation's own description, and it starts with a verb like every other title.

# M2, health information provider services
m2_post_consent_v3_request_hip_on_notify: Acknowledge the consent notification
m2_post_health_information_transfer: Receive the transferred health information
m2_post_hip_v3_link_context_notify: Notify a change to a linked care context
scan-and-register_post_patient_share_v3_on_share: Answer the patient share request
m2_post_user_initiated_linking_v3_patient_care_context_on_8c9340: Answer the care context discovery
m2_post_v3_consent_request_hip_notify: Receive the consent decision

# M3, health information user services
m3_post_consent_v3_request_hiu_on_notify: Acknowledge the consent notification

# M4, HPR and HFR
m4_get_getpsudetailsbyministry: Get PSU details by ministry
m4_get_v1_5_facility_get_master_types: Get all master types

# P1, registration and login
p1_get_v3_phr_app_enrollment_isexists: Check whether the ABHA address exists
p1_post_v3_phr_app_enrollment_suggestion: Suggest an ABHA address
p1_post_v3_phr_app_enrollment_verify: Verify the enrolment OTP

# P2, named as NHA's sandbox observations of 23 September 2026 name them
p2_post_patient_share_v3_share: OPD token generation
p2_get_patient_share_v3_profile_gettokendetails: OPD Token History

# P3, the subscription request side
p3_post_subscription_requests_v3_hiu_care_context_on_notify: Answer the care context subscription notification
p3_post_subscription_requests_v3_hiu_on_notify: Answer the subscription request notification

# NHCX exchange modules. Named by who does what, in order, so a reader sees
# which party makes each call and which party hosts each callback (NHA review,
# #20 and #44). A call the integrator makes is "<Role>: <verb> ...". A
# callback the integrator hosts is "<Role> receives ...". The role is taken
# from the operation's own description: "Provider asks...", "Payer
# returns...", "Hosted by the payer". Every value is quoted, because a colon
# followed by a space ends a plain YAML value.

# Coverage eligibility
eligibility_v1_coverageeligibility_check: "Provider: check coverage eligibility"
eligibility_v1_coverageeligibility_on_check: "Payer: send the coverage eligibility response"
eligibility_webhook_v1_coverageeligibility_check: "Payer receives a coverage eligibility check"
eligibility_webhook_v1_coverageeligibility_on_check: "Provider receives the coverage eligibility response"

# Insurance plan
insurance_plan_v1_insuranceplan_request: "Provider: request an insurance plan"
insurance_plan_v1_insuranceplan_on_request: "Payer: send the insurance plan"
insurance_plan_webhook_v1_insuranceplan_request: "Payer receives an insurance plan request"
insurance_plan_webhook_v1_insuranceplan_on_request: "Provider receives the insurance plan"

# Pre-authorisation
preauth_v1_preauth_submit: "Provider: submit a pre-authorisation"
preauth_v1_preauth_on_submit: "Payer: send the pre-authorisation response"
preauth_webhook_v1_preauth_submit: "Payer receives a pre-authorisation"
preauth_webhook_v1_preauth_on_submit: "Provider receives the pre-authorisation response"

# Claim
claim_v1_claim_submit: "Provider: submit a claim"
claim_v1_claim_on_submit: "Payer: send the claim response"
claim_webhook_v1_claim_submit: "Payer receives a claim"
claim_webhook_v1_claim_on_submit: "Provider receives the claim response"

# Reprocess, cancel and shortfall
task_v1_task_submit: "Provider: submit a reprocess or cancel task"
task_v1_task_on_submit: "Payer: send the task outcome"
task_webhook_v1_task_submit: "Payer receives a reprocess or cancel task"
task_webhook_v1_task_on_submit: "Provider receives the task outcome"

# Payment notice. The payer starts this exchange.
payment_notice_v1_paymentnotice_request: "Payer: send a payment notice"
payment_notice_v1_paymentnotice_on_request: "Provider: acknowledge the payment notice"
payment_notice_webhook_v1_paymentnotice_request: "Provider receives a payment notice"
payment_notice_webhook_v1_paymentnotice_on_request: "Payer receives the payment acknowledgement"

# Communication. The payer starts this exchange.
communication_v1_communication_request: "Payer: send a communication request"
communication_v1_communication_on_request: "Provider: acknowledge the communication"
communication_webhook_v1_communication_request: "Provider receives a communication request"
communication_webhook_v1_communication_on_request: "Payer receives the communication acknowledgement"

# Status and search
status_v1_status: "Sender: check the status of a request"
status_v1_search_submit: "Authorised entity: search for claim information"
status_v1_search_on_submit: "Payer: send the search result"
status_webhook_v1_status: "Payer receives a status check"
status_webhook_v1_search_submit: "Payer receives a claim search"
status_webhook_v1_search_on_submit: "Authorised entity receives the search result"

# Other
other_v1_notification_subscribe: "Patient app: subscribe an ABHA number to notifications"
other_v1_notification_on_subscribe: "Patient app: acknowledge a notification subscription"
other_v1_delete: "Support: delete records by correlation ID"
other_v1_on_status: "Recipient: answer a status check"
other_v1_error: "NHCX: report a request it could not deliver"
other_webhook_v1_on_status: "Sender receives the status answer"
other_webhook_v1_error: "Participant receives an error report"

