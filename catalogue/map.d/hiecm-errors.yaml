hiecm.error.900900:
  type: error
  gateway: hiecm
  milestone: M1
  title: 900900, authentication failed without a reason
  summary: The ABHA service refused the call as an unclassified authentication failure,
    so check both the access token and the person's token.
  page: site/docs/_notes/hiecm/errors/m1.mdx
  heading: '900900'
  url: /docs/hiecm/v3/api/m1/errors#900900
  related:
    concepts:
    - hiecm.concept.gateway-session
hiecm.error.900901:
  type: error
  gateway: hiecm
  milestone: M1
  title: 900901, the credentials are not valid
  summary: The ABHA service rejected the token or client credential you sent, so check
    the credentials for this environment and get a fresh token.
