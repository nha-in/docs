  description: |-
    The PMJAY adjudicator calls on the National Health Claims Exchange (NHCX): 5 operations.

    A PMJAY case is not decided over NHCX.

    The calls fall in two groups. The dummy payer APIs are sandbox hooks a provider uses to make the test payer answer. The PMJAY payer APIs read and act on a PMJAY case in the State Health Agency's Transaction Management System. An integrator testing a PMJAY flow needs them to move a case, and a scheme payer building its own side can copy their shape.

    Guides that use these calls: [Receiving a callback](/docs/nhcx/v1/getting-started/receiving-a-callback), [Get your sandbox credentials](/docs/nhcx/v1/getting-started/get-your-sandbox-credentials), [PMJAY sandbox run](/docs/nhcx/v1/roles/provider/pmjay-sandbox-run), [PMJAY adjudication APIs](/docs/nhcx/v1/roles/provider/pmjay-adjudication-apis).

    Production address for the PMJAY payer service, role lookup: not published. Confirm at onboarding.

    Production address for the PMJAY payer service, act on a case: not published. Confirm at onboarding.

    Production address for the Dummy payer: A sandbox test hook only.
