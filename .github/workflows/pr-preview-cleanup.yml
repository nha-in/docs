name: pr-preview-cleanup

# Removes a closed PR's preview folder from the gh-pages branch, so the
# branch does not accumulate one site per PR forever.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  remove-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove the preview folder
        run: |
          DIR="pr-${{ github.event.pull_request.number }}"
          if [ -d "$DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rq "$DIR"
            git commit -m "preview: remove closed PR #${{ github.event.pull_request.number }}"
            git push
          else
            echo "no preview folder for this PR"
          fi
