name: deploy-pages

# The site on GitHub Pages, the interim home until NHA's S3 + CloudFront
# infrastructure exists. When it does, deploy/nha/workflows/site-deploy.yml
# replaces this file, and the base URL drops to / on docs.abdm.gov.in.

on:
  push:
    branches: [main]
  # A hand trigger, for the first deploy and for re-running one without a
  # commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site
        env:
          DOCUSAURUS_URL: https://nha-in.github.io
          DOCUSAURUS_BASE_URL: /docs/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
