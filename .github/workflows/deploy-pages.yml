name: deploy-pages

# Publishes main to the root of gh-pages, so the site is readable at
# https://nha-in.github.io/docs/ while hosting on NHA's own domain is set up
# (deploy/nha/site-hosting.md). PR previews keep living under pr-<number>/
# on the same branch; see pr-preview.yml.
#
# One-time setting: Settings -> Pages -> Deploy from a branch ->
# gh-pages, / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only NHA's repository publishes here. The file is carried into other
    # copies of this repository with everything else and stays inert there.
    if: github.repository == 'nha-in/docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the site for the Pages path
        env:
          DOCUSAURUS_URL: https://${{ github.repository_owner }}.github.io
          DOCUSAURUS_BASE_URL: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Publish to the root of gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/build
          # ponytail: keep_files leaves pr-<number>/ previews in place, but also
          # leaves files a later build no longer produces. Harmless for review;
          # switch to a clean publish with the previews re-pushed if stale
          # pages ever matter.
          keep_files: true
          commit_message: "deploy: main ${{ github.sha }}"
