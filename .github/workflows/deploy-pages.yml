name: deploy-pages

# Publishes main to main/ on gh-pages, so the site is readable at
# https://nha-in.github.io/docs/main/ while hosting on NHA's own domain is set up
# (deploy/nha/site-hosting.md). PR previews live beside it under pr-<number>/;
# see pr-preview.yml.
#
# Not the branch root: the repository is named docs, so a root deploy has the
# base /docs/, and Docusaurus leaves any link already starting with the base
# unprefixed. Every /docs/... link then resolves outside the site and the
# build fails on broken links. A subfolder base, as the previews use, does not
# collide.
#
# One-time setting: Settings -> Pages -> Deploy from a branch ->
# gh-pages, / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only NHA's repository publishes here. The file is carried into other
    # copies of this repository with everything else and stays inert there.
    if: github.repository == 'nha-in/docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the site for the main/ path
        env:
          DOCUSAURUS_URL: https://${{ github.repository_owner }}.github.io
          DOCUSAURUS_BASE_URL: /${{ github.event.repository.name }}/main/
        run: npm run build

      # GitHub's Deployments panel always links the site root, and the site
      # itself lives under main/, so the link it hands you 404s and reads as a
      # failed deploy. This sends the root at main/ instead.
      - name: Build the root redirect
        run: |
          mkdir -p root
          cat > root/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>ABDM Developer Portal</title>
          <meta http-equiv="refresh" content="0; url=./main/">
          <link rel="canonical" href="./main/">
          <p>The portal is at <a href="./main/">./main/</a>.</p>
          HTML

      - name: Publish the root redirect
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: root
          # Root publish, so keep everything already there: main/ and the
          # pr-<number>/ previews.
          keep_files: true
          commit_message: "deploy: root redirect to main/"

      - name: Publish to gh-pages under main/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/build
          destination_dir: main
          commit_message: "deploy: main ${{ github.sha }}"
