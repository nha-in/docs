name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-specs:
    name: Lint OpenAPI specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:specs

  lint-atoms:
    name: Lint catalogue atoms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:atoms

  build-site:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: site/build

  mcp:
    name: Build and test MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: mcp/go.sum
      - run: go vet ./...
        working-directory: mcp
      - run: go test ./...
        working-directory: mcp
      # PR builds are keyword-only: no Ollama on CI runners. The deploy
      # pipeline re-runs the indexer with -ollama for the published snapshot.
      - run: go run ./cmd/indexer -catalogue ../catalogue -out catalogue.db
        working-directory: mcp
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-db
          path: mcp/catalogue.db
