# Repository variables this workflow reads:
#   SITE_URL  the public site URL, the same variable the site deploy reads.
#             The two site-build jobs pass it to the build as DOCUSAURUS_URL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# build-nav.mjs refuses to build under CI without this, so that llms.txt never
# ships example.com placeholder URLs to an agent. Two jobs below run the build,
# lint-tables and build-site, so it is set once here rather than on each of
# them. The value is where dev-docs-cd.yml actually publishes, so the URLs in a
# CI artifact are the URLs the pages really carry.
env:
  DOCUSAURUS_URL: https://abdm-docs.dev.eka.care

jobs:
  lint-specs:
    name: Lint OpenAPI specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:specs

  lint-atoms:
    name: Lint catalogue atoms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:atoms
      - run: npm run lint:questions

  lint-sources:
    name: Check source freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:sources

  lint-annexure:
    name: Check annexure citations resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:annexure

  check-plugin-manifests:
    name: Check the cross-client plugin manifests are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:plugins

  validate-skills:
    name: Validate compiled agent skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:skills
      # Rebuilding here does two jobs. It fails when the compiled skills changed
      # without a version bump, which otherwise ships silently and leaves every
      # existing install on the old skills. And it fails when the committed
      # skills do not match what the catalogue compiles to, which means somebody
      # hand edited a build output.
      # site/src/data/api is a build output and is gitignored, so it does not
      # exist in a fresh checkout and build-skills reads it.
      # The workflow-wide DOCUSAURUS_URL turns this into a deployment build,
      # which embeds the site URL, skips the gate, and can never match the
      # committed URL-less skills. Blank it so this is the check build.
      - run: node scripts/build-api-reference.mjs
        env:
          DOCUSAURUS_URL: ''
      - run: npm run check:skills-version
        env:
          DOCUSAURUS_URL: ''
      - name: Compiled skills match the catalogue
        run: git diff --exit-code -- plugins/abdm-integrators-assistant/skills site/static/skills

  lint-agent-readiness:
    name: Check specs are agent readable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:agent

  lint-content:
    name: Check pages follow the content paradigm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:content

  lint-tables:
    name: Check tables hold their content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only Chromium, and only its headless shell: the check renders pages,
      # it does not test browser compatibility.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        # build-nav refuses to run in CI without the site URL, so llms.txt can
        # never ship placeholder links. These builds publish nothing, so any
        # real URL will do; it is the repository variable the deploy reads,
        # rather than a hostname written into a file both repositories share.
        env:
          DOCUSAURUS_URL: ${{ vars.SITE_URL || 'https://abdm-docs.dev.eka.care' }}
      - run: npm run lint:tables

  widget:
    name: Test the support agent widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace ai-widget

  build-site:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        # build-nav refuses to run in CI without the site URL, so llms.txt can
        # never ship placeholder links. These builds publish nothing, so any
        # real URL will do; it is the repository variable the deploy reads,
        # rather than a hostname written into a file both repositories share.
        env:
          DOCUSAURUS_URL: ${{ vars.SITE_URL || 'https://abdm-docs.dev.eka.care' }}
      # The committed atom to page map must still match what the site
      # publishes. A renamed or deleted page fails here, rather than becoming
      # a dead link in a support answer. Needs the build above for the
      # sitemap it validates against.
      - run: npm run check:routes
      # The committed icon stylesheet must match the icons the sidebar names.
      # Catches a page whose front matter names an icon nobody rebuilt for,
      # which would otherwise render the neutral fallback and look deliberate.
      - run: npm run check:icons
      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: site/build

  mcp:
    name: Build and test MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: mcp/go.sum
      - run: go vet ./...
        working-directory: mcp
      - run: go test ./...
        working-directory: mcp
      # The Ask AI eval's deterministic checks replay the last recorded run,
      # so they need no model. A case that fails and is not in the baseline
      # fails the build; the baseline only ever shrinks.
      - run: go run ./cmd/askai-eval check -cases ../evals/askai/cases
        working-directory: mcp
      # PR builds are keyword-only: no embedding provider on CI runners. The
      # deploy pipeline resolves EMBED_PROVIDER and rebuilds the snapshot with
      # embeddings for the published image.
      - run: go run ./cmd/indexer -catalogue ../catalogue -out catalogue.db
        working-directory: mcp
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-db
          path: mcp/catalogue.db

  plan-check:
    name: Plan and plugin are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/plan-check.sh

  plugin-validate:
    name: Validate the plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: manifests and components are valid
        run: |
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate ./plugins/abdm-contributors-assistant --strict
          # The plugin integrators install was never validated here, so a
          # broken manifest or a malformed skill would have reached them
          # rather than this job.
          claude plugin validate ./plugins/abdm-integrators-assistant --strict
          # The NHCX plugin ships the same way, so it is held to the same bar.
          claude plugin validate ./plugins/nhcx --strict
      - name: agent frontmatter parses
        run: python3 scripts/check-agent-frontmatter.py
      - name: no skill shares a name with a command
        run: |
          cd plugins/abdm-contributors-assistant
          dupes=$(comm -12 <(ls skills | sort) <(ls commands | sed 's/\.md$//' | sort))
          if [ -n "$dupes" ]; then echo "name collision: $dupes"; exit 1; fi
          echo "ok no collisions"
