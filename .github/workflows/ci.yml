name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-specs:
    name: Lint OpenAPI specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:specs

  lint-atoms:
    name: Lint catalogue atoms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:atoms

  lint-sources:
    name: Check source freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:sources

  validate-skills:
    name: Validate compiled agent skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:skills

  lint-agent-readiness:
    name: Check specs are agent readable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:agent

  lint-content:
    name: Check pages follow the content paradigm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:content

  lint-tables:
    name: Check tables hold their content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only Chromium, and only its headless shell: the check renders pages,
      # it does not test browser compatibility.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lint:tables

  widget:
    name: Test the support agent widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace widget

  build-site:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The committed atom to page map must still match what the site
      # publishes. A renamed or deleted page fails here, rather than becoming
      # a dead link in a support answer. Needs the build above for the
      # sitemap it validates against.
      - run: npm run check:routes
      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: site/build

  mcp:
    name: Build and test MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: mcp/go.sum
      - run: go vet ./...
        working-directory: mcp
      - run: go test ./...
        working-directory: mcp
      # PR builds are keyword-only: no embedding provider on CI runners. The
      # deploy pipeline resolves EMBED_PROVIDER and rebuilds the snapshot with
      # embeddings for the published image.
      - run: go run ./cmd/indexer -catalogue ../catalogue -out catalogue.db
        working-directory: mcp
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-db
          path: mcp/catalogue.db

  plan-check:
    name: Plan and plugin are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/plan-check.sh

  plugin-validate:
    name: Validate the contributor's assistant plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: manifests and components are valid
        run: |
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate ./plugins/abdm-contributors-assistant --strict
      - name: agent frontmatter parses
        run: python3 scripts/check-agent-frontmatter.py
      - name: no skill shares a name with a command
        run: |
          cd plugins/abdm-contributors-assistant
          dupes=$(comm -12 <(ls skills | sort) <(ls commands | sed 's/\.md$//' | sort))
          if [ -n "$dupes" ]; then echo "name collision: $dupes"; exit 1; fi
          echo "ok no collisions"
