name: dev-docs-s3-deploy

# The docs site to S3 + CloudFront, following the nectar frontends' pattern
# (dev-abdm-s3-deploy and siblings): tag-triggered, the shared runner role
# via OIDC, bucket and distribution provisioned by DevOps and named here.
#
# DevOps fills the two values below after provisioning, same request as any
# nectar frontend: a private bucket, a distribution with the certificate,
# and docs.dev.eka.care pointing at it.

on:
  push:
    tags:
      - dev-docs-*

jobs:
  build-and-publish:
    runs-on: dev-spot-ec2-runner-amd64
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the site
        env:
          DOCUSAURUS_URL: https://abdm-docs.dev.eka.care
          DOCUSAURUS_BASE_URL: /
          # The dev MCP has no public hostname yet (dev-mcp-cd.yml deploys it
          # into eka-dev with no ingress defined in this repository). Empty
          # keeps the Ask AI panel a labeled mock, same as an unset value;
          # fill this in once the hostname exists.
          CHAT_URL: "https://abdm-docs-mcp.dev.eka.care"
        run: |
          npm ci
          npm run build

      - name: iam role for the github runner
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::607765814920:role/github-runner-role
          role-session-name: runner-role
          aws-region: ${{ secrets.DEV_AWS_Region }}

      # The shared frontend bucket; the abdm app owns main/, the docs own
      # docs/. The distribution for abdm-docs.dev.eka.care uses origin path
      # /docs, so the site still serves from the domain root.
      - name: Push to s3 bucket
        env:
          BUCKET_LOCATION: elixir-dev-abdm
        run: |
          aws s3 sync site/build/ "s3://$BUCKET_LOCATION/docs/"

      - name: Invalidating Cache
        env:
          DISTRIBUTION_ID: E3VG5GF9H7WLNT
        run: |
          echo 'CD Completed, Invalidating Cache'
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

      # The runner is shared and persistent, so the job cleans up after
      # itself: ~1GB of dependencies and build output would otherwise sit on
      # the machine between deploys. The npm cache in the runner's home is
      # kept, which is what makes the next npm ci fast anyway.
      - name: Clean the workspace
        if: always()
        run: rm -rf node_modules site/node_modules site/build site/.docusaurus
