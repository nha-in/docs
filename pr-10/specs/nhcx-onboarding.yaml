                  type: string
                lab_yn:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                specialityList:
                  type: array
                  items:
                    type: string
                primaryEmail:
                  type: string
                primaryMobile:
                  type: string
                encryption_cert:
                  type: string
                endpoint_url:
                  type: string
                bankdetails:
                  type: object
                  properties:
                    facilitybankaccountname:
                      type: string
                    authorizedsignatoryname:
                      type: string
