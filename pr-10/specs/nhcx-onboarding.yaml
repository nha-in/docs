  /validate:
    get:
      operationId: onboarding_validate
      x-abdm-use-case: Onboarding
      tags:
        - Onboarding
      summary: Validate participant creation
      description: |-
        Confirms a participant creation by presenting the SMS passcode and the transactionId returned by /v2/participant/create.

        ### Business purpose

        Registering an organisation on a national claims exchange must be authorised by someone who actually controls that organisation's registered contact channel. The create call therefore only stages the record and sends a passcode to the mobile number held in HFR or the NHCX payer details; this validation call closes the loop by proving possession of that passcode. It is step 2 of the four-step production onboarding sequence and is what turns a staged participant into a confirmed one.

        ### When to use

        Call it after /v2/participant/create has returned a transactionid and the passcode has arrived by SMS, and before attempting /v2/participant/update, whose validations require that creation confirmation is already completed. The production URL is https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice/validate?transactionId=""&passcode="". The pair is valid for 24 hours. It is one of only three GET operations in the participant service and carries no workflow or x-hcx-status codes.

        ### Preconditions

        - A completed /v2/participant/create whose response supplied the transactionid.
        - The passcode delivered to the registered mobile number for that specific transaction; passcodes are bound to a transaction id and cannot be reused across attempts.
        - Both values presented as query parameters passcode and transactionId within 24 hours of the create call.
        - A Bearer token in bearer_auth with the Bearer prefix and Accept: application/json, as for every registry call.

        ### Postconditions

        HTTP 200 with a bare string body; the OpenAPI declares the 200 response type as string and the operation (particiapntValidate) as validating approval from the participant for participant creation. The participant is now confirmed in the registry and satisfies the precondition for /v2/participant/update, which uploads the encryption certificate and callback endpoint. There is no asynchronous callback. A wrong or expired passcode, or an unknown transaction id, returns the registry ErrorResponse envelope on 400 or 404.

        ### Common mistakes

        - Waiting more than 24 hours; both the transaction id and the passcode expire and the create call must be repeated.
        - Re-triggering /v2/participant/create while a passcode is pending, which issues a new transaction id and passcode and orphans the earlier pair.
        - Using a passcode from a different transaction id; passcodes are specific to the transaction that generated them.
        - Calling /update/validate by mistake; that endpoint confirms updates, not creation.
        - Losing the transaction id: the documented recovery is to create the request again.

        ### Best practices

        - Treat the passcode like a one-time credential: never log it, and hand it from the phone holder to the integrator through a controlled channel.
        - Store transactionid with a 24-hour expiry so the operator dashboard can show whether confirmation is still possible.
        - Send parameters as query string values on a GET; there is no JSON body.
        - After success, proceed straight to /v2/participant/update so the certificate and endpoint are in place before any counterparty tries to fetch them.

        ### Related scenario

        A hospital's production onboarding started with /v2/participant/create, which returned transactionid 1vouv8tlz2tnl-1fpspjhwj07c6 and triggered a passcode to the medical superintendent's registered phone. The superintendent reads the passcode to the integration engineer, who calls GET /validate?transactionId=1vouv8tlz2tnl-1fpspjhwj07c6&passcode=482913 with the Bearer token. The registry returns 200 and the participant is confirmed. The engineer then calls /v2/participant/update with the Base64 certificate and callback URL, and completes that change with /update/validate.

        ### Specification

        Chapter [Your certificate](/docs/nhcx/v1/getting-started/your-certificate) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
        - name: transactionId
          in: query
          required: true
          schema:
            type: string
          example: <transaction id>
        - name: passcode
          in: query
          required: true
          schema:
            type: string
          example: <passcode>
      responses:
        "200":
          description: HTTP 200 with a bare string body; the OpenAPI declares the 200 response type as string and the operation (particiapntValidate) as validating approval from the participant for participant creation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _contentType:
                    type: string
                  _body:
                    type: string
              example:
                _contentType: string
                _body: <confirmation string as declared by the OpenAPI 200 response>
  /update/validate:
    get:
      operationId: onboarding_update_validate
      x-abdm-use-case: Onboarding
      tags:
        - Onboarding
      summary: Validate participant update
      description: |-
        Confirms a participant update by presenting the SMS passcode and the transactionId returned by /v2/participant/update.

        ### Business purpose

        Changing a participant's encryption certificate or callback endpoint changes where encrypted claims data is delivered and who can decrypt it, so the registry does not apply such updates on an API call alone. /v2/participant/update stages the change and sends a passcode to the registered mobile number; this call confirms it. It is step 4 of the production onboarding sequence and the same approval mechanism protects every later certificate or bridge rotation done through the v2 update.

        ### When to use

        Call it after /v2/participant/update returns a transactionid and the passcode arrives by SMS, within the 24-hour validity window. The production URL is https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice/update/validate?transactionId=""&passcode="". It is also the closing step of the annual key-rotation checklist when rotation is done via /v2/participant/update. The passcode-free alternative for certificate-only changes is /v2/update/cert. No workflow or x-hcx-status codes apply.

        ### Preconditions

        - The participant is already registered and its creation was confirmed via /validate.
        - A completed /v2/participant/update that returned a transactionid, with the matching passcode received on the registered mobile number.
        - The call is made within 24 hours; each new update trigger generates a new transaction id and passcode.
        - Bearer token with the Bearer prefix in bearer_auth and Accept: application/json; parameters go in the query string.

        ### Postconditions

        HTTP 200 with a bare string body (operation particiapntUpdateValidate, response type string). The staged certificate and endpoint URL become the participant's live registry values, which is what counterparties will receive from /fetch/certs and what the gateway will use for callback delivery. There is no asynchronous callback. Errors return the registry ErrorResponse envelope with 400, 404 or 500.

        ### Common mistakes

        - Assuming the update is live as soon as /v2/participant/update returns; until this call succeeds counterparties may still fetch the old certificate.
        - Presenting a passcode from a previous update attempt after a new one was triggered.
        - Letting the 24-hour window lapse and then retrying validation instead of re-issuing the update.
        - Calling /validate (creation) instead of /update/validate.
        - Losing the transaction id, which requires repeating the update request.

        ### Best practices

        - Rotate keys in two phases: keep the old private key available for decrypting inbound callbacks until the update is validated and cached certificates (24-hour TTL on the payer side) have refreshed.
        - Persist transactionid with its 24-hour expiry and record who completed validation, for audit.
        - Never log the passcode; treat it as a one-time credential.
        - After success, call /participant/search on your own code to confirm encryption_cert and endpoint_url reflect the change.

        ### Related scenario

        A year after go-live a payer's security team rotates the encryption key pair. The integrator generates a new self-signed X.509 certificate, Base64-encodes it and calls /v2/participant/update with participantcode and encryptioncert. The registry returns status and a new transactionid and sends a passcode to the registered mobile. Within the hour the team calls GET /update/validate with both values; on 200 the new certificate is live. Providers that cached the old certificate pick up the new one at their next 24-hour refresh, and the payer keeps the old private key for one more day to decrypt in-flight callbacks.

        ### Specification

        Chapter [Your certificate](/docs/nhcx/v1/getting-started/your-certificate) of the NHCX integration specification.
      parameters:
