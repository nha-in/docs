        - name: transactionId
          in: query
          required: true
          schema:
            type: string
          example: <transaction id>
        - name: passcode
          in: query
          required: true
          schema:
            type: string
          example: <passcode>
      responses:
        "200":
          description: HTTP 200 with a bare string body (operation particiapntUpdateValidate, response type string).
          content:
            application/json:
              schema:
                type: object
                properties:
                  _contentType:
                    type: string
                  _body:
                    type: string
              example:
                _contentType: string
                _body: <confirmation string as declared by the OpenAPI 200 response>
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "On every NHCX call, the token goes in a header called `bearer_auth`, with the word `Bearer` and a space in front. The sources are not unanimous: the authentication page and the FAQ both write the example as `Authorization`, and the notification endpoint uses `Authorization`. The safe course, and what the adapter does, is to send both headers with the same value."
  parameters:
    BearerAuth:
      name: bearer_auth
      in: header
      required: true
      description: It is `bearer_auth`, not `Authorization`, on NHCX's own endpoints.
      schema:
        type: string
      example: Bearer <access token>
    Source:
      name: source
      in: header
      required: true
      description: Sent on this call, as the package's request carries it.
      schema:
        type: string
      example: internal
