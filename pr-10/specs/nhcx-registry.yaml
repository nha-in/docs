  /V2/participant/link/abha/policy:
    post:
      operationId: registry_v2_participant_link_abha_policy
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: Link ABHA number to policies (V2)
      description: |-
        V2 variant of the ABHA policy link; same ParticipantLinkAbhaRequest body and ParticipantLinkAbhaResponse as the unversioned call.

        ### Business purpose

        This endpoint serves the same business need as /participant/link/abha/policy: it lets a payer (or the TPA processing on its behalf) record which products a beneficiary holds, keyed by ABHA number and member id, so that providers can discover the policy and route claims correctly. The OpenAPI document exposes it as operation participantLinkAbhaPolicyV2 with an identical request and response schema to the v1 path; the documentation does not describe any behavioural difference beyond the path and operationId.

        ### When to use

        Use it in exactly the situations where the v1 link call applies: policy issue, renewal, member addition, or re-linking after a de-link when a payer changes TPA. It belongs to the member-layer setup that precedes every claim-side workflow (coverage eligibility, preauthorisation with workflow code 12, enhancement with code 13, claim). Choose this path or the v1 path consistently across your integration; the docs give no reason to mix them.

        ### Preconditions

        - A valid Bearer token from the client-credentials call (POST /get/session, form-urlencoded client_id, client_secret, grant_type=client_credentials); tokens last 1200 seconds, so refresh before expiry.
        - HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth: Bearer <token> (the participant service uses bearer_auth, not Authorization).
        - Base path for the participant service: https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice (sandbox) or https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice (production).
        - This is a synchronous plain-JSON registry call: no JWE envelope, no x-hcx-* protocol headers and no correlation id are involved.
        - The token must belong to the participant named as payerid or processingid, generated with the client_id used at participant creation.
        - Note the capital V in the path (/V2/participant/...), which differs from the lower-case /v2/ used by the init and validate variants.

        ### Postconditions

        A successful call returns HTTP 200 with ParticipantLinkAbhaResponse (optional result string and optional errormessage with errorcode and errordescription). No asynchronous callback follows; the beneficiary's products are immediately discoverable through /participant/get/policies or /V2/participant/get/policies. Errors come back as 400, 404 or 500 with the registry ErrorResponse envelope. The link can later be reversed only through the de-link endpoints, which check that the caller is the payerid or processingid participant.

        ### Common mistakes

        - Calling with a token minted from a client_id other than the one used at participant creation for the payer or TPA; NHA lists this as common mistake 10 and the call is refused even though the token itself is valid.
        - Confusing payerid and processingid: payerid is always the insurance company's own participant code; processingid is only the TPA code when the payer is mapped under a TPA.
        - Trying to move a payer to a new TPA by re-linking in place; the documented path is de-link, then link again with the new TPA's code as processingid.
        - Omitting one of the required fields (requestid, abhanumber, memberid, payerid, policies with productid and productname) or reusing a non-UUID requestid, which returns 400 with the ErrorResponse envelope.
        - Sending the token without the Bearer prefix, or omitting the Accept header, both of which reject the call before business logic (401 or 400).
        - Lower-casing the path to /v2/participant/link/abha/policy, which is not the same route; the lower-case /v2/ prefix belongs to the init and validate pair.

        ### Best practices

        - Generate a fresh UUID for requestid on every call and log it with the response so a duplicate submission can be traced.
        - Keep the ABHA number in the form the member layer expects (the identifier table and get/policies documentation both specify ABHA without hyphens) and store it in that form.
        - Make sure productid and productname exactly match the payer's product catalogue as registered through /product/link, because providers will later match on these values.
        - Cache and proactively refresh the Bearer token; retry once on 401 with a new token, then stop and alert.
        - After linking, verify the result with /participant/get/policies using the same identifier before telling the provider the member is ready.

        ### Related scenario

        A TPA that processes claims for several insurers migrates its integration to the V2 participant APIs. When one of its insurers issues a new individual health policy, the TPA's system calls /V2/participant/link/abha/policy with the insurer's participant code as payerid and its own code as processingid, listing the product from the insurer's catalogue. The TPA then confirms the link with /V2/participant/get/policies using the member's ABHA number. When the beneficiary later visits a hospital, the provider resolves the processingid as the receiver code and submits the coverage-eligibility check and preauthorisation to the TPA.

        ### Specification

        Chapter [Creating and updating a participant](/docs/nhcx/v1/getting-started/creating-and-updating-a-participant) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestid:
                  type: string
                abhanumber:
                  type: string
                mobilenumber:
                  type: string
                memberid:
                  type: string
                payerid:
                  type: string
                policies:
                  type: array
                  items:
                    type: object
                    properties:
                      productid:
                        type: string
                      productname:
                        type: string
                processingid:
                  type: string
            example:
              requestid: 0b1d6c1e-6a5f-4d3c-8b9a-4f2e7c0d1a22
              abhanumber: "12345678910111"
              mobilenumber: "9876543210"
              memberid: MEM-2026-000123
              payerid: 100234@sbx
              policies:
                - productid: PRD-INDIV-07
                  productname: Individual Health Silver
              processingid: 100235@sbx
      responses:
        "200":
          description: A successful call returns HTTP 200 with ParticipantLinkAbhaResponse (optional result string and optional errormessage with errorcode and errordescription).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
              example:
                result: success
  /v2/participant/link/abha/policy/init:
    post:
      operationId: registry_v2_participant_link_abha_policy_init
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: Initiate ABHA policy link (v2)
      description: |-
        First half of the two-step v2 link: submits the ABHA policy link request, to be confirmed with a passcode via the validate endpoint.

        ### Business purpose

        The init variant exists so that a policy link can be confirmed out of band before it takes effect. It takes the same ParticipantLinkAbhaRequest as the direct link calls but pairs with GET /v2/participant/link/abha/policy/validate, which accepts a passcode and transactionId. This mirrors the passcode-confirmed pattern already used for participant creation (/validate) and update (/update/validate), giving payers and TPAs an approval gate on member-layer writes. The documentation describes the pairing but does not detail how the passcode is delivered for this endpoint.

        ### When to use

        Use it when your NHCX instance requires the confirmed (init then validate) form of linking rather than the single-call form. It is part of member-layer setup and precedes any claim-side workflow. Call init with the full link request, keep the transaction identifier the flow returns, and then complete the link with the validate call carrying passcode and transactionId. If the confirmation is never completed, the link should not be assumed to exist; verify with /participant/get/policies.

        ### Preconditions

        - A valid Bearer token from the client-credentials call (POST /get/session, form-urlencoded client_id, client_secret, grant_type=client_credentials); tokens last 1200 seconds, so refresh before expiry.
        - HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth: Bearer <token> (the participant service uses bearer_auth, not Authorization).
        - Base path for the participant service: https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice (sandbox) or https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice (production).
        - This is a synchronous plain-JSON registry call: no JWE envelope, no x-hcx-* protocol headers and no correlation id are involved.
        - The caller must be the participant named as payerid or processingid, with a token minted from the client_id used at participant creation.
        - The request body is ParticipantLinkAbhaRequest: requestid (UUID), abhanumber, memberid, payerid and policies (productid, productname) are required; mobilenumber and processingid are optional.

        ### Postconditions

        The service answers synchronously with HTTP 200 and ParticipantLinkAbhaResponse (optional result and errormessage). Per the documented pattern, the link is then confirmed by GET /v2/participant/link/abha/policy/validate with the passcode and transactionId; the docs do not state that the link is visible in policy lookups before that confirmation. There is no NHCX callback. Errors return 400, 404 or 500 with the ErrorResponse envelope. For the sibling participant flows the transaction id and passcode are valid for 24 hours; the docs do not state a separate validity for the policy link pair.

        ### Common mistakes

        - Treating init as the complete link and never calling /v2/participant/link/abha/policy/validate, then reporting that get/policies returns nothing.
        - Using a token from a client_id other than the one used at participant creation for the payer or TPA (common mistake 10 in the NHA list); linking is refused for unauthorised parties.
        - Mixing the case of the path: init and validate live under lower-case /v2/, while the direct V2 link uses /V2/.
        - Swapping payerid and processingid, or omitting required fields such as requestid, memberid or the policies array.

        ### Best practices

        - Persist the requestid you sent and the transaction identifier you receive together, so the validate step can be completed by a different process or after a restart.
        - Complete the validate step promptly; the sibling participant create and update passcodes expire after 24 hours, so do not assume a longer window here.
        - Use the same product identifiers as registered through /product/link.
        - Confirm the outcome with /participant/get/policies before informing the provider or beneficiary.
        - Refresh the Bearer token proactively and retry once on 401.

        ### Related scenario

        An insurer's policy administration team is required by its NHCX instance to confirm member links by passcode. When a new policy is issued, the system posts the ParticipantLinkAbhaRequest to /v2/participant/link/abha/policy/init and records the transaction identifier. The authorised operator receives the passcode and the system calls GET /v2/participant/link/abha/policy/validate with passcode and transactionId to complete the link. The team then checks /V2/participant/get/policies for the member's ABHA number and, satisfied, closes the case; the hospital will discover the policy on the beneficiary's next admission.

        ### Specification

        Chapter [Creating and updating a participant](/docs/nhcx/v1/getting-started/creating-and-updating-a-participant) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestid:
                  type: string
                abhanumber:
                  type: string
                mobilenumber:
                  type: string
                memberid:
                  type: string
                payerid:
                  type: string
                policies:
                  type: array
                  items:
                    type: object
                    properties:
                      productid:
                        type: string
                      productname:
                        type: string
                processingid:
                  type: string
            example:
              requestid: 3c9e8d2f-5b4a-4e1c-9f7d-8a6b5c4d3e21
              abhanumber: "12345678910111"
              mobilenumber: "9876543210"
              memberid: MEM-2026-000123
              payerid: 100234@sbx
              policies:
                - productid: PRD-FLOATER-01
                  productname: Family Floater Gold
              processingid: 100235@sbx
      responses:
        "200":
          description: The service answers synchronously with HTTP 200 and ParticipantLinkAbhaResponse (optional result and errormessage).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
              example:
                result: success
  /v2/participant/link/abha/policy/validate:
    get:
      operationId: registry_v2_participant_link_abha_policy_validate
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: Validate ABHA policy link (v2)
      description: |-
        Second half of the two-step v2 link: confirms an initiated ABHA policy link with the passcode and transactionId query parameters.

        ### Business purpose

        This GET endpoint closes the approval loop opened by /v2/participant/link/abha/policy/init. By requiring a passcode tied to a transactionId, it ensures that a member-layer write attributed to a payer or TPA was actually authorised by that organisation, in the same way that participant creation and update are confirmed through /validate and /update/validate. The value to the ecosystem is trust in the registry: providers rely on the policy lookup, so the links behind it should be deliberate and traceable.

        ### When to use

        Call it after a successful init call, once the passcode is available, passing both required query parameters: passcode (string) and transactionId (string). It is the last step of the confirmed link flow and must be completed before the link is relied on. It has no role in claim-side workflows (eligibility, preauthorisation, claim) beyond making the member discoverable so that those flows can start.

        ### Preconditions

        - A prior POST /v2/participant/link/abha/policy/init that returned a transaction identifier.
        - The passcode associated with that transaction; the documentation for the sibling participant flows says the passcode is specific to each transaction id and valid for 24 hours.
        - A valid Bearer token in bearer_auth: Bearer <token>, plus Accept: application/json; there is no request body, and no JWE or x-hcx-* headers are involved.
        - The participant service base path, sandbox https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice.

        ### Postconditions

        On success the endpoint returns HTTP 200 with ParticipantLinkAbhaResponse (optional result and errormessage). The initiated link is confirmed and the beneficiary's products become discoverable through the policy lookup endpoints. No asynchronous callback follows. Errors return 400, 404 or 500 with the ErrorResponse envelope. If the transaction cannot be found or the passcode is wrong, the documented remedy for the sibling participant flows is to trigger the init request again, which generates a new transaction id and passcode.

        ### Common mistakes

        - Sending passcode and transactionId in a JSON body instead of as query parameters; this is a GET with two required query parameters.
        - Using a transactionId from a different init call or from a participant create/update flow.
        - Letting the passcode age out; the sibling flows document a 24-hour validity for transaction id and passcode.
        - Calling with a token from a client_id other than the one used at participant creation, which fails the link authorisation check.
        - Omitting the Accept header or the Bearer prefix on bearer_auth.

        ### Best practices

        - URL-encode both query parameters and log the transactionId with the outcome.
        - Treat a 404 or an errormessage as a signal to restart from init rather than retrying the same passcode indefinitely.
        - Verify the confirmed link with /participant/get/policies using the same ABHA number.
        - Keep the init and validate calls under the same participant token so the identity check passes.

        ### Related scenario

        A TPA's operations desk initiated a policy link for a new member earlier in the day through /v2/participant/link/abha/policy/init and stored the transaction identifier against the case. When the authorised approver supplies the passcode, the system calls GET /v2/participant/link/abha/policy/validate?passcode=...&transactionId=... and receives a 200 with a result string. The desk then runs /V2/participant/get/policies for the member's ABHA number, sees the product listed, and closes the linking task; the next call in the member's journey will be the hospital's coverage-eligibility check.

        ### Specification

        Chapter [Creating and updating a participant](/docs/nhcx/v1/getting-started/creating-and-updating-a-participant) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: On success the endpoint returns HTTP 200 with ParticipantLinkAbhaResponse (optional result and errormessage).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
              example:
                result: success
  /participant/delink/abha/policy:
    post:
      operationId: registry_participant_delink_abha_policy
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: De-link ABHA policies
      description: |-
        Removes specific products from a member's policy link for a payer, keyed on payerid, memberid and the products listed.

        ### Business purpose

        Policies lapse, members leave a product, and insurance companies move between TPAs. This call is the only documented way to reverse a link written through /participant/link/abha/policy, which keeps the registry honest so that providers do not route claims against coverage that no longer exists. Because there is no in-place re-parenting operation, de-link followed by a fresh link is also the documented procedure when a payer changes its processing TPA. The insurer and TPA control their own data; providers get accurate policy lookups.

        ### When to use

        Use it when a product should no longer be discoverable for a member: policy termination, member removal, product migration, or the first half of a TPA change. It belongs to the member layer and precedes no claim-side workflow; it is the payer's use case 3 in the sandbox exit checklist (Link, Get Policy, De-Link). Do not use it to correct an ABHA number, which is what /update/abhanumber is for.

        ### Preconditions

        - A valid Bearer token from the client-credentials call (POST /get/session, form-urlencoded client_id, client_secret, grant_type=client_credentials); tokens last 1200 seconds, so refresh before expiry.
        - HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth: Bearer <token> (the participant service uses bearer_auth, not Authorization).
        - Base path for the participant service: https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice (sandbox) or https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice (production).
        - This is a synchronous plain-JSON registry call: no JWE envelope, no x-hcx-* protocol headers and no correlation id are involved.
        - The caller must be the participant named as payerid or processingid when the policies were linked; NHCX extracts the client id from the token and allows the call only on a match.
        - The body is ParticipantDeLinkAbhaRequest: requestid (UUID), payerid, memberid and policies (productid, productname) are required; processingid is optional. There is no abhanumber field.

        ### Postconditions

        A successful call returns HTTP 200 with ParticipantDeLinkAbhaResponse and the listed products are no longer returned by /participant/get/policies for that payer and member. No asynchronous callback follows. If the caller is not the linking payer or TPA the call is refused with an error message; if a listed product is not linked the response carries "There is no policies with requested details". Other failures return 400, 404 or 500 with the ErrorResponse envelope. To re-establish coverage, call the link endpoint again, optionally with a new processingid.

        ### Common mistakes

        - Calling from a participant that is neither the payerid nor the processingid used at link time; NHCX checks the client id in the token, not the body, and refuses the call (common mistake 10).
        - Listing a product that is not actually linked for that payerid and memberid, which returns the error message "There is no policies with requested details".
        - Including abhanumber or mobilenumber in the body; the de-link request is keyed on payerid, memberid and the products listed, and has no ABHA field.
        - Expecting provider-side caches to update: the handbook documents the policy cache as permanent with no TTL, so a de-linked policy keeps appearing until the provider passes forceRefresh: true.
        - Using a token generated with a different client_id from the one used when the payer or TPA participant was created.

        ### Best practices

        - De-link only the specific products that need removing; the policies array is the unit of work.
        - When moving an insurer to a new TPA, follow the documented order: de-link the existing policies, then link them again with the new TPA's participant code as processingid.
        - Generate a fresh UUID for requestid on every call and log it with the response.
        - Confirm the result with /participant/get/policies afterwards, and remember that providers may need a forced refresh of their own policy cache.
        - Refresh the Bearer token proactively and retry once on 401 before escalating.

        ### Related scenario

        An insurance company ends its contract with one TPA and appoints another. Its integration first calls /participant/get/policies to enumerate the products linked for each affected member, then calls /participant/delink/abha/policy for each member with the insurer's participant code as payerid, the member id and the products to remove. Once every de-link returns success, it calls /participant/link/abha/policy again with the new TPA's participant code as processingid. Hospitals that have cached these members' policies are told to refresh, so that their next coverage-eligibility check is addressed to the new TPA.

        ### Specification

        Chapter [Creating and updating a participant](/docs/nhcx/v1/getting-started/creating-and-updating-a-participant) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestid:
                  type: string
                payerid:
                  type: string
                memberid:
                  type: string
                policies:
                  type: array
                  items:
                    type: object
                    properties:
                      productid:
                        type: string
                      productname:
                        type: string
                processingid:
                  type: string
            example:
              requestid: 9a7c5e3d-1b2f-4c8a-b6d4-0e9f8a7b6c55
              payerid: 100234@sbx
              memberid: MEM-2026-000123
              policies:
                - productid: PRD-FLOATER-01
                  productname: Family Floater Gold
              processingid: 100235@sbx
      responses:
        "200":
          description: A successful call returns HTTP 200 with ParticipantDeLinkAbhaResponse and the listed products are no longer returned by /participant/get/policies for that payer and member.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
              example:
                result: success
  /V2/participant/delink/abha/policy:
    post:
      operationId: registry_v2_participant_delink_abha_policy
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: De-link ABHA policies (V2)
      description: |-
        V2 variant of the ABHA policy de-link; same ParticipantDeLinkAbhaRequest body and response as the unversioned call.

        ### Business purpose

        This endpoint performs the same member-layer removal as /participant/delink/abha/policy: it takes products out of a member's link for a given payer so that providers stop discovering lapsed or migrated coverage. The OpenAPI document exposes it as participantDeLinkAbhaPolicyV2 with an identical request and response schema; the documentation does not describe any behavioural difference beyond the path and operationId. It is the natural partner of /V2/participant/link/abha/policy for integrations that have standardised on the V2 paths.

        ### When to use

        Use it in the same situations as the v1 de-link: policy termination, member removal, product migration, or as the first step when an insurer changes TPA (de-link, then link again with the new processingid). It is part of member-layer maintenance and is not tied to any claim workflow code. Pair it consistently with the V2 link and V2 get-policies calls.

        ### Preconditions

        - A valid Bearer token from the client-credentials call (POST /get/session, form-urlencoded client_id, client_secret, grant_type=client_credentials); tokens last 1200 seconds, so refresh before expiry.
        - HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth: Bearer <token> (the participant service uses bearer_auth, not Authorization).
        - Base path for the participant service: https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice (sandbox) or https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice (production).
        - This is a synchronous plain-JSON registry call: no JWE envelope, no x-hcx-* protocol headers and no correlation id are involved.
        - The caller must be the payerid or processingid participant from the original link, using a token minted with the client_id used at participant creation.
        - Body: requestid (UUID), payerid, memberid and policies are required; processingid is optional; there is no abhanumber field.
        - Note the capital V in /V2/.

        ### Postconditions

        On success the service returns HTTP 200 with ParticipantDeLinkAbhaResponse and the products are no longer visible through the get-policies endpoints for that payer and member. There is no callback. An unauthorised caller is refused with an error message, and a product that is not linked yields "There is no policies with requested details". Other errors use the 400/404/500 ErrorResponse envelope. Provider-side policy caches are documented as permanent, so they will keep the old answer until forced to refresh.

        ### Common mistakes

        - Calling from a participant that is neither the payerid nor the processingid used at link time; NHCX checks the client id in the token, not the body, and refuses the call (common mistake 10).
        - Listing a product that is not actually linked for that payerid and memberid, which returns the error message "There is no policies with requested details".
        - Including abhanumber or mobilenumber in the body; the de-link request is keyed on payerid, memberid and the products listed, and has no ABHA field.
        - Expecting provider-side caches to update: the handbook documents the policy cache as permanent with no TTL, so a de-linked policy keeps appearing until the provider passes forceRefresh: true.
        - Using a token generated with a different client_id from the one used when the payer or TPA participant was created.
        - Lower-casing the path; /v2/participant/delink/abha/policy is not a documented route.

        ### Best practices

        - De-link only the specific products that need removing; the policies array is the unit of work.
        - When moving an insurer to a new TPA, follow the documented order: de-link the existing policies, then link them again with the new TPA's participant code as processingid.
        - Generate a fresh UUID for requestid on every call and log it with the response.
        - Confirm the result with /participant/get/policies afterwards, and remember that providers may need a forced refresh of their own policy cache.
        - Refresh the Bearer token proactively and retry once on 401 before escalating.

        ### Related scenario

        A TPA is informed by one of its insurers that a corporate group policy has been cancelled mid-term. The TPA's system lists the affected members from its own records, calls /V2/participant/get/policies to confirm what NHCX currently holds, and then calls /V2/participant/delink/abha/policy per member with the insurer's participant code as payerid, its own code as processingid and the cancelled product. Each success is logged against the member. When a former member later presents at a hospital, the provider's policy lookup (after a forced cache refresh) no longer shows the product, and the desk proceeds as a self-pay case rather than submitting a coverage-eligibility check.

        ### Specification

        Chapter [Creating and updating a participant](/docs/nhcx/v1/getting-started/creating-and-updating-a-participant) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestid:
                  type: string
                payerid:
                  type: string
                memberid:
                  type: string
                policies:
                  type: array
                  items:
                    type: object
                    properties:
                      productid:
                        type: string
                      productname:
                        type: string
                processingid:
                  type: string
            example:
              requestid: c4d2e1f0-8b7a-4c6d-9e5f-1a2b3c4d5e66
              payerid: 100234@sbx
              memberid: MEM-2026-000123
              policies:
                - productid: PRD-INDIV-07
                  productname: Individual Health Silver
              processingid: 100235@sbx
      responses:
        "200":
          description: On success the service returns HTTP 200 with ParticipantDeLinkAbhaResponse and the products are no longer visible through the get-policies endpoints for that payer and member.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
              example:
                result: success
  /participant/get/policies:
    post:
      operationId: registry_participant_get_policies
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: Get beneficiary policies
      description: |-
        Looks up the policies linked to a beneficiary by ABHA number, member id or mobile number, returning the payer and product details needed for claims.

        ### Business purpose

        This is the provider's window into the member layer that payers populate through the link API. A hospital cannot submit a coverage-eligibility check, preauthorisation or claim until it knows the payer participant code, member id and product for the patient, and this call is where those values come from. The handbook lists policy discovery as step three of the fixed cashless sequence (payer search, payer selection, policy discovery, cache normalisation, effective payer resolution, InsurancePlan retrieval, optional eligibility, preauth). Payers and TPAs also use it to verify that their links were recorded.

        ### When to use

        Call it after patient registration or admission, when the desk needs to confirm that the patient is linked to a scheme or policy, and again (with a forced refresh) whenever a payer-side change is suspected. It precedes /v1/insuranceplan/request, /v1/coverageeligibility/check and /v1/preauth/submit (workflow code 12). If no payer id can be derived from the result, the backend must refuse preauth with "Unable to resolve payerId from policy bundle. Please fetch eligibility/policies before pre-auth submission." It is use case 2 in both the provider and payer sandbox exit checklists.

        ### Preconditions

        - A valid Bearer token from the client-credentials call (POST /get/session, form-urlencoded client_id, client_secret, grant_type=client_credentials); tokens last 1200 seconds, so refresh before expiry.
        - HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth: Bearer <token> (the participant service uses bearer_auth, not Authorization).
        - Base path for the participant service: https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice (sandbox) or https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice (production).
        - This is a synchronous plain-JSON registry call: no JWE envelope, no x-hcx-* protocol headers and no correlation id are involved.
        - The beneficiary must already have been linked by the payer or TPA; if no link exists the lookup returns nothing regardless of the hospital's own records.
        - Body is FetchParticipantPoliciesRequest with two required strings: identifiertype (AbhaNumber, MemberId or MobileNo) and identifiervalue; ABHA must be supplied without hyphens.

        ### Postconditions

        The service answers synchronously with HTTP 200 and ParticipantListResponse: an optional participantdetails array whose entries carry optional participantcode, participantname, address and state. No callback follows. Integrators cache the normalised result keyed by patient (the handbook documents this cache as permanent, with forceRefresh: true as the only bypass) and resolve payerId, memberId, productId, productName and policyNumber from it. NHA guidance stresses that the processingID in the response, not the PayerID, is what goes into x-hcx-recipient_code. Failures return 400, 404 or 500 with the ErrorResponse envelope.

        ### Common mistakes

        - Sending the ABHA number with hyphens; the identifier table specifies ABHA without hyphens for this lookup and a hyphenated value is a common cause of an empty result.
        - Using the PayerID from the response as x-hcx-recipient_code; NHA's common mistake 7 says providers must use the processingID from the get/Policies response as the receiver code, otherwise NHCX-1003 (receiver not registered) or PAYR-1331 follows.
        - Trying only one identifier type; the handbook prescribes a cascade of AbhaNumber, then MemberId, then MobileNo.
        - Dereferencing fields blindly; every field of ParticipantDetails is optional and the response shape may arrive as participantdetails, participants or a raw array.
        - Trusting a permanent policy cache after a payer-side change instead of passing forceRefresh: true.

        ### Best practices

        - Normalise the ABHA number (strip separators) before the call and try identifiers in the documented priority order: ABHA, then MemberId from the latest admission, then mobile number.
        - Cache successful lookups keyed by patient, but expose a forceRefresh path and use it as the first diagnostic step when a preauth is rejected for a coverage mismatch.
        - Store payerId, memberId, productId, productName and policyNumber from the result; these feed x-hcx-recipient_code, the Coverage and Patient identifiers and the InsurancePlan lookup.
        - If the lookup yields nothing, fall back to a coverage-eligibility check with purpose discovery to obtain the active policy code.
        - Keep the token fresh; retry once on 401.

        ### Related scenario

        A patient is admitted to a network hospital and the registration desk captures an ABHA number and a member id. The HMIS has already called /fetch/participants/list to discover payers, and now calls /participant/get/policies with identifiertype AbhaNumber and the hyphen-free ABHA value. The response is normalised and cached against the patient, and the processingID becomes the receiver code. The desk then requests the plan through /v1/insuranceplan/request, optionally runs /v1/coverageeligibility/check, and submits the preauthorisation with /v1/preauth/submit; when the payer later queries a coverage detail, the desk forces a refresh of this lookup before responding.

        ### Specification

        Chapter [Creating and updating a participant](/docs/nhcx/v1/getting-started/creating-and-updating-a-participant) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifiertype:
                  type: string
                identifiervalue:
                  type: string
            example:
              identifiertype: AbhaNumber
              identifiervalue: "12345678910111"
      responses:
        "200":
          description: "The service answers synchronously with HTTP 200 and ParticipantListResponse: an optional participantdetails array whose entries carry optional participantcode, participantname, address and state."
          content:
            application/json:
              schema:
                type: object
                properties:
                  participantdetails:
                    type: array
                    items:
                      type: object
                      properties:
                        participantcode:
                          type: string
                        participantname:
                          type: string
                        address:
                          type: string
                        state:
                          type: string
              example:
                participantdetails:
                  - participantcode: 100234@sbx
                    participantname: Demo Health Insurance Co
                    address: Plot 12, Sector 5, Gurugram
                    state: Haryana
  /V2/participant/get/policies:
    post:
      operationId: registry_v2_participant_get_policies
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: Get beneficiary policies (V2)
      description: |-
        V2 variant of the beneficiary policy lookup; same FetchParticipantPoliciesRequest body and ParticipantListResponse as the unversioned call.

        ### Business purpose

        This endpoint answers the same question as /participant/get/policies: which payer products is this beneficiary linked to, and therefore which payer or TPA should the hospital address. The OpenAPI document exposes it as getParticipantGetPoliciesV2 with an identical request and response schema and the same Registry APIs tag; the documentation records no behavioural difference beyond the path. Integrations that use the V2 link and de-link calls typically read back through this endpoint.

        ### When to use

        Use it at the same point in the journey as the v1 lookup: after registration, before InsurancePlan retrieval, coverage eligibility and preauthorisation (workflow code 12), and whenever a cached policy needs to be re-validated with forceRefresh. Payers and TPAs use it to confirm a link or de-link they have just written. Pick one of the two get-policies paths and use it consistently.

        ### Preconditions

        - A valid Bearer token from the client-credentials call (POST /get/session, form-urlencoded client_id, client_secret, grant_type=client_credentials); tokens last 1200 seconds, so refresh before expiry.
        - HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth: Bearer <token> (the participant service uses bearer_auth, not Authorization).
        - Base path for the participant service: https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice (sandbox) or https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice (production).
        - This is a synchronous plain-JSON registry call: no JWE envelope, no x-hcx-* protocol headers and no correlation id are involved.
        - A payer or TPA must already have linked the beneficiary.
        - Body: identifiertype (AbhaNumber, MemberId or MobileNo) and identifiervalue, both required; ABHA without hyphens.
        - Note the capital V in /V2/.

        ### Postconditions

        Returns HTTP 200 with ParticipantListResponse (optional participantdetails array of participantcode, participantname, address, state). No callback follows. The result is normalised and cached by the caller; the handbook documents that cache as permanent until forceRefresh: true is passed. The processingID from the response is the receiver code for NHCX routing, and payerId, memberId, productId, productName and policyNumber are resolved from the cached policies for the preauth. Errors return 400, 404 or 500 with the ErrorResponse envelope.

        ### Common mistakes

        - Sending the ABHA number with hyphens; the identifier table specifies ABHA without hyphens for this lookup and a hyphenated value is a common cause of an empty result.
        - Using the PayerID from the response as x-hcx-recipient_code; NHA's common mistake 7 says providers must use the processingID from the get/Policies response as the receiver code, otherwise NHCX-1003 (receiver not registered) or PAYR-1331 follows.
        - Trying only one identifier type; the handbook prescribes a cascade of AbhaNumber, then MemberId, then MobileNo.
        - Dereferencing fields blindly; every field of ParticipantDetails is optional and the response shape may arrive as participantdetails, participants or a raw array.
        - Trusting a permanent policy cache after a payer-side change instead of passing forceRefresh: true.
        - Lower-casing the path to /v2/participant/get/policies, which is not a documented route.

        ### Best practices

        - Normalise the ABHA number (strip separators) before the call and try identifiers in the documented priority order: ABHA, then MemberId from the latest admission, then mobile number.
        - Cache successful lookups keyed by patient, but expose a forceRefresh path and use it as the first diagnostic step when a preauth is rejected for a coverage mismatch.
        - Store payerId, memberId, productId, productName and policyNumber from the result; these feed x-hcx-recipient_code, the Coverage and Patient identifiers and the InsurancePlan lookup.
        - If the lookup yields nothing, fall back to a coverage-eligibility check with purpose discovery to obtain the active policy code.
        - Keep the token fresh; retry once on 401.

        ### Related scenario

        A TPA has just linked a new member through /V2/participant/link/abha/policy and wants to verify the write before closing the ticket. It calls /V2/participant/get/policies with identifiertype AbhaNumber and the member's hyphen-free ABHA number and sees the product returned. Months later the same member is admitted; the hospital's HMIS runs the identifier cascade (ABHA, then member id, then mobile) against this endpoint, caches the result, and proceeds to /v1/insuranceplan/request and /v1/preauth/submit addressed to the TPA's participant code taken from processingID.

        ### Specification

        Chapter [Creating and updating a participant](/docs/nhcx/v1/getting-started/creating-and-updating-a-participant) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifiertype:
                  type: string
                identifiervalue:
                  type: string
            example:
              identifiertype: MemberId
              identifiervalue: MEM-2026-000123
      responses:
        "200":
          description: Returns HTTP 200 with ParticipantListResponse (optional participantdetails array of participantcode, participantname, address, state).
          content:
            application/json:
              schema:
                type: object
                properties:
                  participantdetails:
                    type: array
                    items:
                      type: object
                      properties:
                        participantcode:
                          type: string
                        participantname:
                          type: string
                        address:
                          type: string
                        state:
                          type: string
              example:
                participantdetails:
                  - participantcode: 100234@sbx
                    participantname: Demo Health Insurance Co
                    address: Plot 12, Sector 5, Gurugram
                    state: Haryana
  /update/abhanumber:
    post:
      operationId: registry_update_abhanumber
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: Update ABHA number
      description: |-
        Replaces a placeholder (dummy) ABHA number with the beneficiary's real ABHA number in the ABHA_AUTH_TRANSACTION table.

        ### Business purpose

        Beneficiaries are sometimes onboarded before their real ABHA is known, using a placeholder value. Because the member layer and the Patient resource both key on the ABHA number, a placeholder that is never corrected leaves the beneficiary undiscoverable and breaks the identifier rules for claim bundles. This endpoint, tagged Retrieving API and implemented by updateAbhaNumberController, lets the placeholder be swapped for the real number so that later policy lookups and claim transactions line up. The docs describe it as updating the ABHA number in the ABHA_AUTH_TRANSACTION table.

        ### When to use

        Use it once the beneficiary's genuine ABHA number becomes available after an onboarding that used a dummy value, and before relying on ABHA-keyed policy lookups or building Patient identifiers for coverage-eligibility, preauth (workflow code 12) or claim bundles. The documentation does not restrict which participant role calls it, so treat it as a member-data correction step rather than part of any transaction workflow.

        ### Preconditions

        - A valid Bearer token from the client-credentials call (POST /get/session, form-urlencoded client_id, client_secret, grant_type=client_credentials); tokens last 1200 seconds, so refresh before expiry.
        - HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth: Bearer <token> (the participant service uses bearer_auth, not Authorization).
        - Base path for the participant service: https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice (sandbox) or https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice (production).
        - This is a synchronous plain-JSON registry call: no JWE envelope, no x-hcx-* protocol headers and no correlation id are involved.
        - Both the placeholder and the real ABHA must be known; the body is UpdateAbhaRequest with two optional strings, dummyAbha and realAbha.
        - The gateway's error catalogue expects ABHA numbers in XX-XXXX-XXXX-XXXX form (NHCX-1018), while the member layer stores them without hyphens; the docs do not state which form this endpoint expects, so follow your instance's guidance.

        ### Postconditions

        A successful call returns HTTP 200 with UpdateAbhaResponse, which carries optional successMessage and errorMessage strings. Unusually for this service, the 400, 404 and 500 responses also use UpdateAbhaResponse rather than the registry ErrorResponse envelope, so clients must read errorMessage rather than Error.code on failure. No callback follows. After the update, policy lookups and Patient identifiers should use the real ABHA; any provider-side policy cache built on the placeholder needs a forced refresh.

        ### Common mistakes

        - Parsing failures as ErrorResponse; this endpoint returns UpdateAbhaResponse for 400, 404 and 500 as well as for success.
        - Sending an empty body; both fields are optional in the schema, but the operation is meaningless without dummyAbha and realAbha.
        - Inconsistent ABHA formatting between systems: NHCX-1018 requires XX-XXXX-XXXX-XXXX at the gateway, while x-hcx-ben-abha-id and the member-layer lookups take the number without hyphens.
        - Forgetting to refresh cached policies and stored Patient identifiers that still carry the placeholder.
        - Omitting the Accept header or the Bearer prefix on bearer_auth.

        ### Best practices

        - Record both the placeholder and the real ABHA with the timestamp of the change for audit purposes.
        - Read successMessage and errorMessage on every response and treat a non-200 status as failure even if the body parses.
        - Immediately re-run /participant/get/policies with forceRefresh: true for the affected beneficiary.
        - Keep the ABHA formatting rule per field: hyphen-free for member lookups and x-hcx-ben-abha-id, XX-XXXX-XXXX-XXXX where NHCX-1018 applies.
        - Never log the token; log the ABHA change with the request identifier only.

        ### Related scenario

        A state scheme enrols a beneficiary in a hurry with a dummy ABHA so that a policy can be linked and an emergency admission can proceed. After discharge the beneficiary completes ABHA creation and the real number is captured. The payer's system calls /update/abhanumber with dummyAbha and realAbha, receives a successMessage, and then calls /participant/get/policies with forceRefresh to make sure the real ABHA resolves the linked product. The hospital's billing team, preparing the final claim, refreshes its own policy cache so that the Claim bundle's Patient identifiers carry the PMJAY member id and the real hyphen-free ABHA.

        ### Specification

        Chapter [Participants and policies](/docs/nhcx/v1/registries) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dummyAbha:
                  type: string
                realAbha:
                  type: string
            example:
              dummyAbha: "99999999999999"
              realAbha: "12345678910111"
      responses:
        "200":
          description: A successful call returns HTTP 200 with UpdateAbhaResponse, which carries optional successMessage and errorMessage strings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  successMessage:
                    type: string
              example:
                successMessage: ABHA number updated successfully
  /product/link:
    post:
      operationId: registry_product_link
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: Link payer product
      description: |-
        Registers a product (product id and name) against a payer's participant code, so that it can be referenced in ABHA policy links.

        ### Business purpose

        Products are the payer's catalogue entries that policies[].productid and productname refer to when a beneficiary is linked. This Retrieving API call, described in the OpenAPI document as the API to list products by the payers or insurance companies, is how an insurer places a product in the registry under its own participant code. Doing so makes the product ownership resolvable through /product/getowner and gives providers a stable productId and productName to match against when they resolve coverage for InsurancePlan and preauth.

        ### When to use

        Use it when a payer introduces a new product, and before any /participant/link/abha/policy call that references that product. It is part of payer-side catalogue setup, ahead of member linking and well ahead of any claim-side workflow. When a product is retired, the counterpart /product/delink removes it. The documentation does not describe versioning or renaming of products; treat a rename as de-link and re-link.

        ### Preconditions

        - A valid Bearer token from the client-credentials call (POST /get/session, form-urlencoded client_id, client_secret, grant_type=client_credentials); tokens last 1200 seconds, so refresh before expiry.
        - HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth: Bearer <token> (the participant service uses bearer_auth, not Authorization).
        - Base path for the participant service: https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice (sandbox) or https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice (production).
        - This is a synchronous plain-JSON registry call: no JWE envelope, no x-hcx-* protocol headers and no correlation id are involved.
        - The payer or insurance company must already be a registered participant with its own participant code.
        - Body is ProductLinkRequest with all three fields required: productid, productname and participantcode.

        ### Postconditions

        On success the endpoint returns HTTP 200 with ParticipantCreateResponse, whose single optional field participant_code is the machine-generated participant identifier on the HCX instance. No callback follows. The product becomes the value that /product/getowner resolves back to the owning participant and that policy links refer to. Failures return 400, 404 or 500 with the ErrorResponse envelope (timestamp plus Error with code, message and trace).

        ### Common mistakes

        - Omitting one of the three required fields; productid, productname and participantcode are all mandatory.
        - Using a participantcode in the wrong casing or from the wrong environment (sandbox codes look like 100001@sbx, production codes end in @hcx).
        - Referencing a product in a policy link before it has been linked here, so provider-side product matching later fails.
        - Expecting product details in the response; only participant_code is returned.
        - Missing the Accept header or the Bearer prefix on bearer_auth.

        ### Best practices

        - Keep productid values stable and unique within the payer; providers use productId for product-level matching and productName as the practical policy or coverage code for plan lookup.
        - Register products before linking members, and verify with /product/getowner that the product resolves to your participant code.
        - Log the participant_code returned with the product identifiers for reconciliation.
        - Refresh the Bearer token proactively and retry once on 401.

        ### Related scenario

        An insurer launches a new family floater plan. Before its policy administration system can link any member, it calls /product/link with the product id, the product name that hospitals will see, and the insurer's participant code, receiving its participant_code back in the response. It then checks /product/getowner with the product id to confirm ownership, and begins linking members with /participant/link/abha/policy. Hospitals that later call /participant/get/policies will see the product id and name, use productName for the InsurancePlan lookup and productId for coverage matching in the preauth.

        ### Specification

        Chapter [Participants and policies](/docs/nhcx/v1/registries) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productid:
                  type: string
                productname:
                  type: string
                participantcode:
                  type: string
            example:
              productid: PRD-FLOATER-01
              productname: Family Floater Gold
              participantcode: 100234@sbx
      responses:
        "200":
          description: On success the endpoint returns HTTP 200 with ParticipantCreateResponse, whose single optional field participant_code is the machine-generated participant identifier on the HCX instance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_code:
                    type: string
              example:
                participant_code: 100234@sbx
  /product/delink:
    post:
      operationId: registry_product_delink
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: De-link payer product
      description: |-
        Removes a product (product id and name) from a payer's participant code in the registry.

        ### Business purpose

        When a payer withdraws a product from the market or replaces it, the registry entry created by /product/link should be removed so that it is no longer resolvable and cannot be referenced by new member links. The OpenAPI document describes this Retrieving API call as the API to de-link products by the payers or insurance companies. Keeping the catalogue accurate protects providers from matching on retired products when they resolve coverage for InsurancePlan and preauthorisation.

        ### When to use

        Use it when a product is discontinued or renamed (the docs give no rename operation, so de-link and re-link), after the member links that reference it have been handled through /participant/delink/abha/policy. It is a payer-side catalogue maintenance step and is not tied to any claim workflow code. The documentation does not state whether de-linking a product that still has member links is refused, so remove member links first.

        ### Preconditions

        - A valid Bearer token from the client-credentials call (POST /get/session, form-urlencoded client_id, client_secret, grant_type=client_credentials); tokens last 1200 seconds, so refresh before expiry.
        - HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth: Bearer <token> (the participant service uses bearer_auth, not Authorization).
        - Base path for the participant service: https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice (sandbox) or https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice (production).
        - This is a synchronous plain-JSON registry call: no JWE envelope, no x-hcx-* protocol headers and no correlation id are involved.
        - The payer or insurance company must already be a registered participant with its own participant code.
        - Body is ProductLinkRequest with all three fields required: productid, productname and participantcode.

        ### Postconditions

        On success the endpoint returns HTTP 200 with ParticipantCreateResponse containing the optional participant_code. No callback follows. The product should no longer resolve to the payer through /product/getowner. Failures return 400, 404 or 500 with the ErrorResponse envelope. Provider-side policy caches are documented as permanent, so a product that hospitals have already cached will still appear there until they pass forceRefresh: true.

        ### Common mistakes

        - Sending only productid; ProductLinkRequest requires productid, productname and participantcode for de-link as well.
        - De-linking a product while members are still linked to it, then finding those member links inconsistent; de-link members first.
        - Using a participantcode from the wrong environment or with wrong casing.
        - Assuming providers see the change immediately; their cached policies persist without TTL.
        - Missing the Accept header or sending the token without the Bearer prefix.

        ### Best practices

        - Enumerate and de-link affected member policies before removing the product.
        - Use the exact productid and productname that were registered with /product/link.
        - Verify afterwards with /product/getowner that the product no longer resolves to your participant code.
        - Log the request and the returned participant_code for audit.
        - Refresh the Bearer token proactively and retry once on 401.

        ### Related scenario

        An insurer retires its old Individual Health Silver product at the end of a policy year, having migrated every member to a successor product. Its system first runs /participant/delink/abha/policy for each member still linked to the old product, then calls /product/delink with the product id, product name and the insurer's participant code. A confirmation call to /product/getowner shows the product no longer resolves. The insurer notifies its network hospitals, whose desks force a refresh of cached policies so that the next coverage-eligibility check and preauthorisation reference the successor product.

        ### Specification

        Chapter [Participants and policies](/docs/nhcx/v1/registries) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productid:
                  type: string
                productname:
                  type: string
                participantcode:
                  type: string
            example:
              productid: PRD-INDIV-07
              productname: Individual Health Silver
              participantcode: 100234@sbx
      responses:
        "200":
          description: On success the endpoint returns HTTP 200 with ParticipantCreateResponse containing the optional participant_code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_code:
                    type: string
              example:
                participant_code: 100234@sbx
  /product/getowner:
    post:
      operationId: registry_product_getowner
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: Get product owner
      description: |-
        Resolves a product id to the participant code of the payer that owns it.

        ### Business purpose

        Given only a product identifier, an integrator often needs to know which payer stands behind it. This Retrieving API call takes a ProductOwnerRequest with productid and returns ParticipantCreateResponse, whose participant_code is the owning participant's identifier on the HCX instance. That makes it a useful bridge between a product seen on a policy document or in a policy lookup and the participant code that must go into routing. Note that the OpenAPI description reads "This API is to generate the product Id and product Name", which does not match the response schema; the source does not resolve this conflict.

        ### When to use

        Use it when you hold a product id but not the payer participant code, for example while normalising a policy lookup or verifying a newly linked product. It is a synchronous helper in the member layer, used before InsurancePlan retrieval, coverage eligibility or preauthorisation rather than during them. Payers use it after /product/link or /product/delink to confirm the registry state.

        ### Preconditions

        - A valid Bearer token from the client-credentials call (POST /get/session, form-urlencoded client_id, client_secret, grant_type=client_credentials); tokens last 1200 seconds, so refresh before expiry.
        - HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth: Bearer <token> (the participant service uses bearer_auth, not Authorization).
        - Base path for the participant service: https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice (sandbox) or https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice (production).
        - This is a synchronous plain-JSON registry call: no JWE envelope, no x-hcx-* protocol headers and no correlation id are involved.
        - Body is ProductOwnerRequest with a single optional string, productid; supply it, since the lookup has no other input.
        - The product must have been registered by its payer through /product/link.

        ### Postconditions

        Returns HTTP 200 with ParticipantCreateResponse containing the optional participant_code of the owning participant. No callback follows and no state changes. Failures return 400, 404 or 500 with the ErrorResponse envelope. The returned code identifies the payer (the payerid used in policy links); remember that for NHCX routing the receiver code should come from the processingID given by the get-policies response, which may be a TPA rather than this owner.

        ### Common mistakes

        - Using the returned participant_code directly as x-hcx-recipient_code when the payer is processed by a TPA; NHA's common mistake 7 says the receiver code is the processingID from get/Policies.
        - Expecting product name or other product details in the response; only participant_code is returned.
        - Sending an empty body; productid is optional in the schema but the lookup needs it.
        - Confusing this endpoint with /participant/getProductIdName, which carries the same description but a different request shape.
        - Omitting the Accept header or the Bearer prefix.

        ### Best practices

        - Treat the result as the product owner (payerid), then resolve the effective receiver through the policy lookup.
        - Cache owner lookups by productid; ownership changes rarely and only through /product/link and /product/delink.
        - Handle a missing participant_code gracefully; every field in the response is optional.
        - Refresh the Bearer token proactively and retry once on 401.

        ### Related scenario

        A hospital receives a scanned policy card that shows only a product id, and the patient's ABHA-based policy lookup returned more than one payer. The HMIS calls /product/getowner with the product id and gets back the participant code of the insurer that owns it, which lets the desk pick the right entry from the /participant/get/policies result. With the matched policy in hand the system reads the processingID as the receiver code, requests the plan through /v1/insuranceplan/request and goes on to submit the preauthorisation.

        ### Specification

        Chapter [Participants and policies](/docs/nhcx/v1/registries) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productid:
                  type: string
            example:
              productid: PRD-FLOATER-01
      responses:
        "200":
          description: Returns HTTP 200 with ParticipantCreateResponse containing the optional participant_code of the owning participant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_code:
                    type: string
              example:
                participant_code: 100234@sbx
  /participant/getProductIdName:
    post:
      operationId: registry_participant_getproductidname
      x-abdm-use-case: Participant registry
      tags:
        - Participant registry
      summary: Get product id and name
      description: |-
        Retrieving API described as generating the product id and product name; declared with a bare string request body and a participant-code response.

        ### Business purpose

        The OpenAPI document describes this endpoint with the same sentence as /product/getowner, "This API is to generate the product Id and product Name", and it belongs to the payer product lifecycle alongside /product/link, /product/delink and /product/getowner. Its documented purpose is to resolve product identity information within the participant service. The specification is thin: the request body is declared as a bare string, the response is ParticipantCreateResponse (participant_code only), and the operationId participantCreatePost is reused from the participant-creation endpoints, so treat the operationId as non-unique.

        ### When to use

        Use it only where your NHCX instance documents a concrete contract for it, typically when you need product identity resolved from a string key held by the participant service. It plays no part in claim-side workflows and is not listed in either sandbox exit checklist. For resolving a product to its owning payer, /product/getowner has the clearer request schema; for discovering a member's products, use /participant/get/policies.

        ### Preconditions

        - A valid Bearer token from the client-credentials call (POST /get/session, form-urlencoded client_id, client_secret, grant_type=client_credentials); tokens last 1200 seconds, so refresh before expiry.
        - HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth: Bearer <token> (the participant service uses bearer_auth, not Authorization).
        - Base path for the participant service: https://apisbx.abdm.gov.in/pmjay/sbxhcx/participanthcxservice (sandbox) or https://apisprod.nha.gov.in/pmjay/hcx/participanthcxservice (production).
        - This is a synchronous plain-JSON registry call: no JWE envelope, no x-hcx-* protocol headers and no correlation id are involved.
        - The request body is declared in the OpenAPI document as a bare JSON string rather than an object; the docs do not say what the string should contain.
        - The product concerned should have been registered by its payer through /product/link.

        ### Postconditions

        Returns HTTP 200 with ParticipantCreateResponse, whose only field, participant_code, is optional. No callback follows and no state change is documented. Failures return 400, 404 or 500 with the ErrorResponse envelope. Because the description promises a product id and name while the schema returns a participant code, verify the actual body returned by your instance before depending on either interpretation.

        ### Common mistakes

        - Posting a JSON object when the schema declares a bare string body, or the reverse, and getting a 400.
        - Expecting productid and productname fields in the response; the declared response carries only participant_code.
        - Confusing it with /product/getowner because both carry the same description.
        - Matching on operationId participantCreatePost in generated clients, which collides with the participant-creation operations.
        - Omitting the Accept header or the Bearer prefix on bearer_auth.

        ### Best practices

        - Confirm the request and response contract against your instance's live OpenAPI document before integrating.
        - Prefer /product/getowner for owner resolution and /participant/get/policies for member products; use this call only where it is specifically required.
        - Log both the raw request string and the full response body so the actual behaviour can be reconciled with the specification.
        - Keep the Bearer token fresh and retry once on 401.

        ### Related scenario

        A TPA's integration team is generating a client from the participant service OpenAPI document and notices that /participant/getProductIdName shares its operationId with participant creation and its description with /product/getowner. Rather than wire it into the admission flow, they exercise it once in the sandbox with a product key, record the participant_code returned, and decide to rely on /product/getowner and /participant/get/policies for production. The member journey therefore runs link, get policies, InsurancePlan request and preauthorisation without this call.

        ### Specification

        Chapter [Participants and policies](/docs/nhcx/v1/registries) of the NHCX integration specification.
