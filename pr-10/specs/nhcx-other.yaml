  /v1/notification/subscribe:
    post:
      operationId: other_v1_notification_subscribe
      x-abdm-atom: nhcx.endpoint.notification-subscribe
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Notification subscribe
      description: |-
        A Beneficiary Service Provider (PHR app) subscribes an ABHA id to notification topics; NHCX persists it synchronously, Last-Linked-Wins per ABHA id.

        ### Business purpose

        Every other flow is a two-party exchange between hospital and payer. Notifications let a third party, the beneficiary through a PHR app, watch a claim move without being a sender or recipient on the underlying preauth or claim. The caller is a Beneficiary Service Provider (BSP), not a hospital or insurer; the persona label here is the nearest available. The subscription is what routes human-readable messages such as a preauth approval with amount and validity to the patient's app, giving beneficiaries transparency and reducing calls to the hospital desk.

        ### When to use

        Call it on every beneficiary login (Subscribe-on-Login): the user authenticates with the ABHA address, the app checks its NHCX token, refreshes via the sessions endpoint if expired, then subscribes the ABHA id and stores the returned subscription_id. Because Last-Linked-Wins replaces any earlier app's subscription, resubscribe on each login rather than trusting a stored id. Most PHR apps need only topic_code workflow_events; network_events and participant_events are also defined. The call is synchronous and sits outside the workflow-code sequence; a fresh x-hcx-correlation_id is required per attempt.

        ### Preconditions

        - ABDM M1 integration completed; BSP sandbox testing on hcxsbx.abdm.gov.in, certification and production registry onboarding.
        - An HTTPS callback endpoint with TLS 1.2 or higher registered as on_notification_url, and JWT capability.
        - Access token from the ABDM session token call (01-session/session-token.bru); sent as Authorization: Bearer with Content-Type application/json.
        - Body is a JWEPayload whose compact JWE carries protected headers alg RSA-OAEP, enc A256GCM, x-hcx-sender_code (your BSP code), x-hcx-recipient_code (NHCX gateway code), x-hcx-timestamp (ISO 8601) and a unique x-hcx-correlation_id, plus the subscribe JSON: subscription_id, topic_code array, recipient_code, subscriber.id (ABHA id), on_notification_url and optional expiry.
        - Explicit user consent obtained before subscribing.

        ### Postconditions

        NHCX decrypts the request with its private key, validates headers and payload, persists the subscription with Last-Linked-Wins per ABHA id and returns the subscription state synchronously: HTTP 200 with a SubscribeResponse carrying timestamp, api_call_id, correlation_id, subscription_id, subscription_status (active, replaced or expired), expiry and message. Thereafter, when a hospital submits a preauth or claim with that ABHA id and the payer responds, NHCX pushes a notification (notification_id, topic_code, timestamp, subscriber.id, a displayable message and optional domain_values) to the registered callback. Errors: 400 validation, 401 sender not authorised, 403 sender not permitted, 409 duplicate correlation id, 500 decryption or persistence failure.

        ### Common mistakes

        - Reusing x-hcx-correlation_id across attempts or retries, which returns 409 (the API reference defines 409 as replay detection, not an existing-subscription conflict).
        - Subscribing once and trusting the stored subscription_id; another app's login silently replaces it (subscription_status replaced).
        - Sending it to the exchange host, https://apisbx.abdm.gov.in/hcx, where the other /v1 calls go. The notification integration guide gives the portal host: https://hcxsbx.abdm.gov.in/v1/notification/subscribe.
        - Sending the token on bearer_auth. This call reads it from Authorization: Bearer.
        - Sending protocol headers in the clear rather than inside the JWE protected header.
        - Using the NHCX client-credentials token endpoint instead of the ABDM gateway sessions endpoint.
        - Subscribing silently without consent or without showing subscription status in settings.

        ### Best practices

        - Subscribe on every login and refresh the token before its 100-minute expiry; store access_token encrypted and never log the secret.
        - Generate a fresh UUID correlation id per subscribe attempt, including retries; retry 500s with backoff, regenerate the token on 401, check the registry on 403.
        - Subscribe only to the topics you need, typically workflow_events.
        - Secure the callback: HTTPS with TLS 1.2 or higher, validate the JWT from NHCX, verify sender_code, rate-limit.
        - Display the message field directly to users; treat domain_values as optional audit data and read status from x-hcx-status, not the workflow id description.

        ### Related scenario

        A beneficiary opens a PHR app and logs in with the ABHA address ravi@abdm. The app confirms its NHCX token is valid, then posts /v1/notification/subscribe with subscription_id sub_ravi_001, topic_code workflow_events, its BSP code and its on_notification_url, under a fresh correlation id. NHCX replies 200 with subscription_status active. Later that day a hospital submits a preauth for the same ABHA id on /v1/preauth/submit and the payer approves it on /v1/preauth/on_submit; NHCX pushes a notification to the app's callback reading that the preauthorisation was approved for Rs. 50,000 with its validity dates, which the app displays as-is.

        ### Specification

        Chapter [Notifications and patient apps](/docs/nhcx/v1/reference/notifications-and-patient-apps) of the NHCX integration specification.
      security: []
      servers:
        - url: https://hcxsbx.abdm.gov.in
          description: Sandbox, NHCX portal.
      parameters:
        - name: x-hcx-sender_code
          in: header
          required: true
          description: Your participant code. Mandatory on the envelope.
          schema:
            type: string
          example: phr-app-xyz@bsp
        - name: x-hcx-recipient_code
          in: header
          required: true
          description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
          schema:
            type: string
          example: nhcx-gateway@hcx
        - $ref: "#/components/parameters/XHcxTimestamp"
        - $ref: "#/components/parameters/XHcxCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
                _payload_plaintext:
                  type: object
                  properties:
                    subscription_id:
                      type: string
                    topic_code:
                      type: array
                      items:
                        type: string
                    recipient_code:
                      type: string
                    subscriber:
                      type: object
                      properties:
                        id:
                          type: string
                    on_notification_url:
                      type: string
            example:
              payload: eyJhbGciOiJSU0EtT0FFUCIsImVuYyI6IkEyNTZHQ00iLCJ4LWhjeC1zZW5kZXJfY29kZSI6InBoci1hcHAteHl6QGJzcCJ9.encrypted_key.iv.ciphertext.tag
              _payload_plaintext:
                subscription_id: sub_ravi_001
                topic_code:
                  - workflow_events
                recipient_code: phr-app-xyz@bsp
                subscriber:
                  id: ravi@abdm
                on_notification_url: https://api.phrapp.com/v1/hcx/notification/on_subscribe
      responses:
        "200":
          description: "NHCX decrypts the request with its private key, validates headers and payload, persists the subscription with Last-Linked-Wins per ABHA id and returns the subscription state synchronously: HTTP 200 with a SubscribeResponse carrying timestamp, api_call_id, correlation_id, subscription_id, subscription_status (active, replaced or expired), expiry and message."
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  subscription_id:
                    type: string
                  subscription_status:
                    type: string
                  expiry:
                    type: string
                  message:
                    type: string
              example:
                timestamp: 2026-08-25T08:30:00+05:30
                api_call_id: d6e7f8a9-b0c1-2345-9012-456789012345
                correlation_id: 8899aabb-ccdd-eeff-0011-223344556677
                subscription_id: sub_ravi_001
                subscription_status: active
                expiry: ""
                message: Subscription accepted
  /v1/notification/on_subscribe:
    post:
      operationId: other_v1_notification_on_subscribe
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Notification on_subscribe
      description: |-
        BSP-side subscription acknowledgement; the same name denotes the callback where NHCX pushes claim-event notifications for a subscribed ABHA id.

        ### Business purpose

        Two things share this name. The API reference defines an NHCX-side operation (operationId onSubscribe) that takes a NotificationOnSubscribePayload with the beneficiary's abhaid, optional domain_values and plain header values, and returns a SubscribeResponse; it is described as the BSP-side subscription persistence acknowledgement. The integration guide uses the same path on the BSP's own host as the callback where NHCX delivers notifications. Together they complete the beneficiary-facing loop: the patient's app learns, in plain language, that a preauth was approved, a claim adjudicated, a payment made or information requested. The caller is a Beneficiary Service Provider; the persona label is the nearest available.

        ### When to use

        As a BSP you implement this path on your host, registered through on_notification_url, and receive a push whenever a workflow event occurs for a subscribed ABHA id: preauth_request (queued, processing), preauth_response (approved, rejected), claim_request, claim_response, payment_notice (paid, pending) and communication (information_required). The NHCX-side operation is invoked with hvalues senderid, receiverid, correlationid and status required, and workflowid, source, api_caller_id, call_type and usertoken optional. It sits outside the workflow-code sequence; domain_values may carry x-hcx-workflow_id, x-hcx-correlation_id, x-hcx-status, x-hcx-action and amount fields.

        ### Preconditions

        - An active subscription created via /v1/notification/subscribe for the ABHA id; Last-Linked-Wins means only the most recently linked app receives events.
        - The BSP callback exposed over HTTPS with TLS 1.2 or higher at the registered on_notification_url, validating the JWT from NHCX, verifying sender_code and rate-limiting.
        - For the NHCX-side operation: a NotificationOnSubscribePayload with request.abhaid (required) and optional request.domain_values, plus hvalues with senderid, receiverid, correlationid and status.
        - The ordinary preauth or claim exchange between hospital and payer has produced an event for that beneficiary.

        ### Postconditions

        The NHCX-side operation returns HTTP 200 with a SubscribeResponse (timestamp, api_call_id, correlation_id, subscription_id, subscription_status active, replaced or expired, expiry, message); 400, 401, 403, 409 and 500 return a StatusSuccessResponse with the same descriptions as the subscribe table. On the BSP callback the delivered payload carries notification_id, topic_code, timestamp, subscriber.id, a human-readable message that can be shown directly to the user, and optional domain_values with x-hcx-* headers for audit or custom formatting. Nothing changes in the hospital-payer exchange; the notification is a forked copy of the outcome.

        ### Common mistakes

        - Conflating the NHCX-side operation with your own callback and implementing only one of them.
        - Parsing domain_values to build the user message instead of displaying the message field; domain_values is optional and may be absent.
        - Reading status from the x-hcx-workflow_id description (approved, rejected, queued, processing), which is a documentation error; the example carries an identifier and status lives in x-hcx-status.
        - Assuming the subscription is still yours; a subscription_status of replaced means another app took the routing slot on login.
        - Accepting callbacks without validating the JWT or sender_code, or without TLS 1.2 or higher.
        - Treating the senderid and receiverid descriptions (payer id, hospital id) literally in the notification context; they are inherited boilerplate.

        ### Best practices

        - Display message verbatim; keep domain_values for audit logging or advanced formatting only.
        - Validate the JWT and sender_code on every inbound push, enforce TLS 1.2 or higher and rate limiting.
        - Map event types (preauth_response, claim_response, payment_notice, communication) to in-app timelines using x-hcx-action and x-hcx-status.
        - Show subscription status in settings so a replaced subscription is visible to the user; resubscribe on next login.
        - Keep the endpoint fast and idempotent on notification_id.

        ### Related scenario

        A PHR app has subscribed ravi@abdm to workflow_events. A hospital submits a claim on /v1/claim/submit for that beneficiary and the payer adjudicates it on /v1/claim/on_submit. NHCX forks the outcome to the app's registered on_subscribe callback with topic_code workflow_events, a message stating the claim was approved with the amount, and domain_values including x-hcx-action claim_response and x-hcx-status response.complete. The app validates the JWT and sender_code, shows the message on the patient's timeline, and when the payer later sends a payment notice on /v1/paymentnotice/request the next push reads paid.

        ### Specification

        Chapter [Notifications and patient apps](/docs/nhcx/v1/reference/notifications-and-patient-apps) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request:
                  type: object
                  properties:
                    abhaid:
                      type: string
                    domain_values:
                      type: object
                      properties:
                        x-hcx-workflow_id:
                          type: string
                        x-hcx-correlation_id:
                          type: string
                        x-hcx-timestamp:
                          type: string
                        x-hcx-sender_code:
                          type: string
                        x-hcx-recipient_code:
                          type: string
                        x-hcx-status:
                          type: string
                        x-hcx-action:
                          type: string
                        x-hcx-amount_submitted:
                          type: string
                hvalues:
                  type: object
                  properties:
                    senderid:
                      type: string
                    receiverid:
                      type: string
                    correlationid:
                      type: string
                    status:
                      type: string
                    workflowid:
                      type: string
            example:
              request:
                abhaid: ravi@abdm
                domain_values:
                  x-hcx-workflow_id: wf_20260825_001
                  x-hcx-correlation_id: corr_20260825_12345
                  x-hcx-timestamp: 2026-08-25T14:30:00+05:30
                  x-hcx-sender_code: payor.icici@nhcx
                  x-hcx-recipient_code: bsp.phrapp@nhcx
                  x-hcx-status: response.complete
                  x-hcx-action: preauth_response
                  x-hcx-amount_submitted: "75000.00"
              hvalues:
                senderid: payor.icici@nhcx
                receiverid: bsp.phrapp@nhcx
                correlationid: corr_20260825_12345
                status: response.complete
                workflowid: wf_20260825_001
      responses:
        "200":
          description: The NHCX-side operation returns HTTP 200 with a SubscribeResponse (timestamp, api_call_id, correlation_id, subscription_id, subscription_status active, replaced or expired, expiry, message); 400, 401, 403, 409 and 500 return a StatusSuccessResponse with the same descriptions as the subscribe table.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  subscription_id:
                    type: string
                  subscription_status:
                    type: string
                  expiry:
                    type: string
                  message:
                    type: string
              example:
                timestamp: 2026-08-25T14:30:01+05:30
                api_call_id: e7f8a9b0-c1d2-3456-0123-567890123456
                correlation_id: corr_20260825_12345
                subscription_id: sub_ravi_001
                subscription_status: active
                expiry: ""
                message: "Preauthorization approved for Rs. 50,000. Valid from 2026-08-25 to 2026-09-01. Reference: PA-2026-004567"
  /v1/delete:
    post:
      operationId: other_v1_delete
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Delete records (troubleshooting)
      description: |-
        Internal troubleshooting operation on the claim service that deletes records by correlationid and action; not part of the business transaction flows.

        ### Business purpose

        The claim service OpenAPI lists /v1/delete as an internal troubleshooting operation for deleting records identified by a correlationid and an action. It exists to clear stuck or erroneous records during integration testing and support, not to move a claim through its lifecycle. The published documentation gives no further business context and does not state which participant roles may call it.

        ### When to use

        Only in troubleshooting, and only as directed by NHCX support. The endpoint index describes it as internal troubleshooting, deleting records by correlationid plus action. It does not appear in any transaction flow, sample bundle or workflow-code table, and it carries no x-hcx-workflow_id semantics. It is unrelated to the platform behaviour in which NHCX itself deletes a request after five failed delivery attempts; that deletion is automatic and needs no call.

        ### Preconditions

        - A valid Bearer token and the HTTP headers Accept: application/json, Content-Type: application/json and bearer_auth.
        - The correlation ID of the record to be removed and the action it was recorded under; the docs name these two inputs (correlationid and action) but do not publish a schema, sample body or authorisation rule.
        - Agreement from NHCX support that deletion is the right remedy; the documentation does not describe any business validation performed by the endpoint.

        ### Postconditions

        The endpoint sits in the claim service, whose domain operations all return 202 Accepted, 400 Request Validation failed, 404 Requested resource was not found and 500 Downstream systems down, each carrying StatusSuccessResponse. No worked response body, callback or state change is documented for /v1/delete beyond the removal of the record identified by correlationid and action. After deletion a fresh request cycle with a new correlation UUID is the documented way to proceed, since a deleted or inactive correlation ID cannot be resumed.

        ### Common mistakes

        - Treating /v1/delete as a way to cancel a preauth or claim; cancellation is a Task on /v1/task/submit (code cancel, workflow PC01 or 122) and reprocess is workflow 36 on the same endpoint.
        - Calling it to recover from a failed delivery and then reusing the same correlation ID; NHCX marks failed correlation IDs inactive and a new cycle is required.
        - Assuming the input names or authorisation are documented; only correlationid and action are named, and the specs do not say who may call it.
        - Using it in production without NHCX support involvement; it is described as internal troubleshooting.

        ### Best practices

        - Reserve this call for sandbox troubleshooting and only on NHCX support's instruction.
        - Record the correlation ID, action and reason for every deletion in your own audit log, since the docs describe no NHCX-side confirmation beyond the HTTP status.
        - Prefer /v1/status to inspect a stuck correlation ID before deleting anything.
        - Mint a new correlation UUID for any re-submission after a deletion.

        ### Related scenario

        During sandbox testing a hospital's integrator submits a claim whose callback keeps failing because their endpoint returned 200 instead of 202. NHCX support asks them to fix the acknowledgement and then clears the stuck record by correlation ID and action using /v1/delete so the test case can be rerun cleanly. The integrator resubmits the claim to /v1/claim/submit under a new correlation UUID, receives a 202, and this time the on_submit callback is acknowledged correctly.

        ### Specification

        No chapter of the current documentation covers this operation. It appears only in the claim service's OpenAPI.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correlationid:
                  type: string
                action:
                  type: string
            example:
              correlationid: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
              action: /v1/claim/submit
      responses:
        "200":
          description: The endpoint sits in the claim service, whose domain operations all return 202 Accepted, 400 Request Validation failed, 404 Requested resource was not found and 500 Downstream systems down, each carrying StatusSuccessResponse.
          content:
            application/json:
              schema:
                type: object
                properties:
                  httpStatus:
                    type: integer
                  schema:
                    type: string
                  note:
                    type: string
              example:
                httpStatus: 202
                schema: StatusSuccessResponse
                note: The claim service spec lists 202, 400, 404 and 500, all carrying StatusSuccessResponse; no worked response body is published for /v1/delete.
  /v3/api-docs:
    get:
      operationId: other_v3_api_docs
      x-abdm-use-case: Other
      tags:
        - Other
      summary: OpenAPI 3 document (status service)
      description: |-
        Serves the status service's OpenAPI 3 document, optionally filtered by a group query parameter; a discovery endpoint, not a protocol API.

        ### Business purpose

        Integrators need a machine-readable contract for the Status API in order to generate clients, validate their requests and confirm the server prefix. This endpoint serves that contract in OpenAPI 3 form for the status service (statushcxservice, OpenAPI 3.0.1, service version 1.0.0). It carries no claim-settlement data and involves no payer or provider business logic; its value is purely in making the /v1/status operation discoverable and verifiable during integration and troubleshooting.

        ### When to use

        Use it during integration setup, when generating or refreshing an API client, and when a status call is failing and you want to confirm the exact schema and server prefix the service advertises. The endpoint index lists it as endpoint 19 with an optional group query parameter. It is not part of any transaction workflow and is not referenced by the sandbox exit checklists.

        ### Preconditions

        - A GET request to the status service host; the OpenAPI documents in this corpus were captured from https://hcxsbx.abdm.gov.in/<service>/api-docs, and the status service declares the server prefix /statushcxservice.
        - No JWE envelope, no x-hcx-* protocol headers and no correlation id; the docs do not state that a Bearer token is required for these discovery endpoints.
        - No request body.

        ### Postconditions

        The service returns HTTP 200 with a JSON OpenAPI 3 document describing the status service: its info block, the /statushcxservice server entry and the /v1/status operation with its StatusSuccessResponse responses. Nothing changes on NHCX and no callback follows. The document is a description of the service as deployed and may differ from the handbook's gateway-side conventions, which the docs flag as an unresolved conflict.

        ### Common mistakes

        - Pointing at the gateway base https://apisbx.abdm.gov.in/pmjay/sbxhcx and expecting the per-service spec host; the docs advise swapping between the two URL shapes when a path 404s.
        - Treating the served document as the integration contract for gateway traffic; the handbook's gateway base and header conventions take precedence where the two disagree.
        - Sending a POST or a JSON body to a GET discovery endpoint.
        - Wrapping the call in JWE or adding x-hcx-* headers, which only apply to protocol APIs such as /v1/status.

        ### Best practices

        - Use these endpoints for exploration and client generation in the sandbox, and cache the document rather than fetching it on every run.
        - Diff the served document against the corpus (Status service: OpenAPI 3.0.1, version 1.0.0) when behaviour changes unexpectedly.
        - Never let production traffic depend on the availability of the documentation endpoints.
        - Keep the /v1/status protocol rules in mind when reading the spec: x-hcx-correlation_id must carry the original request's correlation id.

        ### Related scenario

        A hospital's integration team is building status polling for stalled preauthorisations. Before wiring /v1/status, an engineer fetches /v3/api-docs from the status service host, confirms the server prefix and the response schema, and generates a typed client. The team then implements the status request with the original correlation id in x-hcx-correlation_id, handles the synchronous request.queued and request.dispatched outcomes, and receives the payer's answer on the status callback.

        ### Specification

        Chapter [Environments and addresses](/docs/nhcx/v1/reference/environments-and-addresses) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: "The service returns HTTP 200 with a JSON OpenAPI 3 document describing the status service: its info block, the /statushcxservice server entry and the /v1/status operation with its StatusSuccessResponse responses."
          content:
            application/json:
              schema:
                type: object
                properties:
                  openapi:
                    type: string
                  info:
                    type: object
                    properties:
                      title:
                        type: string
                      version:
                        type: string
                  servers:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                  paths:
                    type: object
                    properties:
                      /v1/status:
                        type: object
                        properties:
                          post:
                            type: object
                            properties:
                              operationId:
                                type: string
                              responses:
                                type: object
                                properties:
                                  "202":
                                    type: object
                                    properties:
                                      description:
                                        type: string
              example:
                openapi: 3.0.1
                info:
                  title: Status service
                  version: 1.0.0
                servers:
                  - url: /statushcxservice
                paths:
                  /v1/status:
                    post:
                      operationId: status
                      responses:
                        "202":
                          description: Accepted
  /v2/api-docs:
    get:
      operationId: other_v2_api_docs
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Swagger 2 document (status service)
      description: |-
        Serves the status service's Swagger 2 document, optionally filtered by a group query parameter; a discovery endpoint, not a protocol API.

        ### Business purpose

        Some tooling still consumes Swagger 2 rather than OpenAPI 3. This endpoint serves the status service's contract in that older format so that such tools can generate clients and validate requests against /v1/status. It exists alongside /v3/api-docs and describes the same service; it carries no claim-settlement data and involves no business logic. Its value is limited to integration setup and troubleshooting.

        ### When to use

        Use it when your client generator or API tooling requires Swagger 2 input, or when comparing the Swagger 2 and OpenAPI 3 renderings of the status service during a troubleshooting session. The endpoint index lists it as endpoint 20 with an optional group query parameter. It plays no part in any transaction workflow.

        ### Preconditions

        - A GET request to the status service host; the OpenAPI documents in this corpus were captured from https://hcxsbx.abdm.gov.in/<service>/api-docs, and the status service declares the server prefix /statushcxservice.
        - No JWE envelope, no x-hcx-* protocol headers and no correlation id; the docs do not state that a Bearer token is required for these discovery endpoints.
        - No request body.

        ### Postconditions

