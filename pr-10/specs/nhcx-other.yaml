  /v1/on_status:
    post:
      operationId: other_v1_on_status
      x-abdm-atom: nhcx.endpoint.on-status
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Status callback
      description: |-
        The answer to a status request, delivered to the sender that asked. The `x-hcx-status` in the protected header says where the message you asked about got to. The payload is an empty string.

        ### Business purpose

        It separates "did my message arrive" from "what did the payer decide". A sender learns whether a quiet case is still held by the exchange, has reached the recipient, or is dead, without resubmitting it and creating a duplicate.

        ### When to use

        Hosted by every participant that sends `/v1/status`. It arrives in answer to a status request you sent.

        ### Preconditions

        - You sent `/v1/status` with `x-hcx-correlation_id` set to the `api_call_id` of the message you were asking about, and you kept that mapping.
        - Your callback address is registered and answers 202 within 30 seconds.

        ### Postconditions

        Read `x-hcx-status` from the protected header. `request.dispatched` means the message reached the recipient, and `request.queued` that the exchange still holds it. `request.stopped` means redelivery was exhausted and the correlation ID retired, so the original request is dead and a retry needs a fresh correlation ID. `x-hcx-error_details`, with `code`, `message` and `trace`, is present where the original failed. Answer 202 with the receipt.

        ### Common mistakes

        - Expecting a bundle. The payload is an empty string and everything travels in the header.
        - Matching the answer on the original request's correlation ID. It carries the correlation of your status request.
        - Retrying a `request.stopped` message on its old correlation ID.
        - Offering a refresh or chase control in the user interface with no status exchange behind it.

        ### Best practices

        - Keep every `api_call_id` you send. Without it you cannot ask the question at all.
        - Act on `request.stopped` at once, and treat `request.dispatched` as a reason to wait for the payer.
        - Ask from a support screen when a case has gone quiet for longer than the payer's expected turnaround, not on a timer.

        ### Related scenario

        A pre-authorisation has had no answer for longer than the payer's usual turnaround. The support screen sends `/v1/status` with that request's `api_call_id` as the correlation ID. The answer arrives here with an empty payload and `x-hcx-status` `request.stopped`, so the desk knows the request is dead rather than slow, and resubmits it with a fresh correlation ID.

        ### Specification

        Chapter [NHCX adapter (Optional)](/docs/nhcx/v1/getting-started/nhcx-adapter) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
        - name: x-hcx-sender_code
          in: header
          required: true
          description: Your participant code. Mandatory on the envelope.
          schema:
            type: string
          example: <participant code>
        - name: x-hcx-recipient_code
          in: header
          required: true
          description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
          schema:
            type: string
          example: <recipient code>
        - $ref: "#/components/parameters/XHcxApiCallId"
        - name: x-hcx-correlation_id
          in: header
          required: true
          description: The thread. See the rule below. Mandatory on the envelope.
          schema:
            type: string
          example: <correlation id>
        - $ref: "#/components/parameters/XHcxTimestamp"
        - name: x-hcx-status
          in: header
          required: true
          description: Where this message stands. Values below. Mandatory on the envelope.
          schema:
            type: string
          example: response.complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
            example:
              payload: <compact JWE>
      responses:
        "200":
          description: Read `x-hcx-status` from the protected header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 19/03/2026 11:46:35:120
                api_call_id: "{{$guid}}"
                correlation_id: "{{correlationId}}"
                error:
                  code: ""
                  message: ""
  /v1/error:
    post:
      operationId: other_v1_error
      x-abdm-use-case: Other
      tags:
        - Other
      summary: Error report (callback)
      description: |-
        Where the exchange tells a sender that a request could not be delivered after five attempts. Received by every participant under its registered address. There is no outbound form.

        ### Business purpose

        When the exchange cannot deliver a request, it tries five times, retires the correlation ID and tells the original sender here. A system without this endpoint never learns that its request died, and a dead request looks exactly like a case still under review. Every participant must host it.

        ### When to use

        Hosted, never called. Implement it before anything else that is asynchronous. Providers and payers both host it.

        ### Preconditions

        - Your callback address is registered: a domain name over HTTPS with TLS 1.2 or newer, hosted in India, reachable from the exchange's outbound addresses and answering within 30 seconds.
        - The handler accepts a body it does not recognise. What arrives is a plain JSON report of the request the exchange gave up on, with the rejection details, not a sealed `JWEPayload`. Its field names are not published, so the body in this request is an illustration rather than a schema.

        ### Postconditions

        Answer 202 with the receipt, like every other delivery, filling in whatever identifiers the report carries and leaving the rest empty. The original request is dead: its correlation ID has been retired, so a retry needs a fresh one.

        ### Common mistakes

        - Not hosting it, so failed deliveries are never seen.
        - Parsing the report against a fixed schema and answering `4xx` when it does not match.
        - Retrying the failed request on the retired correlation ID.

        ### Best practices

        - Store the report whole before doing anything with it.
        - Mark the case it names as undelivered, so the desk does not wait for a decision that will not come.
        - Check it first when a case goes quiet, before asking the exchange with `/v1/status`.

        ### Related scenario

        A hospital posts a pre-authorisation and gets its receipt, but the payer's endpoint is down. The exchange tries five times, retires the correlation ID and posts a report to the hospital's `/v1/error`. The handler stores the report whole, answers 202 with the receipt, and marks the pre-authorisation undelivered. The desk resubmits it with a fresh correlation ID once the payer is reachable.

        ### Specification

        Chapter [Building and sending a JWE](/docs/nhcx/v1/getting-started/building-and-sending-a-jwe) of the NHCX integration specification.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
        - name: x-hcx-sender_code
          in: header
          required: true
          description: Your participant code. Mandatory on the envelope.
          schema:
            type: string
          example: nhcx-gateway@hcx
        - name: x-hcx-recipient_code
          in: header
          required: true
          description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
          schema:
            type: string
          example: 1000004446@hcx
        - $ref: "#/components/parameters/XHcxApiCallId"
        - name: x-hcx-correlation_id
          in: header
          required: true
          description: The thread. See the rule below. Mandatory on the envelope.
          schema:
            type: string
          example: <correlation id>
        - $ref: "#/components/parameters/XHcxTimestamp"
        - name: x-hcx-status
          in: header
          required: true
          description: Where this message stands. Values below. Mandatory on the envelope.
          schema:
            type: string
          example: response.error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                x-hcx-sender_code:
                  type: string
                x-hcx-recipient_code:
                  type: string
                x-hcx-api_call_id:
                  type: string
                x-hcx-correlation_id:
                  type: string
                x-hcx-workflow_id:
                  type: string
                x-hcx-timestamp:
                  type: string
                x-hcx-status:
                  type: string
                x-hcx-error_details:
                  type: object
                  properties:
                    code:
                      type: string
                    message:
                      type: string
                    trace:
                      type: string
                x-hcx-entity-type:
                  type: string
            example:
              type: ProtocolResponse
              x-hcx-sender_code: nhcx-gateway@hcx
              x-hcx-recipient_code: 1000004446@hcx
              x-hcx-api_call_id: <uuid>
              x-hcx-correlation_id: <correlation id>
              x-hcx-workflow_id: "12"
              x-hcx-timestamp: <iso timestamp>
              x-hcx-status: response.error
              x-hcx-error_details:
                code: ERR_DELIVERY_FAILED
                message: Recipient endpoint unreachable after five attempts
                trace: ""
              x-hcx-entity-type: preauth
      responses:
        "200":
          description: Answer 202 with the receipt, like every other delivery, filling in whatever identifiers the report carries and leaving the rest empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  result:
                    type: object
                    properties:
                      sender_code:
                        type: string
                      recipient_code:
                        type: string
                      entity_type:
                        type: string
                      protocol_status:
                        type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 04/09/2026 11:46:41:305
                api_call_id: <from the incoming header>
                correlation_id: <from the incoming header>
                result:
                  sender_code: 1000003538@hcx
                  recipient_code: 1000004446@hcx
                  entity_type: preauth
                  protocol_status: request.queued
                error:
                  code: ""
                  message: ""
