        Hosted by the provider. The exchange posts this message to the `endpoint_url` you registered, at `/v1/task/on_submit`, with the headers and the sealed payload the sender posted. Answer HTTP 202 with the receipt first and process afterwards; [Receiving a callback](/docs/nhcx/v1/getting-started/receiving-a-callback) has the rules.

        Payer returns a Task bundle with Task.status completed whose Task.output references a ClaimResponse carrying the reprocess or cancellation outcome.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
        - name: x-hcx-sender_code
          in: header
          required: true
          description: Your participant code. Mandatory on the envelope.
          schema:
            type: string
          example: 1518@hcx
        - name: x-hcx-recipient_code
          in: header
          required: true
          description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
          schema:
            type: string
          example: 1000004446@hcx
        - $ref: "#/components/parameters/XHcxApiCallId"
        - $ref: "#/components/parameters/XHcxRequestId"
        - $ref: "#/components/parameters/XHcxCorrelationId"
        - name: x-hcx-workflow_id
          in: header
          required: false
          description: Which step, or which case. See the two readings below. Optional on the envelope.
          schema:
            type: string
          example: "252"
        - $ref: "#/components/parameters/XHcxTimestamp"
        - name: x-hcx-status
          in: header
          required: true
          description: Where this message stands. Values below. Mandatory on the envelope.
          schema:
            type: string
          example: response.complete
        - $ref: "#/components/parameters/XHcxBenAbhaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
            example:
              payload: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwieC1oY3gtc2VuZGVyX2NvZGUiOiIxNTE4QGhjeCJ9.encrypted_key.iv.ciphertext.tag
      responses:
        "202":
          description: Received. The receipt names the message it answers; the answer itself follows as a call of your own.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  result:
                    type: object
                    properties:
                      sender_code:
                        type: string
                      recipient_code:
                        type: string
                      entity_type:
                        type: string
                      protocol_status:
                        type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 04/09/2026 11:46:41:305
                api_call_id: <from the incoming header>
                correlation_id: <from the incoming header>
                result:
                  sender_code: 1000003538@hcx
                  recipient_code: 1000004446@hcx
                  entity_type: preauth
                  protocol_status: request.queued
                error:
                  code: ""
                  message: ""
  v1_on_status:
    post:
      operationId: other_webhook_v1_on_status
      x-abdm-atom: nhcx.callback.on-status
      x-abdm-triggered-by: other_v1_on_status
      x-abdm-use-case: Webhooks
      tags:
        - Other
      summary: Receive status callback
      description: |-
        Hosted by the provider. The exchange posts this message to the `endpoint_url` you registered, at `/v1/on_status`, with the headers and the sealed payload the sender posted. Answer HTTP 202 with the receipt first and process afterwards; [Receiving a callback](/docs/nhcx/v1/getting-started/receiving-a-callback) has the rules.

        The answer to a status request, delivered to the sender that asked. The `x-hcx-status` in the protected header says where the message you asked about got to. The payload is an empty string.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
        - name: x-hcx-sender_code
          in: header
          required: true
          description: Your participant code. Mandatory on the envelope.
          schema:
            type: string
          example: <participant code>
        - name: x-hcx-recipient_code
          in: header
          required: true
          description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
          schema:
            type: string
          example: <recipient code>
        - $ref: "#/components/parameters/XHcxApiCallId"
        - name: x-hcx-correlation_id
          in: header
          required: true
          description: The thread. See the rule below. Mandatory on the envelope.
          schema:
            type: string
          example: <correlation id>
        - $ref: "#/components/parameters/XHcxTimestamp"
        - name: x-hcx-status
          in: header
          required: true
          description: Where this message stands. Values below. Mandatory on the envelope.
          schema:
            type: string
          example: response.complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
            example:
              payload: <compact JWE>
      responses:
        "202":
          description: Received. The receipt names the message it answers; the answer itself follows as a call of your own.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  result:
                    type: object
                    properties:
                      sender_code:
                        type: string
                      recipient_code:
                        type: string
                      entity_type:
                        type: string
                      protocol_status:
                        type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 04/09/2026 11:46:41:305
                api_call_id: <from the incoming header>
                correlation_id: <from the incoming header>
                result:
                  sender_code: 1000003538@hcx
                  recipient_code: 1000004446@hcx
                  entity_type: preauth
                  protocol_status: request.queued
                error:
                  code: ""
                  message: ""
  v1_error:
    post:
      operationId: other_webhook_v1_error
      x-abdm-atom: nhcx.callback.error
      x-abdm-triggered-by: other_v1_error
      x-abdm-use-case: Webhooks
      tags:
        - Other
      summary: Receive error report (callback)
      description: |-
        Hosted by every participant. The exchange posts this message to the `endpoint_url` you registered, at `/v1/error`, with the headers and the sealed payload the sender posted. Answer HTTP 202 with the receipt first and process afterwards; [Receiving a callback](/docs/nhcx/v1/getting-started/receiving-a-callback) has the rules.

        Where the exchange tells a sender that a request could not be delivered after five attempts. Received by every participant under its registered address. There is no outbound form.
      parameters:
        - $ref: "#/components/parameters/BearerAuth"
        - name: x-hcx-sender_code
          in: header
          required: true
          description: Your participant code. Mandatory on the envelope.
          schema:
            type: string
          example: nhcx-gateway@hcx
        - name: x-hcx-recipient_code
          in: header
          required: true
          description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
          schema:
            type: string
          example: 1000004446@hcx
        - $ref: "#/components/parameters/XHcxApiCallId"
        - name: x-hcx-correlation_id
          in: header
          required: true
          description: The thread. See the rule below. Mandatory on the envelope.
          schema:
            type: string
          example: <correlation id>
        - $ref: "#/components/parameters/XHcxTimestamp"
        - name: x-hcx-status
          in: header
          required: true
          description: Where this message stands. Values below. Mandatory on the envelope.
          schema:
            type: string
          example: response.error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                x-hcx-sender_code:
                  type: string
                x-hcx-recipient_code:
                  type: string
                x-hcx-api_call_id:
                  type: string
                x-hcx-correlation_id:
                  type: string
                x-hcx-workflow_id:
                  type: string
                x-hcx-timestamp:
                  type: string
                x-hcx-status:
                  type: string
                x-hcx-error_details:
                  type: object
                  properties:
                    code:
                      type: string
                    message:
                      type: string
                    trace:
                      type: string
                x-hcx-entity-type:
                  type: string
            example:
              type: ProtocolResponse
              x-hcx-sender_code: nhcx-gateway@hcx
              x-hcx-recipient_code: 1000004446@hcx
              x-hcx-api_call_id: <uuid>
              x-hcx-correlation_id: <correlation id>
              x-hcx-workflow_id: "12"
              x-hcx-timestamp: <iso timestamp>
              x-hcx-status: response.error
              x-hcx-error_details:
                code: ERR_DELIVERY_FAILED
                message: Recipient endpoint unreachable after five attempts
                trace: ""
              x-hcx-entity-type: preauth
      responses:
        "202":
          description: Received. The receipt names the message it answers; the answer itself follows as a call of your own.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  api_call_id:
                    type: string
                  correlation_id:
                    type: string
                  result:
                    type: object
                    properties:
                      sender_code:
                        type: string
                      recipient_code:
                        type: string
                      entity_type:
                        type: string
                      protocol_status:
                        type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                timestamp: 04/09/2026 11:46:41:305
                api_call_id: <from the incoming header>
                correlation_id: <from the incoming header>
                result:
                  sender_code: 1000003538@hcx
                  recipient_code: 1000004446@hcx
                  entity_type: preauth
                  protocol_status: request.queued
                error:
                  code: ""
                  message: ""
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "On every NHCX call, the token goes in a header called `bearer_auth`, with the word `Bearer` and a space in front. The sources are not unanimous: the authentication page and the FAQ both write the example as `Authorization`, and the notification endpoint uses `Authorization`. The safe course, and what the adapter does, is to send both headers with the same value."
  parameters:
    BearerAuth:
      name: bearer_auth
      in: header
      required: true
      description: It is `bearer_auth`, not `Authorization`, on NHCX's own endpoints.
      schema:
        type: string
      example: Bearer <access token>
    XHcxSenderCode:
      name: x-hcx-sender_code
      in: header
      required: true
      description: Your participant code. Mandatory on the envelope.
      schema:
        type: string
      example: 1000004446@hcx
    XHcxRecipientCode:
      name: x-hcx-recipient_code
      in: header
      required: true
      description: The recipient's. For a provider, the processor code from the policy lookup. Mandatory on the envelope.
      schema:
        type: string
      example: 1518@hcx
    XHcxApiCallId:
      name: x-hcx-api_call_id
      in: header
      required: true
      description: Fresh on every message, including responses. Mandatory on the envelope.
      schema:
        type: string
      example: <uuid>
    XHcxRequestId:
      name: x-hcx-request_id
      in: header
      required: false
      description: One per originating request. The Open Protocol page marks it Mandatory; the Technical Specifications page marks it Optional. Optional on the envelope.
      schema:
        type: string
      example: <uuid>
    XHcxCorrelationId:
      name: x-hcx-correlation_id
      in: header
      required: true
      description: The thread. See the rule below. Mandatory on the envelope.
      schema:
        type: string
      example: <uuid>
    XHcxWorkflowId:
      name: x-hcx-workflow_id
      in: header
      required: false
      description: Which step, or which case. See the two readings below. Optional on the envelope.
      schema:
        type: string
      example: "18"
    XHcxTimestamp:
      name: x-hcx-timestamp
      in: header
      required: true
      description: See the format note below. Mandatory on the envelope.
      schema:
        type: string
      example: <iso timestamp>
    XHcxStatus:
      name: x-hcx-status
      in: header
      required: true
      description: Where this message stands. Values below. Mandatory on the envelope.
      schema:
        type: string
      example: request.initiated
    XHcxBenAbhaId:
      name: x-hcx-ben-abha-id
      in: header
      required: true
      description: The beneficiary's ABHA number. Mandatory on every exchange, including those with no beneficiary in the payload. Mandatory on the envelope.
      schema:
        type: string
      example: "91711234567890"
x-abdm-errors:
  notes: |-
    Codes any exchange call can meet are recorded once, in the [Other](/docs/nhcx/v1/api/other) specification: the gateway's NHCX- codes, the standard payer codes, and the reference payer's structure and transport codes. The reference payer's other codes sit with the exchange they reject: coverage eligibility, preauthorisation, claim and insurance plan. [Reading error codes](/docs/nhcx/v1/reference/error-code-guide) explains the code spaces.

    18 codes from PAYR-1003 to PAYR-1020 mean one thing on the standard payer sheet and another on the reference payer's sheet. Read the code together with its message.
  ranges:
    - range: NHCX-1xxx
      covers: The exchange, on the envelope. The message never reached the payer.
      examples: "`NHCX-1001`, `NHCX-1002`"
    - range: PAYR-10xx
      covers: Transport and bundle structure. An element, id, sequence or type is missing. Not a value problem.
      examples: "`PAYR-1001`, `PAYR-1002`"
    - range: PAYR-11xx
      covers: Coverage eligibility. The policy, the beneficiary or the hospital configuration.
      examples: "`PAYR-1101`, `PAYR-1102`"
    - range: PAYR-12xx
      covers: Preauthorisation. Codes, amounts, dates, sequencing and scheme rules.
      examples: "`PAYR-1201`, `PAYR-1202`"
    - range: PAYR-13xx
      covers: Claim. The same, against the approved preauthorisation.
      examples: "`PAYR-1301`, `PAYR-1302`"
    - range: PAYR-14xx
      covers: Insurance plan, and the scheme's outer rules. Empanelment, policy association, plan configuration.
      examples: "`PAYR-1401`, `PAYR-1402`"
x-abdm-errors-gateway:
  source: Gateway codes, NHCX-. Sent by the exchange; they arrive synchronously on your own call, or on /v1/error.
  codes:
    - code: NHCX-401
      message: User Unauthorized
      action: ""
    - code: NHCX-1001
      message: Receiver system is not reachable.
      action: ""
    - code: NHCX-1002
      message: Sender not registered in NHCX. Please register in NHCX portal and try again.
      action: ""
    - code: NHCX-1003
      message: Receiver not registered in NHCX. Please try again with valid receiver details.
      action: ""
    - code: NHCX-1004
      message: No receiver registered in NHCX for the requested scheme. Please try again with valid receiver details for the scheme.
      action: ""
    - code: NHCX-1005
      message: Invalid request header. Please try again with valid headers.
      action: ""
    - code: NHCX-1006
      message: Duplicate request. Request with same correlation id already exist in the system.
      action: ""
    - code: NHCX-1007
      message: Something went wrong while processing the request. Please check the request structure and values and try again.
      action: ""
    - code: NHCX-1008
      message: Something went wrong while processing the request. Please try again after sometime.
      action: ""
    - code: NHCX-1009
      message: Something went wrong while processing the request. Please check log for more details.
      action: ""
    - code: NHCX-1010
      message: No Data with given Correlation id for call back request, please check status for more details
      action: ""
    - code: NHCX-1011
      message: Invalid Status, please check x-hcx-status value from the protected header
      action: ""
    - code: NHCX-1012
      message: No records found with the requested api caller id. Please try again with a valid api caller id.
      action: ""
    - code: NHCX-1013
      message: Invalid or blank request found.
      action: ""
    - code: NHCX-1014
      message: Unable to send protocol response to sender.
      action: ""
    - code: NHCX-1015
      message: Invalid response received from receiver.
      action: ""
    - code: NHCX-1016
      message: Invalid Api Action, please check the request action for this correlationId before trying again
      action: ""
    - code: NHCX-1017
      message: Invalid response received from receiver
      action: ""
    - code: NHCX-1018
      message: Invalid ABHA number received. ABHA number should be sent in the format XX-XXXX-XXXX-XXXX
      action: ""
x-abdm-errors-standard-payer:
  source: Standard payer codes, PAYR-1001 to PAYR-1020. Sent by A payer implementing the published standard; they arrive inside the sealed response.
  codes:
    - code: PAYR-1001
      message: Error while decrypting request. Please reprocess the request encrypting with valid certificate of the payer.
      action: ""
    - code: PAYR-1002
      message: Error while encrypting request. Please update encryption certificate in NHCX.
      action: ""
    - code: PAYR-1003
      message: Error while connecting to NHCX. System will try to resend the message to NHCX after some time.
      action: ""
    - code: PAYR-1004
      message: Provider is not registered with the payer for requested policy.
      action: ""
    - code: PAYR-1005
      message: Beneficiary is not a covered member for requested policy. Please enroll beneficiary for the policy and try again.
      action: ""
    - code: PAYR-1006
      message: Policy does not exist. Please try with a valid policy.
      action: ""
    - code: PAYR-1007
      message: Requested policy is expired. Please try with a valid policy.
      action: ""
    - code: PAYR-1008
      message: Eligible coverage amount of the beneficiary for the requested policy is insufficient to process the request.
      action: ""
    - code: PAYR-1009
      message: Requested items are not valid or not covered. Please try again with valid or covered items.
      action: ""
    - code: PAYR-1010
      message: Preauthorization is required to process the request but was not obtained.
      action: ""
    - code: PAYR-1011
      message: Enhancement request can not be processed as the prior approved package/procedure does not support enhancement.
      action: ""
    - code: PAYR-1012
      message: Claim amount requested is more than the preauthorization approved amount.
      action: ""
    - code: PAYR-1013
      message: No prior approval for the requested procedures/packages obtained.
      action: ""
    - code: PAYR-1014
      message: Date of birth of the beneficiary can not be after date of service.
      action: ""
    - code: PAYR-1015
      message: Date of service cannot be after date of death.
      action: ""
    - code: PAYR-1016
      message: Duplicate claim submitted based on service codes and dates.
      action: ""
    - code: PAYR-1017
      message: Amount calculations are not correct. Please verify calculated amount.
      action: ""
    - code: PAYR-1018
      message: Time limit for submission expired.
      action: ""
    - code: PAYR-1019
      message: Requested additional information was not received or was not received within time limit
      action: ""
    - code: PAYR-1020
      message: Unable to process payment as no valid bank details found for the provider.
      action: ""
