webhooks:
  /api/v3/hiu/hiecm/subscription-requests/on-init:
    post:
      tags:
        - subscription-hiu
      operationId: subscription_post_v3_hiu_hiecm_subscription_requests_on_init
      summary: This is a callback api for /api/hiecm/subscription-requests/v3/init.
      description: |-
        **Hosted by the HIP/HIU, not by ABDM.** ABDM calls this endpoint at the callback URL registered for your bridge, so the path below is relative to that URL.
        This API endpoint serves as a callback for the /api/hiecm/subscription-requests/v3/init API. It is used to handle the response from the subscription request initiation process. By invoking this API, the Health Information User (HIU) can receive and process the outcome of the subscription request, ensuring that the system accurately reflects the status and actions taken.
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for track the end to end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
        - name: X-HIU-ID
          in: header
          required: true
          schema:
            type: string
          example: IN2810014366
          description: Identifier of the health information user to which the request was intended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: In the request body, either ‘subscriptionRequest’ or ‘error’ must be included.<br> <ol type='a'><br/> <li>Incase of success scenario,subscriptionRequest is mandatory and error is optional </li> <li>Incase of failure scenario,error is mandatory and subscriptionRequest is optional</li> <li>response is mandatory object in both the cases</li> </ol>
              required:
                - subscriptionRequest
                - response
              properties:
                subscriptionRequest:
                  type: object
                  properties:
