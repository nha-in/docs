                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: Invalid Credentials. Make sure you have provided the correct security credentials
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: Access Denied
        "404":
          description: server cannot find the requested resource
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                required:
                  - timestamp
                  - path
                  - status
                  - error
                  - requestId
                properties:
                  timestamp:
                    type: number
                    example: 1731557446506
                  path:
                    type: string
                    example: /hiecm/api/v3/subscription-requests/init
                  status:
                    type: integer
                    example: 500
                  error:
                    type: string
                    description: The error code and message, if any occurred.
                    example: Internal Server Error
                  requestId:
                    type: string
                    example: d20b575b-2659-4a1b-8c2d-9e3f5a6b7c8d
        "503":
          description: Internal Server Error -> It is just one example, for every api the path will be changed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: 'ABDM-1024 - Dependent service unavailable. May be returned either bare (`ABDM-1024`) or with a trailing ": " separator (`ABDM-1024: `); match on the code itself and tolerate the separator.'
                    nullable: false
                    example: ABDM-1024
                  message:
                    type: string
                    nullable: false
                    example: Dependent service unavailable
