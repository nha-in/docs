                    subscriptionRequestId:
                      type: string
                      nullable: true
                      example: f29f0e59-8388-4698-9fe6-05db67aeac46
                      description: The subscription request id. This should be from the subscription request. Allows alphanumeric characters and  special characters like "^[0-9a-fA-F]{8}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{4}\\b-[0-9a-fA-F]{12}$"
                error:
