openapi: 3.1.1
info:
  x-portal:
    module: record-share
    label: Patient scan and record share
    position: 12
    icon: share-2
  title: ABDM patient scan and record share
  summary: A patient scans a facility's QR code in a PHR app and shares chosen health records with that HIU.
  description: |-
    The patient or end-user logs in to the PHR application and uses the Scan and Record share feature by scanning the facility's QR code. The QR code names the Health Information User (HIU). The PHR app sends the patient's profile and the care contexts to share to the HIE-CM, the HIU answers with a data push URL and an encryption key, the PHR app posts the encrypted records to that URL, and both sides notify the HIE-CM of the transfer status.

    Terminology: the Bridge ID is the client ID NHA provides to the HIP, alphanumeric, for example SBX_00XXXX. The Service ID is the facility ID generated from the NHPR application, alphanumeric, for example IN02100000XX.
  version: abdm-v3
  license:
    name: MIT
    identifier: MIT
  contact:
    name: ABDM sandbox support
    url: https://sandboxsupport.abdm.gov.in/
  x-abdm-gateway: hiecm
  x-abdm-module: RECORD-SHARE
  x-abdm-phase: 1
  x-abdm-roles:
    - his
    - phr
x-abdm-sources:
  - file: catalogue/openapi/.raw/nha-2026-09-21-record-share/Patient Scan and Record Share.docx
    role: upstream
    hash: sha256:2d3ba3761a8a4b0a9b1b21d945a54797956f0ece683c85bfaa2af2bfbbb8df52
    fetched: "2026-09-21"
  - file: catalogue/openapi/.raw/nha-2026-09-21-record-share/Record_Share_19_03_2026.postman_collection.json
    role: upstream
    hash: sha256:a3a8d786cc35e6859c0d640eaf8be37f72e7eb8b65c27ec24f35ce1a3fb3f70c
    fetched: "2026-09-21"
  - file: catalogue/openapi/corrections/2026-09-21-record-share-ingest.md
    role: correction
    status: not-yet-hashed
servers:
  - url: https://dev.abdm.gov.in
    description: ABDM gateway, sandbox. X-CM-ID is sbx.
  - url: https://apis.abdm.gov.in
    description: ABDM gateway, production. X-CM-ID is abdm.
security:
  - bearerAuth: []
tags:
  - name: abdm-record-share-phr
    description: The calls the PHR application makes after scanning the QR code, and the callbacks it receives.
  - name: abdm-record-share-hiu
    description: The calls the HIU makes to receive the records, and the callbacks it receives.
paths:
  /api/hiecm/patient-record/v3/share:
    post:
      tags:
        - abdm-record-share-phr
      operationId: record-share_post_patient_record_v3_share
      summary: Share a patient's records with the HIU whose QR code was scanned.
      description: |-
        This API is the first step in initiating the health data sharing process. It is invoked by an integrator application (such as any PHR application like ABHA) after scanning the HIU's QR code. The QR code provides the Health Information User (HIU) identifier, which is then used to share the user's profile details and care-context information with the HIE-CM.

        The HIE-CM answers 202 Accepted and forwards the request to the HIU as a POST to /api/v3/patient-record/share on the HIU's bridge. The HIU's reply, with the data push URL and encryption key, arrives on the PHR app's /api/v3/patient-record/on-share callback.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/REQUEST-ID"
        - $ref: "#/components/parameters/TIMESTAMP"
        - $ref: "#/components/parameters/X-HIU-ID"
        - $ref: "#/components/parameters/X-CM-ID"
        - $ref: "#/components/parameters/X-AUTH-TOKEN"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - metaData
                - profile
                - sharedRecordCount
                - consent
              properties:
                metaData:
                  $ref: "#/components/schemas/MetaData"
                profile:
                  $ref: "#/components/schemas/Profile"
                sharedRecordCount:
                  type: integer
                  description: Number of records that are to be shared to the health information user (HIU).
                  example: 2
                consent:
                  $ref: "#/components/schemas/Consent"
            example:
              metaData:
                hiuId: MANISH_HIU
                counterId: IN081010313
              profile:
                patient:
                  abhaNumber: null
                  abhaAddress: abhaAddress@sbx
                  name: String
                  gender: M
                  dayOfBirth: "18"
                  monthOfBirth: "10"
                  yearOfBirth: "1991"
                  address:
                    line: String
                    district: String
                    state: String
                    pincode: XXXXXX
                  phoneNumber: 989141XXXX
              sharedRecordCount: 2
              consent:
                careContexts:
                  - patientReference: manishk1991@sbx
                    careContextReference: 10004-20200001768-1
                  - patientReference: manishk1991@sbx
                    careContextReference: 10004-20200001768-2
                permission:
                  accessMode: VIEW
                dataEraseAt: "2025-10-11T08:58:09.738Z"
      responses:
        "202":
          description: Accepted. The HIE-CM forwards the request to the HIU; the HIU's data push URL and key arrive on the on-share callback.
  /api/hiecm/patient-record/v3/on-share:
    post:
      tags:
        - abdm-record-share-hiu
      operationId: record-share_post_patient_record_v3_on_share
      summary: Reply to a share request with the data push URL and the encryption key.
      description: |-
        This API acts as the callback endpoint for the PHR application. After the initial request, the HIU responds to this callback with the data push URL and the encryption key required for securely transferring the user's health records.

        The HIU makes this call after receiving the share request on its /api/v3/patient-record/share bridge endpoint. The transactionId is the one that request carried, and response.requestId is that request's REQUEST-ID. The HIE-CM forwards the body to the PHR app's /api/v3/patient-record/on-share callback.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/REQUEST-ID"
        - $ref: "#/components/parameters/TIMESTAMP"
        - $ref: "#/components/parameters/X-HIU-ID"
        - $ref: "#/components/parameters/X-CM-ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnShareBody"
            example:
              hiRequest:
                transactionId: 18235d89-cb13-479d-ad71-7a57d5f669a8
                dataPushUrl: https://webhook.site/a2477c41-2185-47eb-835a/health-information/transfer
                keyMaterial:
                  cryptoAlg: ECDH.
                  curve: curve25519
                  dhPublicKey:
                    expiry: "2022-12-28T13:18:20.742Z"
                    parameters: Ephemeral public key.
                    keyValue: BFN7KTdOT0jIAExG2A8Jg+01wMPWxptiGqwHRVvtiVEsUq2FR7P2UdqZxJyPJSeR6muai21iQhasNxnhh8I5M+g=
                  nonce: 28236d89-cb13-479d-ad71-7a57d5f669a9
              response:
                requestId: efd6964f-6893-4b66-9e4e-28afc164126b
      responses:
        "202":
          description: Accepted. The HIE-CM forwards the data push URL and key to the PHR app's on-share callback.
  /api/hiecm/patient-record/v3/notify:
    post:
      tags:
        - abdm-record-share-phr
        - abdm-record-share-hiu
      operationId: record-share_post_patient_record_v3_notify
      summary: Notify the HIE-CM of the transfer status, once, after the data transfer completes.
      description: |-
        This API is used to update the status of the health record transfer process. It is invoked by the PHR application and HIU to notify the HIE-CM about the completion status of the transaction and the individual care-contexts. Each care-context's transfer status is included to provide a detailed update on which records were successfully shared and received.

        The PHR app or health locker, on the transfer of data, sends sessionStatus as one of TRANSFERRED, PARTIAL_TRANSFERRED or FAILED, and an hiStatus for each careContextReference as one of DELIVERED or ERRORED.

        The HIU, on receipt of data, sends sessionStatus as one of RECEIVED, PARTIAL_RECEIVED or FAILED, for example FAILED when data was not received or invalid data was received, and an hiStatus for each careContextReference as one of VALID, CORRUPTED, BLANK or ERRORED.

        Send the notification once, after the data transfer has completed. The HIE-CM forwards it to the other side's /api/v3/patient-record/on-notify callback.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/REQUEST-ID"
        - $ref: "#/components/parameters/TIMESTAMP"
        - $ref: "#/components/parameters/X-HIU-ID"
        - $ref: "#/components/parameters/X-CM-ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyBody"
            examples:
              PHR app, after transfer:
                value:
                  notification:
                    transactionId: a0e7bed4-ef98-4ea8-9077-f4a6192bfe2b
                    doneAt: "2026-03-19T08:01:11.090Z"
                    statusNotification:
                      sessionStatus: TRANSFERRED
                      statusResponses:
                        - careContextReference: COC497647c1-0627-48fa-8131-0dddc1b3e0b4
                          hiStatus: DELIVERED
                          description: Data sent successfully
                        - careContextReference: COC497647c1-0627-48fa-8131-0dddc1b3e0b5
                          hiStatus: DELIVERED
                          description: Data sent successfully
              HIU, after receipt:
                value:
                  notification:
                    transactionId: 3acbbb52-6de0-441f-b452-3c9488462b25
                    doneAt: "2023-01-24T06:35:44.167Z"
                    statusNotification:
                      sessionStatus: RECEIVED
                      statusResponses:
                        - careContextReference: 10004-20200001768-1
                          hiStatus: VALID
                          description: Data received successfully
                        - careContextReference: 10004-20200001768-2
                          hiStatus: ERRORED
                          description: Data could not be decrypted
      responses:
        "202":
          description: Accepted. The HIE-CM forwards the status to the other side's on-notify callback.
  /api/hiecm/patient-record/v3/audit-history:
    get:
      tags:
        - abdm-record-share-phr
      operationId: record-share_get_patient_record_v3_audit_history
      summary: List the record sharing history of the signed in user.
      description: This API retrieves the complete history of record-sharing transactions for a specific user. It provides details of all past and ongoing transactions, including associated care-contexts. The user is the one the X-AUTH-TOKEN was issued to. Filter by date with startDate and endDate, and page with limit and offset.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/REQUEST-ID"
        - $ref: "#/components/parameters/TIMESTAMP"
        - $ref: "#/components/parameters/X-CM-ID"
        - $ref: "#/components/parameters/X-AUTH-TOKEN"
        - name: limit
          in: query
          required: false
          description: The number of records to return.
          schema:
            type: integer
          example: 10
        - name: startDate
          in: query
          required: false
          description: Start date of the records, ISO 8601.
          schema:
            type: string
            format: date-time
          example: "2024-07-13T07:30:10.186Z"
        - name: endDate
          in: query
          required: false
          description: End date of the records, ISO 8601.
          schema:
            type: string
            format: date-time
          example: "2025-02-18T08:30:50.189Z"
        - name: offset
          in: query
          required: false
          description: Where to start. When the offset is 0, retrieval starts from the very first record in the dataset.
          schema:
            type: integer
          example: 0
      responses:
        "200":
          description: The sharing transactions of the user, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditHistoryEntry"
              example:
                - requestId: ed9f451d-9e07-484d-ab68-9972d6529d68
                  abhaAddress: manishk1991@sbx
                  senderFacilityId: MANISH_PHR_TEST
                  senderFacilityName: MANISH-PHR-TEST
                  receiverFacilityId: MANISH_HIU
                  receiverFacilityName: MANISH_HIU
                  counterCode: f4cd0d8e-25ec-465f-993c-01c91a56e0e4
                  transactionId: f413b202-16b6-4d4a-9900-5cdcfb8baa50
                  status: RECORD_SHARE_REQUESTED
                  sharedRecordCount: 2
                  consent:
                    accessMode: VIEW
                    dataEraseAt: "2026-10-12T08:58:09.738Z"
                    careContexts:
                      - patientReference: manikandanb87@sbx
                        careContextReference: COC497647c1-0627-48fa-8131-0dddc1b3e0b4
                      - patientReference: manikandanb87@sbx
                        careContextReference: COC497647c1-0627-48fa-8131-0dddc1b3e0b5
                  dateCreated: "2025-12-08T12:04:53.594Z"
                  dateModified: "2025-12-08T12:04:53.594Z"
webhooks:
  /api/v3/patient-record/share:
    post:
      tags:
        - abdm-record-share-hiu
      operationId: record-share_post_v3_patient_record_share
      summary: Receive a patient's share request, as the HIU.
      x-abdm-triggered-by: record-share_post_patient_record_v3_share
      description: |-
        **Hosted by the HIU, not by ABDM.** The HIE-CM calls this endpoint at the callback URL registered for your bridge, so the path below is relative to that URL.

        This is a callback API for the HIU. The HIE-CM provides the record share request the PHR app raised: the patient's profile, the number of records and the care contexts to share, and a transactionId for the transfer. Reply by calling POST /api/hiecm/patient-record/v3/on-share with the data push URL and the encryption key, carrying this transactionId and this request's REQUEST-ID.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/request-id"
        - $ref: "#/components/parameters/timestamp"
        - $ref: "#/components/parameters/x-hiu-id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - metaData
                - transactionId
                - profile
                - sharedRecordCount
                - consent
              properties:
                metaData:
                  $ref: "#/components/schemas/MetaData"
                transactionId:
                  type: string
                  format: uuid
                  description: The transfer's identifier, assigned by the HIE-CM. Carry it in on-share and in notify.
                  example: 56582bc6-5c17-4b32-9244-9b61d47a8059
                profile:
                  $ref: "#/components/schemas/Profile"
                sharedRecordCount:
                  type: integer
                  description: Number of records that are to be shared to the HIU.
                  example: 2
                consent:
                  $ref: "#/components/schemas/Consent"
            example:
              metaData:
                hiuId: MANISH_HIU
                counterId: cf554160-1db7-453e-9d7a-3793ae2f50e0
              transactionId: 56582bc6-5c17-4b32-9244-9b61d47a8059
              profile:
                patient:
                  abhaNumber: null
                  abhaAddress: abhaAddress@sbx
                  name: Nitesh
                  gender: M
                  dayOfBirth: "18"
                  monthOfBirth: "10"
                  yearOfBirth: "1912"
                  address:
                    line: Rohini Delhi
                    district: Delhi
                    state: Delhi
                    pincode: "110042"
                  phoneNumber: 989141XXXX
              sharedRecordCount: 2
              consent:
                careContexts:
                  - patientReference: manikandanb87@sbx
                    careContextReference: COC497647c1-0627-48fa-8131-0dddc1b3e0b4
                  - patientReference: manikandanb87@sbx
                    careContextReference: COC497647c1-0627-48fa-8131-0dddc1b3e0b5
                permission:
                  accessMode: VIEW
                dataEraseAt: "2026-10-12T08:58:09.738Z"
      responses:
        "202":
          description: Accepted. Answer with the on-share call.
  /api/v3/patient-record/on-share:
    post:
      tags:
        - abdm-record-share-phr
      operationId: record-share_post_v3_patient_record_on_share
      summary: Receive the HIU's data push URL and encryption key, as the PHR app.
      x-abdm-triggered-by: record-share_post_patient_record_v3_on_share
      description: |-
        **Hosted by the PHR application, not by ABDM.** The HIE-CM calls this endpoint at the callback URL registered for your bridge, so the path below is relative to that URL.

        This is a callback API for the PHR application. The HIE-CM provides the HIU's answer to the share request: the data push URL to post the records to, and the ECDH key material to encrypt them with. Generate your own key pair and nonce, encrypt each record, and POST them to the data push URL, then call POST /api/hiecm/patient-record/v3/notify with the transfer status.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/request-id"
        - $ref: "#/components/parameters/timestamp"
        - $ref: "#/components/parameters/x-hiu-id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnShareBody"
            example:
              hiRequest:
                transactionId: 56582bc6-5c17-4b32-9244-9b61d47a8059
                dataPushUrl: https://webhook.site/a2477c41-2185-47eb-835a/health-information/transfer
                keyMaterial:
                  cryptoAlg: ECDH.
                  curve: curve25519
                  dhPublicKey:
                    expiry: "2026-12-28T13:18:20.742Z"
                    parameters: Ephemeral public key.
                    keyValue: BFN7KTdOT0jIAExG2A8Jg+01wMPWxptiGqwHRVvtiVEsUq2FR7P2UdqZxJyPJSeR6muai21iQhasNxnhh8I5M+g=
                  nonce: e589643f-48a9-41ed-ab2b-479e709e8f80
              response:
                requestId: 180ce450-ce28-493f-ac43-9f5253fa1167
      responses:
        "202":
          description: Accepted. Post the encrypted records to the data push URL next.
  /health-information/transfer:
    post:
      tags:
        - abdm-record-share-hiu
      operationId: record-share_post_health_information_transfer
      summary: Receive the encrypted records at the data push URL, as the HIU.
      x-abdm-triggered-by: record-share_post_patient_record_v3_on_share
      description: |-
        **Hosted by the HIU at the dataPushUrl it supplied in on-share, not by ABDM.** The PHR application posts here directly; the path is whatever the data push URL names.

        The PHR app sends the records covered by the share, one entry per care context, each an encrypted FHIR bundle with its checksum, along with the PHR app's own ECDH key material so the HIU can derive the shared key and decrypt. The shape below is the placeholder body in NHA's Postman collection; it follows the M2 and M3 health information transfer.
      parameters:
        - $ref: "#/components/parameters/request-id"
        - $ref: "#/components/parameters/timestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pageNumber
                - pageCount
                - transactionId
                - entries
                - keyMaterial
              properties:
                pageNumber:
                  type: integer
                  description: This page, counting from 0.
                  example: 0
                pageCount:
                  type: integer
                  description: How many pages the transfer has.
                  example: 0
                transactionId:
                  type: string
                  description: The transfer's identifier, from the share request.
                  example: 56582bc6-5c17-4b32-9244-9b61d47a8059
                entries:
                  type: array
                  description: One entry per care context shared.
                  items:
                    type: object
                    properties:
                      content:
                        type: string
                        description: Encrypted content of data packaged in a FHIR bundle.
                        example: Encrypted content of data packaged in FHIR bundle
                      media:
                        type: string
                        description: MIME type of the content.
                        example: application/fhir+json
                      checksum:
                        type: string
                        description: Checksum of the content.
                        example: string
                      careContextReference:
                        type: string
                        example: 10004-20200001768-1
                keyMaterial:
                  $ref: "#/components/schemas/KeyMaterial"
            example:
              pageNumber: 0
              pageCount: 0
              transactionId: string
              entries:
                - content: Encrypted content of data packaged in FHIR bundle
                  media: mimetype of the content.
                  checksum: string
                  careContextReference: 10004-20200001768-1
                - content: Encrypted content of data packaged in FHIR bundle
                  media: mimetype of the content.
                  checksum: string
                  careContextReference: 10004-20200001768-2
              keyMaterial:
                cryptoAlg: ECDH
                curve: Curve25519
                dhPublicKey:
                  expiry: "2026-12-28T13:18:20.742Z"
                  parameters: Curve25519/32byte random key
                  keyValue: string
                nonce: string
      responses:
        "202":
          description: Accepted. Decrypt, then call notify with RECEIVED, PARTIAL_RECEIVED or FAILED.
  /api/v3/patient-record/on-notify:
    post:
      tags:
        - abdm-record-share-phr
        - abdm-record-share-hiu
      operationId: record-share_post_v3_patient_record_on_notify
      summary: Receive the other side's transfer status.
      x-abdm-triggered-by: record-share_post_patient_record_v3_notify
      description: |-
        **Hosted by the PHR application and by the HIU, not by ABDM.** The HIE-CM calls this endpoint at the callback URL registered for your bridge, so the path below is relative to that URL.

        This is a callback API for the PHR application and the HIU. This API is used to receive the status of the health record transfer process: the HIU receives what the PHR app sent to notify, and the PHR app receives what the HIU sent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/request-id"
        - $ref: "#/components/parameters/timestamp"
        - $ref: "#/components/parameters/x-hiu-id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyBody"
            example:
              notification:
                transactionId: 103a6265-8d5d-411b-9a9d-b460b5f00e4e
                doneAt: "2026-03-19T08:01:11.090Z"
                statusNotification:
                  sessionStatus: TRANSFERRED
                  statusResponses:
                    - careContextReference: COC497647c1-0627-48fa-8131-0dddc1b3e0b4
                      hiStatus: DELIVERED
                      description: Data sent successfully
      responses:
        "202":
          description: Accepted.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token issued by the ABDM session API after successful validation of client id and secret.
  parameters:
    REQUEST-ID:
      name: REQUEST-ID
      in: header
      required: true
      description: Random UUID, a v4 style guid, unique per request.
      schema:
        type: string
        format: uuid
      example: 18235d89-cb13-479d-ad71-7a57d5f669a8
    TIMESTAMP:
      name: TIMESTAMP
      in: header
      required: true
      description: ISO 8601 timestamp of when the request was initiated.
      schema:
        type: string
        format: date-time
      example: "2022-10-06T15:10:00.587Z"
    X-HIU-ID:
      name: X-HIU-ID
      in: header
      required: true
      description: Identifier of the health information user to which the request was intended.
      schema:
        type: string
      example: HIU_ID
    X-CM-ID:
      name: X-CM-ID
      in: header
      required: true
      description: Suffix of the consent manager to which the request was intended. sbx in the sandbox, abdm in production.
      schema:
        type: string
      example: sbx
    X-AUTH-TOKEN:
      name: X-AUTH-TOKEN
      in: header
      required: true
      description: JWT access token issued by the PHR service after successful user authentication. If the HIP does not have any role, then it is mandatory.
      schema:
        type: string
      example: Bearer <USER_TOKEN>
    request-id:
      name: request-id
      in: header
      required: true
      description: Random UUID, a v4 style guid, unique per callback.
      schema:
        type: string
        format: uuid
      example: 18235d89-cb13-479d-ad71-7a57d5f669a8
    timestamp:
      name: timestamp
      in: header
      required: true
      description: ISO 8601 timestamp of when the callback was sent.
      schema:
        type: string
        format: date-time
      example: "2022-10-06T15:10:00.587Z"
    x-hiu-id:
      name: x-hiu-id
      in: header
      required: true
      description: Identifier of the health information user to which the request was intended.
      schema:
        type: string
      example: HIU_ID
  schemas:
    MetaData:
      type: object
      description: The HIU and the counter the QR code named.
      required:
        - hiuId
        - counterId
      properties:
        hiuId:
          type: string
          description: The HIU's identifier, read from the QR code.
          example: MANISH_HIU
        counterId:
          type: string
          description: The counter at the HIU, read from the QR code.
          example: IN081010313
    Profile:
      type: object
      description: The essential patient details, including ABHA number, ABHA address and the patient's contact address, used for initiating the record share process.
      required:
        - patient
      properties:
        patient:
          type: object
          required:
            - abhaAddress
            - name
            - gender
            - yearOfBirth
            - address
            - phoneNumber
          properties:
            abhaNumber:
              type:
                - string
                - "null"
              description: The 14 digit ABHA number, or null when the patient has an address only.
              example: null
            abhaAddress:
              type: string
              description: The patient's ABHA address.
              example: abhaAddress@sbx
            name:
              type: string
              example: String
            gender:
              type: string
              description: M, F or O.
              example: M
            dayOfBirth:
              type: string
              example: "18"
            monthOfBirth:
              type: string
              example: "10"
            yearOfBirth:
              type: string
              example: "1991"
            address:
              type: object
              properties:
                line:
                  type: string
                  example: String
                district:
                  type: string
                  example: String
                state:
                  type: string
                  example: String
                pincode:
                  type: string
                  example: XXXXXX
            phoneNumber:
              type: string
              example: 989141XXXX
    Consent:
      type: object
      description: The care contexts to share, the permission specifying how the records can be accessed, and the dataEraseAt date until which the data remains accessible.
      required:
        - careContexts
        - permission
        - dataEraseAt
      properties:
        careContexts:
          type: array
          items:
            type: object
            required:
              - patientReference
              - careContextReference
            properties:
              patientReference:
                type: string
                description: The patient reference the care context was linked under.
                example: manishk1991@sbx
              careContextReference:
                type: string
                example: 10004-20200001768-1
        permission:
          type: object
          required:
            - accessMode
          properties:
            accessMode:
              type: string
              description: How the HIU may use the records.
              enum:
                - VIEW
              example: VIEW
        dataEraseAt:
          type: string
          format: date-time
          description: Until when the data remains accessible to the HIU.
          example: "2025-10-11T08:58:09.738Z"
    KeyMaterial:
      type: object
      description: ECDH key material for encrypting the records.
      required:
        - cryptoAlg
        - curve
        - dhPublicKey
        - nonce
      properties:
        cryptoAlg:
          type: string
          example: ECDH
        curve:
          type: string
          example: curve25519
        dhPublicKey:
          type: object
          required:
            - expiry
            - parameters
            - keyValue
          properties:
            expiry:
              type: string
              format: date-time
              example: "2026-12-28T13:18:20.742Z"
            parameters:
              type: string
              example: Ephemeral public key.
            keyValue:
              type: string
              description: The public key, base64.
              example: BFN7KTdOT0jIAExG2A8Jg+01wMPWxptiGqwHRVvtiVEsUq2FR7P2UdqZxJyPJSeR6muai21iQhasNxnhh8I5M+g=
        nonce:
          type: string
          description: A 32 byte random nonce for this transfer.
          example: 28236d89-cb13-479d-ad71-7a57d5f669a9
    OnShareBody:
      type: object
      required:
        - hiRequest
        - response
      properties:
        hiRequest:
          type: object
          description: The data push URL and the encryption key.
          required:
            - transactionId
            - dataPushUrl
            - keyMaterial
          properties:
            transactionId:
              type: string
              format: uuid
              description: The transactionId the share request carried.
              example: 18235d89-cb13-479d-ad71-7a57d5f669a8
            dataPushUrl:
              type: string
              format: uri
              description: The HIU's URL the PHR app posts the encrypted records to.
              example: https://webhook.site/a2477c41-2185-47eb-835a/health-information/transfer
            keyMaterial:
              $ref: "#/components/schemas/KeyMaterial"
        response:
          type: object
          required:
            - requestId
          properties:
            requestId:
              type: string
              format: uuid
              description: The REQUEST-ID of the share request this answers.
              example: fd7567ff-f2e1-4f4f-a736-2244976c2f10
    NotifyBody:
      type: object
      required:
        - notification
      properties:
        notification:
          type: object
          description: The transaction id, the session status and each care context's transfer status.
          required:
            - transactionId
            - doneAt
            - statusNotification
          properties:
            transactionId:
              type: string
              format: uuid
              example: 3acbbb52-6de0-441f-b452-3c9488462b25
            doneAt:
              type: string
              format: date-time
              description: When the transfer completed.
              example: "2023-01-24T06:35:44.167Z"
            statusNotification:
              type: object
              required:
                - sessionStatus
                - statusResponses
              properties:
                sessionStatus:
                  type: string
                  description: TRANSFERRED, PARTIAL_TRANSFERRED or FAILED from the PHR app or health locker; RECEIVED, PARTIAL_RECEIVED or FAILED from the HIU.
                  enum:
                    - TRANSFERRED
                    - PARTIAL_TRANSFERRED
                    - RECEIVED
                    - PARTIAL_RECEIVED
                    - FAILED
                  example: TRANSFERRED
                statusResponses:
                  type: array
                  items:
                    type: object
                    required:
                      - careContextReference
                      - hiStatus
                    properties:
                      careContextReference:
                        type: string
                        example: 10004-20200001768-1
                      hiStatus:
                        type: string
                        description: DELIVERED or ERRORED from the PHR app or health locker; VALID, CORRUPTED, BLANK or ERRORED from the HIU.
                        enum:
                          - DELIVERED
                          - ERRORED
                          - VALID
                          - CORRUPTED
                          - BLANK
                        example: DELIVERED
                      description:
                        type: string
                        example: Data received successfully
    AuditHistoryEntry:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
          example: ed9f451d-9e07-484d-ab68-9972d6529d68
        abhaAddress:
          type: string
          example: manishk1991@sbx
        senderFacilityId:
          type: string
          example: MANISH_PHR_TEST
        senderFacilityName:
          type: string
          example: MANISH-PHR-TEST
        receiverFacilityId:
          type: string
          example: MANISH_HIU
        receiverFacilityName:
          type: string
          example: MANISH_HIU
        counterCode:
          type: string
          example: f4cd0d8e-25ec-465f-993c-01c91a56e0e4
        transactionId:
          type: string
          format: uuid
          example: f413b202-16b6-4d4a-9900-5cdcfb8baa50
        status:
          type: string
          description: The transaction's state, for example RECORD_SHARE_REQUESTED.
          example: RECORD_SHARE_REQUESTED
        sharedRecordCount:
          type: integer
          example: 2
        consent:
          type: object
          properties:
            accessMode:
              type: string
              example: VIEW
            dataEraseAt:
              type: string
              format: date-time
              example: "2026-10-12T08:58:09.738Z"
            careContexts:
              type: array
              items:
                type: object
                properties:
                  patientReference:
                    type: string
                    example: manikandanb87@sbx
                  careContextReference:
                    type: string
                    example: COC497647c1-0627-48fa-8131-0dddc1b3e0b4
        dateCreated:
          type: string
          format: date-time
          example: "2025-12-08T12:04:53.594Z"
        dateModified:
          type: string
          format: date-time
          example: "2025-12-08T12:04:53.594Z"
