  /api/hiecm/gateway/v3/sessions:
    post:
      tags:
        - abdm-sessions
      operationId: gateway_post_gateway_v3_sessions
      summary: This API is invoked to generate access token.
      description: This API is used to generate a access token. When invoked, it facilitates the authentication process by providing a secure token that can be used to access various services and resources within the system. This functionality is essential for ensuring secure and authorized access, enabling users to interact with protected endpoints and perform operations that require authentication. By using this API, users can obtain the necessary tokens to maintain secure sessions and access the system’s features effectively.
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for track the end to end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
        - name: X-CM-ID
          in: header
          required: true
          schema:
            type: string
          example: sbx
          description: Suffix of the consent manager to which the request was intended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientId
                - clientSecret
                - grantType
              properties:
                clientId:
                  type: string
                  nullable: false
                  description: The client ID issued to the integrator by ABDM at registration.
                  example: SBX_0000
                clientSecret:
                  type: string
                  nullable: false
                  description: The client secret issued to the integrator by ABDM along with the client ID.
                  example: 0******-***-***-***-a****
                grantType:
                  type: string
                  description: The method used by the client to obtain an access token, e.g. client_credentials.
                  nullable: false
                  example: client_credentials
                  enum:
                    - client_credentials
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    format: bearer
                    nullable: false
                    example: <TOKEN>
                  expiresIn:
                    type: integer
                    nullable: false
                    example: 1200
                  refreshExpiresIn:
                    type: integer
                    nullable: false
                    example: 1800
                  refreshToken:
                    type: string
                    format: bearer
                    nullable: false
                    example: <TOKEN>
                  tokenType:
                    type: string
                    nullable: false
                    example: bearer
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1001 - No data found. May be returned either bare (`ABDM-1001`) or with a trailing ": " separator (`ABDM-1001: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1001
                      message:
                        type: string
                        example: No data found
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
