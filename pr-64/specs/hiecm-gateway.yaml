  /api/hiecm/gateway/v3/bridge-services:
    get:
      tags:
        - abdm-gateway
      operationId: gateway_get_gateway_v3_bridge_services
      summary: This API will fetch the service ids registered against a bridge.
      description: This API is designed to retrieve the unique identifiers, known as service IDs, that are associated with a specific bridge. In this context, a bridge acts as an intermediary component that connects various services or networks, enabling them to communicate with each other. When you call this API, it queries the bridge to gather a list of all the service IDs that have been registered with it.
      security:
        - bearerAuth: []
      parameters:
        - name: REQUEST-ID
          in: header
          required: true
          schema:
            type: string
          example: 18235d89-cb13-479d-ad71-7a57d5f669a8
          description: Unique UUID for track the end to end request transaction
        - name: TIMESTAMP
          in: header
          required: true
          schema:
            type: string
          example: "2022-10-06T15:10:00.587Z"
          description: Actual time of the request was initiated, ISO 8601 represents date and time by starting with the year, followed by the month, the day, the hour, the minutes, seconds and milliseconds
        - name: X-CM-ID
          in: header
          required: true
          schema:
            type: string
          example: sbx
          description: Suffix of the consent manager to which the request was intended
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bridge:
                    type: object
                    nullable: false
                    properties:
                      id:
                        type: string
                        nullable: false
                        example: Bridge_ABC
                      name:
                        type: string
                        nullable: false
                        example: ABC Bridge
                      url:
                        type: string
                        format: uri
                        nullable: false
                        example: https://abc.def.in
                      active:
                        type: boolean
                        nullable: false
                        example: true
                      blocklisted:
                        type: boolean
                        nullable: false
                        example: false
                  services:
                    type: array
                    nullable: false
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          nullable: false
                          example: ABC_Service
                        name:
                          type: string
                          nullable: false
                          example: Service ABC
                        types:
                          type: array
                          nullable: false
                          items:
                            type: string
                            enum:
                              - HIP
                              - HIU
                              - HEALTH_LOCKER
                              - PHR
                            example: HIP
                        endpoints:
                          type: object
                          nullable: true
                          properties:
                            hipEndpoints:
                              type: array
                              nullable: false
                              items:
                                type: object
                                properties:
                                  use:
                                    type: string
                                    nullable: false
                                    example: registration
                                  connectionType:
                                    type: string
                                    nullable: false
                                    example: HTTPS
                                  address:
                                    type: string
                                    format: uri
                                    nullable: false
                                    example: https://abc.com/register
                            hiuEndpoints:
                              type: array
                              nullable: false
                              items:
                                type: object
                                properties:
                                  use:
                                    type: string
                                    nullable: false
                                    example: registration
                                  connectionType:
                                    type: string
                                    nullable: false
                                    example: HTTPS
                                  address:
                                    type: string
                                    format: uri
                                    nullable: false
                                    example: https://abc.com/register
                            healthLockerEndpoints:
                              type: array
                              nullable: false
                              items:
                                type: object
                                properties:
                                  use:
                                    type: string
                                    nullable: false
                                    example: registration
                                  connectionType:
                                    type: string
                                    nullable: false
                                    example: HTTPS
                                  address:
                                    type: string
                                    format: uri
                                    nullable: false
                                    example: https://abc.com/register
                        active:
                          type: boolean
                          nullable: false
                          example: true
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1001 - No data found. May be returned either bare (`ABDM-1001`) or with a trailing ": " separator (`ABDM-1001: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1001
                      message:
                        type: string
                        example: No data found
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-1015 - Invalid Response. May be returned either bare (`ABDM-1015`) or with a trailing ": " separator (`ABDM-1015: `); match on the code itself and tolerate the separator.'
                        example: ABDM-1015
                      message:
                        type: string
                        example: Bad Request, invalid response
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: '900901 - Invalid Credentials. May be returned either bare or with a trailing ": " separator; match on the code itself and tolerate the separator.'
                    example: "900901"
                  message:
                    type: string
                    example: Invalid Credentials
                  description:
                    type: string
                    example: Invalid Credentials. Make sure you have provided the correct security credentials
        "403":
          description: Forbidden. The caller is authenticated but is not permitted to perform this operation on this resource.
          content:
            text/plain:
              schema:
                type: string
                example: Forbidden
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    description: The error code and message, if any occurred.
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                        description: 'ABDM-9999 - Unknown exception. May be returned either bare (`ABDM-9999`) or with a trailing ": " separator (`ABDM-9999: `); match on the code itself and tolerate the separator.'
                        example: ABDM-9999
                      message:
                        type: string
                        example: Unknown exception
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    pattern: "^(ABDM-\\d{4}|\\d{3,6})(: )?$"
                    description: 'ABDM-1024 - Dependent service unavailable. May be returned either bare (`ABDM-1024`) or with a trailing ": " separator (`ABDM-1024: `); match on the code itself and tolerate the separator.'
                    nullable: false
                    example: ABDM-1024
                  message:
                    type: string
                    nullable: false
                    example: Dependent service unavailable
