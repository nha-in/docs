# docker-compose.test.yml — used by CI to healthcheck the image before pushing to ECR
# Usage: TAG=<ecr-url>/<repo>:<tag> docker-compose --file docker-compose.test.yml up -d
#
# Single service on purpose: the healthcheck proves the image boots and
# serves, not that a model is reachable from a CI runner. EMBED_PROVIDER=none
# is set EXPLICITLY because the server refuses to start when no decision was
# made at all: an absent provider is a failed deploy, an explicit none is a
# deliberate keyword-only server (it logs a warning over a vectored index).

version: '3.8'
services:
  abdm-docs-mcp:
    image: ${TAG}
    ports:
      - "8080:8080"
    environment:
      - CURR_ENV=test
      - EMBED_PROVIDER=none
